<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art-Talk Timeline</title>
<meta name="description" content="An illustrated timeline of painters, sculptors, architects, designers, filmmakers and writers from around the world, with key works and short biographies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f2ea;
  --surface: #fffdf8;
  --surface-2: #efe8db;
  --text: #221d16;
  --muted: #6b6255;
  --line: #d9cfbd;
  --accent: #9a3b1f;
  --accent-soft: #f1ddd2;
  --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 8px 24px rgba(40, 30, 10, .08);
  --europe: #7b4ea3;
  --west-asia: #1f7a6d;
  --south-asia: #c0621b;
  --east-asia: #b2304a;
  --americas: #2f62a8;
  --africa: #a8791a;
  --se-asia: #3c8a3a;
  --oceania: #1c7fa0;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --surface: #1f1c17; --surface-2: #2a261f; --text: #efe8dc; --muted: #a79d8e;
    --line: #3a342b; --accent: #e08a62; --accent-soft: #3a2519;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --europe: #b18ad6; --west-asia: #4fb8a8; --south-asia: #e59650; --east-asia: #e0677f; --americas: #6f9be0;
    --africa: #d6a94a; --se-asia: #74c072; --oceania: #59b5d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --surface: #1f1c17; --surface-2: #2a261f; --text: #efe8dc; --muted: #a79d8e;
  --line: #3a342b; --accent: #e08a62; --accent-soft: #3a2519;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --europe: #b18ad6; --west-asia: #4fb8a8; --south-asia: #e59650; --east-asia: #e0677f; --americas: #6f9be0;
  --africa: #d6a94a; --se-asia: #74c072; --oceania: #59b5d6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 var(--sans); overflow-x: hidden;
}
a { color: var(--accent); }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 48px 0 24px; }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
h1 {
  font-family: var(--serif); font-weight: 600; font-size: clamp(2.2rem, 6vw, 3.6rem);
  line-height: 1.05; margin: 0 0 8px; letter-spacing: -.01em;
}
.lede { color: var(--muted); max-width: 60ch; margin: 0; font-size: 1.05rem; }
.theme-btn {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  width: 40px; height: 40px; cursor: pointer; display: grid; place-items: center;
}
.theme-btn svg { width: 18px; height: 18px; }

.controls {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 12px 0;
}
.controls .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: .875rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.search {
  margin-left: auto; min-width: 0; flex: 1 1 180px; max-width: 260px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font: inherit; font-size: .9rem; color: var(--text);
}
.count { color: var(--muted); font-size: .85rem; width: 100%; }

/* Timeline */
.timeline { position: relative; padding: 24px 0 80px; }
.timeline::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: var(--line);
}
.century { position: relative; }
.century h2 {
  font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 32px 0 16px;
  padding-left: 96px; position: relative; color: var(--muted);
}
.century h2::before {
  content: ""; position: absolute; left: 66px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--bg); border: 2px solid var(--muted);
}
.entry { position: relative; padding-left: 96px; margin-bottom: 20px; }
.entry .year {
  position: absolute; left: 0; top: 18px; width: 60px; text-align: right;
  font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); font-weight: 500;
}
.entry::before {
  content: ""; position: absolute; left: 67px; top: 22px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 0 4px var(--bg);
}
.card {
  display: grid; grid-template-columns: 200px 1fr; gap: 0; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow); cursor: pointer; padding: 0; transition: transform .15s ease, border-color .15s ease;
}
.card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--c); outline: none; }
.card .cover { position: relative; background: var(--surface-2); min-height: 180px; }
.card .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 16px 18px; min-width: 0; }
.card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; margin: 0; line-height: 1.2; }
.meta { color: var(--muted); font-size: .875rem; margin: 2px 0 8px; }
.meta .region { color: var(--c); font-weight: 600; }
.card p.summary { margin: 0 0 12px; font-size: .95rem; }
.thumbs { display: flex; gap: 6px; overflow: hidden; }
.thumbs img {
  width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex: none;
}
.empty { padding: 48px 0; text-align: center; color: var(--muted); }

/* Detail dialog */
dialog {
  border: none; padding: 0; background: var(--surface); color: var(--text);
  width: min(920px, 100vw); max-width: 100vw; max-height: 100dvh; height: 100dvh;
  margin: 0 0 0 auto; box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 8, 5, .55); }
dialog[open] { animation: slide .2s ease; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel-head {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.panel-head .crumb { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px;
  cursor: pointer; display: grid; place-items: center; flex: none;
}
.panel-body { padding: 24px 24px 64px; }
.hero { border-radius: 12px; overflow: hidden; background: var(--surface-2); margin-bottom: 20px; }
.hero img { width: 100%; max-height: 420px; object-fit: cover; }
.panel-body h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0; line-height: 1.1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
.tag { background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: .8rem; }
.tag.region { background: var(--c); color: #fff; }
.panel-summary { font-size: 1.1rem; font-family: var(--serif); margin: 0 0 20px; }
.prose h3 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 28px 0 8px; }
.prose p { margin: 0 0 12px; max-width: 68ch; }
.prose ul { margin: 0 0 12px; padding-left: 20px; max-width: 68ch; }
details.sec { border-top: 1px solid var(--line); }
details.sec summary {
  cursor: pointer; list-style: none; font-family: var(--serif); font-weight: 600; font-size: 1.2rem; padding: 14px 0;
  display: flex; justify-content: space-between; align-items: center;
}
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::after { content: "+"; font-family: var(--sans); color: var(--muted); font-weight: 400; }
details.sec[open] summary::after { content: "–"; }
.works-title { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 32px 0 16px; }
.works { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.work { margin: 0; display: flex; flex-direction: column; }
.work button.img {
  border: none; padding: 0; cursor: zoom-in; border-radius: 10px; overflow: hidden; background: var(--surface-2);
  aspect-ratio: 4 / 3; width: 100%;
}
.work button.img img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.work button.img:hover img { transform: scale(1.03); }
.work figcaption { padding-top: 10px; font-size: .92rem; }
.work .wt { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.work .wm { color: var(--muted); font-size: .82rem; margin: 2px 0 6px; }
.work .wd p { margin: 0 0 8px; }
.credit { color: var(--muted); font-size: .72rem; line-height: 1.4; word-break: break-word; }
.credit a { color: inherit; }
.links { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; }
.links a { text-decoration: none; }

/* Lightbox */
#lightbox {
  width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; margin: 0;
  background: #0d0b08; color: #f3ede3;
}
#lightbox .lb-inner { height: 100%; display: flex; flex-direction: column; }
#lightbox .lb-img { flex: 1; min-height: 0; display: grid; place-items: center; padding: 56px 16px 8px; }
#lightbox .lb-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
#lightbox .lb-cap { padding: 8px 16px 20px; text-align: center; font-size: .9rem; }
#lightbox .lb-cap .credit { color: #b9b0a2; }
#lightbox .icon-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }
#lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); }
#lightbox .prev { left: 12px; } #lightbox .next { right: 12px; }

footer { border-top: 1px solid var(--line); padding: 24px 0 48px; color: var(--muted); font-size: .85rem; }

@media (max-width: 720px) {
  header.top { padding-top: 32px; }
  .timeline::before { left: 8px; }
  .century h2 { padding-left: 28px; font-size: 1.35rem; }
  .century h2::before { left: 2px; }
  .entry { padding-left: 28px; }
  .entry::before { left: 3px; }
  .entry .year { position: static; display: block; text-align: left; width: auto; margin-bottom: 4px; }
  .card { grid-template-columns: 1fr; }
  .card .cover { min-height: 0; aspect-ratio: 16 / 9; }
  .search { max-width: none; margin-left: 0; flex-basis: 100%; }
  .panel-body { padding: 16px 16px 48px; }
  #lightbox .nav { top: auto; bottom: 12px; transform: none; }
  #lightbox .lb-cap { padding-bottom: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="top-row">
    <div>
      <h1>Art-Talk</h1>
      <p class="lede" id="lede"></p>
    </div>
    <button class="theme-btn" id="theme" type="button" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<nav class="controls" aria-label="Filters">
  <div class="wrap">
    <div id="chips" style="display:contents"></div>
    <input class="search" id="q" type="search" placeholder="Search artists or works" aria-label="Search artists or works">
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <div class="wrap" style="margin-top:8px">
    <div id="chips2" style="display:contents"></div>
  </div>
</nav>

<main class="wrap timeline" id="timeline"></main>

<footer class="wrap" id="footer"></footer>

<dialog id="panel" aria-labelledby="panel-title">
  <div class="panel-head">
    <span class="crumb" id="crumb"></span>
    <button class="icon-btn" type="button" data-close aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</dialog>

<dialog id="lightbox" aria-label="Artwork">
  <div class="lb-inner">
    <button class="icon-btn" type="button" data-close aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button class="icon-btn nav prev" type="button" aria-label="Previous work">&#8249;</button>
    <button class="icon-btn nav next" type="button" aria-label="Next work">&#8250;</button>
    <div class="lb-img"><img id="lb-img" alt=""></div>
    <div class="lb-cap" id="lb-cap"></div>
  </div>
</dialog>

<script>
const DATA = {"artists":[{"slug":"murasaki-shikibu","name":"Murasaki Shikibu","lifespan":"c. 973–c. 1014","born":973,"died":1014,"year_label":"973","region":"East Asia","country":"Japan","movements":["Heian court literature"],"discipline":["Literature"],"summary":"The Heian-era court lady whose sprawling novel of court life and love, The Tale of Genji, is widely considered the world's first novel.","sections":[{"title":"Overview","html":"<p>Murasaki Shikibu was a lady-in-waiting at the Heian-era Japanese imperial court who wrote <em>The Tale of Genji<\/em>, a 54-chapter novel following the romantic and political life of a fictional prince and, in its later chapters, his descendants. Composed roughly a thousand years ago, it is widely regarded as the world's first novel and remains a foundational work of Japanese literature, prized for its psychological subtlety and its detailed portrait of Heian court life.<\/p>"},{"title":"Life","html":"<p>Little is known of Murasaki Shikibu's life beyond what can be inferred from her own diary and scraps of court record; even her real personal name is unknown, \"Murasaki Shikibu\" being a later nickname combining a character from her novel with her father's court rank. Born around 973 into a minor branch of the powerful Fujiwara clan, she received an unusually thorough education in Chinese classics, normally reserved for men, by absorbing lessons given to her brother. She married a much older provincial governor around 998, was widowed within a few years, and around 1005 or 1006 entered service at the imperial court as a lady-in-waiting to Empress Shōshi, where she likely continued writing and revising <em>The Tale of Genji<\/em>, probably begun before she arrived at court. She also kept a diary, <em>The Diary of Lady Murasaki<\/em>, recording court life and rivalries, including a barbed comment about her contemporary Sei Shōnagon. She is thought to have died around 1014, though the exact date, like most of her biography, is uncertain.<\/p>"},{"title":"Style & Technique","html":"<p><em>The Tale of Genji<\/em> is built from dozens of interwoven characters and, unusually for its time, an interest in psychological interiority, characters' private motives, regrets and self-deceptions, rather than only their outward actions. Murasaki wrote almost entirely in hiragana, the syllabic script associated with women's writing at the Heian court, rather than the Chinese-derived script used for official and male scholarly writing, and embedded hundreds of waka poems into the narrative as characters' own compositions, a convention of court fiction she pushed to new sophistication. The novel's structure loosens across its later chapters, following the diminishing fortunes of Genji's descendants after his death in a tone markedly more melancholy than its earlier sections.<\/p>"},{"title":"Legacy","html":"<p><em>The Tale of Genji<\/em> has been continuously read, copied, illustrated and adapted in Japan for a thousand years, and the earliest surviving illustrated version, the 12th-century Genji Monogatari Emaki, is itself a Japanese National Treasure. The novel is widely taught as one of the founding texts of world literature and has been translated into English several times, each translation prompting fresh debate over how to render its indirect, allusive Heian court idiom. Murasaki Shikibu appears on the Japanese 2000 yen banknote, and the site of her likely birthplace and burial are still visited as literary landmarks in Kyoto.<\/p>"}],"cover":"genji-sakaki","wikipedia":"https://en.wikipedia.org/wiki/Murasaki_Shikibu","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/murasaki-shikibu.md","works":[{"id":"genji-kashiwagi","title":"The Tale of Genji — Hakubyō scroll fragment","year":"c. 1005–1010","medium":"Illustrated hand scroll (hakubyō, monochrome ink line drawing) on paper","location":"Private collection","description":"<p>A scene from a later, monochrome ink-line (\"hakubyō\") illustrated copy of the novel, a distinct tradition from the coloured Tokugawa and Gotoh scrolls also shown here, and evidence of how continuously artists kept reinterpreting Murasaki's novel in new visual styles over the following centuries.<\/p>","image":"images/murasaki-shikibu/genji-kashiwagi.jpg","credit":{"file":"File:Hakubyo Genji monogatari emaki - scroll 1-1.jpg","source":"https://commons.wikimedia.org/wiki/File:Hakubyo_Genji_monogatari_emaki_-_scroll_1-1.jpg","author":"Unknown author Unknown author","license":"Public domain","license_url":null}},{"id":"genji-yadorigi","title":"The Tale of Genji — \"Yadorigi\"","year":"c. 1005–1010","medium":"Illustrated hand scroll (yamato-e), ink and colour on paper","location":"Tokugawa Art Museum, Nagoya, Japan","description":"<p>A later chapter, illustrated in the same early 12th-century scroll tradition, following the generation after Genji's death as his descendants navigate the same web of court rivalry, love and Buddhist renunciation that structures the novel's earlier chapters.<\/p>","image":"images/murasaki-shikibu/genji-yadorigi.jpg","credit":{"file":"File:Genji emaki Yadorigi.JPG","source":"https://commons.wikimedia.org/wiki/File:Genji_emaki_Yadorigi.JPG","author":"Imperial court in Kyoto. The handscroll had been said to be painted by Fujiwara, Takayoshi, though it is now presumed to be painted by several groups of painters in Heian period.","license":"Public domain","license_url":null}},{"id":"genji-sakaki","title":"The Tale of Genji — Hakubyō scroll fragment (II)","year":"c. 1005–1010","medium":"Illustrated hand scroll (hakubyō, monochrome ink line drawing) on paper","location":"Private collection","description":"<p>Another scene from the same monochrome hakubyō scroll, part of a genre of ink-line Genji illustration that favoured clarity of narrative detail over the saturated mineral colour of the earliest surviving scrolls, and was often used as a study or reference copy by later painters.<\/p>","image":"images/murasaki-shikibu/genji-sakaki.jpg","credit":{"file":"File:Hakubyo Genji monogatari emaki - scroll 1-4.jpg","source":"https://commons.wikimedia.org/wiki/File:Hakubyo_Genji_monogatari_emaki_-_scroll_1-4.jpg","author":"Unknown author Unknown author","license":"Public domain","license_url":null}},{"id":"genji-suzumushi","title":"The Tale of Genji — \"Suzumushi\" (The Bell Cricket)","year":"c. 1005–1010","medium":"Illustrated hand scroll (yamato-e), ink and colour on paper","location":"Gotoh Museum, Tokyo, Japan","description":"<p>A chapter named for the bell crickets released into a garden Genji has planted to evoke autumn, illustrated with the restrained, geometric interior perspective and stylised wind-blown-away-roof viewpoint characteristic of this earliest surviving Genji scroll tradition.<\/p>","image":"images/murasaki-shikibu/genji-suzumushi.jpg","credit":{"file":"File:GENJI EMAKI -SUZUMUSHI GOTO MUSEUM.jpg","source":"https://commons.wikimedia.org/wiki/File:GENJI_EMAKI_-SUZUMUSHI_GOTO_MUSEUM.jpg","author":"According to Japanese Copyright Law (June 1, 2018 grant) the copyright on this work has expired and is as such public domain . According to articles 51, 52, 53 and 57 of the copyright laws of Japan, under the jurisdiction of the Government of Japan works enter the public domain 50 years after the death of the creator (there being multiple creators, the creator who dies last) or 50 years after publication for anonymous or pseudonymous authors or for works whose copyright holder is an organization. Note: The enforcement of the revised Copyright Act on December 30, 2018 extended the copyright term of works whose copyright was valid on that day to 70 years. Do not use this template for works of the copyright holders who died after 1967. Use {{PD-Japan-oldphoto}} for photos published before December 31, 1956, and {{PD-Japan-film}} for films produced prior to 1953. Public domain works must be out of copyright in both the United States and in the source country of the work in order to be hosted on the Commons. The file must have an additional copyright tag indicating the copyright status in the United States. See also Copyright rules by territory .","license":"Public domain","license_url":null}},{"id":"genji-azumaya","title":"The Tale of Genji — \"Azumaya\" (The Eastern Cottage)","year":"c. 1005–1010","medium":"Illustrated hand scroll (yamato-e), ink and colour on paper","location":"Tokugawa Art Museum, Nagoya, Japan","description":"<p>Part of the novel's final \"Uji chapters,\" set a generation after Genji's death and centred on his descendants' tangled romances, illustrated with the same muted mineral-pigment palette and roofless bird's-eye compositions used throughout the scroll.<\/p>","image":"images/murasaki-shikibu/genji-azumaya.jpg","credit":{"file":"File:Genji emaki azumaya.jpg","source":"https://commons.wikimedia.org/wiki/File:Genji_emaki_azumaya.jpg","author":"Imperial court in Kyoto","license":"Public domain","license_url":null}}]},{"slug":"rumi","name":"Jalal al-Din Rumi","lifespan":"1207–1273","born":1207,"died":1273,"year_label":"1207","region":"West & Central Asia","country":"Khwarazmian Empire (later Seljuk Sultanate of Rum, now Turkey)","movements":["Sufi poetry"],"discipline":["Literature"],"summary":"The Persian mystic poet whose Masnavi and ecstatic lyric verse, and the whirling ceremony his followers built around his teaching, made him one of the most widely read poets in the world.","sections":[{"title":"Overview","html":"<p>Jalal al-Din Rumi was a 13th-century Islamic scholar and Sufi mystic whose poetry, composed almost entirely in the last decades of his life following a transformative friendship with the wandering mystic Shams-e Tabrizi, became some of the most celebrated devotional literature in the Persian language. His six-book Masnavi and his vast lyric collection, the Divan-e Shams, blend storytelling, scriptural commentary and ecstatic mystical love poetry, and the whirling Sema ceremony associated with the Sufi order his followers founded after his death remains a living performance tradition.<\/p>"},{"title":"Life","html":"<p>Rumi was born in 1207 in Balkh, then part of the Khwarazmian Empire in Greater Khorasan (in present-day Afghanistan), into a family of religious scholars. Fleeing the advancing Mongol invasions during his childhood, his family travelled west over many years, eventually settling in Konya, in the Seljuk Sultanate of Rum in present-day Turkey, where his father became a respected religious teacher. Rumi succeeded his father as a legal and religious scholar, a conventional and respected career, until 1244, when he met a wandering dervish, Shams-e Tabrizi, whose intense friendship and teaching transformed Rumi's outlook and unleashed the poetry for which he is now known. Shams disappeared under mysterious circumstances a few years later, possibly murdered by Rumi's own jealous disciples or family members, a loss Rumi mourned for the rest of his life and channelled into poetry written in Shams's name rather than his own. In his final decade Rumi dictated his long didactic poem, the Masnavi, to his disciple Husam al-Din Chalabi. He died in Konya in 1273.<\/p>"},{"title":"Style & Technique","html":"<p>Rumi's Masnavi unfolds through hundreds of short parables, animal fables, jokes and scriptural commentary loosely strung together to illustrate Sufi teaching in memorable, often playful form, earning it the nickname \"the Quran in Persian\" among some later readers for its didactic reach. His lyric poetry in the Divan-e Shams, by contrast, is intensely personal and ecstatic, often addressed directly to Shams-e Tabrizi as a stand-in for divine love, and became the model for later Sufi love poetry across the Persian-speaking world. His followers' formalisation of a whirling dance, the Sema, into a devotional discipline gave his poetry an unusual second life as embodied performance rather than text alone.<\/p>"},{"title":"Legacy","html":"<p>The Mevlevi Sufi order founded by Rumi's followers, popularly known as the \"whirling dervishes,\" continues to perform the Sema ceremony at his shrine in Konya, now a UNESCO-recognised heritage site, and in Mevlevi communities worldwide. His poetry has been translated into dozens of languages, and loose English adaptations from the late twentieth century onward made him, by some measures, one of the best-selling poets in the United States, a striking afterlife for a 13th-century Persian mystic's devotional verse.<\/p>"}],"cover":"masnavi-opening","wikipedia":"https://en.wikipedia.org/wiki/Rumi","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/rumi.md","works":[{"id":"masnavi-opening","title":"Masnavi-ye Ma'navi (opening)","year":"c. 1258–1273","medium":"Illustrated manuscript, Persian didactic poem in rhyming couplets","location":"Bodleian Library, Oxford","description":"<p>The opening page of Rumi's six-book masterwork, some 25,000 couplets composed over the last decade or so of his life at the request of his disciple Husam al-Din Chalabi, who wrote down the verses as Rumi recited them, reportedly even while walking through the streets of Konya.<\/p>","image":"images/rumi/masnavi-opening.jpg","credit":{"file":"File:Opening page of Masnavi of Rumi, Shiraz, circa 1460, Bodleian Library’s Manuscript Elliott 251.jpg","source":"https://commons.wikimedia.org/wiki/File:Opening_page_of_Masnavi_of_Rumi,_Shiraz,_circa_1460,_Bodleian_Library%E2%80%99s_Manuscript_Elliott_251.jpg","author":"1460 artist, Shiraz","license":"Public domain","license_url":null}},{"id":"masnavi-peacock-parable","title":"Masnavi — The Wise Man and the Peacock","year":"c. 1258–1273","medium":"Illustrated manuscript, Persian didactic poem in rhyming couplets","location":"Walters Art Museum, Baltimore","description":"<p>One of hundreds of short parables and stories Rumi wove through the Masnavi's six books to illustrate points of Sufi doctrine in accessible, often humorous form, here a peacock plucking out its own beautiful feathers to avoid the suffering its beauty attracts, a lesson on renouncing worldly vanity.<\/p>","image":"images/rumi/masnavi-peacock-parable.jpg","credit":{"file":"File:Illuminated Manuscript, Collection of poems (masnavi), A wise man and a peacock plucking out its feathers not to be attractive to people, Walters Art Museum Ms. W.626, fol. 220b detail.jpg","source":"https://commons.wikimedia.org/wiki/File:Illuminated_Manuscript,_Collection_of_poems_(masnavi),_A_wise_man_and_a_peacock_plucking_out_its_feathers_not_to_be_attractive_to_people,_Walters_Art_Museum_Ms._W.626,_fol._220b_detail.jpg","author":"Walters Art Museum Illuminated Manuscripts","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"divan-e-shams","title":"Divan-e Shams-e Tabrizi","year":"c. 1247–1273","medium":"Illustrated manuscript, Persian lyric poetry (ghazals)","location":"British Museum, London","description":"<p>A vast collection of ecstatic lyric poems, tens of thousands of lines, that Rumi composed after meeting the wandering mystic Shams-e Tabrizi in 1244, an encounter that transformed him from a respected legal scholar into a poet, and which he credited by naming the entire collection after his friend and teacher rather than himself.<\/p>","image":"images/rumi/divan-e-shams.jpg","credit":{"file":"File:A selection of ghazals from the Diwan-i-Shams of Jalal al-Din Rumi (d. 1273) and the diwan of his son Baha al-Din Sultan Walad, Seljuk Anatolia, late 13th - early 14th century.jpg","source":"https://commons.wikimedia.org/wiki/File:A_selection_of_ghazals_from_the_Diwan-i-Shams_of_Jalal_al-Din_Rumi_(d._1273)_and_the_diwan_of_his_son_Baha_al-Din_Sultan_Walad,_Seljuk_Anatolia,_late_13th_-_early_14th_century.jpg","author":"Christies.com","license":"Public domain","license_url":null}},{"id":"fihi-ma-fihi","title":"Fihi Ma Fihi (In It What Is In It)","year":"c. 1250s–1270s","medium":"Manuscript, prose discourses in Persian","location":"Konya, Turkey","description":"<p>A collection of Rumi's informal talks and discourses to his disciples, recorded in prose rather than verse, covering everything from Quranic interpretation to everyday anecdotes, and valued by scholars as the clearest direct record of how Rumi taught and argued outside the formal structure of his poetry.<\/p>","image":"images/rumi/fihi-ma-fihi.jpg","credit":{"file":"File:Fihi ma fihi sample.jpg","source":"https://commons.wikimedia.org/wiki/File:Fihi_ma_fihi_sample.jpg","author":"Rumi","license":"Public domain","license_url":null}},{"id":"sema-ceremony","title":"The Sema (whirling ceremony)","year":"13th century–present","medium":"Devotional performance: music, poetry recitation and turning dance","location":"Mevlana Museum (Rumi's shrine), Konya, Turkey","description":"<p>Not a text but a living performance tradition associated with Rumi and formalised by his followers into the Mevlevi Sufi order after his death: a turning dance performed to music and poetry, intended to induce a trance-like focus on the divine. It continues to be performed at his shrine in Konya and by Mevlevi communities worldwide.<\/p>","image":"images/rumi/sema-ceremony.jpg","credit":{"file":"File:Mevlana Museum, Konya 06.jpg","source":"https://commons.wikimedia.org/wiki/File:Mevlana_Museum,_Konya_06.jpg","author":"Murat Özsoy 1958","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}}]},{"slug":"amir-khusrau","name":"Amir Khusrau","lifespan":"1253–1325","born":1253,"died":1325,"year_label":"1253","region":"South Asia","country":"Delhi Sultanate (India)","movements":["Indo-Persian literature","Sufi poetry"],"discipline":["Literature"],"summary":"The court poet of Delhi whose Persian verse, and the musical tradition he is credited with founding, shaped Indo-Persian and South Asian culture for centuries.","sections":[{"title":"Overview","html":"<p>Amir Khusrau was the leading poet of the Delhi Sultanate, writing in Persian, the language of the Indo-Islamic courts, while drawing constantly on the Indian environment around him. Best known today for his Khamsa, five long narrative poems written in deliberate dialogue with the Persian master Nizami Ganjavi, he was also a devoted disciple of the Sufi saint Nizamuddin Auliya and is traditionally credited with founding qawwali, the devotional music still performed at Sufi shrines across South Asia.<\/p>"},{"title":"Life","html":"<p>Khusrau was born in 1253 near Delhi to a Turkic father who had migrated from Central Asia and an Indian mother, a mixed heritage he referred to proudly throughout his work. He served as a court poet under a rapid succession of Delhi sultans across more than four decades of political upheaval, surviving palace coups and dynastic changes that ended the careers, and sometimes the lives, of many of his contemporaries. Alongside his court poetry he became a devoted follower of the Sufi mystic Nizamuddin Auliya, and legend holds the two were so close that Khusrau died within months of his spiritual master in 1325, asking to be buried near him; their shrines still stand together in Delhi as one of the city's most visited Sufi sites.<\/p>"},{"title":"Style & Technique","html":"<p>Khusrau modelled his five major narrative poems directly on the Khamsa of the earlier Persian poet Nizami Ganjavi, retelling the same romances and legends, Shirin and Khusrau, Layla and Majnun, Alexander the Great, in his own voice, a common and respected form of literary tribute and rivalry in the Persian tradition rather than mere imitation. He also wrote extensively in more personal, mystical registers associated with his Sufi devotion, and popularised, if he did not strictly invent, literary and musical forms blending Persian and Indian elements, including an early form of the ghazal performance later systematised as qawwali. Later legend also credits him, without firm historical evidence, with inventing instruments such as the sitar and tabla.<\/p>"},{"title":"Legacy","html":"<p>Khusrau is regarded as the founding figure of Indo-Persian literature, the body of Persian-language poetry produced in the Indian subcontinent over the following centuries, and qawwali, the devotional musical genre traced to him, remains a living performance tradition at Sufi shrines across India, Pakistan and Bangladesh. His shrine beside that of Nizamuddin Auliya in Delhi continues to draw pilgrims and qawwali performers, and his verses are still sung as much as read, a rare case of a medieval court poet whose work survives as much in music as in manuscript.<\/p>"}],"cover":"khusrau-majnun-layla","wikipedia":"https://en.wikipedia.org/wiki/Amir_Khusrau","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/amir-khusrau.md","works":[{"id":"khusrau-matla-ul-anwar","title":"Matla' al-Anwar (The Rising of Lights)","year":"c. 1298","medium":"Illustrated manuscript, Persian narrative poem (masnavi)","location":"Metropolitan Museum of Art, New York","description":"<p>The first of the five long narrative poems making up Khusrau's Khamsa (Quintet), modelled on the Persian poet Nizami's own Khamsa but reworked with Khusrau's own didactic and mystical concerns. This folio illustrates one of its moral parables, a pilgrim humbled by an unexpected lesson in piety from a Hindu holy man.<\/p>","image":"images/amir-khusrau/khusrau-matla-ul-anwar.jpg","credit":{"file":"File:\"A Muslim Pilgrim Learns a Lesson in Piety from a Brahman\", Folio from a Khamsa (Quintet) of Amir Khusrau Dihlavi MET DP120804.jpg","source":"https://commons.wikimedia.org/wiki/File:%22A_Muslim_Pilgrim_Learns_a_Lesson_in_Piety_from_a_Brahman%22,_Folio_from_a_Khamsa_(Quintet)_of_Amir_Khusrau_Dihlavi_MET_DP120804.jpg","author":"Basawan / Muhammad Husayn Kashmiri / Amir Khusrau","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"khusrau-shirin-khusrau","title":"Shirin o Khusrau","year":"c. 1298","medium":"Illustrated manuscript, Persian narrative poem (masnavi)","location":"Walters Art Museum, Baltimore","description":"<p>The second poem of the Khamsa, retelling the romance of the Sasanian king Khusrau and the Armenian princess Shirin already told by Nizami, a deliberate act of literary homage and rivalry that was common practice among Persian poets responding to an admired predecessor's Khamsa.<\/p>","image":"images/amir-khusrau/khusrau-shirin-khusrau.jpg","credit":{"file":"File:Amir Khusraw Dihlavi - Khusraw Meets Shirin While Hunting - Walters W62266A - Full Page.jpg","source":"https://commons.wikimedia.org/wiki/File:Amir_Khusraw_Dihlavi_-_Khusraw_Meets_Shirin_While_Hunting_-_Walters_W62266A_-_Full_Page.jpg","author":"Amir Khusrau","license":"Public domain","license_url":null}},{"id":"khusrau-majnun-layla","title":"Majnun o Layla","year":"c. 1299","medium":"Illustrated manuscript, Persian narrative poem (masnavi)","location":"Walters Art Museum, Baltimore","description":"<p>The third poem of the Khamsa, condensing the widely told Arabian legend of Layla and Majnun, lovers driven apart by their families until Majnun wanders the desert wilderness in grief-mad devotion, into Khusrau's own tightly constructed Persian verse.<\/p>","image":"images/amir-khusrau/khusrau-majnun-layla.jpg","credit":{"file":"File:Amir Khusraw Dihlavi - Laylá Visits Majnun in the Wilderness - Walters W624115A - Full Page.jpg","source":"https://commons.wikimedia.org/wiki/File:Amir_Khusraw_Dihlavi_-_Layl%C3%A1_Visits_Majnun_in_the_Wilderness_-_Walters_W624115A_-_Full_Page.jpg","author":"Amir Khusrau","license":"Public domain","license_url":null}},{"id":"khusrau-hasht-bihisht","title":"Hasht Bihisht (The Eight Paradises)","year":"c. 1301","medium":"Illustrated manuscript, Persian narrative poem (masnavi)","location":"Private collection","description":"<p>The fourth poem of the Khamsa, following the Sasanian king Bahram Gur as he visits seven princesses, each housed in a differently coloured pavilion and each telling him a story, a structure adapted from Nizami's <em>Haft Paykar<\/em> and often illustrated as a cycle of jewel-toned courtly scenes.<\/p>","image":"images/amir-khusrau/khusrau-hasht-bihisht.jpg","credit":{"file":"File:Bahram Gur and Dilaram.jpg","source":"https://commons.wikimedia.org/wiki/File:Bahram_Gur_and_Dilaram.jpg","author":"Amir Khusrau","license":"Public domain","license_url":null}},{"id":"khusrau-aina-i-sikandari","title":"A'ina-yi Sikandari (The Alexandrine Mirror)","year":"c. 1302","medium":"Illustrated manuscript, Persian narrative poem (masnavi)","location":"Metropolitan Museum of Art, New York","description":"<p>The fifth and final poem of the Khamsa, recasting the legendary exploits of Alexander the Great as a philosopher-king, drawing partly on the same Alexander Romance tradition behind Nizami's <em>Iskandarnama<\/em> while adding battles and wonders of Khusrau's own invention.<\/p>","image":"images/amir-khusrau/khusrau-aina-i-sikandari.jpg","credit":{"file":"File:\"Alexander Fights a Sea Battle\", Folio from a Khamsa (Quintet) of Amir Khusrau Dihlavi MET DP120807.jpg","source":"https://commons.wikimedia.org/wiki/File:%22Alexander_Fights_a_Sea_Battle%22,_Folio_from_a_Khamsa_(Quintet)_of_Amir_Khusrau_Dihlavi_MET_DP120807.jpg","author":"Amir Khusrau","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}}]},{"slug":"giotto","name":"Giotto di Bondone","lifespan":"c. 1267–1337","born":1267,"died":1337,"year_label":"1267","region":"Europe","country":"Italy","movements":["Proto-Renaissance"],"discipline":["Painting"],"summary":"The Florentine painter who gave medieval figures weight, emotion and space. Many call him the father of Western painting.","sections":[{"title":"Overview","html":"<p>Giotto broke with the flat, gold-ground style that Italian painting had inherited from Byzantium. His figures stand on solid ground, their clothes fall with real weight, and their faces show grief, anger and tenderness. In the frescoes of the Scrovegni Chapel in Padua he told sacred stories as human drama, with a directness that later artists admired for two centuries. Writers of his own day already counted him the greatest painter alive. By the Renaissance he was seen as the artist who had started painting again from nature.<\/p>"},{"title":"Life","html":"<p>Giotto was probably born around 1267 in the Mugello valley north of Florence. Giorgio Vasari tells the story in his <em>Lives of the Artists<\/em> (1550): the painter Cimabue came upon the young shepherd drawing a sheep on a flat rock and took him on as an apprentice. The tale is legend, but Giotto was almost certainly trained in the Florentine workshops of the late 1200s.<\/p>\n<p>His early career is still debated. Many scholars believe he worked on the fresco cycle of the Legend of St Francis in the Upper Church at Assisi in the late 1290s. His name is firmly attached to the Scrovegni Chapel in Padua, painted around 1303–1305 for the banker Enrico Scrovegni. From then on he ran a busy workshop and worked across Italy: in Rome for Cardinal Stefaneschi at Old St Peter's, in the Bardi and Peruzzi chapels of Santa Croce in Florence, and at the court of King Robert of Anjou in Naples from about 1328 to 1333.<\/p>\n<p>Giotto was also a shrewd businessman who owned property and rented out looms. He was famous enough that Dante wrote of him in the <em>Divine Comedy<\/em>: \"Cimabue thought to hold the field in painting, and now Giotto has the cry.\" In 1334 Florence named him master of works for the cathedral, and he designed its bell tower. He died in Florence in January 1337 and was buried with public honours.<\/p>"},{"title":"Style & Technique","html":"<p>Giotto worked mainly in <em>buon fresco<\/em>, painting into wet plaster one day's section (a <em>giornata<\/em>) at a time so that the colour bonded with the wall. He simplified his scenes to a few strong figures set in shallow, stage-like spaces. Rocks, buildings and furniture are drawn at angles that suggest depth, more than 100 years before linear perspective was worked out.<\/p>\n<p>Above all he made painting physical and emotional. His figures have volume, like carved stone, and they react to one another through glances, gestures and body language. He often chose the most charged moment in a story and built the picture around it. In the <em>Lamentation<\/em> he even placed mourners with their backs to the viewer, pulling us into the scene.<\/p>"},{"title":"Legacy","html":"<p>Vasari opened his history of Italian art with Cimabue and Giotto, saying Giotto had brought back \"the good modern manner\" of painting from nature. Masaccio in the 1420s and Michelangelo after him studied and copied Giotto's frescoes. The Scrovegni Chapel is now a UNESCO World Heritage Site, part of Padua's fourteenth-century fresco cycles. In the chapel's <em>Adoration of the Magi<\/em>, the star of Bethlehem is painted as a blazing comet, perhaps inspired by Halley's Comet of 1301. When the European Space Agency sent a probe to Halley's Comet in 1986, it named the mission Giotto.<\/p>"}],"cover":"kiss-of-judas","wikipedia":"https://en.wikipedia.org/wiki/Giotto","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/giotto.md","works":[{"id":"renunciation-of-worldly-goods","title":"St Francis Renounces His Worldly Goods","year":"c. 1297–1300","medium":"Fresco","location":"Upper Church, Basilica of San Francesco, Assisi","description":"<p>One of 28 scenes from the Legend of St Francis in Assisi. The young Francis strips off his clothes and hands them back to his furious father, while the bishop covers him with his cloak. The painting splits into two crowds, family on one side and Church on the other, with an empty gap between them. Scholars still argue over how much of the cycle is Giotto's own work, but its solid figures and clear storytelling point toward the Scrovegni Chapel.<\/p>","image":"images/giotto/renunciation-of-worldly-goods.jpg","credit":{"file":"File:Giotto di Bondone - Legend of St Francis - 5. Renunciation of Wordly Goods - WGA09123.jpg","source":"https://commons.wikimedia.org/wiki/File:Giotto_di_Bondone_-_Legend_of_St_Francis_-_5._Renunciation_of_Wordly_Goods_-_WGA09123.jpg","author":"Giotto","license":"Public domain","license_url":null}},{"id":"scrovegni-chapel","title":"Scrovegni Chapel","year":"c. 1303–1305","medium":"Fresco cycle","location":"Scrovegni (Arena) Chapel, Padua","description":"<p>The banker Enrico Scrovegni paid for this small chapel, and Giotto covered its whole interior with paint. Rows of scenes tell the lives of Joachim and Anna, the Virgin Mary and Christ, all under a deep blue vault scattered with gold stars. A Last Judgment fills the entrance wall. Below the stories, painted figures of the Virtues and Vices are done in grey to look like stone sculpture. It is the most complete surviving work by Giotto, and one of the great turning points in European art.<\/p>","image":"images/giotto/scrovegni-chapel.jpg","credit":{"file":"File:Padova Cappella degli Scrovegni Innen Langhaus West 5.jpg","source":"https://commons.wikimedia.org/wiki/File:Padova_Cappella_degli_Scrovegni_Innen_Langhaus_West_5.jpg","author":"Zairon","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"kiss-of-judas","title":"The Kiss of Judas","year":"c. 1304–1306","medium":"Fresco","location":"Scrovegni Chapel, Padua","description":"<p>Judas wraps Christ in a sweeping yellow cloak as he leans in for the kiss that betrays him. The two faces meet in profile, calm against treacherous, while torches, clubs and lances crowd the sky above. At the left, Peter cuts off a servant's ear. Giotto puts the whole drama into one locked gaze, which makes this one of the most psychologically charged images of the Middle Ages.<\/p>","image":"images/giotto/kiss-of-judas.jpg","credit":{"file":"File:Giotto - Scrovegni - -31- - Kiss of Judas.jpg","source":"https://commons.wikimedia.org/wiki/File:Giotto_-_Scrovegni_-_-31-_-_Kiss_of_Judas.jpg","author":"Giotto","license":"Public domain","license_url":null}},{"id":"lamentation","title":"Lamentation (The Mourning of Christ)","year":"c. 1305","medium":"Fresco","location":"Scrovegni Chapel, Padua","description":"<p>Mourners gather around the body of Christ. A bare, rocky ridge runs diagonally down the picture and leads the eye to his face, which Mary holds close to her own. Two figures sit with their backs to us, a bold idea that places the viewer inside the circle of grief. Above, angels twist and cry out in the sky. The fresco shows Giotto's gift for turning sacred stories into human feeling.<\/p>","image":"images/giotto/lamentation.jpg","credit":{"file":"File:Giotto - Scrovegni - -36- - Lamentation (The Mourning of Christ) adj.jpg","source":"https://commons.wikimedia.org/wiki/File:Giotto_-_Scrovegni_-_-36-_-_Lamentation_(The_Mourning_of_Christ)_adj.jpg","author":"Giotto","license":"Public domain","license_url":null}},{"id":"ognissanti-madonna","title":"Ognissanti Madonna","year":"c. 1306–1310","medium":"Tempera and gold on panel, 325 × 204 cm","location":"Uffizi Gallery, Florence","description":"<p>Painted for the church of Ognissanti in Florence, this huge altarpiece shows the Virgin enthroned among saints and angels. Earlier Madonnas, such as Cimabue's, look flat and weightless. Giotto's Virgin has real bulk: her knees push forward under her robe, and her throne recedes like a piece of architecture. It hangs in the Uffizi beside the Madonnas of Cimabue and Duccio, so visitors can see the change for themselves.<\/p>","image":"images/giotto/ognissanti-madonna.jpg","credit":{"file":"File:Giotto, 1267 Around-1337 - Maestà - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Giotto,_1267_Around-1337_-_Maest%C3%A0_-_Google_Art_Project.jpg","author":"Giotto","license":"Public domain","license_url":null}},{"id":"campanile","title":"Giotto's Campanile","year":"begun 1334","medium":"Marble-clad bell tower (architecture), 84.7 m tall","location":"Piazza del Duomo, Florence","description":"<p>In 1334 Florence appointed Giotto master of works for its cathedral, and he designed this bell tower beside it. He lived to see only the lowest storey built. Andrea Pisano and Francesco Talenti finished the tower in the 1350s, but it still carries his name. Its patterned facing of white, green and pink marble became one of the symbols of the city.<\/p>","image":"images/giotto/campanile.jpg","credit":{"file":"File:CampanileGiotto-01.jpg","source":"https://commons.wikimedia.org/wiki/File:CampanileGiotto-01.jpg","author":"Thermos","license":"CC BY-SA 2.5","license_url":"https://creativecommons.org/licenses/by-sa/2.5"}}]},{"slug":"van-eyck","name":"Jan van Eyck","lifespan":"c. 1390–1441","born":1390,"died":1441,"year_label":"1390","region":"Europe","country":"Flanders (Burgundian Netherlands)","movements":["Early Netherlandish painting"],"discipline":["Painting"],"summary":"The Flemish master who showed what oil paint could do, painting the visible world with a clarity and detail never seen before.","sections":[{"title":"Overview","html":"<p>Jan van Eyck was the leading painter of the Burgundian Netherlands and one of the founders of Early Netherlandish painting. He did not invent oil paint, as later legend claimed. What he did was develop a way of building up thin, translucent layers of oil colour that let him paint light glinting on metal, the weave of cloth and the wrinkles of skin with startling realism. His <em>Ghent Altarpiece<\/em> and <em>Arnolfini Portrait<\/em> are among the most studied paintings in the world.<\/p>"},{"title":"Life","html":"<p>Van Eyck was probably born around 1390 in or near Maaseik, in what is now Belgian Limburg. Nothing is known of his training. He first appears in records around 1422 at The Hague, working for John of Bavaria, Count of Holland. From 1425 he served Philip the Good, Duke of Burgundy, as court painter and <em>valet de chambre<\/em>, a trusted household post. The duke paid him a generous salary and sent him on confidential missions. In 1428–1429 he travelled to Portugal to paint Princess Isabella, whom Philip later married.<\/p>\n<p>Around 1430 van Eyck settled in Bruges, a wealthy trading city full of Italian bankers and merchants. He bought a house, married a woman named Margaret, and had children. He completed the <em>Ghent Altarpiece<\/em>, begun by his brother Hubert, in 1432. The years that followed were his most productive: portraits of merchants and clergy and devotional pictures for rich patrons. Unusually for the time, he often signed and dated his work, sometimes adding his punning motto <em>Als ich can<\/em> (\"As I can\"). He died in Bruges in July 1441.<\/p>"},{"title":"Style & Technique","html":"<p>Van Eyck's method built up oil colours in many thin, transparent glazes over a light ground. Light passes through the layers and bounces back, which gives his colours a jewel-like depth. The slow drying time of oil let him blend and refine for weeks. He worked at tiny scale with fine brushes, and he could paint a distant city and the reflection on a single pearl in the same picture.<\/p>\n<p>He did not use the mathematical perspective that Italian artists were developing. Instead he built space through careful observation of light, and through atmosphere that turns distant hills blue. His pictures are full of symbols, such as candles, fruit and mirrors, that link everyday objects to religious meaning. His portraits are plain and closely observed, and look straight at their sitters.<\/p>"},{"title":"Legacy","html":"<p>Van Eyck set the course for Netherlandish painting for a century. Rogier van der Weyden, Petrus Christus and Hans Memling all followed his lead. Italian collectors prized his work, and his technique helped spread oil painting south of the Alps. Painters such as Antonello da Messina adopted it. Vasari's claim that van Eyck invented oil painting was wrong, but it shows how revolutionary his results seemed. The <em>Ghent Altarpiece<\/em> has survived iconoclasm, fire and Napoleon's looters. It was seized by the Nazis and later recovered from an Austrian salt mine by the Monuments Men. A restoration begun in 2012 has removed centuries of overpaint. In 2020 it revealed the Lamb's startlingly human face.<\/p>"}],"cover":"arnolfini-portrait","wikipedia":"https://en.wikipedia.org/wiki/Jan_van_Eyck","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/van-eyck.md","works":[{"id":"ghent-altarpiece","title":"The Ghent Altarpiece (Adoration of the Mystic Lamb)","year":"completed 1432","medium":"Oil on oak panels, 12 panels (open), 350 × 470 cm","location":"St Bavo's Cathedral, Ghent","description":"<p>A huge folding altarpiece. When open, it shows God enthroned between Mary and John the Baptist, Adam and Eve at the far edges, and below them crowds of saints, prophets and pilgrims streaming across a flowering meadow to worship the Lamb of God. An inscription credits Jan's brother Hubert with beginning it and Jan with finishing it in 1432. It may be the most frequently stolen artwork in history. One panel, the <em>Just Judges<\/em>, taken in 1934, has never been found.<\/p>","image":"images/van-eyck/ghent-altarpiece.jpg","credit":{"file":"File:Ghent Altarpiece Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Ghent_Altarpiece_Google_Art_Project.jpg","author":"Jan van Eyck / Presumably Hubert van Eyck","license":"Public domain","license_url":null}},{"id":"man-in-a-turban","title":"Portrait of a Man in a Red Turban","year":"1433","medium":"Oil on oak panel, 26 × 19 cm","location":"National Gallery, London","description":"<p>A sharply lit face turns out of a black background, framed by a red headdress folded in astonishing detail. The original frame carries van Eyck's motto <em>Als ich can<\/em> (\"As I can\") and the date 21 October 1433. The steady sideways gaze has led many to believe this is a self-portrait, perhaps painted with the help of a mirror.<\/p>","image":"images/van-eyck/man-in-a-turban.jpg","credit":{"file":"File:Jan van Eyck - Portrait of a Man (Self Portrait?) 1433.jpg","source":"https://commons.wikimedia.org/wiki/File:Jan_van_Eyck_-_Portrait_of_a_Man_(Self_Portrait%3F)_1433.jpg","author":"Jan van Eyck","license":"Public domain","license_url":null}},{"id":"arnolfini-portrait","title":"The Arnolfini Portrait","year":"1434","medium":"Oil on oak panel, 82 × 60 cm","location":"National Gallery, London","description":"<p>An Italian merchant, probably Giovanni di Nicolao Arnolfini, stands hand in hand with a woman in a green gown in a room in Bruges. On the back wall, a convex mirror reflects the couple from behind along with two more figures in the doorway. Above it, van Eyck signed in elegant script: \"Jan van Eyck was here 1434\". Every object is painted with microscopic care: the brass chandelier, the oranges on the windowsill, the little dog. The picture has invited endless theories about marriage, memory and symbolism.<\/p>","image":"images/van-eyck/arnolfini-portrait.jpg","credit":{"file":"File:The Arnolfini portrait (1434).jpg","source":"https://commons.wikimedia.org/wiki/File:The_Arnolfini_portrait_(1434).jpg","author":"Jan van Eyck","license":"Public domain","license_url":null}},{"id":"madonna-of-chancellor-rolin","title":"The Madonna of Chancellor Rolin","year":"c. 1435","medium":"Oil on panel, 66 × 62 cm","location":"Musée du Louvre, Paris","description":"<p>Nicolas Rolin, the powerful chancellor of Burgundy, kneels in prayer across from the Virgin and Child, as an angel lowers a crown onto Mary's head. Behind them, three arches open onto a river valley painted in miniature: a bridge, a city, boats and tiny people, fading into blue distance. That landscape shows van Eyck's mastery of detail at every scale.<\/p>","image":"images/van-eyck/madonna-of-chancellor-rolin.jpg","credit":{"file":"File:The Virgin with Chancellor Rolin by Jan van Eyck (Louvre).webp","source":"https://commons.wikimedia.org/wiki/File:The_Virgin_with_Chancellor_Rolin_by_Jan_van_Eyck_(Louvre).webp","author":"Jan van Eyck","license":"Public domain","license_url":null}},{"id":"madonna-van-der-paele","title":"The Madonna with Canon van der Paele","year":"1434–1436","medium":"Oil on panel, 122 × 157 cm","location":"Groeningemuseum, Bruges","description":"<p>The elderly canon Joris van der Paele, spectacles in hand, is presented to the Virgin by St George, while St Donatian stands at the left. Van Eyck painted the old man's wrinkled skin, the shining armour and a richly patterned oriental carpet with such precision that they seem almost real enough to touch. The painting is a showcase of what oil paint could do.<\/p>","image":"images/van-eyck/madonna-van-der-paele.jpg","credit":{"file":"File:Jan van Eyck 069.jpg","source":"https://commons.wikimedia.org/wiki/File:Jan_van_Eyck_069.jpg","author":"Jan van Eyck","license":"Public domain","license_url":null}},{"id":"margaret-van-eyck","title":"Portrait of Margaret van Eyck","year":"1439","medium":"Oil on panel, 41 × 34 cm","location":"Groeningemuseum, Bruges","description":"<p>The artist's wife, then 33, looks directly out at us. This is among the earliest European portraits of an artist's spouse. Its original frame records that \"my husband Johannes completed me\" on 17 June 1439. The painting is plain and unflattering, but warm: it is a record of a real person rather than an ideal.<\/p>","image":"images/van-eyck/margaret-van-eyck.jpg","credit":{"file":"File:Jan van Eyck - Portrait of Margaret van Eyck (1439).jpg","source":"https://commons.wikimedia.org/wiki/File:Jan_van_Eyck_-_Portrait_of_Margaret_van_Eyck_(1439).jpg","author":"Jan van Eyck","license":"Public domain","license_url":null}}]},{"slug":"sesshu","name":"Sesshū Tōyō","lifespan":"1420–1506","born":1420,"died":1506,"year_label":"1420","region":"East Asia","country":"Japan","movements":["Muromachi ink painting (suibokuga)","Zen art"],"discipline":["Painting"],"summary":"The Zen monk-painter who mastered Chinese ink painting and made it Japanese; he is regarded as the greatest master of Japanese ink painting.","sections":[{"title":"Overview","html":"<p>Sesshū Tōyō was a Zen Buddhist monk whose ink paintings are among the highest achievements of Japanese art. Trained in the Chinese-inspired ink painting of the Zen monasteries, he travelled to Ming China and studied its landscapes and painters at first hand. He came home with a bold, confident style of his own. His strong brush lines, sharp contrasts and daring compositions gave Japanese ink painting a new energy. Six of his works are designated National Treasures of Japan, more than any other painter.<\/p>"},{"title":"Life","html":"<p>Sesshū was born in 1420 in Bitchū Province (in present-day Okayama Prefecture) and entered a Zen temple as a boy. A famous legend tells that, tied to a pillar as punishment for drawing instead of studying, he drew a mouse on the floor with his tears so lifelike that it seemed to come alive. As a young monk he moved to Shōkoku-ji in Kyoto, one of the great Zen monasteries. He studied painting there with the monk-painter Tenshō Shūbun.<\/p>\n<p>Around the 1460s he took the name Sesshū (\"snow boat\") and settled in Yamaguchi under the patronage of the powerful Ōuchi family. In 1467 he joined a trade mission to Ming China. He spent about two years there. He travelled from the coast to Beijing, saw the landscapes that Chinese painters depicted, and received an honorary title at the famous Tiantong monastery near Ningbo.<\/p>\n<p>He returned to Japan in 1469, just as the Ōnin War was tearing Kyoto apart. He avoided the capital and worked in the provinces, mainly in Yamaguchi, where his studio, the Unkoku-an, attracted pupils. He travelled widely, sketching Japanese landscapes. He is also credited with designing several temple gardens. He remained active into his eighties and died in 1506.<\/p>"},{"title":"Style & Technique","html":"<p>Sesshū worked in <em>suibokuga<\/em>, painting in black ink and water on paper or silk, sometimes with light washes of colour. His brushwork is strong and angular. He built rocks and mountains from hard, chiselled contour lines, and his compositions are clear and tightly organised, with a firm sense of structure that earlier Japanese ink paintings lacked.<\/p>\n<p>He mastered many modes, from detailed Chinese-style landscapes to the loose, splashed <em>haboku<\/em> (\"broken ink\") style, in which wet washes are dropped onto the paper and shaped with a few quick strokes. His subjects range from grand imaginary landscapes to Zen figures, birds and flowers, and real Japanese scenery.<\/p>"},{"title":"Legacy","html":"<p>After his death, Sesshū became a legend. Later schools of painting claimed to descend from him: the Unkoku school that continued his studio, and Hasegawa Tōhaku, who styled himself the fifth-generation heir of Sesshū. The official Kanō school painters revered his work and copied it as a model. Gardens attributed to him, such as that of Jōei-ji in Yamaguchi, are still visited today. In 1956 the World Peace Council named him one of its \"great cultural figures\", and his image appeared on a Soviet stamp.<\/p>"}],"cover":"haboku-landscape","wikipedia":"https://en.wikipedia.org/wiki/Sessh%C5%AB_T%C5%8Dy%C5%8D","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/sesshu.md","works":[{"id":"four-seasons-autumn","title":"Landscapes of the Four Seasons – Autumn (attributed)","year":"late 15th century","medium":"Hanging scroll, ink and light colour","location":"Tokyo National Museum","description":"<p>One of a set of four tall scrolls showing the seasons in the monumental style of Chinese landscape painting: towering cliffs, a temple half hidden in trees, houses in a misty valley. Works like this show how carefully Sesshū studied the Chinese masters of the Song and Ming dynasties. He did this before and during his journey to China.<\/p>","image":"images/sesshu/four-seasons-autumn.jpg","credit":{"file":"File:Sesshu Toyo - Landscape of Four Seasons- Fall - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Sesshu_Toyo_-_Landscape_of_Four_Seasons-_Fall_-_Google_Art_Project.jpg","author":"Sesshu Toyo 1420-1506? Details on Google Art Project","license":"Public domain","license_url":null}},{"id":"autumn-and-winter-landscapes","title":"Autumn and Winter Landscapes","year":"late 15th century","medium":"Pair of hanging scrolls, ink on paper, each 46.4 × 29.4 cm","location":"Tokyo National Museum (National Treasure)","description":"<p>Two small scrolls that are among the most admired works of Japanese ink painting. In <em>Winter<\/em>, a single jagged black line plunges down through the sky beside a cliff. It is not really a mountain edge, and it slices the composition in two with startling abstract force. A lone traveller climbs toward a temple through the snow, suggested only by blank paper.<\/p>","image":"images/sesshu/autumn-and-winter-landscapes.jpg","credit":{"file":"File:Autumn and Winter Landscape.jpg","source":"https://commons.wikimedia.org/wiki/File:Autumn_and_Winter_Landscape.jpg","author":"Sesshū Tōyō","license":"Public domain","license_url":null}},{"id":"haboku-landscape","title":"Haboku Landscape (Splashed-Ink Landscape)","year":"1495","medium":"Hanging scroll, ink on paper, 148.6 × 32.7 cm (whole scroll)","location":"Tokyo National Museum (National Treasure)","description":"<p>Painted for his disciple Josui Sōen as a certificate of his training, this landscape is made almost entirely of wet, splashed washes of ink. A few quick dark strokes turn the blots into a wine-shop flag, a roof, a boat and two tiny figures. Above it Sesshū wrote a long inscription about his teachers and his trip to China. It is a celebrated example of the spontaneous \"broken ink\" style.<\/p>","image":"images/sesshu/haboku-landscape.jpg","credit":{"file":"File:Sesshu - Haboku-Sansui.jpg","source":"https://commons.wikimedia.org/wiki/File:Sesshu_-_Haboku-Sansui.jpg","author":"Sesshū Tōyō","license":"Public domain","license_url":null}},{"id":"huike-offering-his-arm","title":"Huike Offering His Arm to Bodhidharma","year":"1496","medium":"Hanging scroll, ink and light colour on paper, 199.9 × 113.6 cm","location":"Sainen-ji, Aichi Prefecture (National Treasure)","description":"<p>Painted when Sesshū was 76, it shows a Zen legend. The monk Huike, refused as a disciple by Bodhidharma, cuts off his own arm to prove his sincerity. Bodhidharma sits meditating before a cave wall, drawn with a heavy, unbroken outline, unmoved. Huike stands beside him, holding his severed arm. The bold contrast of the simple figure and the swirling rock makes it one of the great images of Zen art.<\/p>","image":"images/sesshu/huike-offering-his-arm.jpg","credit":{"file":"File:Bodhidharma.and.Huike-Sesshu.Toyo.jpg","source":"https://commons.wikimedia.org/wiki/File:Bodhidharma.and.Huike-Sesshu.Toyo.jpg","author":"Sesshū Tōyō","license":"Public domain","license_url":null}},{"id":"flowers-and-birds","title":"Flowers and Birds of the Four Seasons (attributed)","year":"15th century","medium":"Folding screens, ink and colour on paper","location":"Tokyo National Museum","description":"<p>Pines, plum trees, water and birds stretch across large folding screens, moving through the year from spring to winter. Screens like these, painted in Sesshū's manner, helped make bird-and-flower painting a staple of Japanese interior decoration. It prepared the way for the grand screens of the Kanō school.<\/p>","image":"images/sesshu/flowers-and-birds.jpg","credit":{"file":"File:Flowers and Birds of the Four Seasons, attributed to Sesshu Toyo (1420-1506), Muromachi period, 15th century, color on paper, view 3 - Tokyo National Museum - DSC05854.JPG","source":"https://commons.wikimedia.org/wiki/File:Flowers_and_Birds_of_the_Four_Seasons,_attributed_to_Sesshu_Toyo_(1420-1506),_Muromachi_period,_15th_century,_color_on_paper,_view_3_-_Tokyo_National_Museum_-_DSC05854.JPG","author":"Daderot","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"view-of-ama-no-hashidate","title":"View of Ama-no-Hashidate","year":"c. 1501–1506","medium":"Hanging scroll, ink and light colour on paper, 89.4 × 169.5 cm","location":"Kyoto National Museum (National Treasure)","description":"<p>One of Sesshū's last works and one of the earliest large views of a real Japanese place. The famous pine-covered sandbar of Ama-no-Hashidate stretches across the bay, surrounded by temples, shrines and villages, many labelled with their names. Painted in his eighties, it shows him turning from Chinese models to the scenery of his own country.<\/p>","image":"images/sesshu/view-of-ama-no-hashidate.jpg","credit":{"file":"File:Sesshu - View of Ama-no-Hashidate.jpg","source":"https://commons.wikimedia.org/wiki/File:Sesshu_-_View_of_Ama-no-Hashidate.jpg","author":"Sesshū Tōyō","license":"Public domain","license_url":null}}]},{"slug":"shen-zhou","name":"Shen Zhou","lifespan":"1427–1509","born":1427,"died":1509,"year_label":"1427","region":"East Asia","country":"China (Ming dynasty)","movements":["Wu School","Literati painting"],"discipline":["Painting"],"summary":"The founder of the Wu School in Suzhou, a scholar-painter who turned landscape into a record of friendship, poetry and quiet life.","sections":[{"title":"Overview","html":"<p>Shen Zhou was the leading figure of Ming-dynasty <em>literati<\/em> painting and the founder of the Wu School, named after the Suzhou region. He never held office. Instead he spent his long life at his family estate outside Suzhou, painting, writing poetry, collecting art and entertaining friends. His landscapes, flowers, animals and figures combine painting with poetry and calligraphy. They revived the styles of the great Yuan-dynasty masters with a warmth and directness of his own. With his pupil Wen Zhengming, Tang Yin and Qiu Ying, he is counted among the \"Four Masters of the Ming Dynasty\".<\/p>"},{"title":"Life","html":"<p>Shen Zhou was born in 1427 near Suzhou, in the prosperous Jiangnan region of eastern China, into a wealthy family of scholars, poets and art collectors. His grandfather and father were painters, and the family deliberately avoided government service. Shen Zhou was taught by leading local scholars, including Chen Kuan and Liu Jue. He studied the old masterpieces in his family's collection.<\/p>\n<p>He never sat the civil service examinations that led to an official career. When local officials recommended him for office, he declined, saying that he needed to care for his widowed mother. She lived to almost 100. His home became a meeting place for Suzhou's intellectual elite, and many of his paintings were made as gifts for friends, to mark birthdays, farewells or shared outings.<\/p>\n<p>Shen Zhou was famous for his generosity. According to one story, when forgers sold fake Shen Zhou paintings, he sometimes signed them to help the poor forgers earn a living. He trained the younger painter Wen Zhengming, who carried on the Wu School. He died in 1509 at the age of 82.<\/p>"},{"title":"Style & Technique","html":"<p>As a literati painter, Shen Zhou valued personal expression over technical display. He painted mainly in ink on paper, sometimes with light washes of colour. His brushwork was strong, rounded and deliberate. He studied the four great Yuan masters, Huang Gongwang, Wu Zhen, Ni Zan and Wang Meng. He painted \"in the manner of\" each of them, not as copies but as conversations with the past.<\/p>\n<p>His compositions are often simple and solid, with large forms and clear spaces. He was one of the first Chinese painters to make albums of real local places around Suzhou. He also painted plants, animals and everyday objects with humour and affection. Almost every painting carries his own poem in his vigorous calligraphy, so that word and image complete each other.<\/p>"},{"title":"Legacy","html":"<p>Shen Zhou's example defined the ideal of the scholar-painter for the rest of the Ming and Qing dynasties. Through Wen Zhengming and his followers, the Wu School dominated Chinese painting in the 16th century. Later theorists such as Dong Qichang placed Shen Zhou in the \"Southern School\" of literati painters, whom they considered superior to professional court artists. His works are prized in collections across China, Taiwan and the United States, and the National Palace Museum in Taipei and the Palace Museum in Beijing hold especially important groups of them.<\/p>"}],"cover":"lofty-mount-lu","wikipedia":"https://en.wikipedia.org/wiki/Shen_Zhou","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/shen-zhou.md","works":[{"id":"lofty-mount-lu","title":"Lofty Mount Lu","year":"1467","medium":"Hanging scroll, ink and light colour on paper, 193.8 × 98.1 cm","location":"National Palace Museum, Taipei","description":"<p>A towering mountain of stacked peaks, waterfalls and pines, with a tiny scholar standing at its foot. Shen Zhou painted it as a 70th-birthday gift for his teacher Chen Kuan. The mountain's grandeur is a tribute to the old man's character. He had never visited Mount Lu. He painted it in the dense, textured manner of the Yuan master Wang Meng, and it is one of his largest and most ambitious works.<\/p>","image":"images/shen-zhou/lofty-mount-lu.jpg","credit":{"file":"File:Lofty Mt.Lu by Shen Zhou.jpg","source":"https://commons.wikimedia.org/wiki/File:Lofty_Mt.Lu_by_Shen_Zhou.jpg","author":"Shen Zhou","license":"Public domain","license_url":null}},{"id":"boating-on-an-autumn-river","title":"Boating on an Autumn River","year":"1471","medium":"Hanging scroll, ink and colour on paper","location":"Honolulu Museum of Art","description":"<p>A small boat drifts on a quiet river beneath autumn trees and distant hills, composed in a tall, narrow format that leads the eye upward through the landscape. Scenes of boating, visiting friends and retreat were favourite themes of the Suzhou literati, who valued leisure and friendship above official careers.<\/p>","image":"images/shen-zhou/boating-on-an-autumn-river.jpg","credit":{"file":"File:Boating on an Autumn River by Shen Zhou, 1471, Honolulu Museum of Art.jpg","source":"https://commons.wikimedia.org/wiki/File:Boating_on_an_Autumn_River_by_Shen_Zhou,_1471,_Honolulu_Museum_of_Art.jpg","author":"Shen Zhou","license":"Public domain","license_url":null}},{"id":"walking-with-a-staff","title":"Walking with a Staff","year":"late 15th century","medium":"Hanging scroll, ink on paper, 159.1 × 72.2 cm","location":"National Palace Museum, Taipei","description":"<p>A small scholar with a walking stick pauses among tall, slender trees near a stream and a thatched pavilion, beneath towering, rounded mountains. The dry ink and clean contours follow the Yuan painter Ni Zan, whose austere style Shen Zhou admired but found hard to imitate. Here he makes it fuller and bolder. The figure is often read as a self-portrait of the artist.<\/p>","image":"images/shen-zhou/walking-with-a-staff.jpg","credit":{"file":"File:Shen Zhou. Walking with a Staff. National Palace Museum, Taipei.jpg","source":"https://commons.wikimedia.org/wiki/File:Shen_Zhou._Walking_with_a_Staff._National_Palace_Museum,_Taipei.jpg","author":"Shen Zhou","license":"Public domain","license_url":null}},{"id":"night-vigil","title":"Night Vigil","year":"1492","medium":"Hanging scroll, ink and light colour on paper, 84.8 × 21.8 cm","location":"National Palace Museum, Taipei","description":"<p>Shen Zhou sits awake in a small house among mountains late at night. Above the painting he wrote a long essay describing how, in the silence, he listened to the sounds of the night: wind, dogs, a distant drum. The experience cleared his mind. Text and image together make this a rare, intimate record of a Chinese painter's inner life.<\/p>","image":"images/shen-zhou/night-vigil.jpg","credit":{"file":"File:沈周-夜坐圖.jpg","source":"https://commons.wikimedia.org/wiki/File:%E6%B2%88%E5%91%A8-%E5%A4%9C%E5%9D%90%E5%9C%96.jpg","author":null,"license":"Public domain","license_url":null}},{"id":"poet-on-a-mountaintop","title":"Poet on a Mountaintop","year":"c. 1500","medium":"Album leaf mounted as a handscroll, ink and light colour on paper, 38.7 × 60.3 cm","location":"Nelson-Atkins Museum of Art, Kansas City","description":"<p>A scholar stands alone on a clifftop, gazing across an empty valley veiled in mist. Shen Zhou's poem in the sky imagines the white clouds like a sash around the mountains. The vast empty space, the simple forms and the fusion of painting, poetry and calligraphy make this small album leaf one of the most loved images in Chinese art.<\/p>","image":"images/shen-zhou/poet-on-a-mountaintop.jpg","credit":{"file":"File:Poet on a Mountaintop.jpg","source":"https://commons.wikimedia.org/wiki/File:Poet_on_a_Mountaintop.jpg","author":"Shen Zhou (沈周, 1427-1509), Ming Dynasty (1368-1644)","license":"Public domain","license_url":null}},{"id":"crabs","title":"Crabs","year":"late 15th century","medium":"Ink and light colour on paper","location":"Princeton University Art Museum","description":"<p>Three crabs clamber among reeds at the water's edge, each drawn with a few wet, confident strokes of ink. A short poem in Shen Zhou's hand is written above them. He enjoyed painting everyday subjects such as vegetables, fruit, birds, cats and crabs, which were a favourite autumn delicacy in Suzhou. These quick, humorous sketches show the lively side of an artist better known for grand landscapes.<\/p>","image":"images/shen-zhou/crabs.jpg","credit":{"file":"File:Shen Zhou 沈周 - Crabs - y1942-24 - Princeton University Art Museum.jpg","source":"https://commons.wikimedia.org/wiki/File:Shen_Zhou_%E6%B2%88%E5%91%A8_-_Crabs_-_y1942-24_-_Princeton_University_Art_Museum.jpg","author":"Shen Zhou","license":"Public domain","license_url":null}}]},{"slug":"bosch","name":"Hieronymus Bosch","lifespan":"c. 1450–1516","born":1450,"died":1516,"year_label":"1450","region":"Europe","country":"Duchy of Brabant (Netherlands)","movements":["Early Netherlandish painting"],"discipline":["Painting"],"summary":"The Dutch painter of paradise and nightmare, whose teeming visions of sin, folly and salvation still resist explanation.","sections":[{"title":"Overview","html":"<p>Hieronymus Bosch filled his paintings with strange creatures, impossible buildings and swarms of tiny figures acting out the sins and follies of humanity. Behind the fantasy lay the deep religious worries of the late Middle Ages: fear of Hell, suspicion of corrupt clergy, and the pull of earthly pleasure. Only about 25 paintings are firmly attributed to him. They made him famous across Europe in his lifetime, and centuries later the Surrealists hailed him as their forefather.<\/p>"},{"title":"Life","html":"<p>Bosch was born Jheronimus van Aken around 1450 in 's-Hertogenbosch, a prosperous town in the Duchy of Brabant, now in the southern Netherlands. His grandfather, father and uncles were all painters, and he learned the trade in the family workshop. He later signed his works \"Jheronimus Bosch\" after the town's name.<\/p>\n<p>Around 1481 he married Aleid van de Meervenne, the daughter of a wealthy family. The marriage gave him financial independence. In 1488 he became a sworn member of the Illustrious Brotherhood of Our Blessed Lady, a powerful religious confraternity whose members included the town's elite. He took part in its feasts and designed works for it.<\/p>\n<p>Bosch seems to have spent almost his whole life in 's-Hertogenbosch, yet his fame spread far. Philip the Handsome, Duke of Burgundy, commissioned a Last Judgment from him in 1504. The Nassau family and other nobles collected his paintings. He died in 1516, and the Brotherhood held a funeral mass for him that August. Later in the century King Philip II of Spain became obsessed with his work and bought every Bosch he could. That is why the Prado in Madrid holds his greatest paintings today.<\/p>"},{"title":"Style & Technique","html":"<p>Bosch painted in oil on oak panels, often as triptychs, three hinged panels that could be closed to show grey-toned scenes on the outside. His technique was unusually quick and free for his time. He often applied thin paint in a single layer, with lively, visible brushwork and bright highlights.<\/p>\n<p>His imagination is his signature. He combined human, animal, plant and machine parts into hybrid monsters. He turned proverbs and puns into images, and he packed his panels with hundreds of tiny episodes that reward close looking. Beneath the fantasy, he was a sharp observer of ordinary life: peasants, beggars, quack doctors and gluttons appear with satirical precision.<\/p>"},{"title":"Legacy","html":"<p>Bosch had many imitators in the 16th century, and Pieter Bruegel the Elder built on his crowded moral landscapes. His work was then partly forgotten until the 20th century. Surrealists such as Salvador Dalí and Max Ernst claimed him as a pioneer of dream imagery. In 2016, the 500th anniversary of his death, the Bosch Research and Conservation Project re-examined his works, and several were reattributed to his workshop. His imagery of the <em>Garden of Earthly Delights<\/em> now appears everywhere from album covers to video games.<\/p>"}],"cover":"garden-of-earthly-delights","wikipedia":"https://en.wikipedia.org/wiki/Hieronymus_Bosch","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/bosch.md","works":[{"id":"seven-deadly-sins","title":"The Seven Deadly Sins and the Four Last Things","year":"c. 1500 (attributed)","medium":"Oil on panel, 120 × 150 cm","location":"Museo del Prado, Madrid","description":"<p>A painted tabletop arranged like a giant eye. At its centre, Christ rises from his tomb inside the \"pupil\" above the Latin warning <em>Beware, beware, the Lord sees<\/em>. Around him, seven scenes of everyday life act out Glut
