y a wise parrot. This page, attributed to Basawan, illustrates a story about how music was first discovered. It already shows the lively figures and bright colours that marked the new Mughal style, a blend of Persian and Indian painting.<\/p>","image":"images/basawan/origin-of-music.jpg","credit":{"file":"File:1 Basawan. The Origin of Music Page from a Tutinama Manuscript 1560-65 Cleveland Museum of Art.jpg","source":"https://commons.wikimedia.org/wiki/File:1_Basawan._The_Origin_of_Music_Page_from_a_Tutinama_Manuscript_1560-65_Cleveland_Museum_of_Art.jpg","author":"Basawan","license":"Public domain","license_url":null}},{"id":"drunk-european","title":"A European Seated on the Ground (A Drunk European)","year":"c. 1580–1585","medium":"Ink, opaque watercolour and gold on paper","location":"National Museum of Asian Art (Freer Gallery), Washington","description":"<p>A slumped man in European dress sits on the ground with a wine flask, carefully shaded to give him volume. Portuguese traders and Jesuit missionaries had recently arrived at Akbar's court with European prints and paintings. Basawan was among the first Mughal artists to study them closely and absorb their modelling and perspective.<\/p>","image":"images/basawan/drunk-european.jpg","credit":{"file":"File:Basawan. Drunk European seated on ground. ca. 1580-1585. Freer and Sackler Gallery, Washington.jpg","source":"https://commons.wikimedia.org/wiki/File:Basawan._Drunk_European_seated_on_ground._ca._1580-1585._Freer_and_Sackler_Gallery,_Washington.jpg","author":"Basawan","license":"Public domain","license_url":null}},{"id":"akbar-and-hawai","title":"Akbar's Adventure with the Elephant Hawai, from the Akbarnama","year":"c. 1590–1595","medium":"Opaque watercolour and gold on paper (design by Basawan, painted by Chetar Munti)","location":"Victoria and Albert Museum, London","description":"<p>One page of a double-page scene from the illustrated history of Akbar's reign. In 1561 the 19-year-old emperor mounted the ferocious elephant Hawai and drove it after another elephant across a bridge of boats on the Jumna at Agra. The boats sink and tilt beneath the animals as attendants leap into the water. Basawan designed the swirling composition, and another artist added the colours.<\/p>","image":"images/basawan/akbar-and-hawai.jpg","credit":{"file":"File:Basawan. Akbar Taming Mad Elephant Hawai. Composition by Basawan, coloring by Chitra. (right part) Akbarnama, ca. 1590, Victoria and Albert Museum, London.. (2).jpg","source":"https://commons.wikimedia.org/wiki/File:Basawan._Akbar_Taming_Mad_Elephant_Hawai._Composition_by_Basawan,_coloring_by_Chitra._(right_part)_Akbarnama,_ca._1590,_Victoria_and_Albert_Museum,_London.._(2).jpg","author":"Basawan","license":"Public domain","license_url":null}},{"id":"battle-of-the-ascetics","title":"Battle between Rival Groups of Ascetics at Thanesar, from the Akbarnama","year":"c. 1590–1595","medium":"Opaque watercolour and gold on paper","location":"Victoria and Albert Museum, London","description":"<p>In 1567 two rival bands of Hindu ascetics fought over the right to a sacred bathing place at Thanesar. Akbar watched, and let some of his soldiers join the fight. Basawan fills the page with dozens of near-naked, ash-smeared figures wielding swords and bows. Each body is shown in a different pose, with a vigour and anatomical study that were unmatched at the court.<\/p>","image":"images/basawan/battle-of-the-ascetics.jpg","credit":{"file":"File:Basawan. Battle of rival ascetics. Akbarnama, ca. 1590, V&A Museum.jpg","source":"https://commons.wikimedia.org/wiki/File:Basawan._Battle_of_rival_ascetics._Akbarnama,_ca._1590,_V%26A_Museum.jpg","author":"Basawan","license":"Public domain","license_url":null}},{"id":"vain-dervish","title":"The Vain Dervish Rebuked, from the Baharistan of Jami","year":"1595","medium":"Opaque watercolour and gold on paper","location":"Bodleian Library, Oxford","description":"<p>From a small, exquisite manuscript of Jami's <em>Baharistan<\/em> (\"Spring Garden\") made for Akbar's library in Lahore. A proud dervish is taught humility by a wiser Sufi. Basawan sets the scene in a soft, receding landscape with a distant town, showing his mastery of atmospheric depth learned partly from European models.<\/p>","image":"images/basawan/vain-dervish.jpg","credit":{"file":"File:Basawan. The Vain Dervish and the Sufi. Baharistan of Jami. Dated 1595, Bodleian Library, Oxford..jpg","source":"https://commons.wikimedia.org/wiki/File:Basawan._The_Vain_Dervish_and_the_Sufi._Baharistan_of_Jami._Dated_1595,_Bodleian_Library,_Oxford..jpg","author":"Basawan","license":"Public domain","license_url":null}},{"id":"jain-ascetic","title":"Jain Ascetic Walking Along a Riverbank","year":"c. 1600","medium":"Ink and opaque watercolour on paper","location":"Cleveland Museum of Art","description":"<p>A lean, white-robed Jain monk walks along a river beneath trees, absorbed in thought, while life goes on around him. It is a late, intimate work, an individual study of a holy man rather than a page of history. It shows the naturalism and sympathy for ordinary people that Basawan passed on to the next generation of Mughal painters, including his son Manohar.<\/p>","image":"images/basawan/jain-ascetic.jpg","credit":{"file":"File:Basawan. Jain-Ascetic-Walking-Along-a-Riverbank-ca.1600..jpg","source":"https://commons.wikimedia.org/wiki/File:Basawan._Jain-Ascetic-Walking-Along-a-Riverbank-ca.1600..jpg","author":"Basawan","license":"Public domain","license_url":null}}]},{"slug":"caravaggio","name":"Caravaggio","lifespan":"1571–1610","born":1571,"died":1610,"year_label":"1571","region":"Europe","country":"Italy","movements":["Baroque"],"discipline":["Painting"],"summary":"The rebel of Baroque Rome, whose dramatic light and street-level realism transformed European painting.","sections":[{"title":"Overview","html":"<p>Michelangelo Merisi, known as Caravaggio, burst onto the Roman art scene around 1600 with paintings of startling realism. He painted saints and apostles using ordinary people as models: dirty feet, torn clothes and all. He lit them with a harsh, theatrical light that plunged everything else into darkness. This dramatic light and shadow, called <em>tenebrism<\/em>, and his directness shocked some patrons and thrilled others. His turbulent, violent life ended at 38, but his influence spread across Europe in a single generation.<\/p>"},{"title":"Life","html":"<p>Caravaggio was born in Milan in September 1571. His family came from the nearby town of Caravaggio, which gave him his name. He lost his father to plague as a child and trained in Milan with the painter Simone Peterzano. Around 1592 he arrived in Rome penniless, working in other painters' studios, where he painted flowers and fruit, and selling small pictures of youths and still lifes.<\/p>\n<p>Cardinal Francesco Maria del Monte, a sophisticated collector, took him into his household. In 1599–1600 Caravaggio won his first public commission, two large paintings of St Matthew for the Contarelli Chapel in San Luigi dei Francesi. They caused a sensation. Commissions followed from churches and wealthy collectors, although several altarpieces were rejected as indecorous.<\/p>\n<p>His temper was as famous as his art. Police records list brawls, assaults and insults. In 1606 he killed a man, Ranuccio Tomassoni, in a fight and fled Rome under sentence of death. He spent his last years on the run, in Naples, Malta (where he was briefly made a Knight of the Order of St John before being imprisoned and expelled) and Sicily. After being badly wounded in an attack in Naples, he set off for Rome in 1610 hoping for a papal pardon. He died on the journey, at Porto Ercole in Tuscany, in July 1610.<\/p>"},{"title":"Style & Technique","html":"<p>Caravaggio painted directly onto the canvas, apparently without preparatory drawings, working from live models posed under a strong single light source. He sometimes scored outlines into the wet ground with the end of his brush. His backgrounds are dark and bare, so the figures seem to push out into the viewer's space.<\/p>\n<p>He chose the moment of greatest drama: a conversion, a betrayal, a death. He showed it with unidealised bodies and gestures. His religious paintings bring sacred events into the streets of contemporary Rome. Late works, made in exile, grew sparer and darker, with small figures lost in vast shadowy spaces.<\/p>"},{"title":"Legacy","html":"<p>Within a decade of his death, painters across Europe were imitating him. The \"Caravaggisti\" included Orazio and Artemisia Gentileschi in Italy, Jusepe de Ribera in Naples, Georges de La Tour in France, and the Utrecht painters Gerrit van Honthorst and Hendrick ter Brugghen. Through them his influence reached Velázquez and Rembrandt. His reputation faded in later centuries, until a landmark 1951 exhibition in Milan revived it. Today he is one of the most popular of the Old Masters, and film directors and photographers still borrow his dramatic lighting.<\/p>"}],"cover":"calling-of-saint-matthew","wikipedia":"https://en.wikipedia.org/wiki/Caravaggio","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/caravaggio.md","works":[{"id":"boy-with-a-basket-of-fruit","title":"Boy with a Basket of Fruit","year":"c. 1593","medium":"Oil on canvas, 70 × 67 cm","location":"Galleria Borghese, Rome","description":"<p>Painted soon after Caravaggio arrived in Rome, when he was selling pictures to survive. A young man with bare shoulder and parted lips holds a basket overflowing with grapes, peaches and figs. The fruit is painted with such botanical accuracy that its species can be identified, a sign of the young artist's commitment to painting straight from life.<\/p>","image":"images/caravaggio/boy-with-a-basket-of-fruit.jpg","credit":{"file":"File:Boy with a Basket of Fruit by Caravaggio.jpg","source":"https://commons.wikimedia.org/wiki/File:Boy_with_a_Basket_of_Fruit_by_Caravaggio.jpg","author":"Caravaggio","license":"Public domain","license_url":null}},{"id":"medusa","title":"Medusa","year":"c. 1597","medium":"Oil on canvas mounted on a wooden shield, 60 × 55 cm","location":"Uffizi Gallery, Florence","description":"<p>Painted on a real parade shield as a gift for the Grand Duke of Tuscany, the Gorgon's severed head screams at the instant of death, blood spurting and snakes still writhing. Caravaggio probably used his own face as the model. The convex surface makes the head seem to jump forward.<\/p>","image":"images/caravaggio/medusa.jpg","credit":{"file":"File:Caravaggio - Medusa - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_Medusa_-_Google_Art_Project.jpg","author":"Caravaggio","license":"Public domain","license_url":null}},{"id":"judith-beheading-holofernes","title":"Judith Beheading Holofernes","year":"c. 1598–1599","medium":"Oil on canvas, 145 × 195 cm","location":"Galleria Nazionale d'Arte Antica (Palazzo Barberini), Rome","description":"<p>The Jewish heroine Judith saws through the neck of the Assyrian general Holofernes, her face showing both determination and disgust. Her old maid waits eagerly with a sack. Against a black background and a blood-red curtain, the violence is shockingly direct. The picture helped establish Caravaggio's reputation for brutal realism.<\/p>","image":"images/caravaggio/judith-beheading-holofernes.jpg","credit":{"file":"File:Caravaggio - Giuditta e Oloferne (ca. 1599).jpg","source":"https://commons.wikimedia.org/wiki/File:Caravaggio_-_Giuditta_e_Oloferne_(ca._1599).jpg","author":"Caravaggio","license":"Public domain","license_url":null}},{"id":"calling-of-saint-matthew","title":"The Calling of Saint Matthew","year":"1599–1600","medium":"Oil on canvas, 322 × 340 cm","location":"Contarelli Chapel, San Luigi dei Francesi, Rome","description":"<p>Caravaggio's first public commission, and the painting that made him famous overnight. In a dim tax office, Christ enters from the right and points at Matthew, echoing God's hand in Michelangelo's <em>Creation of Adam<\/em>. A shaft of light cuts across the wall to single him out. Matthew, surrounded by men in modern Roman dress, gestures as if to say, \"Who, me?\"<\/p>","image":"images/caravaggio/calling-of-saint-matthew.jpg","credit":{"file":"File:Caravaggio — The Calling of Saint Matthew.jpg","source":"https://commons.wikimedia.org/wiki/File:Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg","author":"Gleb Simonov","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"supper-at-emmaus","title":"Supper at Emmaus","year":"1601","medium":"Oil and tempera on canvas, 141 × 196 cm","location":"National Gallery, London","description":"<p>Two disciples realise that the stranger they have met on the road is the risen Christ. One pushes back his chair, the other flings his arms wide, and the gesture seems to break through the picture plane into our space. A basket of fruit teeters on the edge of the table, its shadow painted with eye-fooling realism.<\/p>","image":"images/caravaggio/supper-at-emmaus.jpg","credit":{"file":"File:Supper at Emmaus-Caravaggio (1601).jpg","source":"https://commons.wikimedia.org/wiki/File:Supper_at_Emmaus-Caravaggio_(1601).jpg","author":"Caravaggio","license":"Public domain","license_url":null}},{"id":"entombment","title":"The Entombment of Christ","year":"1603–1604","medium":"Oil on canvas, 300 × 203 cm","location":"Vatican Museums (Pinacoteca), Vatican City","description":"<p>Christ's body is lowered toward a stone slab whose sharp corner seems to project out toward the viewer, as if we stood inside the tomb. The mourners form a falling diagonal, from Mary Cleophas throwing up her arms down to the dead man's hand brushing the stone. Rubens, Géricault, Cézanne and many others made copies of it.<\/p>","image":"images/caravaggio/entombment.jpg","credit":{"file":"File:The Entombment of Christ-Caravaggio (c.1602-3).jpg","source":"https://commons.wikimedia.org/wiki/File:The_Entombment_of_Christ-Caravaggio_(c.1602-3).jpg","author":"Caravaggio","license":"Public domain","license_url":null}}]},{"slug":"artemisia-gentileschi","name":"Artemisia Gentileschi","lifespan":"1593–c. 1656","born":1593,"died":1656,"year_label":"1593","region":"Europe","country":"Italy","movements":["Baroque","Caravaggisti"],"discipline":["Painting"],"summary":"The most celebrated woman painter of the Baroque, known for powerful heroines painted with Caravaggesque drama.","sections":[{"title":"Overview","html":"<p>Artemisia Gentileschi was one of the most accomplished painters of the generation after Caravaggio, and the first woman admitted to Florence's Academy of the Arts of Drawing. She specialised in strong female figures from the Bible and ancient history: Judith, Susanna, Jael, Cleopatra, Lucretia. She painted them with dramatic lighting, physical realism and psychological depth. For centuries her fame was overshadowed by her father's and by the story of her rape and the trial that followed. Since the 1970s she has been recognised as a major artist in her own right.<\/p>"},{"title":"Life","html":"<p>Artemisia was born in Rome on 8 July 1593, the eldest child of the painter Orazio Gentileschi, a friend and follower of Caravaggio. She trained in her father's workshop, and by 17 she had painted <em>Susanna and the Elders<\/em>. In 1611 she was raped by Agostino Tassi, a painter working with her father. At the seven-month trial that followed in 1612, she was tortured with thumbscrews to test her testimony. Tassi was convicted, though he never served his sentence.<\/p>\n<p>Soon afterwards she married a Florentine painter, Pierantonio Stiattesi, and moved to Florence. There she flourished. She won the patronage of Grand Duke Cosimo II de' Medici, befriended Galileo Galilei, and in 1616 was admitted to the Accademia delle Arti del Disegno. She learned to read and write during these years; her surviving letters are vivid and businesslike.<\/p>\n<p>In the 1620s she worked in Rome and Venice, and from about 1630 she settled in Naples, which became her base for the rest of her life. Around 1638 she travelled to London to join her father at the court of Charles I, where Orazio died in 1639. Returning to Naples, she ran a workshop and corresponded with collectors such as Don Antonio Ruffo. She is thought to have died there around 1656, possibly in the plague that year.<\/p>"},{"title":"Style & Technique","html":"<p>Artemisia absorbed Caravaggio's strong light and shadow, his use of live models, and his focus on dramatic moments. She added a strong sense of female experience and agency. Her heroines are solid, muscular and believable, and their emotions are written on their faces and bodies.<\/p>\n<p>She was admired for her rich colour, especially her golds, crimsons and blues, and for her rendering of fabrics and skin. Her later Neapolitan works are more elegant and polished, adapting to the taste of her patrons. She often painted herself into her pictures, lending her own features to saints and allegories.<\/p>"},{"title":"Legacy","html":"<p>After her death Artemisia's reputation faded, and many works were credited to her father or to other painters. The art historian Roberto Longhi wrote about her in 1916. From the 1970s feminist scholars, notably Mary D. Garrard, made her a central figure in the history of women in art. Judy Chicago gave her a place setting at <em>The Dinner Party<\/em>. Major exhibitions followed, including one at the National Gallery, London, in 2020, and her work now commands record prices. Novels, plays and films have retold her life.<\/p>"}],"cover":"judith-slaying-holofernes","wikipedia":"https://en.wikipedia.org/wiki/Artemisia_Gentileschi","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/artemisia-gentileschi.md","works":[{"id":"susanna-and-the-elders","title":"Susanna and the Elders","year":"1610","medium":"Oil on canvas, 170 × 119 cm","location":"Schloss Weißenstein, Pommersfelden","description":"<p>Signed and dated when Artemisia was just 17, this is her earliest known painting. Two older men lean over a wall to pressure the bathing Susanna, who twists away in distress. Male painters often treated the story as an excuse for an erotic nude. Artemisia shows it from Susanna's point of view, as an experience of threat and violation.<\/p>","image":"images/artemisia-gentileschi/susanna-and-the-elders.jpg","credit":{"file":"File:Susanna and the Elders (1610), Artemisia Gentileschi.jpg","source":"https://commons.wikimedia.org/wiki/File:Susanna_and_the_Elders_(1610),_Artemisia_Gentileschi.jpg","author":"Artemisia Gentileschi","license":"Public domain","license_url":null}},{"id":"judith-slaying-holofernes","title":"Judith Slaying Holofernes","year":"c. 1620","medium":"Oil on canvas, 199 × 162.5 cm","location":"Uffizi Gallery, Florence","description":"<p>Judith and her maid pin down the Assyrian general and saw through his neck, the blood spraying in arcs across the white sheets. Unlike Caravaggio's hesitant, delicate Judith, Artemisia's women are strong, working together with physical effort. Many viewers read the painting in light of her own trial, though it is first of all a masterpiece of Baroque drama. An earlier version is in Naples.<\/p>","image":"images/artemisia-gentileschi/judith-slaying-holofernes.jpg","credit":{"file":"File:Judit decapitando a Holofernes, por Artemisia Gentileschi.jpg","source":"https://commons.wikimedia.org/wiki/File:Judit_decapitando_a_Holofernes,_por_Artemisia_Gentileschi.jpg","author":"Artemisia Gentileschi","license":"Public domain","license_url":null}},{"id":"self-portrait-as-saint-catherine","title":"Self-Portrait as Saint Catherine of Alexandria","year":"c. 1615–1617","medium":"Oil on canvas, 71.4 × 69 cm","location":"National Gallery, London","description":"<p>Artemisia gives her own features to the early Christian martyr, shown with a palm and the broken spiked wheel on which she was to be tortured. The painting dates from her successful years in Florence. The National Gallery bought it in 2018, only the 21st painting by a woman to enter its collection. It then toured Britain, including a GP surgery and a women's prison.<\/p>","image":"images/artemisia-gentileschi/self-portrait-as-saint-catherine.jpg","credit":{"file":"File:Self-Portrait as Saint Catherine of Alexandria (Gentileschi).jpg","source":"https://commons.wikimedia.org/wiki/File:Self-Portrait_as_Saint_Catherine_of_Alexandria_(Gentileschi).jpg","author":"Artemisia Gentileschi","license":"Public domain","license_url":null}},{"id":"jael-and-sisera","title":"Jael and Sisera","year":"1620","medium":"Oil on canvas, 86 × 125 cm","location":"Museum of Fine Arts, Budapest","description":"<p>Another Old Testament heroine: Jael raises a hammer to drive a tent peg through the temple of the sleeping enemy general Sisera. Her calm, almost thoughtful face contrasts with the violence to come. The column at the right carries Artemisia's signature and the date.<\/p>","image":"images/artemisia-gentileschi/jael-and-sisera.jpg","credit":{"file":"File:Giaele e Sisara (ca.1620) - Artemisia Gentileschi (Museum of Fine Arts, Budapest).jpg","source":"https://commons.wikimedia.org/wiki/File:Giaele_e_Sisara_(ca.1620)_-_Artemisia_Gentileschi_(Museum_of_Fine_Arts,_Budapest).jpg","author":"Artemisia Gentileschi","license":"Public domain","license_url":null}},{"id":"judith-and-her-maidservant","title":"Judith and Her Maidservant","year":"c. 1623–1625","medium":"Oil on canvas, 187 × 142 cm","location":"Detroit Institute of Arts","description":"<p>After the killing: in a tent lit by a single candle, Judith raises her hand to shade the light and listens for danger, sword still in hand, while her maid wraps the general's head in cloth. The suspense, the deep shadows and the glowing gold of Judith's dress make this one of the finest night scenes of the Caravaggesque movement.<\/p>","image":"images/artemisia-gentileschi/judith-and-her-maidservant.jpg","credit":{"file":"File:Artemisia Gentileschi Judith Maidservant DIA.jpg","source":"https://commons.wikimedia.org/wiki/File:Artemisia_Gentileschi_Judith_Maidservant_DIA.jpg","author":"Artemisia Gentileschi","license":"Public domain","license_url":null}},{"id":"allegory-of-painting","title":"Self-Portrait as the Allegory of Painting (La Pittura)","year":"c. 1638–1639","medium":"Oil on canvas, 98.6 × 75.2 cm","location":"Royal Collection, United Kingdom","description":"<p>Artemisia shows herself as the personification of Painting itself, leaning into the canvas with brush raised, sleeves rolled up, a gold chain with a mask pendant at her neck. A male artist could paint the figure of Painting but could not become her. Artemisia claims both roles at once. Probably painted in London, where she joined her father at the court of Charles I.<\/p>","image":"images/artemisia-gentileschi/allegory-of-painting.jpg","credit":{"file":"File:Self-portrait as the Allegory of Painting (La Pittura) - Artemisia Gentileschi.jpg","source":"https://commons.wikimedia.org/wiki/File:Self-portrait_as_the_Allegory_of_Painting_(La_Pittura)_-_Artemisia_Gentileschi.jpg","author":"Artemisia Gentileschi","license":"Public domain","license_url":null}}]},{"slug":"velazquez","name":"Diego Velázquez","lifespan":"1599–1660","born":1599,"died":1660,"year_label":"1599","region":"Europe","country":"Spain","movements":["Baroque","Spanish Golden Age"],"discipline":["Painting"],"summary":"The leading painter of Spain's Golden Age, whose loose, luminous brushwork and truthful portraits of kings and commoners made him a \"painter's painter\".","sections":[{"title":"Overview","html":"<p>Diego Velázquez spent most of his career as court painter to King Philip IV of Spain. He painted the royal family, courtiers, jesters and dwarfs with the same unflinching honesty. Seen up close, his brushwork breaks into loose, almost abstract dabs; from a distance it resolves into shimmering silk and living flesh. <em>Las Meninas<\/em> is often called the greatest painting ever made. Manet called Velázquez \"the painter of painters\", and his influence runs through Goya, the Impressionists and Picasso.<\/p>"},{"title":"Life","html":"<p>Velázquez was baptised in Seville on 6 June 1599. At about 11 he entered the workshop of Francisco Pacheco, a painter and scholar, and in 1618 he married Pacheco's daughter Juana. In Seville he painted <em>bodegones<\/em>, kitchen scenes with still lifes, and religious works in a strongly lit, naturalistic style influenced by Caravaggio.<\/p>\n<p>In 1623 he painted a portrait of the young Philip IV that so pleased the king that Velázquez was appointed court painter, and he moved to Madrid. He would serve Philip for 37 years, rising through court offices to become chamberlain of the palace. In 1628 he met Peter Paul Rubens, then on a diplomatic mission to Madrid, who encouraged him to visit Italy. His first Italian trip (1629–1631) transformed his colour and handling.<\/p>\n<p>A second journey to Italy (1649–1651) to buy art for the royal collection produced his portraits of Pope Innocent X and of his assistant Juan de Pareja. Back in Madrid he painted <em>Las Meninas<\/em> (1656). In 1659 he was admitted to the noble Order of Santiago, a rare honour for a painter. He died on 6 August 1660, shortly after organising the ceremonies for the marriage of the Infanta Maria Theresa to Louis XIV of France.<\/p>"},{"title":"Style & Technique","html":"<p>Early Velázquez is sharp, dark and sculptural. After studying Titian and the Venetians in Italy, his style loosened into thin layers of paint and quick, suggestive strokes. He painted <em>alla prima<\/em>, directly and often without drawing, and he altered compositions on the canvas; X-rays reveal many changes of mind. His palette was restrained, built on greys, blacks and earth tones, which makes his occasional reds and pinks glow.<\/p>\n<p>He was a master of air and space. In <em>Las Meninas<\/em> the room seems to fill with light and atmosphere. His portraits avoid flattery: the king's heavy Habsburg jaw, the court dwarfs' dignity and intelligence, the pope's wary eyes are all recorded truthfully.<\/p>"},{"title":"Legacy","html":"<p>Velázquez's work was largely locked away in Spanish royal palaces until the Prado opened in 1819. When 19th-century artists saw it, they were overwhelmed. Manet travelled to Madrid in 1865 and declared him the greatest painter who ever lived. Whistler and Sargent learned from his tonal harmonies. In the 20th century Picasso painted 58 variations on <em>Las Meninas<\/em> (1957), and Francis Bacon's screaming popes are based on his <em>Innocent X<\/em>. Salvador Dalí's moustache was a homage to him.<\/p>"}],"cover":"las-meninas","wikipedia":"https://en.wikipedia.org/wiki/Diego_Vel%C3%A1zquez","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/velazquez.md","works":[{"id":"old-woman-frying-eggs","title":"Old Woman Frying Eggs","year":"1618","medium":"Oil on canvas, 100.5 × 119.5 cm","location":"Scottish National Gallery, Edinburgh","description":"<p>Painted in Seville when Velázquez was about 19, this <em>bodegón<\/em>, a kitchen scene with still life, shows an old woman cooking eggs in a clay dish while a boy brings a melon and a flask. The eggs turning white in the oil, the gleam on a brass mortar and the shadows under a knife are all observed with astonishing precision for so young a painter.<\/p>","image":"images/velazquez/old-woman-frying-eggs.jpg","credit":{"file":"File:Diego Velazquez - An Old Woman Cooking Eggs - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg","author":"Diego Velázquez","license":"Public domain","license_url":null}},{"id":"waterseller-of-seville","title":"The Waterseller of Seville","year":"c. 1618–1622","medium":"Oil on canvas, 106.7 × 81 cm","location":"Apsley House (Wellington Collection), London","description":"<p>A dignified old water-seller hands a glass to a boy, while a man drinks in the shadows behind. A fig floats in the glass to freshen the water, and drops bead on the great clay jug. Velázquez gives a street vendor the gravity of a saint. The painting was captured from Joseph Bonaparte's baggage after the Battle of Vitoria in 1813 and given to the Duke of Wellington.<\/p>","image":"images/velazquez/waterseller-of-seville.jpg","credit":{"file":"File:El aguador de Sevilla, por Diego Velázquez.jpg","source":"https://commons.wikimedia.org/wiki/File:El_aguador_de_Sevilla,_por_Diego_Vel%C3%A1zquez.jpg","author":"Diego Velázquez","license":"Public domain","license_url":null}},{"id":"surrender-of-breda","title":"The Surrender of Breda","year":"1634–1635","medium":"Oil on canvas, 307 × 367 cm","location":"Museo del Prado, Madrid","description":"<p>Painted for the Hall of Realms in the Buen Retiro Palace, it commemorates a Spanish victory of 1625 in the war with the Dutch. Instead of triumph, Velázquez shows courtesy: the Spanish general Ambrogio Spinola lays a consoling hand on the shoulder of the defeated Justinus of Nassau as he hands over the city's keys. Behind the Spanish, a forest of upright lances gave the painting its popular name, <em>Las Lanzas<\/em>.<\/p>","image":"images/velazquez/surrender-of-breda.jpg","credit":{"file":"File:Velazquez-The Surrender of Breda.jpg","source":"https://commons.wikimedia.org/wiki/File:Velazquez-The_Surrender_of_Breda.jpg","author":"Diego Velázquez","license":"Public domain","license_url":null}},{"id":"rokeby-venus","title":"The Rokeby Venus (The Toilet of Venus)","year":"1647–1651","medium":"Oil on canvas, 122.5 × 177 cm","location":"National Gallery, London","description":"<p>The only surviving female nude by Velázquez, a rare subject in Catholic Spain. Venus reclines with her back to us, gazing into a mirror held by Cupid, where her face appears as a soft blur. In 1914 the suffragette Mary Richardson slashed the canvas with a meat cleaver in protest at the arrest of Emmeline Pankhurst. It was skilfully restored.<\/p>","image":"images/velazquez/rokeby-venus.jpg","credit":{"file":"File:Diego Velázquez - Rokeby Venus.jpg","source":"https://commons.wikimedia.org/wiki/File:Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg","author":"Diego Velázquez","license":"Public domain","license_url":null}},{"id":"innocent-x","title":"Portrait of Pope Innocent X","year":"c. 1650","medium":"Oil on canvas, 141 × 119 cm","location":"Galleria Doria Pamphilj, Rome","description":"<p>Painted during Velázquez's second trip to Italy, this portrait shows the 75-year-old pope in shimmering red and white, his sharp, suspicious gaze fixed on the viewer. Innocent is said to have remarked that it was <em>troppo vero<\/em>, \"too true\". Three centuries later it obsessed Francis Bacon, who painted dozens of screaming variations on it.<\/p>","image":"images/velazquez/innocent-x.jpg","credit":{"file":"File:Retrato del Papa Inocencio X. Roma, by Diego Velázquez.jpg","source":"https://commons.wikimedia.org/wiki/File:Retrato_del_Papa_Inocencio_X._Roma,_by_Diego_Vel%C3%A1zquez.jpg","author":"Diego Velázquez","license":"Public domain","license_url":null}},{"id":"las-meninas","title":"Las Meninas","year":"1656","medium":"Oil on canvas, 318 × 276 cm","location":"Museo del Prado, Madrid","description":"<p>The little Infanta Margarita stands among her maids of honour, a dwarf, a dog and courtiers. At the left Velázquez himself stands at a vast canvas, brush poised. In a mirror on the back wall appear the king and queen, standing, it seems, exactly where we stand. Who is looking at whom? The picture's puzzles about seeing and representation have made it perhaps the most analysed painting in Western art.<\/p>","image":"images/velazquez/las-meninas.jpg","credit":{"file":"File:Las Meninas, by Diego Velázquez, from Prado in Google Earth.jpg","source":"https://commons.wikimedia.org/wiki/File:Las_Meninas,_by_Diego_Vel%C3%A1zquez,_from_Prado_in_Google_Earth.jpg","author":"Diego Velázquez","license":"Public domain","license_url":null}}]},{"slug":"rembrandt","name":"Rembrandt van Rijn","lifespan":"1606–1669","born":1606,"died":1669,"year_label":"1606","region":"Europe","country":"Dutch Republic","movements":["Dutch Golden Age","Baroque"],"discipline":["Painting"],"summary":"The Dutch master of light, shadow and the human soul, whose self-portraits trace a lifetime from confident youth to searching old age.","sections":[{"title":"Overview","html":"<p>Rembrandt Harmenszoon van Rijn is the greatest artist of the Dutch Golden Age. He was equally brilliant as a painter, an etcher and a draughtsman. He worked in every genre: portraits, biblical scenes, history, landscape. What unites them is his use of light emerging from deep shadow and his insight into human feeling. His roughly 80 self-portraits form an extraordinary autobiography. He enjoyed early fame and wealth, then suffered bankruptcy and the deaths of those closest to him. His late works are some of the most profound in Western art.<\/p>"},{"title":"Life","html":"<p>Rembrandt was born in Leiden on 15 July 1606, the ninth child of a prosperous miller. He briefly enrolled at Leiden University but left to train as a painter, first locally and then for six months in Amsterdam with Pieter Lastman, a history painter. Back in Leiden he shared a studio with Jan Lievens and attracted the attention of Constantijn Huygens, secretary to the Prince of Orange.<\/p>\n<p>Around 1631 he moved to Amsterdam, the booming commercial capital. <em>The Anatomy Lesson of Dr Nicolaes Tulp<\/em> (1632) made him the city's most sought-after portraitist. In 1634 he married Saskia van Uylenburgh, cousin of his art dealer, and in 1639 bought a grand house, now the Rembrandt House Museum, where he filled rooms with art and curiosities. Three of their children died in infancy. Only Titus, born 1641, survived. Saskia died in 1642, the year he completed <em>The Night Watch<\/em>.<\/p>\n<p>His later life was hard. He had a bitter legal dispute with Titus's nurse Geertje Dircx, and his partner Hendrickje Stoffels was censured by the church for \"living in whoredom\". Debts led to bankruptcy in 1656, and his house and collection were sold. Yet he kept working and received important commissions, such as the <em>Syndics of the Drapers' Guild<\/em> (1662). Hendrickje died in 1663 and Titus in 1668. Rembrandt died on 4 October 1669 and was buried in an unmarked grave in the Westerkerk.<\/p>"},{"title":"Style & Technique","html":"<p>Rembrandt used chiaroscuro, strong contrasts of light and dark, not just for drama but to direct attention and create mood. Figures emerge from warm brown darkness, lit as if by an inner glow. His early paintings are smooth and detailed. His late ones are built from thick, rough layers of paint, applied with brush, palette knife and even fingers, which catch the light like relief sculpture.<\/p>\n<p>As a printmaker he transformed etching, combining it with drypoint and experimenting with inking and paper to vary each impression. His drawings, quick and economical, are among the most admired ever made. Across all media his subject was human experience: faith, love, doubt, ageing and forgiveness.<\/p>"},{"title":"Legacy","html":"<p>Rembrandt ran a large workshop and trained many pupils, so separating his work from theirs has been a long scholarly task. Since 1968 the Rembrandt Research Project has reattributed many paintings. His influence runs through every later era: Goya named him one of his three masters, Van Gogh revered him, and modern painters such as Francis Bacon and Lucian Freud studied his handling of paint. 2019, the 350th anniversary of his death, was celebrated in the Netherlands as a \"Year of Rembrandt\".<\/p>"}],"cover":"night-watch","wikipedia":"https://en.wikipedia.org/wiki/Rembrandt","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/rembrandt.md","works":[{"id":"anatomy-lesson","title":"The Anatomy Lesson of Dr Nicolaes Tulp","year":"1632","medium":"Oil on canvas, 169.5 × 216.5 cm","location":"Mauritshuis, The Hague","description":"<p>Rembrandt's first big commission in Amsterdam, painted at 26. The city's leading anatomist demonstrates the muscles of a dissected arm to seven surgeons, who lean in with varied expressions of attention. Group portraits were usually stiff rows of heads. Rembrandt turned this one into a dramatic scene of learning, and it made his name.<\/p>","image":"images/rembrandt/anatomy-lesson.jpg","credit":{"file":"File:Rembrandt - The Anatomy Lesson of Dr Nicolaes Tulp.jpg","source":"https://commons.wikimedia.org/wiki/File:Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg","author":"Rembrandt","license":"Public domain","license_url":null}},{"id":"night-watch","title":"The Night Watch (Militia Company of District II under Captain Frans Banninck Cocq)","year":"1642","medium":"Oil on canvas, 379.5 × 453.5 cm","location":"Rijksmuseum, Amsterdam","description":"<p>A company of civic guardsmen bursts into motion as their captain gives the order to march. Muskets are loaded, a drum beats, a dog barks, and a glowing girl carries the company's emblem, a chicken's claw. It is not a night scene: the name came from darkened varnish, removed in later restorations. Since 2019 the Rijksmuseum has studied and restored it in public, in a glass room.<\/p>","image":"images/rembrandt/night-watch.jpg","credit":{"file":"File:La ronda de noche, por Rembrandt van Rijn.jpg","source":"https://commons.wikimedia.org/wiki/File:La_ronda_de_noche,_por_Rembrandt_van_Rijn.jpg","author":"Rembrandt","license":"Public domain","license_url":null}},{"id":"hundred-guilder-print","title":"The Hundred Guilder Print (Christ Healing the Sick)","year":"c. 1647–1649","medium":"Etching, drypoint and engraving, 28 × 39.3 cm","location":"Impressions in many collections (e.g. Rijksmuseum, Amsterdam)","description":"<p>Rembrandt's most ambitious print gathers several episodes from Matthew 19 around a radiant Christ: the sick being brought to him, mothers with children, arguing Pharisees and a rich young man. It is densely worked in dark shadows on the left and left almost bare on the right. Its nickname comes from the very high price it was said to fetch.<\/p>","image":"images/rembrandt/hundred-guilder-print.jpg","credit":{"file":"File:Rembrandt The Hundred Guilder Print.jpg","source":"https://commons.wikimedia.org/wiki/File:Rembrandt_The_Hundred_Guilder_Print.jpg","author":"Rembrandt","license":"Public domain","license_url":null}},{"id":"self-portrait-with-two-circles","title":"Self-Portrait with Two Circles","year":"c. 1665–1669","medium":"Oil on canvas, 114.3 × 94 cm","location":"Kenwood House, London","description":"<p>One of the last and greatest of Rembrandt's roughly 80 self-portraits. The ageing, bankrupt artist stands before us with palette and brushes, in a plain fur-lined robe and white cap, looking straight out. Two mysterious arcs on the wall behind have been read as symbols of perfection, a map of the world, or a display of the painter's skill.<\/p>","image":"images/rembrandt/self-portrait-with-two-circles.jpg","credit":{"file":"File:Rembrandt Self-portrait (Kenwood).jpg","source":"https://commons.wikimedia.org/wiki/File:Rembrandt_Self-portrait_(Kenwood).jpg","author":"Rembrandt","license":"Public domain","license_url":null}},{"id":"jewish-bride","title":"The Jewish Bride","year":"c. 1665–1669","medium":"Oil on canvas, 121.5 × 166.5 cm","location":"Rijksmuseum, Amsterdam","description":"<p>A couple, probably portrayed as the biblical Isaac and Rebecca, stand in a tender embrace, his hand resting on her breast, hers touching his. The sleeves are built up with thick paint applied with a palette knife, glowing gold and red. Vincent van Gogh said he would give ten years of his life to sit in front of it for a fortnight with only a crust of bread.<\/p>","image":"images/rembrandt/jewish-bride.jpg","credit":{"file":"File:Rembrandt Harmensz. van Rijn - Portret van een paar als oudtestamentische figuren, genaamd 'Het Joodse bruidje' - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Rembrandt_Harmensz._van_Rijn_-_Portret_van_een_paar_als_oudtestamentische_figuren,_genaamd_%27Het_Joodse_bruidje%27_-_Google_Art_Project.jpg","author":"Rembrandt","license":"Public domain","license_url":null}},{"id":"prodigal-son","title":"The Return of the Prodigal Son","year":"c. 1661–1669","medium":"Oil on canvas, 262 × 205 cm","location":"Hermitage Museum, St Petersburg","description":"<p>The ragged son kneels, shaven-headed and barefoot, pressing his face against his old father's chest. The father rests both hands on his back in forgiveness, while the elder brother watches coldly from the right. Painted near the end of Rembrandt's life, it is one of the most moving images of mercy in art.<\/p>","image":"images/rembrandt/prodigal-son.jpg","credit":{"file":"File:Rembrandt Harmensz van Rijn - Return of the Prodigal Son - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg","author":"Rembrandt","license":"Public domain","license_url":null}}]},{"slug":"christopher-wren","name":"Christopher Wren","lifespan":"1632–1723","born":1632,"died":1723,"year_label":"1632","region":"Europe","country":"England","movements":["English Baroque"],"discipline":["Architecture"],"summary":"The scientist turned architect who rebuilt London's skyline after the Great Fire, above all in the dome of St Paul's Cathedral.","sections":[{"title":"Overview","html":"<p>Christopher Wren came to architecture unusually late and by an unusual route: as one of the leading mathematicians and astronomers of Restoration England, a founder of the Royal Society, before the Great Fire of London in 1666 handed him the chance to rebuild much of the City almost from scratch. Over the following decades he designed more than fifty parish churches and, above all, a new St Paul's Cathedral, whose triple-shell dome remains one of the most admired pieces of structural engineering in architectural history.<\/p>"},{"title":"Life","html":"<p>Wren was born in 1632 in East Knoyle, Wiltshire, the son of a clergyman who would become Dean of Windsor. A gifted student at Westminster School and Wadham College, Oxford, he was appointed professor of astronomy at Gresham College in London at just 25, then Savilian Professor of Astronomy at Oxford. He was a founding member of the Royal Society in 1662 and later served as its president. His architectural career began with the Sheldonian Theatre in Oxford and a proposed restoration of old St Paul's Cathedral; the Great Fire of September 1666, which destroyed the cathedral along with most of the City, changed the scale of the task entirely. Appointed Surveyor of the King's Works in 1669, Wren spent the rest of his working life on the City's parish churches and on St Paul's, which was finally completed in 1710. He died in 1723, aged 90, and is buried in the cathedral's crypt beneath a Latin epitaph that translates as \"Reader, if you seek his monument, look around you.\"<\/p>"},{"title":"Style & Technique","html":"<p>Wren fused the classical vocabulary of Inigo Jones and Palladio with elements drawn from French and Italian Baroque architecture he studied on a research trip to Paris, the only time he travelled outside England. His scientific training shows most clearly in St Paul's dome, engineered as three independent shells nested inside one another so that its exterior profile, interior coffered ceiling, and structural core could each be optimised separately, a solution more sophisticated than any single-shell dome before it. In his City churches, working on cramped and irregular medieval plots, he treated each floor plan as a fresh geometric problem rather than repeating a single template.<\/p>"},{"title":"Legacy","html":"<p>St Paul's Cathedral became a symbol of London's endurance, especially after photographs of its dome rising intact above the smoke of the Blitz in 1940 circulated worldwide. Many of Wren's City churches were later damaged or demolished, by Victorian redevelopment and then German bombing, but a substantial number still stand and function as parish churches. He is generally regarded as England's greatest architect, and his integration of scientific reasoning with architectural design influenced generations of British engineers and builders who followed him.<\/p>"}],"cover":"st-pauls-cathedral","wikipedia":"https://en.wikipedia.org/wiki/Christopher_Wren","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/christopher-wren.md","works":[{"id":"st-pauls-cathedral","title":"St Paul's Cathedral","year":"1675–1710","medium":"Portland stone, with a triple-shell lead-covered dome","location":"Ludgate Hill, City of London, England","description":"<p>Wren's masterpiece and the building he spent 35 years on, rising on the site of a medieval cathedral gutted in the Great Fire of London. Its dome is really three shells in one: a shallow inner dome seen from the floor, a hidden brick cone that carries the real structural load, and a tall outer dome of timber and lead that gives St Paul's its skyline silhouette. Wren's son laid the final stone in 1710.<\/p>","image":"images/christopher-wren/st-pauls-cathedral.jpg","credit":{"file":"File:St Pauls aerial (cropped).jpg","source":"https://commons.wikimedia.org/wiki/File:St_Pauls_aerial_(cropped).jpg","author":"Mark Fosh","license":"CC BY 2.0","license_url":"https://creativecommons.org/licenses/by/2.0"}},{"id":"royal-observatory-greenwich","title":"Royal Observatory, Greenwich","year":"1675–1676","medium":"Brick with stone dressings, built partly from recycled materials from a demolished fort","location":"Greenwich Park, London, England","description":"<p>Built in under a year for the newly created post of Astronomer Royal, John Flamsteed, on the foundations of an old fort in Greenwich Park. Wren, himself a former professor of astronomy, oriented the main hall along a north-south meridian; the site later gave its name to Greenwich Mean Time and the line of zero longitude.<\/p>","image":"images/christopher-wren/royal-observatory-greenwich.jpg","credit":{"file":"File:Royal observatory greenwich.jpg","source":"https://commons.wikimedia.org/wiki/File:Royal_observatory_greenwich.jpg","author":null,"license":"CC BY-SA 3.0","license_url":"http://creativecommons.org/licenses/by-sa/3.0/"}},{"id":"royal-hospital-chelsea","title":"Royal Hospital Chelsea","year":"1682–1692","medium":"Brick with stone dressings around three courtyards","location":"Chelsea, London, England","description":"<p>A retirement and nursing home for army veterans, commissioned by Charles II and modelled loosely on Les Invalides in Paris, arranged around three plain, dignified brick courtyards rather than a single showpiece facade. It still houses several hundred retired soldiers, known as Chelsea Pensioners, who continue to wear the scarlet coats introduced in Wren's time.<\/p>","image":"images/christopher-wren/royal-hospital-chelsea.jpg","credit":{"file":"File:The Royal Hospital Chelsea (1).jpg","source":"https://commons.wikimedia.org/wiki/File:The_Royal_Hospital_Chelsea_(1).jpg","author":"Colin McLaughlin","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"st-stephen-walbrook","title":"St Stephen Walbrook","year":"1672–1679","medium":"Stone piers and a coffered dome on a wooden frame","location":"Walbrook, City of London, England","description":"<p>One of more than fifty City parish churches Wren rebuilt after the Great Fire, squeezed onto an awkward, irregular plot yet crowned with a coffered dome carried on slender Corinthian columns, widely read as his working study for the dome of St Paul's, then still on the drawing board a few streets away.<\/p>","image":"images/christopher-wren/st-stephen-walbrook.jpg","credit":{"file":"File:St Stephen Walbrook 20130324 033.jpg","source":"https://commons.wikimedia.org/wiki/File:St_Stephen_Walbrook_20130324_033.jpg","author":"Elisa.rolle","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"monument-to-the-great-fire","title":"The Monument to the Great Fire of London","year":"1671–1677","medium":"Portland stone Doric column with an internal spiral staircase","location":"Monument Street, City of London, England","description":"<p>A fluted Doric column raised, with Robert Hooke, near the bakery where the Great Fire of 1666 began, its height of 202 feet equal to its exact distance from the fire's starting point. A gilded urn of flames tops the column, and 311 steps of an internal spiral staircase lead to a viewing platform still open to the public.<\/p>","image":"images/christopher-wren/monument-to-the-great-fire.jpg","credit":{"file":"File:The Monument to the Great Fire of London.JPG","source":"https://commons.wikimedia.org/wiki/File:The_Monument_to_the_Great_Fire_of_London.JPG","author":"Eluveitie","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}}]},{"slug":"vermeer","name":"Johannes Vermeer","lifespan":"1632–1675","born":1632,"died":1675,"year_label":"1632","region":"Europe","country":"Dutch Republic","movements":["Dutch Golden Age"],"discipline":["Painting"],"summary":"The Delft painter of quiet interiors and luminous light, whose small output of about 35 paintings contains some of the most beloved images in art.","sections":[{"title":"Overview","html":"<p>Johannes Vermeer painted slowly and sparingly: only about 35 paintings are accepted as his. Most show one or two figures in a room in Delft, lit by soft daylight from a window at the left. A woman reads a letter, pours milk, plays a keyboard, weighs pearls. In these calm, closely observed scenes he achieved a purity of light and colour, especially his costly ultramarine blue, that few have ever matched. Almost forgotten for 200 years after his death, he is now among the most famous painters in the world.<\/p>"},{"title":"Life","html":"<p>Vermeer was baptised in Delft on 31 October 1632. His father was a silk weaver who also dealt in art and ran an inn on the market square. Nothing is known of Vermeer's training. In 1653 he married Catharina Bolnes, a Catholic from a wealthier family, and probably converted to her faith. The same year he joined Delft's Guild of St Luke, which later elected him as one of its leaders several times.<\/p>\n<p>The couple lived with Catharina's mother, Maria Thins, in a house in the Catholic quarter of Delft, and had 15 children, 11 of whom survived. Vermeer worked as an art dealer as well as a painter, and his slow output was bought largely by a single local patron, Pieter van Ruijven.<\/p>\n<p>In 1672, the Dutch Republic's \"Disaster Year\", France invaded and the art market collapsed. Vermeer could sell neither his own paintings nor others'. His widow wrote that the strain drove him into a frenzy, and within a day or two he was dead. He was buried in December 1675, aged 43, leaving his family deep in debt.<\/p>"},{"title":"Style & Technique","html":"<p>Vermeer built his pictures carefully, with geometric compositions and a limited cast of props: maps, chairs with lion-head finials, Turkish carpets, pearls. He used expensive pigments freely, above all natural ultramarine ground from lapis lazuli, even in shadows. He applied small dots of thick paint (<em>pointillés<\/em>) to suggest sparkling highlights.<\/p>\n<p>Some features of his paintings, such as blurred foregrounds and highlights like those of an out-of-focus lens, have led scholars to argue that he used a camera obscura as an aid. The question remains debated. What is certain is his sensitivity to how daylight falls, softens and reflects through a room.<\/p>"},{"title":"Legacy","html":"<p>After his death Vermeer's name faded; some of his works were sold as by other artists. In the 1860s the French critic Théophile Thoré-Bürger rediscovered him and called him the \"Sphinx of Delft\". His rarity and fame made him a target for forgers: in the 1940s Han van Meegeren fooled experts, and sold a fake Vermeer to Hermann Göring. A record-breaking exhibition of 28 of his works at the Rijksmuseum in 2023 sold out within days. Tracy Chevalier's novel <em>Girl with a Pearl Earring<\/em> (1999) and its film adaptation brought his world to millions.<\/p>"}],"cover":"girl-with-a-pearl-earring","wikipedia":"https://en.wikipedia.org/wiki/Johannes_Vermeer","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/vermeer.md","works":[{"id":"the-milkmaid","title":"The Milkmaid","year":"c. 1657–1658","medium":"Oil on canvas, 45.5 × 41 cm","location":"Rijksmuseum, Amsterdam","description":"<p>A sturdy kitchen maid pours a thin stream of milk into an earthenware bowl, utterly absorbed in her work. Light from the window picks out the crusty bread in dots of paint, the nail holes in the plaster wall, and the ultramarine of her apron. Vermeer makes a simple household task feel timeless and quietly heroic.<\/p>","image":"images/vermeer/the-milkmaid.jpg","credit":{"file":"File:Johannes Vermeer - Het melkmeisje - Google Art Project.png","source":"https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png","author":"Johannes Vermeer","license":"Public domain","license_url":null}},{"id":"the-little-street","title":"The Little Street","year":"c. 1657–1658","medium":"Oil on canvas, 54.3 × 44 cm","location":"Rijksmuseum, Amsterdam","description":"<p>A view of ordinary brick houses in Delft, with a woman sewing in a doorway, another busy in an alleyway, and children playing on the pavement. Every crack and patch of whitewash is lovingly recorded. In 2015 archival research identified the exact site, on the Vlamingstraat, where Vermeer's aunt lived.<\/p>","image":"images/vermeer/the-little-street.jpg","credit":{"file":"File:Johannes Vermeer - Gezicht op huizen in Delft, bekend als 'Het straatje' - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Gezicht_op_huizen_in_Delft,_bekend_als_%27Het_straatje%27_-_Google_Art_Project.jpg","author":"Johannes Vermeer","license":"Public domain","license_url":null}},{"id":"view-of-delft","title":"View of Delft","year":"c. 1660–1661","medium":"Oil on canvas, 96.5 × 115.7 cm","location":"Mauritshuis, The Hague","description":"<p>Vermeer's hometown seen across the water on a morning after rain, under towering clouds. Parts of the city lie in shadow while sunlight strikes a distant church tower and rooftops. He mixed sand into some of his paint to catch the texture of brick and stone. In Proust's <em>In Search of Lost Time<\/em>, the writer Bergotte dies gazing at its \"little patch of yellow wall\".<\/p>","image":"images/vermeer/view-of-delft.jpg","credit":{"file":"File:Vermeer-view-of-delft.jpg","source":"https://commons.wikimedia.org/wiki/File:Vermeer-view-of-delft.jpg","author":"Johannes Vermeer","license":"Public domain","license_url":null}},{"id":"woman-holding-a-balance","title":"Woman Holding a Balance","year":"c. 1662–1663","medium":"Oil on canvas, 39.7 × 35.5 cm","location":"National Gallery of Art, Washington","description":"<p>A woman in a fur-trimmed jacket stands at a table strewn with pearls and gold, holding a small, empty balance up to the soft window light. On the wall behind her hangs a painting of the Last Judgment, when souls are weighed. The picture is a meditation on balance, temperance and the choices of daily life.<\/p>","image":"images/vermeer/woman-holding-a-balance.jpg","credit":{"file":"File:Johannes Vermeer - Woman Holding a Balance - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Woman_Holding_a_Balance_-_Google_Art_Project.jpg","author":"Johannes Vermeer","license":"Public domain","license_url":null}},{"id":"girl-with-a-pearl-earring","title":"Girl with a Pearl Earring","year":"c. 1665","medium":"Oil on canvas, 44.5 × 39 cm","location":"Mauritshuis, The Hague","description":"<p>Not a portrait but a <em>tronie<\/em>, a study of a character or type. A girl in an exotic blue and yellow turban turns over her shoulder toward us, lips parted, a large pearl gleaming at her ear. The pearl is just two strokes of paint. Often called the \"Mona Lisa of the North\", it inspired a best-selling novel and a 2003 film.<\/p>","image":"images/vermeer/girl-with-a-pearl-earring.jpg","credit":{"file":"File:1665 Girl with a Pearl Earring.jpg","source":"https://commons.wikimedia.org/wiki/File:1665_Girl_with_a_Pearl_Earring.jpg","author":"Johannes Vermeer","license":"Public domain","license_url":null}},{"id":"the-art-of-painting","title":"The Art of Painting","year":"c. 1666–1668","medium":"Oil on canvas, 120 × 100 cm","location":"Kunsthistorisches Museum, Vienna","description":"<p>A heavy tapestry is drawn back to reveal a painter, seen from behind, painting a model dressed as Clio, the muse of history, with a trumpet and a book. A large map of the Netherlands covers the back wall. Vermeer kept this allegory of his art until his death. In 1940 it was bought by Adolf Hitler; after the war it went to Vienna, and restitution claims for it were rejected in 2011.<\/p>","image":"images/vermeer/the-art-of-painting.jpg","credit":{"file":"File:Jan Vermeer - The Art of Painting - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Jan_Vermeer_-_The_Art_of_Painting_-_Google_Art_Project.jpg","author":"Johannes Vermeer","license":"Public domain","license_url":null}}]},{"slug":"jeong-seon","name":"Jeong Seon","lifespan":"1676–1759","born":1676,"died":1759,"year_label":"1676","region":"East Asia","country":"Korea (Joseon dynasty)","movements":["True-view landscape painting (jingyeong sansuhwa)"],"discipline":["Painting"],"summary":"Korea's great landscape painter, who created \"true-view\" painting of real Korean mountains instead of imagined Chinese scenery.","sections":[{"title":"Overview","html":"<p>Jeong Seon, known by his pen name Gyeomjae, transformed Korean landscape painting. For centuries Korean painters had followed Chinese models, painting idealised mountains they had never seen. Jeong Seon instead painted the actual scenery of Korea: the Diamond Mountains (Geumgangsan), the hills and valleys of Seoul, riverside pavilions and famous waterfalls. He devised new brush techniques to capture their granite peaks and wooded slopes. This \"true-view landscape\" (<em>jingyeong sansuhwa<\/em>) expressed a growing pride in Korean culture during the 18th-century Joseon dynasty.<\/p>"},{"title":"Life","html":"<p>Jeong Seon was born in 1676 in Hanyang (modern Seoul), into a scholarly family of modest means. His father died when he was young, and his talent for painting brought him to the attention of scholars and officials. He trained in painting and in Neo-Confucian learning. Through recommendations he held a series of government posts, eventually serving as county magistrate in places such as Hayang and Yangcheon, near Seoul. He rose to high official rank in old age.<\/p>\n<p>He lived most of his life near Mount Inwang in the western part of Seoul, where his circle of friends included the poet Yi Byeong-yeon. The two men exchanged poems and paintings for decades. In 1711 and 1712 Jeong Seon travelled to the Diamond Mountains, and the albums he made there made his name. He painted until late in life, and he produced a vast body of work. He died in 1759 at 83.<\/p>"},{"title":"Style & Technique","html":"<p>Jeong Seon painted in ink, sometimes with light colour, on paper or silk. To capture the distinctive landscape of Korea he invented his own vocabulary of brushstrokes. He used sharp, vertical strokes for crystalline granite peaks, and soft, wet dots (the \"rice-dot\" technique of Chinese tradition, used in a new way) for rounded, forested earth mountains.<\/p>\n<p>He often combined a bird's-eye view with exaggeration, compressing whole mountain ranges into one dramatic composition. In his late work, such as <em>Inwang jesaekdo<\/em>, he used heavy, broad sweeps of dark ink to make rocks look massive and wet. His paintings are not maps but expressions of the emotional experience of real places.<\/p>"},{"title":"Legacy","html":"<p>Jeong Seon's true-view landscapes inspired a generation of Korean painters, including Kim Hong-do and Sim Sa-jeong, and helped establish a distinctly Korean school of painting. Two of his works, <em>Geumgang jeondo<\/em> and <em>Inwang jesaekdo<\/em>, are designated National Treasures of South Korea. The Gyeomjae Jeong Seon Art Museum opened in 2009 in Seoul's Gangseo district, where he once served as magistrate. He is regarded, with Kim Hong-do and Sin Yun-bok, as one of the great painters of the Joseon dynasty.<\/p>"}],"cover":"inwang-jesaekdo","wikipedia":"https://en.wikipedia.org/wiki/Jeong_Seon","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/jeong-seon.md","works":[{"id":"geumgang-jeondo","title":"General View of Mount Geumgang (Geumgang jeondo)","year":"1734","medium":"Hanging scroll, ink and light colour on paper, 130.7 × 94.1 cm","location":"Leeum, Samsung Museum of Art, Seoul (National Treasure)","description":"<p>The famous Diamond Mountains of Korea's east coast seen as if from the air, packed into a great circular composition. Sharp white granite peaks, drawn with vertical, needle-like strokes, rise around softer, wooded earthen hills rendered with wet dots. Jeong Seon balanced them like the yin and yang of Korean thought. It is one of the landmark images of Korean art.<\/p>","image":"images/jeong-seon/geumgang-jeondo.jpg","credit":{"file":"File:Geumgangjeondo.jpg","source":"https://commons.wikimedia.org/wiki/File:Geumgangjeondo.jpg","author":"Jeong Seon","license":"Public domain","license_url":null}},{"id":"cheongpunggye","title":"Valley of Clear Wind (Cheongpunggye)","year":"1739","medium":"Hanging scroll, ink and light colour on silk","location":"Gansong Art Museum, Seoul","description":"<p>A wooded valley at the foot of Mount Inwang in Seoul, where a scholarly family kept a pavilion among pines and rocks. Jeong Seon painted many such views of real places in and around the capital. He mixed dense, dark ink with lighter washes to capture the texture of the hills he knew from daily walks.<\/p>","image":"images/jeong-seon/cheongpunggye.jpg","credit":{"file":"File:Jeong Seon-Cheongpung.gye-02.jpg","source":"https://commons.wikimedia.org/wiki/File:Jeong_Seon-Cheongpung.gye-02.jpg","author":"Jeong Seon","license":"Public domain","license_url":null}},{"id":"pungak-naesan-chongram","title":"Overview of Inner Mount Geumgang in Autumn (Pungak naesan chongram)","year":"c. 1740","medium":"Hanging scroll, ink and colour on silk","location":"Gansong Art Museum, Seoul","description":"<p>Another vision of the Diamond Mountains, this time in autumn, when they are called Pungak (\"maple mountain\"). Temples and hermitages are tucked among the crowded peaks, with touches of red foliage. Jeong Seon travelled to Mount Geumgang several times from 1711 and painted it throughout his life.<\/p>","image":"images/jeong-seon/pungak-naesan-chongram.jpg","credit":{"file":"File:Jeong Seon-PungakNaesanChongramDo.jpg","source":"https://commons.wikimedia.org/wiki/File:Jeong_Seon-PungakNaesanChongramDo.jpg","author":"Jeong Seon","license":"Public domain","license_url":null}},{"id":"bakyeon-falls","title":"Bakyeon Falls","year":"18th century","medium":"Hanging scroll, ink on silk, 119.5 × 52.2 cm","location":"Private collection","description":"<p>A waterfall near Kaesong, counted among the \"three wonders\" of that old capital, crashes down a sheer cliff into a deep pool while tiny visitors watch from below. Jeong Seon exaggerated the height of the falls and darkened the cliffs with heavy ink so that the white water seems to roar out of the picture.<\/p>","image":"images/jeong-seon/bakyeon-falls.jpg","credit":{"file":"File:Jeong Seon-Bakyeon pokpo.jpg","source":"https://commons.wikimedia.org/wiki/File:Jeong_Seon-Bakyeon_pokpo.jpg","author":"겸제 정선 (1676 숙종 2년 출생- 1759 영조35년 사망)","license":"Public domain","license_url":null}},{"id":"inwang-jesaekdo","title":"Clearing after Rain on Mount Inwang (Inwang jesaekdo)","year":"1751","medium":"Hanging scroll, ink on paper, 79.2 × 138.2 cm","location":"National Museum of Korea, Seoul (National Treasure)","description":"<p>Jeong Seon's masterpiece, painted at 75. The granite peaks of Mount Inwang, behind the royal palace in Seoul, rise dark and wet after a summer rain, while mist drifts through the pine woods below. The rock faces are built with broad, heavy sweeps of ink, a daring technique for its time. According to tradition, he painted it hoping for the recovery of his dying friend, the poet Yi Byeong-yeon. It entered the national collection in 2021 as part of the Lee Kun-hee donation.<\/p>","image":"images/jeong-seon/inwang-jesaekdo.jpg","credit":{"file":"File:Inwangjesaekdo.jpg","source":"https://commons.wikimedia.org/wiki/File:Inwangjesaekdo.jpg","author":"Jeong Seon","license":"Public domain","license_url":null}},{"id":"cat-on-an-autumn-day","title":"Cat on an Autumn Day (Chuil hanmyo)","year":"18th century","medium":"Ink and colour on silk","location":"Gansong Art Museum, Seoul","description":"<p>Not all of Jeong Seon's work is grand landscape. Here a cat sits among autumn flowers, alert and relaxed at once. Small paintings of animals, insects and plants were popular with Korean collectors. This one shows his gentle observation of everyday nature.<\/p>","image":"images/jeong-seon/cat-on-an-autumn-day.jpg","credit":{"file":"File:Jeong Seon-Chuil hanmyo-Free cat on an autumn day-01.jpg","source":"https://commons.wikimedia.org/wiki/File:Jeong_Seon-Chuil_hanmyo-Free_cat_on_an_autumn_day-01.jpg","author":"Jeong Seon","license":"Public domain","license_url":null}}]},{"slug":"goya","name":"Francisco Goya","lifespan":"1746–1828","born":1746,"died":1828,"year_label":"1746","region":"Europe","country":"Spain","movements":["Romanticism"],"discipline":["Painting"],"summary":"Court painter and fierce witness to his age, whose work runs from sunny tapestry designs to the nightmares of war and the Black Paintings.","sections":[{"title":"Overview","html":"<p>Francisco Goya is often called the last of the Old Masters and the first of the moderns. He rose from a provincial background to become First Court Painter to the King of Spain, producing brilliant portraits of royalty and aristocrats. Yet illness, deafness, political repression and the horrors of the Napoleonic wars drove him toward darker subjects: satire, violence, madness and the irrational. His prints and late paintings anticipate Romanticism, Expressionism and modern war reporting.<\/p>"},{"title":"Life","html":"<p>Goya was born on 30 March 1746 in Fuendetodos, a village in Aragon, and grew up in Zaragoza. He trained with a local painter and travelled to Italy around 1770. In 1773 he married Josefa Bayeu, sister of the court painter Francisco Bayeu, who helped him obtain work designing tapestry cartoons for the Royal Tapestry Factory in Madrid. These cheerful scenes of picnics, games and fairs brought him royal attention.<\/p>\n<p>By 1786 he was painter to the king, and in 1799 he became First Court Painter to Charles IV. In 1792–1793 a mysterious illness left him permanently deaf. His art turned more personal and critical. In 1799 he published <em>Los Caprichos<\/em>, satirical etchings mocking superstition and the clergy.<\/p>\n<p>When Napoleon's armies invaded Spain in 1808, Goya witnessed atrocities on both sides. He recorded them in <em>The Disasters of War<\/em>, prints so savage they were published only 35 years after his death. After the war he painted <em>The Second<\/em> and <em>Third of May 1808<\/em>. Disillusioned with the repressive rule of the restored king Ferdinand VII, he retreated to a house outside Madrid, the Quinta del Sordo (\"Deaf Man's Villa\"), and covered its walls with the Black Paintings. In 1824 he went into exile in Bordeaux, where he died on 16 April 1828.<\/p>"},{"title":"Style & Technique","html":"<p>Goya's early style is light and decorative, influenced by Tiepolo and Mengs. His mature portraits, influenced by Velázquez, use loose, rapid brushwork and sparkling highlights, and they avoid flattery. As a printmaker he mastered aquatint, a technique that creates areas of tone, and used it for deep, velvety shadows.<\/p>\n<p>In his later work he painted with increasing freedom and darkness. He applied paint with knives, rags and even his fingers, and restricted his palette to blacks, browns and ochres. His subjects became visions: crowds of witches, giants, faces twisted by fear. He painted private obsessions rather than commissions.<\/p>"},{"title":"Legacy","html":"<p>Goya's unflinching treatment of war and cruelty has made him a model for artists confronting violence. Manet's <em>Execution of Emperor Maximilian<\/em> and Picasso's <em>Guernica<\/em> both descend from <em>The Third of May<\/em>. The Romantics admired his imagination, the Expressionists and Surrealists his dark visions. His <em>Disasters of War<\/em> remain a benchmark for images of atrocity. The Prado holds the greatest collection of his work, and a statue of him stands outside its north entrance.<\/p>"}],"cover":"third-of-may","wikipedia":"https://en.wikipedia.org/wiki/Francisco_Goya","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/goya.md","works":[{"id":"nude-maja","title":"La maja desnuda (The Nude Maja)","year":"c. 1797–1800","medium":"Oil on canvas, 97 × 190 cm","location":"Museo del Prado, Madrid","description":"<p>A young woman reclines on green cushions, arms behind her head, looking straight at the viewer without shame or mythological excuse. It is one of the earliest Western paintings of a real nude woman who is not a goddess. It was probably made for the royal favourite Manuel Godoy, who also owned its clothed pendant, <em>La maja vestida<\/em>. In 1815 the Inquisition summoned Goya to explain the \"obscene\" picture.<\/p>","image":"images/goya/nude-maja.jpg","credit":{"file":"File:Goya Maja naga2.jpg","source":"https://commons.wikimedia.org/wiki/File:Goya_Maja_naga2.jpg","author":"Francisco Goya","license":"Public domain","license_url":null}},{"id":"sleep-of-reason","title":"The Sleep of Reason Produces Monsters (Los Caprichos, plate 43)","year":"1799","medium":"Etching and aquatint, 21.5 × 15 cm","location":"Impressions in many collections (e.g. Museo del Prado, Madrid)","description":"<p>A man, perhaps Goya himself, slumps asleep over his desk while owls, bats and a staring lynx swarm out of the darkness behind him. The title is inscribed on the desk. It comes from <em>Los Caprichos<\/em>, 80 satirical prints attacking superstition, ignorance and the abuses of Spanish society. The image has become an emblem of the Enlightenment and its fears.<\/p>","image":"images/goya/sleep-of-reason.jpg","credit":{"file":"File:Francisco José de Goya y Lucientes - The sleep of reason produces monsters (No. 43), from Los Caprichos - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Francisco_Jos%C3%A9_de_Goya_y_Lucientes_-_The_sleep_of_reason_produces_monsters_(No._43),_from_Los_Caprichos_-_Google_Art_Project.jpg","author":"Francisco Goya","license":"Public domain","license_url":null}},{"id":"family-of-charles-iv","title":"Charles IV of Spain and His Family","year":"1800–1801","medium":"Oil on canvas, 280 × 336 cm","location":"Museo del Prado, Madrid","description":"<p>The Spanish royal family lined up in glittering silks and sashes, painted with an honesty that has sometimes been read as satire. The queen, Maria Luisa, dominates the centre; the king looks vacant. In a nod to Velázquez's <em>Las Meninas<\/em>, Goya painted himself in the shadows at the left, working at a large canvas.<\/p>","image":"images/goya/family-of-charles-iv.jpg","credit":{"file":"File:La familia de Carlos IV.jpg","source":"https://commons.wikimedia.org/wiki/File:La_familia_de_Carlos_IV.jpg","author":"Francisco Goya","license":"Public domain","license_url":null}},{"id":"second-of-may","title":"The Second of May 1808 (The Charge of the Mamelukes)","year":"1814","medium":"Oil on canvas, 268 × 347 cm","location":"Museo del Prado, Madrid","description":"<p>The people of Madrid rise up against Napoleon's troops, attacking the Egyptian Mameluke cavalry with knives in a tangle of horses, bodies and blood. Painted after the French were expelled, it shows no heroes, only the chaos and fury of street fighting.<\/p>","image":"images/goya/second-of-may.jpg","credit":{"file":"File:El dos de mayo de 1808 en Madrid.jpg","source":"https://commons.wikimedia.org/wiki/File:El_dos_de_mayo_de_1808_en_Madrid.jpg","author":"Francisco Goya","license":"Public domain","license_url":null}},{"id":"third-of-may","title":"The Third of May 1808","year":"1814","medium":"Oil on canvas, 268 × 347 cm","location":"Museo del Prado, Madrid","description":"<p>The companion to <em>The Second of May<\/em>. At night, a faceless line of French soldiers aims its muskets at Spanish prisoners. At the centre a man in a white shirt flings his arms wide, lit by a lantern, his pose recalling the crucified Christ. It is one of the first great paintings to show war as senseless slaughter rather than glory, and it prepared the way for Manet and Picasso's <em>Guernica<\/em>.<\/p>","image":"images/goya/third-of-may.jpg","credit":{"file":"File:El Tres de Mayo, by Francisco de Goya, from Prado thin black margin.jpg","source":"https://commons.wikimedia.org/wiki/File:El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_thin_black_margin.jpg","author":"El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_in_Google_Earth.jpg : Francisco de Goya derivative work: Papa Lima Whiskey 2","license":"Public domain","license_url":null}},{"id":"saturn","title":"Saturn Devouring His Son","year":"1819–1823","medium":"Mixed media mural transferred to canvas, 143.5 × 81.4 cm","location":"Museo del Prado, Madrid","description":"<p>One of the 14 \"Black Paintings\" that the aged, deaf Goya painted directly on the walls of his farmhouse outside Madrid, never meant for public view. The Titan Saturn, fearing that his children will overthrow him, tears into a headless body, eyes wild with horror. The murals were transferred to canvas in 1874 and are now among the most disturbing images in the Prado.<\/p>","image":"images/goya/saturn.jpg","credit":{"file":"File:Francisco de Goya, Saturno devorando a su hijo (1819-1823).jpg","source":"https://commons.wikimedia.org/wiki/File:Francisco_de_Goya,_Saturno_devorando_a_su_hijo_(1819-1823).jpg","author":"Francisco Goya","license":"Public domain","license_url":null}}]},{"slug":"hokusai","name":"Katsushika Hokusai","lifespan":"1760–1849","born":1760,"died":1849,"year_label":"1760","region":"East Asia","country":"Japan","movements":["Ukiyo-e"],"discipline":["Painting"],"summary":"The restless Edo master of the woodblock print, creator of The Great Wave, who called himself \"the old man mad about painting\".","sections":[{"title":"Overview","html":"<p>Katsushika Hokusai was one of the most prolific and inventive artists in history. Over a career of 70 years he produced paintings, book illustrations, erotic prints, surimono (privately published prints), drawing manuals and, in his seventies, the landscape print series that made him world-famous. <em>The Great Wave off Kanagawa<\/em> is instantly recognisable across the globe. Hokusai's energy, humour and endless curiosity about the visible world also made him a major influence on European art in the late 19th century.<\/p>"},{"title":"Life","html":"<p>Hokusai was born in 1760 in the Katsushika district of Edo (modern Tokyo). As a teenager he worked in a lending library and trained as a woodblock carver. At about 18 he entered the studio of Katsukawa Shunshō, a leading designer of prints of kabuki actors. He later broke away and studied other schools of painting, Japanese, Chinese and even Western.<\/p>\n<p>He changed his artistic name more than 30 times, often to mark a new phase of his work. He is also said to have moved house more than 90 times, and he lived in poverty for much of his life despite his fame. His daughter Katsushika Ōi became a fine painter and assisted him in his old age.<\/p>\n<p>In 1814 he began publishing the <em>Hokusai Manga<\/em>. Around 1830–1832, in his early seventies, he designed <em>Thirty-six Views of Mount Fuji<\/em>, followed by series on waterfalls, bridges and birds and flowers. In the postscript to <em>One Hundred Views of Mount Fuji<\/em> (1834) he wrote that nothing he drew before age 70 was worth noticing, and that by 110 every dot and line would be alive. He died in Edo on 10 May 1849, at 88, reportedly saying that with five more years he could have become a true painter.<\/p>"},{"title":"Style & Technique","html":"<p>Ukiyo-e (\"pictures of the floating world\") were a collaborative art. Hokusai drew the design, and specialist carvers cut it into cherry-wood blocks, one for each colour. Printers then pressed the paper onto the inked blocks by hand. Hokusai's designs push this medium to its limits, with bold outlines, dramatic cropping and vivid colour, including the imported Prussian blue that characterises his Fuji series.<\/p>\n<p>He was a keen student of Western perspective, which he learned from Dutch prints available in Japan. He combined it with Japanese traditions of flat colour and strong design. He observed people at work and nature in motion, especially water: waves, waterfalls, rain and whirlpools. He drew them with extraordinary precision and fantasy.<\/p>"},{"title":"Legacy","html":"<p>When Japanese prints reached Europe after Japan opened to trade in the 1850s, Hokusai became a sensation. The craze for Japanese art, <em>Japonisme<\/em>, shaped the Impressionists and Post-Impressionists. Monet, Degas, Van Gogh and Cassatt all learned from him, and Debussy kept a copy of <em>The Great Wave<\/em> and put it on the cover of his score <em>La Mer<\/em>. Today his wave appears on everything from Japanese banknotes (the 1,000-yen note issued in 2024) to emoji. A museum dedicated to him, the Sumida Hokusai Museum, opened in Tokyo in 2016.<\/p>"}],"cover":"great-wave","wikipedia":"https://en.wikipedia.org/wiki/Hokusai","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/hokusai.md","works":[{"id":"hokusai-manga","title":"Hokusai Manga (Sketches by Hokusai)","year":"1814–1878","medium":"Woodblock-printed books, 15 volumes","location":"Copies in many collections","description":"<p>Fifteen volumes of sketches published from 1814 onwards, the last appearing long after Hokusai's death. They show thousands of subjects: people at work and play, animals, plants, gods, ghosts, landscapes and comic figures, drawn with wit and economy. Meant as a model book for students, the <em>Manga<\/em> became a best-seller. It was one of the first Japanese books to excite European artists in the 1850s–60s.<\/p>","image":"images/hokusai/hokusai-manga.jpg","credit":{"file":"File:Hokusai sketches - hokusai manga vol6.jpg","source":"https://commons.wikimedia.org/wiki/File:Hokusai_sketches_-_hokusai_manga_vol6.jpg","author":"Katsushika Hokusai","license":"Public domain","license_url":null}},{"id":"great-wave","title":"The Great Wave off Kanagawa","year":"c. 1831","medium":"Woodblock print, ink and colour on paper, 25.7 × 37.9 cm","location":"Impressions in many collections (e.g. Metropolitan Museum of Art, British Museum)","description":"<p>A towering wave curls over three fishing boats, its foam breaking into claw-like fingers, while Mount Fuji sits small and calm in the distance. It opens the series <em>Thirty-six Views of Mount Fuji<\/em>. The print used the newly imported Prussian blu
