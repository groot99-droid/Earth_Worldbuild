tony, Sloth, Lust, Pride, Anger, Envy and Avarice. Four roundels in the corners show Death, Judgment, Heaven and Hell. Philip II of Spain kept it in his bedroom at the Escorial. Some scholars now credit it to Bosch's workshop or a follower.<\/p>","image":"images/bosch/seven-deadly-sins.jpg","credit":{"file":"File:Hieronymus Bosch- The Seven Deadly Sins and the Four Last Things.JPG","source":"https://commons.wikimedia.org/wiki/File:Hieronymus_Bosch-_The_Seven_Deadly_Sins_and_the_Four_Last_Things.JPG","author":"Hieronymus Bosch or follower","license":"Public domain","license_url":null}},{"id":"ship-of-fools","title":"The Ship of Fools","year":"c. 1500–1510","medium":"Oil on panel, 58 × 33 cm","location":"Musée du Louvre, Paris","description":"<p>A leaky boat drifts nowhere, crewed by a monk, a nun and a crowd of drunken revellers who sing, gorge and snap at a dangling cake. A tree serves as the mast, and a jester perches in its branches. It is a fragment of a larger triptych, and it mocks human folly and corrupt clergy with the sharp humour of its day.<\/p>","image":"images/bosch/ship-of-fools.jpg","credit":{"file":"File:Jheronimus Bosch 011.jpg","source":"https://commons.wikimedia.org/wiki/File:Jheronimus_Bosch_011.jpg","author":"Hieronymus Bosch","license":"Public domain","license_url":null}},{"id":"temptation-of-st-anthony","title":"The Temptation of St Anthony","year":"c. 1501","medium":"Oil on oak panel, triptych, 131.5 × 225 cm (open)","location":"Museu Nacional de Arte Antiga, Lisbon","description":"<p>The desert hermit Anthony kneels in prayer while chaos swirls around him: fish that fly like airships, demons in armour, a black mass in a ruined tower, a city burning on the horizon. Bosch invented a whole world of hybrid monsters to show the saint's inner struggle against temptation. The painting inspired later Surrealists.<\/p>","image":"images/bosch/temptation-of-st-anthony.jpg","credit":{"file":"File:Hieronymus Bosch - Triptych of Temptation of St Anthony - WGA2585.jpg","source":"https://commons.wikimedia.org/wiki/File:Hieronymus_Bosch_-_Triptych_of_Temptation_of_St_Anthony_-_WGA2585.jpg","author":"Hieronymus Bosch","license":"Public domain","license_url":null}},{"id":"garden-of-earthly-delights","title":"The Garden of Earthly Delights","year":"c. 1490–1510","medium":"Oil on oak panels, triptych, 205.5 × 384.9 cm (open)","location":"Museo del Prado, Madrid","description":"<p>Bosch's most famous and mysterious work. The left panel shows God presenting Eve to Adam in Paradise. The huge centre panel is filled with naked figures frolicking among giant birds, strawberries and crystal fountains. The right panel is a nightmarish, frozen Hell of musical torture instruments and the \"Tree-Man\". Whether it is a warning against sin or a vision of a lost innocence, scholars still disagree after five centuries.<\/p>","image":"images/bosch/garden-of-earthly-delights.jpg","credit":{"file":"File:The Garden of earthly delights.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Garden_of_earthly_delights.jpg","author":"Hieronymus Bosch","license":"Public domain","license_url":null}},{"id":"haywain-triptych","title":"The Haywain Triptych","year":"c. 1510–1516","medium":"Oil on panel, triptych, about 135 × 190 cm (open)","location":"Museo del Prado, Madrid","description":"<p>A giant cart of hay, a Flemish symbol of worthless worldly goods, rolls toward Hell pulled by demons. People of every class, from pope and emperor down, grab at the hay or fight and kill each other to get it. On top, a pair of lovers ignore the angel praying beside them. The story reads left to right: from the Fall in Eden to damnation.<\/p>","image":"images/bosch/haywain-triptych.jpg","credit":{"file":"File:Bosch - Haywain Triptych.jpg","source":"https://commons.wikimedia.org/wiki/File:Bosch_-_Haywain_Triptych.jpg","author":"Hieronymus Bosch or workshop","license":"Public domain","license_url":null}},{"id":"christ-carrying-the-cross","title":"Christ Carrying the Cross","year":"c. 1510–1516 (attributed)","medium":"Oil on panel, 76.7 × 83.5 cm","location":"Museum of Fine Arts (MSK), Ghent","description":"<p>There is no landscape or sky, only a tight crush of grotesque, jeering faces pressed around the calm, closed-eyed Christ. Saint Veronica, holding the cloth with his image, turns away in the corner. The composition is claustrophobic and almost modern. Its attribution to Bosch himself is debated.<\/p>","image":"images/bosch/christ-carrying-the-cross.jpg","credit":{"file":"File:Kruisdraging, Hieronymus Bosch, ca. 1510, Koninklijk Museum voor Schone Kunsten Gent, 1902-H.jpg","source":"https://commons.wikimedia.org/wiki/File:Kruisdraging,_Hieronymus_Bosch,_ca._1510,_Koninklijk_Museum_voor_Schone_Kunsten_Gent,_1902-H.jpg","author":"Hieronymus Bosch","license":"Public domain","license_url":null}}]},{"slug":"behzad","name":"Kamāl ud-Dīn Behzād","lifespan":"c. 1450–c. 1535","born":1450,"died":1535,"year_label":"1450","region":"West & Central Asia","country":"Persia (Timurid Herat and Safavid Tabriz)","movements":["Persian miniature","Herat school"],"discipline":["Painting"],"summary":"The greatest master of Persian miniature painting, head of the royal workshops of Herat and Tabriz.","sections":[{"title":"Overview","html":"<p>Kamāl ud-Dīn Behzād (also spelled Bihzad) is the most celebrated painter in the Persian tradition. He worked at the court of Herat, now in Afghanistan, then one of the world's most brilliant cultural centres, and later at the Safavid court in Tabriz. His manuscript paintings for poetry and history books brought new naturalism, individual characters, scenes of everyday life and complex, carefully balanced compositions to Persian painting. Within his lifetime his name became a byword for artistic excellence, and painters across the Persian, Ottoman and Mughal worlds looked back to him as a model.<\/p>"},{"title":"Life","html":"<p>Behzād was probably born around 1450 in Herat, the capital of the Timurid dynasty founded by Timur (Tamerlane). He was orphaned young and was brought up by the painter Mirak Naqqash, head of the royal library. He also came under the protection of Mir Ali-Shir Nava'i, the great poet and minister of Sultan Husayn Bayqara.<\/p>\n<p>Under Husayn Bayqara, who ruled Herat from 1469 to 1506, the city became a centre of poetry, music, calligraphy and painting. Behzād became the leading artist of the royal <em>kitabkhana<\/em>, the library workshop where calligraphers, illuminators, painters and bookbinders made luxury manuscripts. His most famous surviving works date from this period, including paintings in a <em>Bustan<\/em> of Sa'di (1488) and a <em>Khamsa<\/em> of Nizami (1494–1495).<\/p>\n<p>After Herat fell to the Uzbeks and then to the Safavid Shah Ismail I in 1510, Behzād moved to the Safavid capital, Tabriz. A legend claims that during the Battle of Chaldiran in 1514 the shah hid Behzād and a famous calligrapher in a cave, because he valued them more than his army. In 1522 Ismail appointed him director of the royal library. There he shaped the style of the next generation, whose masterpiece is the great <em>Shahnameh<\/em> of Shah Tahmasp. He died in about 1535.<\/p>"},{"title":"Style & Technique","html":"<p>Persian manuscript painting used mineral and organic pigments bound with gum on burnished paper, with gold and silver. The paintings were small and packed with detail, and they were meant to be seen up close in a book. Behzād worked within this tradition but transformed it. His figures are no longer standard types. They have individual faces, gestures and body language, and they are often busy with ordinary tasks like building, washing or tending animals.<\/p>\n<p>He was a master of composition. He organised complex scenes with architecture, patterned tiles and screens, and geometric structures that guide the eye, and he balanced them with rich but harmonious colour. He often hid his signature discreetly in the architecture of a painting. Many works are attributed to him on the basis of style, and scholars debate which are by his own hand.<\/p>"},{"title":"Legacy","html":"<p>Behzād's pupils and followers spread his style to the Safavid court in Tabriz and later to Bukhara and India. The Persian painters Mir Sayyid Ali and Abd al-Samad trained in his tradition and went on to found the Mughal imperial workshop under Humayun and Akbar. That workshop is where Basawan worked. Mughal and Ottoman writers praised Behzād as the ideal painter, and collectors prized anything bearing his name, which led to many false attributions. In modern Iran and Afghanistan he is a national hero, and his name is used for art schools and prizes.<\/p>"}],"cover":"seduction-of-yusuf","wikipedia":"https://en.wikipedia.org/wiki/Kam%C4%81l_ud-D%C4%ABn_Behz%C4%81d","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/behzad.md","works":[{"id":"dancing-dervishes","title":"Dancing Dervishes (attributed)","year":"c. 1480","medium":"Opaque watercolour, ink and gold on paper, folio from a Divan of Hafiz","location":"Metropolitan Museum of Art, New York","description":"<p>Sufi mystics whirl and leap in ecstatic dance in a flowering garden while others look on, some calm, some overcome with emotion. Every figure has a distinct pose and expression. The painting captures the <em>sama<\/em>, the Sufi ceremony of music and movement, with a liveliness that marks the new naturalism of the Herat school.<\/p>","image":"images/behzad/dancing-dervishes.jpg","credit":{"file":"File:Dance of Sufi Dervishes.jpg","source":"https://commons.wikimedia.org/wiki/File:Dance_of_Sufi_Dervishes.jpg","author":"Kamāl ud-Dīn Behzād","license":"Public domain","license_url":null}},{"id":"timur-granting-audience","title":"Timur Granting an Audience at Balkh (attributed)","year":"c. 1467–1480s","medium":"Opaque watercolour, ink and gold on paper, from a *Zafarnama* (Book of Victory)","location":"John Work Garrett Library, Johns Hopkins University, Baltimore","description":"<p>From an illustrated history of the conqueror Timur (Tamerlane), made for Sultan Husayn Bayqara. Timur sits enthroned beneath a canopy at his accession in 1370, while courtiers and guards fill a flowering garden in a crowded yet ordered composition. This is one half of a double-page scene attributed to the young Behzād. It shows the courtly world he would record throughout his career.<\/p>","image":"images/behzad/timur-granting-audience.jpg","credit":{"file":"File:Timur granting audience on the occasion of his accession (right).jpg","source":"https://commons.wikimedia.org/wiki/File:Timur_granting_audience_on_the_occasion_of_his_accession_(right).jpg","author":"Attributed to Bihzād","license":"CC BY-SA 2.0","license_url":"https://creativecommons.org/licenses/by-sa/2.0"}},{"id":"seduction-of-yusuf","title":"The Seduction of Yusuf","year":"1488","medium":"Opaque watercolour, ink and gold on paper, from a *Bustan* of Sa'di","location":"Egyptian National Library (Dar al-Kutub), Cairo","description":"<p>Behzād's most famous painting. The story of Yusuf (Joseph) and Zulaikha (Potiphar's wife) is set in a fantastic palace of staircases, doorways and tiled rooms. Zulaikha has led Yusuf through seven locked chambers, but as she reaches for him, the doors fly open and he escapes. The maze-like architecture becomes an image of the soul resisting desire, and the signed work is one of the high points of Persian painting.<\/p>","image":"images/behzad/seduction-of-yusuf.jpg","credit":{"file":"File:Yusuf fleeing the Advances of Zulaikha.jpg","source":"https://commons.wikimedia.org/wiki/File:Yusuf_fleeing_the_Advances_of_Zulaikha.jpg","author":"Kamāl ud-Dīn Behzād","license":"Public domain","license_url":null}},{"id":"construction-of-khawarnaq","title":"The Construction of the Palace of Khawarnaq","year":"1494–1495","medium":"Opaque watercolour, ink and gold on paper, from a *Khamsa* of Nizami","location":"British Library, London (Or. 6810)","description":"<p>Instead of a royal scene, Behzād painted workers building a palace: labourers carry bricks up ladders, masons lay courses, a man mixes mortar, another hauls water. Each figure is individually observed at a different task. It is one of the most celebrated images of labour in Islamic art, and it shows Behzād's interest in the everyday world.<\/p>","image":"images/behzad/construction-of-khawarnaq.jpg","credit":{"file":"File:Kamal-ud-din Bihzad - Construction of the fort of Kharnaq.jpg","source":"https://commons.wikimedia.org/wiki/File:Kamal-ud-din_Bihzad_-_Construction_of_the_fort_of_Kharnaq.jpg","author":"Kamāl ud-Dīn Behzād","license":"Public domain","license_url":null}},{"id":"alexander-and-the-hermit","title":"Alexander Visits the Sage in His Cave","year":"1494–1495","medium":"Opaque watercolour, ink and gold on paper, from a *Khamsa* of Nizami","location":"British Library, London (Or. 6810, fol. 273r)","description":"<p>The world conqueror Iskandar (Alexander the Great) dismounts to visit a wise hermit living in a cave in a wild, rocky landscape. It is a lesson in humility before spiritual wisdom. Alexander may be given the features of Behzād's patron, Sultan Husayn Bayqara, and the gnarled trees and rocks show the Herat school's delight in nature.<\/p>","image":"images/behzad/alexander-and-the-hermit.jpg","credit":{"file":"File:Alexander and the Hermit, from Nizami's Iskandarnama, 1494-95, by Behzad. British Library OR.6810 Folio 273R.jpg","source":"https://commons.wikimedia.org/wiki/File:Alexander_and_the_Hermit,_from_Nizami%27s_Iskandarnama,_1494-95,_by_Behzad._British_Library_OR.6810_Folio_273R.jpg","author":"c. 1494-1495 artist","license":"Public domain","license_url":null}},{"id":"sultan-husayn-bayqara","title":"Portrait of Sultan Husayn Mirza Bayqara (after Behzād)","year":"c. 1500–1525 (after an original of c. 1490)","medium":"Opaque watercolour and ink on paper, album page","location":"Harvard Art Museums, Cambridge, Massachusetts","description":"<p>The last great Timurid ruler of Herat, Behzād's patron, sits cross-legged in a plain robe. His face is shown as that of a specific, ageing man rather than an idealised king. The painting is a copy after Behzād's lost original. Such individual portraits were a new development in Persian painting, and they influenced portraiture at the Mughal and Ottoman courts.<\/p>","image":"images/behzad/sultan-husayn-bayqara.jpg","credit":{"file":"File:Portrait of Sultan Husayn Mirza Bayqara at the age of about 50 years. 1500–25 copy from Behzād's original of about 1490.jpg","source":"https://commons.wikimedia.org/wiki/File:Portrait_of_Sultan_Husayn_Mirza_Bayqara_at_the_age_of_about_50_years._1500%E2%80%9325_copy_from_Behz%C4%81d%27s_original_of_about_1490.jpg","author":"Kamāl ud-Dīn Behzād","license":"Public domain","license_url":null}}]},{"slug":"leonardo-da-vinci","name":"Leonardo da Vinci","lifespan":"1452–1519","born":1452,"died":1519,"year_label":"1452","region":"Europe","country":"Italy","movements":["High Renaissance"],"discipline":["Painting"],"summary":"Painter, engineer, anatomist and inventor, the restless genius who became the model of the \"Renaissance man\".","sections":[{"title":"Overview","html":"<p>Leonardo da Vinci left fewer than 20 finished paintings, yet they include the <em>Mona Lisa<\/em> and <em>The Last Supper<\/em>, perhaps the two most famous images in Western art. His painting grew out of endless investigation: of light and shadow, of anatomy, of water, flight and geology. He recorded these in thousands of notebook pages filled with drawings and mirror-writing. He pioneered the soft modelling called <em>sfumato<\/em> (\"smoky\") and a new psychological depth in portraiture, and he helped define the High Renaissance.<\/p>"},{"title":"Life","html":"<p>Leonardo was born on 15 April 1452 near the Tuscan town of Vinci, the illegitimate son of a notary, Ser Piero, and a young woman named Caterina. Around his mid-teens he was apprenticed in Florence to Andrea del Verrocchio, a leading sculptor and painter. According to Vasari, the angel Leonardo painted in Verrocchio's <em>Baptism of Christ<\/em> was so beautiful that his master gave up painting.<\/p>\n<p>In about 1482 he moved to Milan. He offered his services to Duke Ludovico Sforza in a letter that stressed his skills as a military engineer before mentioning his art. In Milan he painted <em>The Last Supper<\/em>, designed festivals, and modelled a giant clay horse for a bronze monument that was never cast. After the French invaded in 1499 he moved between Mantua, Venice and Florence. He worked briefly as a military engineer for Cesare Borgia, and in Florence he began the <em>Mona Lisa<\/em>.<\/p>\n<p>His later years took him back to Milan under the French, then to Rome under the Medici pope Leo X. In 1516 King Francis I invited him to France and gave him the manor of Clos Lucé near the royal château at Amboise. He died there on 2 May 1519. His pupil Francesco Melzi inherited his notebooks.<\/p>"},{"title":"Style & Technique","html":"<p>Leonardo believed painting was a science based on observation. He studied how light falls on curved surfaces and how distant objects lose sharpness and turn blue (atmospheric perspective). He dissected corpses to understand muscles and bones. In his paintings, forms emerge from shadow through very gradual changes of tone, without hard outlines: this is <em>sfumato<\/em>.<\/p>\n<p>He composed with geometry, often arranging figures in stable pyramids. He gave faces and hands subtle expressions that suggest what the sitters are thinking. He also experimented constantly with materials, sometimes disastrously: <em>The Last Supper<\/em> began to decay within decades. His slowness and perfectionism meant that many projects were left unfinished.<\/p>"},{"title":"Legacy","html":"<p>Raphael, Giorgione and generations of Italian painters absorbed Leonardo's sfumato and his compositions. His notebooks, scattered after Melzi's death, reveal studies of anatomy, flight, hydraulics and optics that were centuries ahead of their time. Today they are prized collections, such as the Codex Leicester, bought by Bill Gates in 1994. The <em>Mona Lisa<\/em> draws millions of visitors to the Louvre every year. In 2017 the <em>Salvator Mundi<\/em>, attributed to Leonardo, sold for $450 million, the highest price ever paid for a painting, though its attribution remains disputed.<\/p>"}],"cover":"mona-lisa","wikipedia":"https://en.wikipedia.org/wiki/Leonardo_da_Vinci","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/leonardo-da-vinci.md","works":[{"id":"annunciation","title":"Annunciation","year":"c. 1472–1476","medium":"Oil and tempera on panel, 98 × 217 cm","location":"Uffizi Gallery, Florence","description":"<p>Probably painted while Leonardo was still in Verrocchio's workshop, this is one of his earliest surviving paintings. The angel Gabriel kneels on a flowering lawn to greet the Virgin. The angel's wings were modelled on a real bird's, and a hazy landscape of trees and mountains opens up behind. There are youthful mistakes in the perspective, but the careful study of nature points to everything that came later.<\/p>","image":"images/leonardo-da-vinci/annunciation.jpg","credit":{"file":"File:Annunciation (Leonardo c. 1472–1476).jpg","source":"https://commons.wikimedia.org/wiki/File:Annunciation_(Leonardo_c._1472%E2%80%931476).jpg","author":"Leonardo da Vinci","license":"Public domain","license_url":null}},{"id":"virgin-of-the-rocks","title":"Virgin of the Rocks","year":"c. 1483–1486","medium":"Oil on panel (transferred to canvas), 199 × 122 cm","location":"Musée du Louvre, Paris","description":"<p>Mary, the infant Jesus, the infant John the Baptist and an angel sit in a shadowy grotto of strange rock formations and carefully observed plants. Leonardo bound the figures together with glances and gestures in a pyramid shape. He modelled them with soft shadow, the technique later called <em>sfumato<\/em>. A second version, painted after a dispute with the patrons, hangs in the National Gallery, London.<\/p>","image":"images/leonardo-da-vinci/virgin-of-the-rocks.jpg","credit":{"file":"File:Leonardo Da Vinci - Vergine delle Rocce (Louvre).jpg","source":"https://commons.wikimedia.org/wiki/File:Leonardo_Da_Vinci_-_Vergine_delle_Rocce_(Louvre).jpg","author":"Leonardo da Vinci","license":"Public domain","license_url":null}},{"id":"lady-with-an-ermine","title":"Lady with an Ermine","year":"c. 1489–1491","medium":"Oil on walnut panel, 54 × 39 cm","location":"Czartoryski Museum, Kraków","description":"<p>Cecilia Gallerani, the teenage companion of Ludovico Sforza, Duke of Milan, turns as if someone had just called to her. She holds a sleek white ermine, a pun on her surname and a symbol of the duke. The twisting pose and her long, expressive hand brought a new sense of life and movement to the Italian portrait.<\/p>","image":"images/leonardo-da-vinci/lady-with-an-ermine.jpg","credit":{"file":"File:Lady with an Ermine - Leonardo da Vinci (adjusted levels).jpg","source":"https://commons.wikimedia.org/wiki/File:Lady_with_an_Ermine_-_Leonardo_da_Vinci_(adjusted_levels).jpg","author":"Leonardo da Vinci","license":"Public domain","license_url":null}},{"id":"vitruvian-man","title":"Vitruvian Man","year":"c. 1490","medium":"Pen and ink with wash on paper, 34.4 × 25.5 cm","location":"Gallerie dell'Accademia, Venice","description":"<p>A man with arms and legs in two positions fits inside both a circle and a square, illustrating the Roman architect Vitruvius's claim that the ideal human body mirrors the geometry of the universe. Leonardo's notes in mirror-writing record the proportions he measured. Because it is fragile and light-sensitive, the drawing is rarely displayed. Even so, it has become a universal symbol of the union of art and science.<\/p>","image":"images/leonardo-da-vinci/vitruvian-man.jpg","credit":{"file":"File:Da Vinci Vitruve Luc Viatour.jpg","source":"https://commons.wikimedia.org/wiki/File:Da_Vinci_Vitruve_Luc_Viatour.jpg","author":"Leonardo da Vinci","license":"Public domain","license_url":null}},{"id":"last-supper","title":"The Last Supper","year":"c. 1495–1498","medium":"Tempera and oil on gesso, pitch and mastic, 460 × 880 cm","location":"Convent of Santa Maria delle Grazie, Milan","description":"<p>Painted on the refectory wall of a Milanese convent, it shows the moment Christ announces that one of his disciples will betray him. The apostles recoil in waves of shock and questioning, grouped in threes. All the lines of the architecture lead to Christ's head. Leonardo experimented with painting on dry plaster so that he could work slowly, but the paint began flaking within his lifetime. A 21-year restoration ended in 1999.<\/p>","image":"images/leonardo-da-vinci/last-supper.jpg","credit":{"file":"File:The Last Supper - Leonardo Da Vinci - High Resolution 32x16.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Last_Supper_-_Leonardo_Da_Vinci_-_High_Resolution_32x16.jpg","author":"Leonardo da Vinci","license":"Public domain","license_url":null}},{"id":"mona-lisa","title":"Mona Lisa","year":"c. 1503–1519","medium":"Oil on poplar panel, 77 × 53 cm","location":"Musée du Louvre, Paris","description":"<p>Lisa Gherardini, wife of the Florentine silk merchant Francesco del Giocondo, sits before a dreamlike landscape, her smile hovering at the edges of her mouth and eyes. Leonardo kept the portrait for the rest of his life and reworked it for years, blurring its transitions with <em>sfumato<\/em>. Its theft from the Louvre in 1911, and its return two years later, helped make it the most famous painting in the world.<\/p>","image":"images/leonardo-da-vinci/mona-lisa.jpg","credit":{"file":"File:Mona Lisa.jpg","source":"https://commons.wikimedia.org/wiki/File:Mona_Lisa.jpg","author":"Leonardo da Vinci","license":"Public domain","license_url":null}}]},{"slug":"durer","name":"Albrecht Dürer","lifespan":"1471–1528","born":1471,"died":1528,"year_label":"1471","region":"Europe","country":"Holy Roman Empire (Germany)","movements":["Northern Renaissance"],"discipline":["Painting"],"summary":"Nuremberg's great painter and printmaker, who brought the Italian Renaissance north and made the print an art form.","sections":[{"title":"Overview","html":"<p>Albrecht Dürer was the leading artist of the German Renaissance. He travelled to Italy twice, absorbed its ideas about proportion, perspective and the dignity of the artist, and combined them with the precise, detailed tradition of the North. His woodcuts and engravings, sold across Europe, made him the first artist with an international reputation built largely on prints. He was also a theorist who wrote books on geometry and human proportion, and a pioneer of self-portraiture and nature study.<\/p>"},{"title":"Life","html":"<p>Dürer was born in Nuremberg on 21 May 1471, the son of a Hungarian-born goldsmith. He trained first in his father's workshop, which taught him the fine engraving skills of a goldsmith. At 13 he drew a remarkable self-portrait in silverpoint. From 1486 he was apprenticed to Michael Wolgemut, whose workshop produced woodcuts for book illustration. After years of travel on the Upper Rhine, he returned home in 1494 to marry Agnes Frey, and almost at once left for Venice.<\/p>\n<p>Back in Nuremberg he set up his own workshop and in 1498 published the <em>Apocalypse<\/em>, 15 huge woodcuts that made him famous. A second stay in Venice (1505–1507) brought a major commission, the <em>Feast of the Rosary<\/em>. The Venetian painter Giovanni Bellini treated him as an equal. From 1512 Emperor Maximilian I employed him on grand projects and granted him a pension.<\/p>\n<p>In 1520–1521 Dürer travelled through the Netherlands to have his pension confirmed by the new emperor, Charles V. His diary of the trip records his amazement at Aztec treasures sent from Mexico. He sympathised with Martin Luther's reforms. In his last years he published treatises on measurement, fortification and human proportion. He died in Nuremberg on 6 April 1528.<\/p>"},{"title":"Style & Technique","html":"<p>Dürer drew with extraordinary control. In engraving he built up tone with networks of fine, swelling lines, reaching a range from brilliant white to deep black. He took the woodcut, until then a fairly crude craft, and made it do what engraving could, working with skilled block cutters. His famous \"AD\" monogram served as a trademark, and he took action against copyists who used it.<\/p>\n<p>He looked both north and south. From Italy he took classical proportion, perspective and a new ideal of the human body. From the North he kept meticulous detail and a love of the natural world. You can see it in his watercolours of hares, turf and landscapes. His self-portraits present the artist as a learned, even god-like creator.<\/p>"},{"title":"Legacy","html":"<p>Dürer's prints circulated across Europe and were copied by artists from Italy to Persia and Mughal India. Raphael exchanged drawings with him. His treatises spread Renaissance theory in the German language. In the 19th century German Romantics made him a national hero, and his <em>Praying Hands<\/em> and <em>Young Hare<\/em> became some of the most reproduced images in the world. His house in Nuremberg is a museum, and his monogram remains one of the most recognisable artist signatures in history.<\/p>"}],"cover":"self-portrait-1500","wikipedia":"https://en.wikipedia.org/wiki/Albrecht_D%C3%BCrer","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/durer.md","works":[{"id":"self-portrait-1500","title":"Self-Portrait at the Age of Twenty-Eight","year":"1500","medium":"Oil on lime panel, 67.1 × 48.9 cm","location":"Alte Pinakothek, Munich","description":"<p>Dürer faces us head-on, in the symmetrical pose normally used for images of Christ. His hair falls in perfect ringlets, and his hand touches the fur of his coat. The Latin inscription states that he painted himself \"in everlasting colours\" at age 28. It is a daring claim for the dignity of the artist, whose creative gift was seen as a reflection of God's.<\/p>","image":"images/durer/self-portrait-1500.jpg","credit":{"file":"File:Albrecht Dürer - 1500 self-portrait (High resolution and detail).jpg","source":"https://commons.wikimedia.org/wiki/File:Albrecht_D%C3%BCrer_-_1500_self-portrait_(High_resolution_and_detail).jpg","author":"Albrecht Dürer","license":"Public domain","license_url":null}},{"id":"young-hare","title":"Young Hare","year":"1502","medium":"Watercolour and bodycolour on paper, 25 × 22.5 cm","location":"Albertina, Vienna","description":"<p>A crouching hare, painted fur by fur, its ears alert and whiskers catching the light. A window is reflected in its eye. Dürer's nature studies were far ahead of their time. This one shows an animal as an individual living creature, not a symbol, and it became one of the most copied images in German art.<\/p>","image":"images/durer/young-hare.jpg","credit":{"file":"File:Albrecht Dürer - Hare, 1502 - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Albrecht_D%C3%BCrer_-_Hare,_1502_-_Google_Art_Project.jpg","author":"Albrecht Dürer","license":"Public domain","license_url":null}},{"id":"adam-and-eve","title":"Adam and Eve","year":"1504","medium":"Engraving, 25.2 × 19.4 cm","location":"Impressions in many collections (e.g. National Gallery of Art, Washington)","description":"<p>Dürer's showpiece of the ideal human body, drawn from classical proportions he had studied in Italy. Adam and Eve stand in a dark forest full of animals, and each animal stands for one of the four medieval \"temperaments\". A small tablet hanging from a branch carries his proud signature. The engraving's range of tones, from bright skin to velvety black, shows his total command of the burin.<\/p>","image":"images/durer/adam-and-eve.jpg","credit":{"file":"File:Albrecht Dürer, Adam and Eve, 1504, Engraving.jpg","source":"https://commons.wikimedia.org/wiki/File:Albrecht_D%C3%BCrer,_Adam_and_Eve,_1504,_Engraving.jpg","author":"Albrecht Dürer","license":"Public domain","license_url":null}},{"id":"knight-death-and-the-devil","title":"Knight, Death and the Devil","year":"1513","medium":"Engraving, 24.5 × 19 cm","location":"Impressions in many collections (e.g. National Gallery of Art, Washington)","description":"<p>An armoured knight rides steadily through a gloomy ravine, ignoring Death, who holds up an hourglass, and a pig-snouted devil lurking behind. It is one of Dürer's three \"Master Engravings\". It is often read as an image of the Christian who keeps to the path of faith despite fear and temptation.<\/p>","image":"images/durer/knight-death-and-the-devil.jpg","credit":{"file":"File:Albrecht Dürer, Knight, Death and Devil, 1513, NGA 6637.jpg","source":"https://commons.wikimedia.org/wiki/File:Albrecht_D%C3%BCrer,_Knight,_Death_and_Devil,_1513,_NGA_6637.jpg","author":"Albrecht Dürer","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"melencolia-i","title":"Melencolia I","year":"1514","medium":"Engraving, 24 × 18.8 cm","location":"Impressions in many collections (e.g. Metropolitan Museum of Art, New York)","description":"<p>A winged figure sits brooding among scattered tools of measurement and craft: a compass, a polyhedron, a sphere, an hourglass. Behind her hangs a magic square whose rows add up to 34 and whose bottom row contains the year, 1514. It has been called the most debated print ever made. It is often read as a portrait of the creative mind stalled by doubt.<\/p>","image":"images/durer/melencolia-i.jpg","credit":{"file":"File:Albrecht Dürer - Melencolia I - Google Art Project ( AGDdr3EHmNGyA).jpg","source":"https://commons.wikimedia.org/wiki/File:Albrecht_D%C3%BCrer_-_Melencolia_I_-_Google_Art_Project_(_AGDdr3EHmNGyA).jpg","author":"Albrecht Dürer","license":"Public domain","license_url":null}},{"id":"rhinoceros","title":"The Rhinoceros","year":"1515","medium":"Woodcut, 23.5 × 29.8 cm","location":"Impressions in many collections (e.g. National Gallery of Art, Washington)","description":"<p>In 1515 an Indian rhinoceros arrived in Lisbon, the first seen in Europe since Roman times. Dürer never saw it. He worked from a letter and a sketch, and imagined an animal clad in riveted armour plates with a small extra horn on its back. The print sold in thousands and remained Europe's standard picture of a rhinoceros for about 250 years.<\/p>","image":"images/durer/rhinoceros.jpg","credit":{"file":"File:The Rhinoceros (NGA 1964.8.697) enhanced.png","source":"https://commons.wikimedia.org/wiki/File:The_Rhinoceros_(NGA_1964.8.697)_enhanced.png","author":"Albrecht Dürer","license":"Public domain","license_url":null}}]},{"slug":"michelangelo","name":"Michelangelo Buonarroti","lifespan":"1475–1564","born":1475,"died":1564,"year_label":"1475","region":"Europe","country":"Italy","movements":["High Renaissance","Mannerism"],"discipline":["Painting","Sculpture","Architecture"],"summary":"Sculptor, painter, architect and poet, whose heroic figures of the Pietà, David and the Sistine Chapel defined the High Renaissance.","sections":[{"title":"Overview","html":"<p>Michelangelo thought of himself first as a sculptor, yet he produced the most famous painted ceiling in the world and designed the dome of St Peter's in Rome. His art is built on the nude human body, powerful, twisting and charged with feeling. Contemporaries called it <em>terribilità<\/em>, an awe-inspiring intensity. He lived to almost 89, worked for a long line of popes, and was the first Western artist to have his biography published while he was still alive. Admirers called him <em>Il Divino<\/em>, \"the Divine One\".<\/p>"},{"title":"Life","html":"<p>Michelangelo was born on 6 March 1475 at Caprese, in Tuscany, where his father was a local magistrate. He grew up in Florence. At 13 he was apprenticed to the painter Domenico Ghirlandaio, but he soon moved to the sculpture garden of Lorenzo de' Medici. There he studied ancient statues and lived in the Medici household among poets and philosophers.<\/p>\n<p>After Lorenzo's death he went to Rome, where the <em>Pietà<\/em> (1498–1499) made his name. Returning to Florence, he carved the <em>David<\/em> (1501–1504). In 1505 Pope Julius II called him to Rome to design a colossal tomb, then diverted him to paint the ceiling of the Sistine Chapel (1508–1512), a task he at first resisted. The unfinished tomb haunted him for decades.<\/p>\n<p>He later worked for the Medici in Florence, designing the New Sacristy with its tomb sculptures and the Laurentian Library. In 1534 he settled permanently in Rome, where he painted <em>The Last Judgment<\/em> (1536–1541). In 1546 he became chief architect of St Peter's Basilica. He also wrote hundreds of poems, many addressed to the nobleman Tommaso de' Cavalieri and the poet Vittoria Colonna. He died in Rome on 18 February 1564, and his body was secretly taken to Florence for burial in Santa Croce.<\/p>"},{"title":"Style & Technique","html":"<p>Michelangelo believed the figure already existed inside the marble block and that the sculptor's job was to free it. He carved directly, often without full-size models, attacking the stone with chisels whose marks remain visible in his unfinished works. He studied anatomy through dissection, and his figures have exaggerated, muscular bodies in complex, twisting poses called <em>contrapposto<\/em> and <em>figura serpentinata<\/em>.<\/p>\n<p>As a painter he worked like a sculptor, giving bodies strong modelling. The 1980s–1990s cleaning of the Sistine Chapel revealed vivid, even acidic colours. His late work grew more spiritual and distorted, as in the unfinished <em>Rondanini Pietà<\/em>. That intensity pointed toward Mannerism.<\/p>"},{"title":"Legacy","html":"<p>Vasari's <em>Lives<\/em> (1550) ended with Michelangelo as the peak of all art, and Ascanio Condivi published a biography of him in 1553. Generations of artists, from Raphael and the Mannerists to Rubens and Rodin, learned from his figures. His dome for St Peter's became the model for domes from London to Washington. The <em>David<\/em> is a worldwide symbol of Florence, and <em>The Creation of Adam<\/em>'s nearly touching fingers are among the most reproduced images ever made.<\/p>"}],"cover":"creation-of-adam","wikipedia":"https://en.wikipedia.org/wiki/Michelangelo","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/michelangelo.md","works":[{"id":"pieta","title":"Pietà","year":"1498–1499","medium":"Carrara marble, 174 × 195 cm","location":"St Peter's Basilica, Vatican City","description":"<p>Made when Michelangelo was in his early twenties for a French cardinal's tomb, this shows the Virgin cradling the dead Christ across her lap. Her calm, youthful face and the heavy folds of her robe turn the marble into flesh and cloth. It is the only work he ever signed: his name is carved on the sash across Mary's chest. Vasari says he added it after hearing visitors credit the statue to another sculptor.<\/p>","image":"images/michelangelo/pieta.jpg","credit":{"file":"File:Pieta de Michelangelo - Vaticano.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieta_de_Michelangelo_-_Vaticano.jpg","author":"original file by Stanislav Traykov","license":"CC BY 2.5","license_url":"https://creativecommons.org/licenses/by/2.5"}},{"id":"david","title":"David","year":"1501–1504","medium":"Carrara marble, 517 cm tall","location":"Galleria dell'Accademia, Florence","description":"<p>Carved from a tall, narrow block that other sculptors had abandoned, this giant David is shown before his fight with Goliath, tense, watchful and fully alert. The Florentine Republic set it in front of the Palazzo Vecchio as a symbol of the city's defiance of stronger enemies. It was moved indoors in 1873, and a copy now stands in its original place.<\/p>","image":"images/michelangelo/david.jpg","credit":{"file":"File:'David' by Michelangelo Fir JBU004.jpg","source":"https://commons.wikimedia.org/wiki/File:%27David%27_by_Michelangelo_Fir_JBU004.jpg","author":"Jörg Bittner Unna","license":"CC BY 3.0","license_url":"https://creativecommons.org/licenses/by/3.0"}},{"id":"doni-tondo","title":"Doni Tondo (The Holy Family)","year":"c. 1506–1507","medium":"Oil and tempera on panel, diameter 120 cm","location":"Uffizi Gallery, Florence","description":"<p>Michelangelo's only generally accepted finished panel painting. It was made for the wedding of the merchant Agnolo Doni. Mary, Joseph and the Christ Child twist together in a tight spiral of sculptural bodies and sharp, acid colours. Nude youths lounge in the background. The original carved frame, probably designed by Michelangelo himself, survives.<\/p>","image":"images/michelangelo/doni-tondo.jpg","credit":{"file":"File:Tondo Doni 2015.png","source":"https://commons.wikimedia.org/wiki/File:Tondo_Doni_2015.png","author":"Michelangelo","license":"Public domain","license_url":null}},{"id":"creation-of-adam","title":"The Creation of Adam (Sistine Chapel ceiling)","year":"c. 1508–1512","medium":"Fresco, 280 × 570 cm (part of a ceiling of about 40 × 13 m)","location":"Sistine Chapel, Vatican City","description":"<p>The best-known scene of the vast Sistine ceiling, which Michelangelo painted largely by himself for Pope Julius II. God, borne on a swirl of angels, reaches toward the languid Adam; their fingers almost, but not quite, touch. Around this and eight other Genesis scenes, he painted prophets, sibyls, ancestors of Christ and 20 muscular nudes, over 300 figures in all.<\/p>","image":"images/michelangelo/creation-of-adam.jpg","credit":{"file":"File:Michelangelo - Creation of Adam (cropped).jpg","source":"https://commons.wikimedia.org/wiki/File:Michelangelo_-_Creation_of_Adam_(cropped).jpg","author":"Michelangelo","license":"Public domain","license_url":null}},{"id":"moses","title":"Moses","year":"c. 1513–1515","medium":"Marble, 235 cm tall","location":"San Pietro in Vincoli, Rome","description":"<p>The centrepiece of the tomb of Julius II, a project that dragged on for 40 years and that Michelangelo called \"the tragedy of the tomb\". The seated prophet grips the tablets of the law, his beard flowing like water, his gaze fierce. The horns on his head come from a traditional mistranslation of the Hebrew for \"rays of light\".<\/p>","image":"images/michelangelo/moses.jpg","credit":{"file":"File:Michelangelo's Moses (Rome).jpg","source":"https://commons.wikimedia.org/wiki/File:Michelangelo%27s_Moses_(Rome).jpg","author":"Livioandronico2013","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"last-judgment","title":"The Last Judgment","year":"1536–1541","medium":"Fresco, 13.7 × 12 m","location":"Sistine Chapel, Vatican City","description":"<p>More than 20 years after the ceiling, Michelangelo returned to cover the altar wall with a whirling vision of the end of time. A powerful, beardless Christ raises his arm as the saved rise and the damned are dragged down. Its crowds of nudes caused scandal, and after the Council of Trent another painter was hired to add draperies. St Bartholomew holds a flayed skin whose face is thought to be Michelangelo's self-portrait.<\/p>","image":"images/michelangelo/last-judgment.jpg","credit":{"file":"File:Last Judgement (Michelangelo).jpg","source":"https://commons.wikimedia.org/wiki/File:Last_Judgement_(Michelangelo).jpg","author":"Michelangelo","license":"Public domain","license_url":null}}]},{"slug":"mimar-sinan","name":"Mimar Sinan","lifespan":"c. 1489–1588","born":1489,"died":1588,"year_label":"1489","region":"West & Central Asia","country":"Ottoman Empire","movements":["Classical Ottoman architecture"],"discipline":["Architecture"],"summary":"Chief royal architect to three Ottoman sultans, whose hundreds of mosques, bridges and hospitals across the empire brought Ottoman architecture to its classical peak.","sections":[{"title":"Overview","html":"<p>Mimar Sinan was the greatest architect of the Ottoman Empire's classical age, serving as chief royal architect for nearly fifty years under three sultans. In that time he is credited with several hundred structures across the empire, from small neighbourhood mosques to entire charitable complexes, alongside bridges, aqueducts, hospitals and public baths. His three most celebrated mosques, in Istanbul and Edirne, form a self-described progression from apprentice to master, ending in a dome he engineered to finally surpass Hagia Sophia, the six-century-old building that had set the standard for domed construction in the region.<\/p>"},{"title":"Life","html":"<p>Sinan was born around 1489 or 1490 in the village of Ağırnas, near Kayseri in central Anatolia, into a Christian family; sources disagree on whether it was Greek or Armenian. Like many boys from Christian villages, he was conscripted through the devşirme levy into the Ottoman elite corps, converted to Islam, and trained as a Janissary. He rose through military engineering, building bridges and fortifications on campaign for Suleiman the Magnificent in Persia and Europe, before Suleiman appointed him chief royal architect in 1538, a post he held into his late nineties. He continued designing and travelling to inspect building sites almost to the end of his life, and died in Istanbul in 1588. He is buried in a small, self-designed tomb just outside the walls of the Süleymaniye Mosque complex.<\/p>"},{"title":"Style & Technique","html":"<p>Sinan's central technical obsession was the dome: he wanted to build one larger and more structurally daring than the dome of Hagia Sophia, the Byzantine cathedral converted to a mosque after 1453. He worked out increasingly refined systems of semi-domes, buttressing piers and pendentives to carry ever-wider domes on fewer visible supports, opening the walls beneath them to rows of windows. He described his own career as a sequence of three lessons: Şehzade Mosque as \"apprenticeship,\" Süleymaniye Mosque as \"journeyman work,\" and the Selimiye Mosque in Edirne as his final \"masterpiece,\" where the dome at last exceeded Hagia Sophia's span. He also built purely functional infrastructure, aqueducts and bridges, some of which are still standing and in use.<\/p>"},{"title":"Legacy","html":"<p>Sinan trained a generation of students, several of whom carried his methods across the empire and into later Ottoman building, and he is regarded in Turkey with the kind of reverence given to Michelangelo or Bernini in Italy. Streets, universities and Turkey's largest architecture prize carry his name. The Selimiye Mosque, his acknowledged masterpiece, was inscribed as a UNESCO World Heritage Site in 2011, and his mosques remain active places of worship, still drawing architects and engineers studying how he pushed masonry domes to their structural limits.<\/p>"}],"cover":"selimiye-mosque","wikipedia":"https://en.wikipedia.org/wiki/Mimar_Sinan","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/mimar-sinan.md","works":[{"id":"sehzade-mosque","title":"Şehzade Mosque","year":"1543–1548","medium":"Cut stone, brick and lead-covered domes","location":"Fatih, Istanbul, Ottoman Empire","description":"<p>Built for Suleiman the Magnificent in memory of his son Şehzade Mehmed, who died young, this was Sinan's first major imperial commission after his appointment as chief architect. He later called it his \"apprenticeship work,\" experimenting with a four-semi-dome plan around a central dome that he would refine for the rest of his career. Its twin minarets each carry two balconies.<\/p>","image":"images/mimar-sinan/sehzade-mosque.jpg","credit":{"file":"File:Sehzade camisi.jpg","source":"https://commons.wikimedia.org/wiki/File:Sehzade_camisi.jpg","author":"Viceskeeni2","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"suleymaniye-mosque","title":"Süleymaniye Mosque","year":"1550–1557","medium":"Cut stone and brick, with a lead-covered central dome","location":"Fatih, Istanbul, Ottoman Empire","description":"<p>The centrepiece of a vast charitable complex built for Suleiman the Magnificent, with hospitals, schools, a soup kitchen, baths and a caravanserai around the mosque itself. Sinan called it his \"journeyman work,\" a step toward surpassing the ancient dome of Hagia Sophia nearby. Sinan and Suleiman are both buried in domed mausoleums in its garden.<\/p>","image":"images/mimar-sinan/suleymaniye-mosque.jpg","credit":{"file":"File:SüleymaniyeMosqueIstanbul (cropped).jpg","source":"https://commons.wikimedia.org/wiki/File:S%C3%BCleymaniyeMosqueIstanbul_(cropped).jpg","author":"Hunanuk","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"selimiye-mosque","title":"Selimiye Mosque","year":"1568–1574","medium":"Cut stone and brick, with a lead-covered dome on an octagonal drum","location":"Edirne, Ottoman Empire","description":"<p>Built for Selim II in the former Ottoman capital of Edirne, and the building Sinan himself called his masterpiece, completed at about eighty years old. Eight massive piers carry a dome whose diameter finally exceeded that of Hagia Sophia, the target he had chased his whole career, while four slender, fluted minarets frame the courtyard. It is a UNESCO World Heritage Site.<\/p>","image":"images/mimar-sinan/selimiye-mosque.jpg","credit":{"file":"File:Selimiye Mosque (15051985908) (cropped).jpg","source":"https://commons.wikimedia.org/wiki/File:Selimiye_Mosque_(15051985908)_(cropped).jpg","author":"rob Stoeltje from loenen, netherlands","license":"CC BY 2.0","license_url":"https://creativecommons.org/licenses/by/2.0"}},{"id":"rustem-pasha-mosque","title":"Rüstem Pasha Mosque","year":"1561–1563","medium":"Stone construction faced inside with İznik tile","location":"Eminönü, Istanbul, Ottoman Empire","description":"<p>A small mosque for grand vizier Rüstem Pasha, raised on a shopping arcade above a busy market street, its modest footprint hides an interior sheathed almost floor to ceiling in high-quality İznik tile in the tomato-red that marks the finest production of the period, more densely tiled than any other Ottoman mosque of its size.<\/p>","image":"images/mimar-sinan/rustem-pasha-mosque.jpg","credit":{"file":"File:Rustem Pasha Mosque.JPG","source":"https://commons.wikimedia.org/wiki/File:Rustem_Pasha_Mosque.JPG","author":"User:Simm","license":"CC BY-SA 2.5","license_url":"https://creativecommons.org/licenses/by-sa/2.5"}},{"id":"mihrimah-sultan-mosque","title":"Mihrimah Sultan Mosque","year":"1562–1565","medium":"Cut stone with an unusually large number of windows","location":"Edirnekapı, Istanbul, Ottoman Empire","description":"<p>Built at the city's highest point for Mihrimah Sultan, Suleiman the Magnificent's daughter, on a hilltop site that let Sinan surround the single dome with an exceptional number of windows, flooding the prayer hall with light. A popular, likely apocryphal legend reads the light effects at the spring and autumn equinoxes as a tribute to her name, which means \"sun and moon.\"<\/p>","image":"images/mimar-sinan/mihrimah-sultan-mosque.jpg","credit":{"file":"File:Istanbul - Mesquita de Mihrimah.JPG","source":"https://commons.wikimedia.org/wiki/File:Istanbul_-_Mesquita_de_Mihrimah.JPG","author":"Josep Renalias","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}}]},{"slug":"andrea-palladio","name":"Andrea Palladio","lifespan":"1508–1580","born":1508,"died":1580,"year_label":"1508","region":"Europe","country":"Republic of Venice (Italy)","movements":["Renaissance classicism","Palladianism"],"discipline":["Architecture"],"summary":"The Renaissance architect whose temple-fronted villas, churches and treatise turned Roman classicism into a portable, endlessly imitated style.","sections":[{"title":"Overview","html":"<p>Andrea Palladio is arguably the most influential individual architect in Western history, not for the size of his body of work but for its reach: his villas and churches around Vicenza and Venice codified a system of classical proportion that, through his own illustrated treatise, spread across Europe and eventually to colonial North America. He trained as a stonemason, not an architect in the modern sense, and it was a chance patronage that gave him both a classical education and the name by which the world knows him.<\/p>"},{"title":"Life","html":"<p>Born Andrea di Pietro della Gondola in Padua in 1508, he was apprenticed to a stonemasons' guild in his teens and moved to Vicenza to work as a carver. There the humanist nobleman Gian Giorgio Trissino took him under his wing, gave him a classical education, and renamed him \"Palladio\" after Pallas Athena, taking him on study trips to Rome to measure and draw ancient ruins firsthand. Back in Vicenza, his 1549 remodelling of the town's medieval basilica made his name, and for the next three decades he designed country villas for the Venetian nobility across the Veneto countryside alongside major churches in Venice itself. In 1570 he published <em>I Quattro Libri dell'Architettura<\/em> (The Four Books of Architecture), part treatise, part illustrated catalogue of his own buildings. He died in Vicenza in 1580, leaving the Teatro Olimpico and Villa Rotonda to be finished by his pupil Vincenzo Scamozzi.<\/p>"},{"title":"Style & Technique","html":"<p>Palladio treated ancient Roman temple architecture, colonnaded porticoes, pediments, domes, as a system of proportion that could be adapted to any building type, from a working farm villa to a cathedral. Drawing on Vitruvius and his own measured drawings of Roman ruins, he worked out room dimensions using simple musical ratios he believed produced an innate sense of harmony. To keep costs down for rural patrons, he built in brick and rendered stucco finished to imitate carved stone. His four-square, centrally planned villas and his device for masking a basilica's stepped roofline behind overlapping temple fronts became templates repeated for centuries.<\/p>"},{"title":"Legacy","html":"<p>The <em>Four Books<\/em> was translated widely and carried Palladio's system to England, where Inigo Jones and later Lord Burlington built an entire \"Palladian\" movement on it, and from there to colonial America: Thomas Jefferson owned and annotated a copy and drew directly on Palladio's plans for Monticello and the rotunda of the University of Virginia. Vicenza's historic centre and the Palladian villas of the surrounding Veneto region are together inscribed as a UNESCO World Heritage Site. Few architects before or since have had a single book carry their style so far beyond their own lifetime and country.<\/p>"}],"cover":"villa-rotonda","wikipedia":"https://en.wikipedia.org/wiki/Andrea_Palladio","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/andrea-palladio.md","works":[{"id":"villa-rotonda","title":"Villa Rotonda","year":"1567–1592","medium":"Brick and stucco rendered to resemble stone","location":"Vicenza, Republic of Venice (Italy)","description":"<p>A country retreat for a retired papal official, built on a hilltop with views in every direction, and answered with a design of near-perfect symmetry: four identical temple-fronted porticoes, one on each face, around a central domed rotunda. Left unfinished at Palladio's death, it was completed by his pupil Vincenzo Scamozzi and became the most copied private house plan in Western architecture.<\/p>","image":"images/andrea-palladio/villa-rotonda.jpg","credit":{"file":"File:Larotonda2009.JPG","source":"https://commons.wikimedia.org/wiki/File:Larotonda2009.JPG","author":"Marco Bagarella","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}},{"id":"basilica-palladiana","title":"Basilica Palladiana","year":"1549–1614","medium":"Marble-clad stone arcades wrapped around a medieval brick hall","location":"Piazza dei Signori, Vicenza, Republic of Venice (Italy)","description":"<p>Palladio's first major public commission and the building that made his reputation: a new classical skin wrapped around Vicenza's crumbling medieval town hall. His solution, a two-storey arcade of round arches framed by smaller flanking openings, a motif now called the Palladian window, let the load-bearing masonry flex slightly without cracking the stonework. Construction continued for decades after his death.<\/p>","image":"images/andrea-palladio/basilica-palladiana.jpg","credit":{"file":"File:Basilica Palladiana (Vicenza) - facade on Piazza dei signori.jpg","source":"https://commons.wikimedia.org/wiki/File:Basilica_Palladiana_(Vicenza)_-_facade_on_Piazza_dei_signori.jpg","author":"Didier Descouens","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"teatro-olimpico","title":"Teatro Olimpico","year":"1580–1585","medium":"Wood, stucco and painted trompe-l'oeil scenery over a masonry shell","location":"Vicenza, Republic of Venice (Italy)","description":"<p>Palladio's last design, a covered theatre modelled on his study of ancient Roman precedent, completed after his death by Scamozzi. Behind its stage arch, streets built in forced perspective recede at a scale that makes them appear far longer than the shallow space allows, an illusion still used at the world's oldest surviving indoor theatre in continuous use.<\/p>","image":"images/andrea-palladio/teatro-olimpico.jpg","credit":{"file":"File:Interior of Teatro Olimpico (Vicenza) scena .jpg","source":"https://commons.wikimedia.org/wiki/File:Interior_of_Teatro_Olimpico_(Vicenza)_scena_.jpg","author":"Didier Descouens","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"san-giorgio-maggiore","title":"San Giorgio Maggiore","year":"1566–1610","medium":"Istrian stone facade over a brick basilica plan","location":"Isola di San Giorgio Maggiore, Venice, Republic of Venice (Italy)","description":"<p>A monastery church on its own island across the water from St Mark's Square, its bright white facade overlapping two classical temple fronts of different heights to mask the awkward profile of a basilica's tall nave and lower side aisles, a problem Palladio solved more elegantly here than any architect before him.<\/p>","image":"images/andrea-palladio/san-giorgio-maggiore.jpg","credit":{"file":"File:San Giorgio Maggiore from the top of St Mark's Campanile.jpg","source":"https://commons.wikimedia.org/wiki/File:San_Giorgio_Maggiore_from_the_top_of_St_Mark%27s_Campanile.jpg","author":"Anton Volnuhin","license":"CC BY 4.0","license_url":"https://creativecommons.org/licenses/by/4.0"}},{"id":"il-redentore","title":"Il Redentore","year":"1577–1592","medium":"Istrian stone facade over a brick and stone basilica","location":"Giudecca, Venice, Republic of Venice (Italy)","description":"<p>A votive church commissioned by the Venetian Senate after a plague that killed roughly a third of the city's population, still visited every July in a footbridge-borne procession of thanksgiving. Its luminous white facade and centrally planned interior, lit from hidden windows, are considered among the calmest and most resolved of all his church designs.<\/p>","image":"images/andrea-palladio/il-redentore.jpg","credit":{"file":"File:Chiesa del Santissimo Redentore, Venice, Italy.jpg","source":"https://commons.wikimedia.org/wiki/File:Chiesa_del_Santissimo_Redentore,_Venice,_Italy.jpg","author":"Il_Redentore.jpg : Wknight94 derivative work: Alberto Fernandez Fernandez ( talk )","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}}]},{"slug":"bruegel","name":"Pieter Bruegel the Elder","lifespan":"c. 1525–1569","born":1525,"died":1569,"year_label":"1525","region":"Europe","country":"Duchy of Brabant (Netherlands)","movements":["Northern Renaissance"],"discipline":["Painting"],"summary":"The great Flemish painter of peasant life and landscape, who filled his panels with crowds, proverbs and the turning of the seasons.","sections":[{"title":"Overview","html":"<p>Pieter Bruegel the Elder was the most important Netherlandish painter of the 16th century. He turned away from saints and nobles and made ordinary people his subject: peasants working, feasting, dancing and playing, set in sweeping landscapes that change with the seasons. His crowded panels carry humour, moral warnings and sharp social observation, and they are some of the first great landscape and genre paintings in Europe. Only about 40 of his paintings survive.<\/p>"},{"title":"Life","html":"<p>Little is certain about Bruegel's early life. He was probably born between 1525 and 1530, perhaps near Breda in the Duchy of Brabant. In 1551 he became a master in the painters' guild of Antwerp, then the richest trading city in northern Europe. The following year he set off for Italy, reaching Rome and the far south. His drawings of the Alps on the way back fed the vast mountain views in his later paintings.<\/p>\n<p>Back in Antwerp he designed prints for the publisher Hieronymus Cock. Some were fantastic scenes in the manner of Hieronymus Bosch, and they made his name. In 1563 he married Mayken Coecke, daughter of his former teacher Pieter Coecke van Aelst, and moved to Brussels. There, in the last six years of his life, he painted most of his masterpieces for collectors such as the merchant Nicolaes Jonghelinck and Cardinal Granvelle.<\/p>\n<p>According to the early biographer Karel van Mander, Bruegel and a friend dressed as peasants to join village weddings and fairs, which is how he studied country life. He died in Brussels in September 1569. His two sons, Pieter Brueghel the Younger and Jan Brueghel the Elder, became successful painters and founded a family dynasty that lasted for generations.<\/p>"},{"title":"Style & Technique","html":"<p>Bruegel often set his scenes from a high viewpoint, so that the eye can wander over dozens or hundreds of small figures and episodes. His figures are sturdy and simplified, seen as types rather than portraits, and often from behind. He worked in oil on oak panels, and sometimes in distemper (glue-based paint) on linen.<\/p>\n<p>His landscapes combine Flemish fields with imagined mountains, and capture the atmosphere of weather and season as no one before him had. His pictures are often built around proverbs, games or Bible stories retold in Flemish dress. He painted during the religious conflicts and Spanish repression that led to the Dutch Revolt, and many scholars see hidden commentary on these events in his work.<\/p>"},{"title":"Legacy","html":"<p>Bruegel's sons copied and adapted his compositions for the rest of the century, spreading his imagery widely. Dutch genre and landscape painters of the 17th century owe much to him. The Kunsthistorisches Museum in Vienna holds the world's largest group of his paintings, a legacy of Habsburg collectors. Poets such as W. H. Auden (\"Musée des Beaux Arts\") and William Carlos Williams wrote about his pictures. <em>The Hunters in the Snow<\/em> has appeared in films by Andrei Tarkovsky and Lars von Trier.<\/p>"}],"cover":"hunters-in-the-snow","wikipedia":"https://en.wikipedia.org/wiki/Pieter_Bruegel_the_Elder","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/bruegel.md","works":[{"id":"netherlandish-proverbs","title":"Netherlandish Proverbs","year":"1559","medium":"Oil on oak panel, 117 × 163 cm","location":"Gemäldegalerie, Berlin","description":"<p>A village packed with people acting out more than 100 sayings, taken literally. A man bangs his head against a brick wall, another fills in the well after the calf has drowned, a woman ties the devil to a pillow. The painting is both a comic encyclopedia of folly and a portrait of a world turned upside down.<\/p>","image":"images/bruegel/netherlandish-proverbs.jpg","credit":{"file":"File:Pieter Brueghel the Elder - The Dutch Proverbs - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieter_Brueghel_the_Elder_-_The_Dutch_Proverbs_-_Google_Art_Project.jpg","author":"Pieter Brueghel the Elder","license":"Public domain","license_url":null}},{"id":"childrens-games","title":"Children's Games","year":"1560","medium":"Oil on oak panel, 118 × 161 cm","location":"Kunsthistorisches Museum, Vienna","description":"<p>Some 230 children fill a town square with about 80 games: leapfrog, hoops, stilts, blind man's buff, spinning tops, playing at weddings and processions. Seen from above, the crowded scene is a remarkable record of 16th-century play. It may also carry a moral: that adult affairs are just as foolish as a child's games.<\/p>","image":"images/bruegel/childrens-games.jpg","credit":{"file":"File:Pieter Bruegel the Elder - Children’s Games - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Children%E2%80%99s_Games_-_Google_Art_Project.jpg","author":"Pieter Brueghel the Elder","license":"Public domain","license_url":null}},{"id":"tower-of-babel","title":"The Tower of Babel","year":"1563","medium":"Oil on oak panel, 114 × 155 cm","location":"Kunsthistorisches Museum, Vienna","description":"<p>A colossal spiralling tower, modelled on Rome's Colosseum, rises above a Flemish harbour city. King Nimrod inspects the work in the foreground while hundreds of tiny labourers haul stone, operate cranes and build scaffolding. But the tower is already leaning, and its lower levels are crumbling before the top is finished: a warning about human pride.<\/p>","image":"images/bruegel/tower-of-babel.jpg","credit":{"file":"File:Pieter Bruegel the Elder - The Tower of Babel (Vienna) - Google Art Project - edited.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_The_Tower_of_Babel_(Vienna)_-_Google_Art_Project_-_edited.jpg","author":"Pieter Brueghel the Elder","license":"Public domain","license_url":null}},{"id":"hunters-in-the-snow","title":"The Hunters in the Snow","year":"1565","medium":"Oil on oak panel, 117 × 162 cm","location":"Kunsthistorisches Museum, Vienna","description":"<p>Three tired hunters and their dogs trudge home over a hill with a single fox to show for their day. Below, villagers skate on frozen ponds under a green-grey sky. It belongs to a series of six paintings of the seasons made for the Antwerp merchant Nicolaes Jonghelinck, and it is one of the most beloved winter scenes in art.<\/p>","image":"images/bruegel/hunters-in-the-snow.jpg","credit":{"file":"File:Pieter Bruegel the Elder - Hunters in the Snow (Winter) - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter)_-_Google_Art_Project.jpg","author":"Pieter Brueghel the Elder","license":"Public domain","license_url":null}},{"id":"the-harvesters","title":"The Harvesters","year":"1565","medium":"Oil on wood, 119 × 162 cm","location":"Metropolitan Museum of Art, New York","description":"<p>Another of the seasons series, showing late summer. Peasants scythe and bundle golden wheat while others rest under a pear tree to eat bread, porridge and cheese, one sprawled asleep. The landscape stretches to a hazy bay. It is one of the first great paintings of ordinary working life, with no religious or mythological story attached.<\/p>","image":"images/bruegel/the-harvesters.jpg","credit":{"file":"File:Pieter Bruegel the Elder- The Harvesters - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder-_The_Harvesters_-_Google_Art_Project.jpg","author":"Pieter Brueghel the Elder","license":"Public domain","license_url":null}},{"id":"peasant-wedding","title":"The Peasant Wedding","year":"1567","medium":"Oil on oak panel, 114 × 164 cm","location":"Kunsthistorisches Museum, Vienna","description":"<p>A wedding feast in a barn: two men carry bowls of porridge on an unhinged door, a piper looks hungrily at the food, a child licks a plate clean. The bride sits beneath a paper crown in front of a green cloth, while the groom's identity is still debated. The painting is full of affectionate, comic detail, and it is one of the reasons for Bruegel's nickname \"Peasant Bruegel\".<\/p>","image":"images/bruegel/peasant-wedding.jpg","credit":{"file":"File:Pieter Bruegel the Elder - Peasant Wedding - Google Art Project 2.jpg","source":"https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Peasant_Wedding_-_Google_Art_Project_2.jpg","author":"Pieter Brueghel the Elder","license":"Public domain","license_url":null}}]},{"slug":"sofonisba-anguissola","name":"Sofonisba Anguissola","lifespan":"c. 1532–1625","born":1532,"died":1625,"year_label":"1532","region":"Europe","country":"Italy","movements":["Late Renaissance"],"discipline":["Painting"],"summary":"The first Renaissance woman painter to win international fame, and court painter to the King of Spain.","sections":[{"title":"Overview","html":"<p>Sofonisba Anguissola was one of the first women in Europe to build a career as a professional painter. Born into a noble family, she could not study anatomy from the nude or take large public commissions, so she made portraiture her field. She brought to it a new warmth and informality: sisters playing chess, a laughing child, a father with his children. Michelangelo encouraged her, Vasari praised her, and she spent 14 years at the Spanish court. Her success opened the way for later women artists such as Lavinia Fontana and Artemisia Gentileschi.<\/p>"},{"title":"Life","html":"<p>Sofonisba was born around 1532 in Cremona, in Lombardy, the eldest of seven children of Amilcare Anguissola, a minor nobleman. Unusually, her father gave all his daughters a humanist education, and several of her sisters also became painters. Sofonisba studied with the local painters Bernardino Campi and Bernardino Gatti.<\/p>\n<p>Amilcare promoted her talent energetically. He sent her drawings to Michelangelo in Rome, who reportedly challenged her to draw a crying boy rather than a smiling girl. She replied with <em>Boy Bitten by a Crayfish<\/em>, a drawing that circulated widely. When Vasari visited the family in 1566 he wrote that her pictures seemed to breathe.<\/p>\n<p>In 1559 she was invited to Madrid to serve Queen Elisabeth of Valois, the teenage wife of Philip II, as lady-in-waiting and painting teacher. She painted the royal family and court for about 14 years. The king arranged a dowry and her marriage to a Sicilian nobleman, Fabrizio de Moncada. After his death she married a Genoese sea captain, Orazio Lomellini, and lived in Genoa and later Palermo. In 1624 the young Anthony van Dyck visited her there. He sketched the nearly blind artist in his notebook and recorded her advice on painting. She died in Palermo in 1625, in her early nineties.<\/p>"},{"title":"Style & Technique","html":"<p>Anguissola's early portraits are lively and intimate. She caught fleeting expressions, glances and smiles, and showed people interacting rather than posing stiffly. She painted with delicate, precise brushwork and a soft, even light, and she paid close attention to fabrics and jewellery.<\/p>\n<p>At the Spanish court she adapted to the formal state portrait: full-length figures, sombre costumes and restrained expressions. Here her individual touch is harder to see. Many of her court works were later credited to male painters such as Sánchez Coello. Her many self-portraits, from small miniatures to formal canvases, show her as a musician, a scholar and a working painter.<\/p>"},{"title":"Legacy","html":"<p>Anguissola showed that a woman could achieve international fame as a painter. Her success encouraged families to train their daughters and inspired artists such as Lavinia Fontana. Her genre-like family scenes may have influenced later painters, and some scholars link <em>Boy Bitten by a Crayfish<\/em> to Caravaggio's <em>Boy Bitten by a Lizard<\/em>. After centuries of neglect and misattribution, scholars have restored many works to her name. The Prado's 2019 exhibition with Lavinia Fontana brought her to a wide new audience.<\/p>"}],"cover":"the-chess-game","wikipedia":"https://en.wikipedia.org/wiki/Sofonisba_Anguissola","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/sofonisba-anguissola.md","works":[{"id":"the-chess-game","title":"The Chess Game (Portrait of the Artist's Sisters Playing Chess)","year":"1555","medium":"Oil on canvas, 72 × 97 cm","location":"National Museum, Poznań","description":"<p>Three of Sofonisba's sisters, Lucia, Minerva and Europa, play chess outdoors while a servant looks on. Lucia glances at us after making a winning move, Minerva raises a hand in protest, and little Europa grins. Chess was a game of intellect, so the painting quietly shows off the family's education, and it brings unusual warmth and spontaneity to a group portrait.<\/p>","image":"images/sofonisba-anguissola/the-chess-game.jpg","credit":{"file":"File:The Chess Game (Sofonisba Anguissola) 1555 (4096x3236px).jpg","source":"https://commons.wikimedia.org/wiki/File:The_Chess_Game_(Sofonisba_Anguissola)_1555_(4096x3236px).jpg","author":"Sofonisba Anguissola","license":"Public domain","license_url":null}},{"id":"self-portrait-at-the-easel","title":"Self-Portrait at the Easel","year":"c. 1556","medium":"Oil on canvas, 66 × 57 cm","location":"Łańcut Castle, Poland","description":"<p>Anguissola paints herself at work on an image of the Virgin and Child, brush in hand, looking straight at the viewer. At a time when women were rarely allowed to train as artists, the self-portrait is a statement of her professional identity. She painted more self-portraits than any other artist between Dürer and Rembrandt.<\/p>","image":"images/sofonisba-anguissola/self-portrait-at-the-easel.jpg","credit":{"file":"File:Sofonisba Anguissola, Selvportræt ved staffeliet, 1556, Museum Castle in Łańcut.jpg","source":"https://commons.wikimedia.org/wiki/File:Sofonisba_Anguissola,_Selvportr%C3%A6t_ved_staffeliet,_1556,_Museum_Castle_in_%C5%81a%C5%84cut.jpg","author":"Sofonisba Anguissola","license":"Public domain","license_url":null}},{"id":"family-portrait","title":"Amilcare Anguissola with His Children Minerva and Asdrubale","year":"c. 1557–1558","medium":"Oil on canvas, 157 × 122 cm","location":"Nivaagaard Collection, Denmark","description":"<p>The artist's father sits with his only son, Asdrubale, and his daughter Minerva in front of a landscape. The boy clutches a small dog, and the relaxed, affectionate poses were unusual for a formal family portrait. Amilcare had championed his daughters' education and sent Sofonisba's work to Michelangelo.<\/p>","image":"images/sofonisba-anguissola/family-portrait.jpg","credit":{"file":"File:Sofonisba Anguissola, Portrætgruppe med kunstnerens fader Amilcare Anguissola og hendes søskende Minerva og Astrubale, ca. 1559, 0001NMK, Nivaagaards Malerisamling.jpg","source":"https://commons.wikimedia.org/wiki/File:Sofonisba_Anguissola,_Portr%C3%A6tgruppe_med_kunstnerens_fader_Amilcare_Anguissola_og_hendes_s%C3%B8skende_Minerva_og_Astrubale,_ca._1559,_0001NMK,_Nivaagaards_Malerisamling.jpg","author":"Sofonisba Anguissola","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"bernardino-campi","title":"Bernardino Campi Painting Sofonisba Anguissola","year":"c. 1559","medium":"Oil on canvas, 111 × 110 cm","location":"Pinacoteca Nazionale, Siena","description":"<p>A double portrait with a twist. Sofonisba shows her teacher Bernardino Campi painting her portrait, but she is the one who painted the whole picture. She made her own likeness larger and brighter than his hand-made version of her. It is a witty meditation on authorship, teaching and who holds the brush.<\/p>","image":"images/sofonisba-anguissola/bernardino-campi.jpg","credit":{"file":"File:Self-portrait with Bernardino Campi by Sofonisba Anguissola.jpg","source":"https://commons.wikimedia.org/wiki/File:Self-portrait_with_Bernardino_Campi_by_Sofonisba_Anguissola.jpg","author":"Possibly Sofonisba Anguissola / Possibly Bernardino Campi","license":"Public domain","license_url":null}},{"id":"elisabeth-of-valois","title":"Elisabeth of Valois Holding a Portrait of Philip II","year":"c. 1561–1565","medium":"Oil on canvas, 206 × 123 cm","location":"Museo del Prado, Madrid","description":"<p>Anguissola's pupil and friend, the young French-born Queen of Spain, stands in a black gown embroidered with gold, holding a miniature of her husband, Philip II. The costume and jewels are rendered in minute detail, following the formal conventions of the Spanish court. The portrait also carries a personal tenderness born of the two women's years together.<\/p>","image":"images/sofonisba-anguissola/elisabeth-of-valois.jpg","credit":{"file":"File:Elizabeth.of.Valois.JPG","source":"https://commons.wikimedia.org/wiki/File:Elizabeth.of.Valois.JPG","author":"Sofonisba Anguissola","license":"Public domain","license_url":null}},{"id":"philip-ii","title":"Portrait of Philip II of Spain","year":"1565","medium":"Oil on canvas, 88 × 72 cm","location":"Museo del Prado, Madrid","description":"<p>The king, in sober black with the Order of the Golden Fleece, holds a rosary. For centuries this portrait was credited to the court painter Alonso Sánchez Coello. Modern research returned it to Anguissola, one of several of her court works that had lost her name.<\/p>","image":"images/sofonisba-anguissola/philip-ii.jpg","credit":{"file":"File:Portrait of Philip II of Spain by Sofonisba Anguissola - 002b.jpg","source":"https://commons.wikimedia.org/wiki/File:Portrait_of_Philip_II_of_Spain_by_Sofonisba_Anguissola_-_002b.jpg","author":"Sofonisba Anguissola","license":"Public domain","license_url":null}}]},{"slug":"basawan","name":"Basawan","lifespan":"active c. 1560–1600","born":1540,"died":1600,"year_label":"fl. 1560","region":"South Asia","country":"Mughal India","movements":["Mughal painting"],"discipline":["Painting"],"summary":"The leading painter of Emperor Akbar's workshop, admired for his lifelike figures, deep landscapes and bold compositions.","sections":[{"title":"Overview","html":"<p>Basawan was one of the greatest artists of the Mughal court under Emperor Akbar (reigned 1556–1605). Akbar built a large imperial painting workshop in which Persian masters trained Indian artists, mostly Hindus, to illustrate books of history, poetry and legend. Among more than a hundred painters, Basawan stood out. Akbar's historian Abu'l-Fazl praised his skill in composition, faces, colour and portraiture, and wrote that many critics preferred him even to the celebrated Daswanth. He was one of the first Indian painters to absorb European techniques of modelling and perspective.<\/p>"},{"title":"Life","html":"<p>Almost nothing is known of Basawan's life beyond his paintings and the brief praise in Abu'l-Fazl's <em>Ain-i-Akbari<\/em>. He was a Hindu and probably joined the imperial workshop as a young man in the 1560s. There the Persian masters Mir Sayyid Ali and Abd al-Samad, who had trained in the tradition of Behzād, directed Indian artists in producing vast illustrated manuscripts. The most famous of these was the <em>Hamzanama<\/em>, 1,400 large paintings of the adventures of the hero Hamza, made over some 15 years.<\/p>\n<p>Basawan's name, written in the margins of paintings by the imperial librarians, appears in the great manuscripts of Akbar's reign. They include the <em>Razmnama<\/em> (a Persian translation of the <em>Mahabharata<\/em>), the <em>Darabnama<\/em>, the <em>Akbarnama<\/em> (the official history of Akbar's reign) and luxurious small books of Persian poetry made in Lahore in the 1590s. For big history manuscripts, the work was often divided: Basawan designed the composition, and another artist completed the colouring.<\/p>\n<p>From 1580 Jesuit missionaries at Akbar's court brought European engravings and paintings. Basawan studied them closely, copying and adapting their figures, shading and deep space. He was active until about 1600. His son Manohar became one of the leading painters under Akbar's son, Emperor Jahangir.<\/p>"},{"title":"Style & Technique","html":"<p>Mughal painters worked with opaque watercolour on burnished paper, grinding pigments from minerals and plants and applying gold. Basawan's hallmark is a new sense of three-dimensional form. He modelled bodies and faces with subtle shading, set figures in convincing space, and painted landscapes that recede into soft, bluish distance. These ideas drew on both Persian tradition and European prints.<\/p>\n<p>His crowded scenes of battles, hunts and court events are full of energy. He arranged them in dynamic diagonals and swirling groups. At the same time he was a sympathetic observer of individuals: ascetics, servants, animals and old people are drawn with character and warmth.<\/p>"},{"title":"Legacy","html":"<p>Basawan helped create the Mughal style, a synthesis of Persian refinement, Indian vitality and European naturalism. It flourished under Jahangir and Shah Jahan. His pupils and his son Manohar carried his approach into the 17th century. Today his paintings are treasured in the Victoria and Albert Museum, the British Library, the Chester Beatty Library in Dublin, and museums in India and the United States. Scholars recognise him as one of the first Indian artists whose individual personality can be traced through his work.<\/p>"}],"cover":"akbar-and-hawai","wikipedia":"https://en.wikipedia.org/wiki/Basawan","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/basawan.md","works":[{"id":"origin-of-music","title":"The Origin of Music, from a Tutinama (Tales of a Parrot) (attributed)","year":"c. 1560–1565","medium":"Opaque watercolour, ink and gold on paper","location":"Cleveland Museum of Art","description":"<p>From one of the earliest manuscripts made for the young emperor Akbar, a collection of tales told b
