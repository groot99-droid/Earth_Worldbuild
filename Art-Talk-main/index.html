ue often stood for the female and yellow for the male, while green suggested their union. The paintings range from small canvases to the vast <em>Ten Largest<\/em>, painted in tempera on paper laid on the floor.<\/p>\n<p>She worked in series, developing a theme through variations, and considered herself a medium through whom the works were created. Her art draws on Theosophy, Christianity, botany and the new sciences of her time: evolution, atomic physics and invisible radiation.<\/p>"},{"title":"Legacy","html":"<p>Af Klint's abstract paintings were unknown until they appeared in the 1986 exhibition <em>The Spiritual in Art: Abstract Painting 1890–1985<\/em> at the Los Angeles County Museum of Art. A major show at Moderna Museet in Stockholm in 2013 brought international fame, and the Guggenheim's <em>Paintings for the Future<\/em> (2018–2019) drew more than 600,000 visitors. Her work has prompted a rethinking of who invented abstraction and why women artists were written out of the story. It has inspired films, books and new research, and the Hilma af Klint Foundation cares for her legacy.<\/p>"}],"cover":"the-ten-largest-adulthood","wikipedia":"https://en.wikipedia.org/wiki/Hilma_af_Klint","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/hilma-af-klint.md","works":[{"id":"primordial-chaos-16","title":"Primordial Chaos, No. 16 (Group I, WU/Rose Series)","year":"1906–1907","medium":"Oil on canvas, 53 × 37 cm","location":"Hilma af Klint Foundation, Stockholm","description":"<p>From the very first group of her <em>Paintings for the Temple<\/em>. Coiling spirals of green and yellow unwind across a deep blue ground. They represent the origins of the world and the division of unity into opposites, male and female, spirit and matter. Painted in 1906, these small works are among the earliest abstract paintings in Western art.<\/p>","image":"images/hilma-af-klint/primordial-chaos-16.jpg","credit":{"file":"File:Hilma af Klint, 1906-07, Primordial Chaos - No 16.jpg","source":"https://commons.wikimedia.org/wiki/File:Hilma_af_Klint,_1906-07,_Primordial_Chaos_-_No_16.jpg","author":"Hilma af Klint","license":"Public domain","license_url":null}},{"id":"the-ten-largest-adulthood","title":"The Ten Largest, No. 7, Adulthood (Group IV)","year":"1907","medium":"Tempera on paper mounted on canvas, 315 × 235 cm","location":"Hilma af Klint Foundation, Stockholm","description":"<p>One of ten huge paintings describing the stages of human life, from childhood to old age. Af Klint painted them in a few months, on paper laid on the floor. Blossoming flower-like forms, spirals and Roman numerals drift over a lilac ground. They seem to celebrate growth, love and maturity. The series was the centrepiece of the record-breaking Guggenheim exhibition of 2018–2019.<\/p>","image":"images/hilma-af-klint/the-ten-largest-adulthood.jpg","credit":{"file":"File:Hilma af Klint - The Ten Largest No. 7 - Adulthood - 1907.jpg","source":"https://commons.wikimedia.org/wiki/File:Hilma_af_Klint_-_The_Ten_Largest_No._7_-_Adulthood_-_1907.jpg","author":"Hilma af Klint","license":"Public domain","license_url":null}},{"id":"evolution-13","title":"Evolution, No. 13 (Group VI)","year":"1908","medium":"Oil on canvas","location":"Hilma af Klint Foundation, Stockholm","description":"<p>A great circle, ringed by a serpent, holds a pink, flower-like form divided into quarters and scattered with geometric signs: triangles, a crescent, black bars and coloured ovals. Reddish human figures twist toward it from either side. The series traces humanity's evolution through the meeting of opposites, such as light and dark or male and female. Shortly afterwards af Klint stopped painting the temple works for four years, partly discouraged by Rudolf Steiner's lukewarm response.<\/p>","image":"images/hilma-af-klint/evolution-13.jpg","credit":{"file":"File:Hilma af Klint - Group VI, Evolution No. 13 (13949).jpg","source":"https://commons.wikimedia.org/wiki/File:Hilma_af_Klint_-_Group_VI,_Evolution_No._13_(13949).jpg","author":"Rhododendrites","license":"Public domain","license_url":null}},{"id":"tree-of-knowledge-1","title":"The Tree of Knowledge, No. 1","year":"1913–1915","medium":"Watercolour and gouache on paper","location":"Glenstone Museum, Potomac, Maryland","description":"<p>One of eight delicate works on paper showing the biblical tree of knowledge as a symmetrical, diagram-like form of branches, birds, circles and hearts. Af Klint combined Christian, Theosophical and scientific imagery into a personal symbolic language. It is as much a spiritual diagram as a painting. Glenstone acquired the series of eight in 2022, among the most significant af Klint works ever sold.<\/p>","image":"images/hilma-af-klint/tree-of-knowledge-1.jpg","credit":{"file":"File:Tree of Knowledge No. 1, Hilma af Klint, 1913-1915, Glenstone 2023.jpg","source":"https://commons.wikimedia.org/wiki/File:Tree_of_Knowledge_No._1,_Hilma_af_Klint,_1913-1915,_Glenstone_2023.jpg","author":"Hilma af Klint","license":"Public domain","license_url":null}},{"id":"the-swan-17","title":"The Swan, No. 17 (Group IX/SUW)","year":"1915","medium":"Oil on canvas","location":"Hilma af Klint Foundation, Stockholm","description":"<p>The Swan series begins with realistic black and white swans and gradually turns them into pure geometry. In this late work a single circle, split into black and white on one side and blue and yellow on the other around a pink core, floats on a red ground in perfect balance. The series shows af Klint moving from symbol to hard-edged abstraction years before such painting became common.<\/p>","image":"images/hilma-af-klint/the-swan-17.jpg","credit":{"file":"File:Hilma af Klint, 1915, Svanen, No. 17.jpg","source":"https://commons.wikimedia.org/wiki/File:Hilma_af_Klint,_1915,_Svanen,_No._17.jpg","author":"Hilma af Klint","license":"Public domain","license_url":null}},{"id":"altarpiece-1","title":"Altarpiece, No. 1 (Group X)","year":"1915","medium":"Oil and metal leaf on canvas, 237.5 × 179.5 cm","location":"Hilma af Klint Foundation, Stockholm","description":"<p>The last series of the <em>Paintings for the Temple<\/em>. A rainbow-coloured triangle rises like a mountain or a pyramid toward a golden disc, symbolising the soul's ascent from the physical to the spiritual world. Af Klint imagined these altarpieces hanging in a spiral-shaped temple, a building that was never realised.<\/p>","image":"images/hilma-af-klint/altarpiece-1.jpg","credit":{"file":"File:Hilma af Klint - 1907 - Altarpiece - No 1 - Group X - Altarpieces.jpg","source":"https://commons.wikimedia.org/wiki/File:Hilma_af_Klint_-_1907_-_Altarpiece_-_No_1_-_Group_X_-_Altarpieces.jpg","author":"Hilma af Klint","license":"Public domain","license_url":null}}]},{"slug":"munch","name":"Edvard Munch","lifespan":"1863–1944","born":1863,"died":1944,"year_label":"1863","region":"Europe","country":"Norway","movements":["Symbolism","Expressionism"],"discipline":["Painting"],"summary":"The Norwegian painter of anxiety, love and death, whose Scream became the emblem of the modern psyche.","sections":[{"title":"Overview","html":"<p>Edvard Munch turned his own experiences of illness, grief, love and fear into images that speak to almost everyone. Rejecting naturalism, he used strong colour, swirling lines and simplified forms to express inner states: \"I paint not what I see, but what I saw.\" His <em>Frieze of Life<\/em> cycle explored the great themes of human existence. <em>The Scream<\/em> is one of the most recognised images in the world. Munch was also a pioneering printmaker, and he became a founding figure of Expressionism.<\/p>"},{"title":"Life","html":"<p>Munch was born on 12 December 1863 in Løten, Norway, and grew up in Kristiania (now Oslo). His mother died of tuberculosis when he was five, and his favourite sister, Sophie, died of the same disease when he was 13. His father, a devout army doctor, was prone to religious anxiety, and another sister was later hospitalised for mental illness. \"Illness, insanity and death were the black angels that kept watch over my cradle,\" Munch wrote.<\/p>\n<p>He studied art in Kristiania and joined the city's bohemian circle of writers and artists, who rejected bourgeois morality. Visits to Paris exposed him to Impressionism and Post-Impressionism. In 1892 his exhibition in Berlin was closed after a week amid scandal, which made him famous in Germany. In the 1890s he lived mostly in Berlin and Paris, mixing with writers such as August Strindberg, and developed the <em>Frieze of Life<\/em>.<\/p>\n<p>After years of heavy drinking and a turbulent love affair, he suffered a breakdown in 1908 and was treated in a clinic in Copenhagen. He returned to Norway in 1909, painted monumental murals for the Aula of the University of Oslo, and from 1916 lived quietly at his estate, Ekely, outside Oslo. In 1937 the Nazis labelled his work \"degenerate\" and removed it from German museums. He died at Ekely on 23 January 1944.<\/p>"},{"title":"Style & Technique","html":"<p>Munch simplified forms into flowing outlines and flat areas of expressive colour. He was influenced by Van Gogh, Gauguin and Symbolism. He often worked the paint thinly, scraped it back, or left canvases exposed to the weather, a practice he called his \"horse cure\". He repeated his key motifs many times, in paint and in prints.<\/p>\n<p>His lithographs and woodcuts are as important as his paintings. In woodcuts he used the grain of the wood as part of the image and sawed blocks into pieces to print different colours. The motifs recur throughout: the lonely figure, the shoreline, the column of moonlight, the embracing couple.<\/p>"},{"title":"Legacy","html":"<p>Munch had an enormous influence on German Expressionism, especially the artists of <em>Die Brücke<\/em>. He left his estate to the city of Oslo: about 1,100 paintings, 4,500 drawings and 18,000 prints. They became the core of the Munch Museum, which moved to a new 13-storey building on the Oslo waterfront in 2021. <em>The Scream<\/em> has been stolen twice, from the National Gallery in 1994 and from the Munch Museum in 2004, and recovered both times. Its image appears everywhere in popular culture, from films to emoji.<\/p>"}],"cover":"the-scream","wikipedia":"https://en.wikipedia.org/wiki/Edvard_Munch","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/munch.md","works":[{"id":"the-sick-child","title":"The Sick Child","year":"1885–1886","medium":"Oil on canvas, 119.5 × 118.5 cm","location":"National Museum, Oslo","description":"<p>A pale, red-haired girl propped on a pillow turns toward a grieving woman who bows her head beside the bed. The picture recalls the death of Munch's sister Sophie from tuberculosis. He scraped, scratched and repainted the canvas for a year until the surface seemed damaged. Critics mocked it as unfinished, but Munch called it a breakthrough, and he returned to the subject all his life.<\/p>","image":"images/munch/the-sick-child.jpg","credit":{"file":"File:Munch Det Syke Barn 1885-86.jpg","source":"https://commons.wikimedia.org/wiki/File:Munch_Det_Syke_Barn_1885-86.jpg","author":"Edvard Munch","license":"Public domain","license_url":null}},{"id":"the-scream","title":"The Scream","year":"1893","medium":"Tempera and crayon on cardboard, 91 × 73.5 cm","location":"National Museum, Oslo","description":"<p>A skull-like figure clutches its face on a bridge beneath a blood-red sky. Munch recalled walking at sunset, feeling \"an infinite scream passing through nature\". He made several painted, pastel and printed versions. The image has become a universal symbol of modern anxiety. A 1895 pastel version sold for $119.9 million in 2012.<\/p>","image":"images/munch/the-scream.jpg","credit":{"file":"File:Edvard Munch, 1893, The Scream, oil, tempera and pastel on cardboard, 91 x 73 cm, National Gallery of Norway.jpg","source":"https://commons.wikimedia.org/wiki/File:Edvard_Munch,_1893,_The_Scream,_oil,_tempera_and_pastel_on_cardboard,_91_x_73_cm,_National_Gallery_of_Norway.jpg","author":"Edvard Munch","license":"Public domain","license_url":null}},{"id":"madonna","title":"Madonna","year":"1894","medium":"Oil on canvas, 91 × 70.5 cm","location":"National Museum, Oslo","description":"<p>A nude woman with long black hair and closed eyes, a red halo above her head, sways against a dark, swirling ground. Munch combined the sacred and the erotic, conception and death. In a later lithograph version he added a frame of swimming sperm and a foetus-like figure. It belongs to his <em>Frieze of Life<\/em> cycle about love and mortality.<\/p>","image":"images/munch/madonna.jpg","credit":{"file":"File:Edvard Munch - Madonna - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Edvard_Munch_-_Madonna_-_Google_Art_Project.jpg","author":"Edvard Munch","license":"Public domain","license_url":null}},{"id":"vampire","title":"Vampire (Love and Pain)","year":"1895","medium":"Oil on canvas, 91 × 109 cm","location":"Munch Museum, Oslo","description":"<p>A woman with flaming red hair bends over a man, her mouth at his neck, her hair falling over him like streams of blood. Munch first called it <em>Love and Pain<\/em>. A critic named it <em>Vampire<\/em>, and the title stuck. The ambiguous embrace, comforting or consuming, captures Munch's view of love as both tender and destructive.<\/p>","image":"images/munch/vampire.jpg","credit":{"file":"File:Edvard Munch - Vampire (1895) - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Edvard_Munch_-_Vampire_(1895)_-_Google_Art_Project.jpg","author":"Edvard Munch","license":"Public domain","license_url":null}},{"id":"the-dance-of-life","title":"The Dance of Life","year":"1899–1900","medium":"Oil on canvas, 125.5 × 190.5 cm","location":"National Museum, Oslo","description":"<p>Couples dance on a shore on a midsummer night, beneath the pillar of the moon's reflection on the sea. Three women frame the scene: a young woman in white, a woman in red at the centre locked in a dance with a man, and an older woman in black. They represent innocence, passion and grief. It is one of the key paintings of Munch's <em>Frieze of Life<\/em>.<\/p>","image":"images/munch/the-dance-of-life.jpg","credit":{"file":"File:Edvard Munch - The Dance of Life - NG.M.00941 - National Museum of Art, Architecture and Design.jpg","source":"https://commons.wikimedia.org/wiki/File:Edvard_Munch_-_The_Dance_of_Life_-_NG.M.00941_-_National_Museum_of_Art,_Architecture_and_Design.jpg","author":"Edvard Munch","license":"Public domain","license_url":null}},{"id":"girls-on-the-bridge","title":"The Girls on the Bridge","year":"1901","medium":"Oil on canvas, 136 × 125 cm","location":"National Museum, Oslo","description":"<p>Three girls lean on the railing of a jetty in the small coastal town of Åsgårdstrand on a light summer night, while a great tree and its reflection loom over the water. The mood is calmer than in <em>The Scream<\/em>, which is set on a similar bridge, but still charged with longing and melancholy. Munch painted many versions of this popular subject.<\/p>","image":"images/munch/girls-on-the-bridge.jpg","credit":{"file":"File:Edvard Munch - The Girls on the Bridge - NG.M.00844 - National Museum of Art, Architecture and Design.jpg","source":"https://commons.wikimedia.org/wiki/File:Edvard_Munch_-_The_Girls_on_the_Bridge_-_NG.M.00844_-_National_Museum_of_Art,_Architecture_and_Design.jpg","author":"Edvard Munch","license":"Public domain","license_url":null}}]},{"slug":"kandinsky","name":"Wassily Kandinsky","lifespan":"1866–1944","born":1866,"died":1944,"year_label":"1866","region":"Europe","country":"Russia, Germany and France","movements":["Der Blaue Reiter","Abstract art","Bauhaus"],"discipline":["Painting"],"summary":"Russian painter and theorist, one of the pioneers of abstract art, who believed colour could affect the soul like music.","sections":[{"title":"Overview","html":"<p>Wassily Kandinsky is widely credited as one of the first painters to create purely abstract works in Europe, and he was abstraction's most influential theorist. Trained as a lawyer, he turned to art at 30. He came to believe that colours and forms, freed from the task of depicting objects, could express spiritual truths and move the viewer as directly as music. He co-founded the Blue Rider group in Munich, taught at the Bauhaus, and wrote <em>On the Spiritual in Art<\/em> (1911), a key text of modernism.<\/p>"},{"title":"Life","html":"<p>Kandinsky was born in Moscow on 16 December 1866 and grew up in Odessa. He studied law and economics at Moscow University and began a promising academic career. In 1896, having seen one of Monet's <em>Haystacks<\/em> in an exhibition and heard Wagner's <em>Lohengrin<\/em> at the Bolshoi, he gave up law and moved to Munich to study painting.<\/p>\n<p>In Munich he founded an art school and exhibiting society. He lived and travelled with the painter Gabriele Münter, and in the Bavarian village of Murnau his colours grew bolder. In 1911 he and Franz Marc founded <em>Der Blaue Reiter<\/em> (The Blue Rider) and published an influential almanac. Around the same time he painted his first fully abstract works.<\/p>\n<p>The First World War forced him back to Russia, where he took part in the new Soviet cultural institutions after the 1917 Revolution and married Nina Andreevskaya. Disillusioned, he returned to Germany in 1921 and from 1922 to 1933 taught at the Bauhaus in Weimar and Dessau, where he published <em>Point and Line to Plane<\/em> (1926). When the Nazis closed the Bauhaus he moved to Neuilly-sur-Seine near Paris, becoming a French citizen in 1939. He died there on 13 December 1944.<\/p>"},{"title":"Style & Technique","html":"<p>Kandinsky's work evolved from Russian folk and fairy-tale scenes, through Fauve-like landscapes at Murnau, to the explosive abstractions of 1911–1914. He sorted his works into <em>Impressions<\/em> (from nature), <em>Improvisations<\/em> (spontaneous expressions of inner feeling) and <em>Compositions<\/em> (the most carefully planned works). He made only ten <em>Compositions<\/em> over 30 years.<\/p>\n<p>He probably experienced synaesthesia, seeing colours when hearing sounds. He assigned emotional and musical qualities to colours: yellow was like a trumpet, blue a deep cello. At the Bauhaus his work became geometric, built from circles, triangles and lines in careful balance. In Paris his late style included soft, biomorphic forms that resemble microscopic organisms.<\/p>"},{"title":"Legacy","html":"<p>Kandinsky's writings and paintings laid the foundations for 20th-century abstraction. They influenced the Abstract Expressionists in New York and generations of designers through his Bauhaus teaching. The Solomon R. Guggenheim Museum, founded around a collection of \"non-objective\" art, holds more than 150 of his works. Compositions I–III were destroyed in the Second World War. His paintings now sell for tens of millions of dollars, and in 2017 <em>Murnau with Church II<\/em> sold for £33 million.<\/p>"}],"cover":"composition-vii","wikipedia":"https://en.wikipedia.org/wiki/Wassily_Kandinsky","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/kandinsky.md","works":[{"id":"the-blue-rider","title":"The Blue Rider","year":"1903","medium":"Oil on cardboard, 52.1 × 54.6 cm","location":"Foundation E.G. Bührle Collection, Zurich (on loan to Kunsthaus Zürich)","description":"<p>A rider in a blue cloak gallops across a sunlit meadow, painted in dabs of colour that break up the forms. The small painting is still figurative, but colour is already doing the expressive work. Its title later gave its name to the artists' group that Kandinsky and Franz Marc founded in 1911.<\/p>","image":"images/kandinsky/the-blue-rider.jpg","credit":{"file":"File:Wassily Kandinsky, 1903, The Blue Rider (Der Blaue Reiter), oil on canvas, 52.1 x 54.6 cm, Stiftung Sammlung E.G. Bührle, Zurich.jpg","source":"https://commons.wikimedia.org/wiki/File:Wassily_Kandinsky,_1903,_The_Blue_Rider_(Der_Blaue_Reiter),_oil_on_canvas,_52.1_x_54.6_cm,_Stiftung_Sammlung_E.G._B%C3%BChrle,_Zurich.jpg","author":"Wassily Kandinsky","license":"Public domain","license_url":null}},{"id":"composition-iv","title":"Composition IV","year":"1911","medium":"Oil on canvas, 159.5 × 250.5 cm","location":"Kunstsammlung Nordrhein-Westfalen, Düsseldorf","description":"<p>Behind the bursts of colour and black lines lie hidden images: Cossacks with lances, a castle on a blue mountain, reclining lovers, a rainbow. Kandinsky was gradually stripping away recognisable subject matter so that colour and line could act directly on the viewer's emotions, like music.<\/p>","image":"images/kandinsky/composition-iv.jpg","credit":{"file":"File:Vassily Kandinsky, 1911 - Composition No 4.jpg","source":"https://commons.wikimedia.org/wiki/File:Vassily_Kandinsky,_1911_-_Composition_No_4.jpg","author":"Wassily Kandinsky","license":"Public domain","license_url":null}},{"id":"composition-vi","title":"Composition VI","year":"1913","medium":"Oil on canvas, 195 × 300 cm","location":"State Hermitage Museum, St Petersburg","description":"<p>Kandinsky struggled for months with the theme of the Flood, and in the end he found release by repeating the word \"Deluge\" to himself. The finished canvas is a storm of colliding colour, line and form, a vision of destruction and rebirth in which the original subject is almost entirely dissolved.<\/p>","image":"images/kandinsky/composition-vi.jpg","credit":{"file":"File:Kandinsky - Composition VI, 1913, ГЭ-9662.jpg","source":"https://commons.wikimedia.org/wiki/File:Kandinsky_-_Composition_VI,_1913,_%D0%93%D0%AD-9662.jpg","author":"Wassily Kandinsky","license":"Public domain","license_url":null}},{"id":"composition-vii","title":"Composition VII","year":"1913","medium":"Oil on canvas, 200 × 300 cm","location":"State Tretyakov Gallery, Moscow","description":"<p>Considered the summit of Kandinsky's pre-war work, this huge canvas swirls with intersecting shapes and colours around a dark central vortex. It draws on the themes of resurrection, the Last Judgment and the Garden of Love. He made more than 30 preparatory studies and then painted it in about four days.<\/p>","image":"images/kandinsky/composition-vii.jpg","credit":{"file":"File:Composition VII - Wassily Kandinsky, GAC.jpg","source":"https://commons.wikimedia.org/wiki/File:Composition_VII_-_Wassily_Kandinsky,_GAC.jpg","author":"Wassily Kandinsky","license":"Public domain","license_url":null}},{"id":"composition-viii","title":"Composition VIII","year":"1923","medium":"Oil on canvas, 140 × 201 cm","location":"Solomon R. Guggenheim Museum, New York","description":"<p>Painted at the Bauhaus, it shows the change in Kandinsky's style after his years in revolutionary Russia. Instead of stormy colour, crisp geometric circles, triangles, grids and lines float on a pale ground in precise balance. He called circles \"the synthesis of the greatest oppositions\".<\/p>","image":"images/kandinsky/composition-viii.jpg","credit":{"file":"File:Vassily Kandinsky, 1923 - Composition 8, huile sur toile, 140 cm x 201 cm, Musée Guggenheim, New York.jpg","source":"https://commons.wikimedia.org/wiki/File:Vassily_Kandinsky,_1923_-_Composition_8,_huile_sur_toile,_140_cm_x_201_cm,_Mus%C3%A9e_Guggenheim,_New_York.jpg","author":"Wassily Kandinsky","license":"Public domain","license_url":null}},{"id":"several-circles","title":"Several Circles","year":"1926","medium":"Oil on canvas, 140.3 × 140.7 cm","location":"Solomon R. Guggenheim Museum, New York","description":"<p>Translucent coloured circles, large and small, overlap and float on a dark, cosmic ground. They look like planets, cells or musical notes. It is one of Kandinsky's purest and most serene works, reducing painting to the interplay of a single shape and colour.<\/p>","image":"images/kandinsky/several-circles.jpg","credit":{"file":"File:Vassily Kandinsky, 1926 - Several Circles, Gugg 0910 25.jpg","source":"https://commons.wikimedia.org/wiki/File:Vassily_Kandinsky,_1926_-_Several_Circles,_Gugg_0910_25.jpg","author":"Wassily Kandinsky","license":"Public domain","license_url":null}}]},{"slug":"frank-lloyd-wright","name":"Frank Lloyd Wright","lifespan":"1867–1959","born":1867,"died":1959,"year_label":"1867","region":"Americas","country":"United States","movements":["Prairie School","Organic architecture","Usonian"],"discipline":["Architecture"],"summary":"The American architect of \"organic architecture,\" who spent seven decades redefining the house, the office and the museum around open space, natural light and the shape of the land.","sections":[{"title":"Overview","html":"<p>Frank Lloyd Wright was the most influential American architect of the twentieth century, working across an unusually long career that ran from the horizontal, ground-hugging houses of his Prairie School period through radical public buildings like Unity Temple and the Johnson Wax headquarters, to Fallingwater and the spiralling Guggenheim Museum near the very end of his life. He argued for what he called \"organic architecture,\" buildings designed from the inside out around their site, their materials and the people who would use them, rather than applied historical style.<\/p>"},{"title":"Life","html":"<p>Wright was born in 1867 in Richland Center, Wisconsin, and studied engineering briefly at the University of Wisconsin before moving to Chicago, where he worked under Louis Sullivan, the pioneer of the skyscraper, who became his chief early influence and whom Wright later called his \"Lieber Meister.\" Setting up his own practice in the Chicago suburb of Oak Park in the 1890s, he developed the low, wide-eaved Prairie house style through the following decade. His personal life was turbulent and often scandalous by the standards of the time, including an affair, a double murder at his Wisconsin home Taliesin in 1914, and bankruptcy during the Depression; each crisis was followed by a fresh burst of work. In his late sixties, rather than winding down, he designed some of his most celebrated buildings, Fallingwater, the Johnson Wax headquarters and finally the Guggenheim Museum, working until shortly before his death in 1959 at the age of 91.<\/p>"},{"title":"Style & Technique","html":"<p>Wright designed around open, flowing interior space rather than a sequence of enclosed rooms, breaking up walls with bands of art-glass windows and extending rooflines far beyond their walls in deep, cantilevered overhangs. He treated concrete, steel and glass as materials to be used honestly and inventively rather than disguised as historical stonework, engineering unusually slender cantilevers and columns that alarmed structural engineers of the day, most famously the tapering \"dendriform\" columns at the Johnson Wax headquarters. He also designed most of the furniture, textiles and stained glass within his buildings himself, treating each project as a single integrated work rather than a shell to be furnished afterward.<\/p>"},{"title":"Legacy","html":"<p>Wright designed more than a thousand structures over his career, of which roughly half were built, and left an influence on residential design, particularly the open-plan living spaces standard in American houses today, that is hard to overstate. Fallingwater and several other Wright buildings are inscribed together as a UNESCO World Heritage Site. Late in life he also planned an entire unrealised city, Broadacre City, laying out a vision of low-density, car-based suburban living that anticipated, for better and worse, much of postwar American development.<\/p>"}],"cover":"fallingwater","wikipedia":"https://en.wikipedia.org/wiki/Frank_Lloyd_Wright","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/frank-lloyd-wright.md","works":[{"id":"robie-house","title":"Robie House","year":"1909–1910","medium":"Roman brick, limestone trim and art-glass windows over a steel-framed cantilevered roof","location":"Chicago, Illinois, United States","description":"<p>The most fully resolved of Wright's Prairie School houses, built for a bicycle manufacturer on a narrow urban lot. Long, low rooflines cantilever dramatically beyond their brick walls with almost no visible support, echoing the flat horizon of the Midwestern prairie, while art-glass windows dissolve the boundary between rooms and garden.<\/p>","image":"images/frank-lloyd-wright/robie-house.jpg","credit":{"file":"File:Frederick C. Robie House.JPG","source":"https://commons.wikimedia.org/wiki/File:Frederick_C._Robie_House.JPG","author":"Teemu08","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}},{"id":"unity-temple","title":"Unity Temple","year":"1905–1908","medium":"Board-formed reinforced concrete, one of the earliest uses of the material for a public building","location":"Oak Park, Illinois, United States","description":"<p>A Unitarian church built to a tight budget, and Wright's first major public building, cast almost entirely in raw concrete left exposed rather than faced with stone. Worshippers enter through a low, compressed passage before the space opens dramatically upward into a top-lit, cube-shaped sanctuary, a sequence of compression and release Wright reused throughout his career.<\/p>","image":"images/frank-lloyd-wright/unity-temple.jpg","credit":{"file":"File:Oak Park Il Unity Temple8.jpg","source":"https://commons.wikimedia.org/wiki/File:Oak_Park_Il_Unity_Temple8.jpg","author":"IvoShandor","license":"CC BY 2.5","license_url":"https://creativecommons.org/licenses/by/2.5"}},{"id":"fallingwater","title":"Fallingwater","year":"1936–1939","medium":"Reinforced concrete cantilevers, sandstone walls and steel-framed glazing","location":"Mill Run, Pennsylvania, United States","description":"<p>A weekend house built directly over a waterfall for the Kaufmann family, its stacked concrete terraces cantilevered dramatically out over the falling water rather than facing it from a safe distance. Widely considered Wright's masterpiece, it was designed when he was nearly 70, in the middle of what is often called his career's second, \"Usonian\" act.<\/p>","image":"images/frank-lloyd-wright/fallingwater.jpg","credit":{"file":"File:Fallingwater3.jpg","source":"https://commons.wikimedia.org/wiki/File:Fallingwater3.jpg","author":"lachrimae72","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"johnson-wax-headquarters","title":"Johnson Wax Headquarters","year":"1936–1939","medium":"Brick with slender reinforced-concrete \"dendriform\" (tree-shaped) columns and Pyrex glass tubing","location":"Racine, Wisconsin, United States","description":"<p>An open-plan office hall lit not by conventional windows but by bands of glass tubing between slender, mushroom-capped concrete columns that widen toward the ceiling like tree trunks and leaves. Wright had to build a test column and load it with sandbags to prove to sceptical building inspectors that the unusually thin supports would hold.<\/p>","image":"images/frank-lloyd-wright/johnson-wax-headquarters.jpg","credit":{"file":"File:Racine October 2023 102 (S. C. Johnson and Son Administration Building and Research Tower).jpg","source":"https://commons.wikimedia.org/wiki/File:Racine_October_2023_102_(S._C._Johnson_and_Son_Administration_Building_and_Research_Tower).jpg","author":"Michael Barera","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"guggenheim-museum","title":"Solomon R. Guggenheim Museum","year":"1956–1959","medium":"Reinforced concrete","location":"New York City, United States","description":"<p>Wright's last major work, completed the year of his death after sixteen years of design and dispute with the client and the city. A continuous spiral ramp, rather than a sequence of separate rooms, lets visitors descend past artworks along one unbroken gallery wound around an open, skylit central well.<\/p>","image":"images/frank-lloyd-wright/guggenheim-museum.jpg","credit":{"file":"File:Solomon R. Guggenheim Museum (48059131351).jpg","source":"https://commons.wikimedia.org/wiki/File:Solomon_R._Guggenheim_Museum_(48059131351).jpg","author":"Ajay Suresh from New York, NY, USA","license":"CC BY 2.0","license_url":"https://creativecommons.org/licenses/by/2.0"}}]},{"slug":"charles-rennie-mackintosh","name":"Charles Rennie Mackintosh","lifespan":"1868–1928","born":1868,"died":1928,"year_label":"1868","region":"Europe","country":"Scotland","movements":["Glasgow Style","Art Nouveau"],"discipline":["Design","Architecture"],"summary":"The Glasgow architect-designer whose buildings, furniture and interiors, largely unrecognised in his own later career, became one of the defining styles of European Art Nouveau.","sections":[{"title":"Overview","html":"<p>Charles Rennie Mackintosh was the central figure of the \"Glasgow Style,\" a distinctly Scottish strand of Art Nouveau built on severe geometric form, tall vertical lines and restrained ornament, applied across architecture, furniture and interior design as a single integrated art. His most celebrated building, the Glasgow School of Art, and his total interior schemes for private houses and tearooms made him a significant influence on continental European design even as his career in Britain struggled after 1910, and he spent his final years painting watercolours rather than designing buildings.<\/p>"},{"title":"Life","html":"<p>Mackintosh was born in Glasgow in 1868 and trained as an architect while attending evening classes at the Glasgow School of Art, where he met his future wife, the artist Margaret Macdonald; together with her sister Frances and Frances's husband Herbert MacNair, they became known as \"The Four,\" developing a shared symbolist decorative style. Working for the Glasgow firm Honeyman and Keppie, Mackintosh won the competition to design a new building for his own art school in 1896, and its completion in 1909 established his reputation. He designed several private houses, tearooms and a school in and around Glasgow over the following decade, always in close collaboration with Margaret Macdonald on furnishings and decoration. Commissions dried up after around 1910, partly through changing taste and partly through his own uncompromising manner with clients, and by 1914 he had left Glasgow for England. In the 1920s he and Margaret settled in the south of France, where he largely abandoned architecture and design for landscape watercolours. He returned to London for cancer treatment and died there in 1928, in relative obscurity and financial hardship.<\/p>"},{"title":"Style & Technique","html":"<p>Mackintosh treated a building, its furniture and its decoration as a single design problem rather than separate disciplines, working out room proportions, light fittings, stencilled wall patterns and chair silhouettes together as one composition. His furniture, especially his towering ladder-back chairs, often prioritised a striking vertical silhouette that shaped the feeling of a room over conventional comfort, treating a chair as a piece of spatial design as much as a seat. Restrained, geometric ornament, stylised roses, grids of glazing bars, contrasted with the more overtly organic, curving forms typical of French and Belgian Art Nouveau, giving the Glasgow Style its more austere, architectural character.<\/p>"},{"title":"Legacy","html":"<p>Mackintosh found greater recognition on the European continent during his own lifetime than at home: his work was exhibited at the 1900 Vienna Secession show and directly influenced Josef Hoffmann and the Wiener Werkstätte. Largely forgotten in Britain by the time of his death, he was rediscovered by architectural historians from the mid-twentieth century onward and is now regarded as one of the most important European architect-designers of his generation. The 2014 and 2018 fires at the Glasgow School of Art, destroying much of his most celebrated interior, were treated as a major cultural loss in Scotland and remain the subject of ongoing conservation and rebuilding work.<\/p>"}],"cover":"glasgow-school-of-art","wikipedia":"https://en.wikipedia.org/wiki/Charles_Rennie_Mackintosh","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/charles-rennie-mackintosh.md","works":[{"id":"glasgow-school-of-art","title":"Glasgow School of Art","year":"1897–1909","medium":"Sandstone, iron and timber, built in two phases","location":"Glasgow, Scotland","description":"<p>Mackintosh's masterpiece and, at the time, an almost unknown young architect's first major commission, won through an anonymous competition. Its severe stone facades and soaring, timber-lined library interior fused Scottish baronial tradition with an entirely original Art Nouveau vocabulary. Two catastrophic fires, in 2014 and 2018, destroyed much of the original library and interior, a loss still being assessed and, in part, rebuilt.<\/p>","image":"images/charles-rennie-mackintosh/glasgow-school-of-art.jpg","credit":{"file":"File:Schoolofart1.jpg","source":"https://commons.wikimedia.org/wiki/File:Schoolofart1.jpg","author":"No machine-readable author provided. Twid assumed (based on copyright claims).","license":"CC BY-SA 3.0","license_url":"http://creativecommons.org/licenses/by-sa/3.0/"}},{"id":"hill-house","title":"Hill House","year":"1902–1904","medium":"Roughcast render over stone, with integrated interior furnishings","location":"Helensburgh, Scotland","description":"<p>A private house for the publisher Walter Blackie, designed down to its furniture, light fittings and stencilled wall decoration as a single unified scheme. Considered Mackintosh's finest domestic building, it is now protected under a giant steel \"box\" and rain shield while conservators address decades of water damage to its experimental cement render.<\/p>","image":"images/charles-rennie-mackintosh/hill-house.jpg","credit":{"file":"File:HillHouse.jpg","source":"https://commons.wikimedia.org/wiki/File:HillHouse.jpg","author":null,"license":"CC BY-SA 2.5","license_url":"https://creativecommons.org/licenses/by-sa/2.5"}},{"id":"willow-tearooms","title":"Willow Tearooms","year":"1903","medium":"Timber, leaded glass and gesso panels","location":"Sauchiehall Street, Glasgow, Scotland","description":"<p>Designed for the entrepreneur Catherine Cranston down to the cutlery and waitress uniforms, its \"Room de Luxe\" salon is lined with silvered high-backed chairs and leaded mirror glass. It is the most complete surviving example of the total interior environments Mackintosh and his wife, the artist Margaret Macdonald, designed together for Cranston's chain of tearooms.<\/p>","image":"images/charles-rennie-mackintosh/willow-tearooms.jpg","credit":{"file":"File:Mackintosh At The Willow.jpg","source":"https://commons.wikimedia.org/wiki/File:Mackintosh_At_The_Willow.jpg","author":"JJCMarshall","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"high-backed-chair","title":"High-backed chair","year":"c. 1900–1904","medium":"Ebonised oak","location":"Designed for the Argyle Street and Ingram Street tearooms, Glasgow, Scotland","description":"<p>An elongated ladder-back chair whose towering rear rail was designed as much to define and divide a room visually as to be sat in comfortably. Variants of this silhouette became Mackintosh's most widely recognised design and one of the signature furniture forms of the Glasgow Style.<\/p>","image":"images/charles-rennie-mackintosh/high-backed-chair.jpg","credit":{"file":"File:High-backed chair by Charles Rennie Mackintosh, V&A London.jpg","source":"https://commons.wikimedia.org/wiki/File:High-backed_chair_by_Charles_Rennie_Mackintosh,_V%26A_London.jpg","author":"14GTR","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"scotland-street-school","title":"Scotland Street School","year":"1903–1906","medium":"Sandstone with twin glazed stair towers","location":"Glasgow, Scotland","description":"<p>A working elementary school built around two dramatic glass-fronted stair towers that flood the interior with light, a functional solution Mackintosh turned into the building's defining visual feature. It operated as a school until 1979 and is now a museum of Scottish education.<\/p>","image":"images/charles-rennie-mackintosh/scotland-street-school.jpg","credit":{"file":"File:Scotland Street school museum - geograph.org.uk - 1190061.jpg","source":"https://commons.wikimedia.org/wiki/File:Scotland_Street_school_museum_-_geograph.org.uk_-_1190061.jpg","author":"Dave Forrest","license":"CC BY-SA 2.0","license_url":"https://creativecommons.org/licenses/by-sa/2.0"}}]},{"slug":"alice-guy-blache","name":"Alice Guy-Blaché","lifespan":"1873–1968","born":1873,"died":1968,"year_label":"1873","region":"Europe","country":"France (later United States)","movements":["Early cinema"],"discipline":["Film"],"summary":"One of cinema's first narrative filmmakers and the first woman to run her own film studio, whose hundreds of films were erased from film history for most of the twentieth century.","sections":[{"title":"Overview","html":"<p>Alice Guy-Blaché began directing films in 1896, within months of the medium's public birth, while working as a secretary at the Gaumont Film Company in Paris, and went on to direct or supervise hundreds of films across three decades in France and the United States. She is widely credited as one of the very first directors, anywhere, to make a staged narrative fiction film rather than a documentary fragment of everyday life, and she later became the first woman to found and run her own film studio. For much of the twentieth century her work was misattributed to male colleagues and successors; only from the 1970s did film historians restore her place in the medium's founding generation.<\/p>"},{"title":"Life","html":"<p>Guy was born in Saint-Mandé, France, in 1873, and in 1894 took a job as a secretary to Léon Gaumont, a manufacturer of photographic equipment moving into motion pictures. After watching an early demonstration film, she asked Gaumont for permission to direct a short fictional scene of her own in her spare time, on the condition it never interfered with her office duties; the result, <em>La Fée aux choux<\/em>, launched a directing career that ran alongside her secretarial work for years. She rose to become Gaumont's head of production, directing and supervising output across genres while experimenting with hand-tinted colour and an early synchronised-sound process called Phonoscènes. In 1907 she married Gaumont cameraman Herbert Blaché and moved with him to the United States, where in 1910 they founded the Solax Company in Fort Lee, New Jersey, then a centre of American film production; Guy served as artistic director and later president, one of the very few women to head a film studio at any point in the medium's first half-century. Financial strain, the industry's move to Hollywood, and the couple's 1922 divorce ended Solax; Guy returned to France, largely unable to resume directing, and spent her later decades trying, mostly unsuccessfully, to have her contribution to early cinema properly recognised. She died in New Jersey in 1968.<\/p>"},{"title":"Style & Technique","html":"<p>Guy worked across nearly every genre and technique available in early cinema, comedy, melodrama, religious epic, social drama, westerns, and used cinema's earliest years as an open laboratory rather than settling into one register. <em>Les Résultats du féminisme<\/em> shows her taste for social satire built on a simple structural device, here a wholesale reversal of gender roles; other films used hand-tinted colour, synchronised phonograph recordings, and, at Solax, unusually direct engagement with contemporary social issues such as immigration and domestic violence, subjects most of her contemporaries avoided in short comic or sentimental films.<\/p>"},{"title":"Legacy","html":"<p>For decades after her retirement, many of Guy's Gaumont-era films were catalogued under the names of male colleagues and successors, and film histories routinely omitted her from the medium's founding generation entirely. Feminist and archival film scholarship from the 1970s onward, drawing on her own memoir and on studio records, gradually restored her authorship and her reputation, and she is now widely recognised as one of the first narrative filmmakers in cinema history and the first woman to run a film studio. Many of her hundreds of films remain lost, and rediscovery of surviving prints continues.<\/p>"}],"cover":"la-fee-aux-choux","wikipedia":"https://en.wikipedia.org/wiki/Alice_Guy-Blach%C3%A9","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/alice-guy-blache.md","works":[{"id":"la-fee-aux-choux","title":"La Fée aux choux (The Cabbage-Patch Fairy)","year":"1896","medium":"Silent film, black-and-white, 35mm, about 1 minute","location":"Gaumont Film Company, Paris, France","description":"<p>Made when Guy was a 23-year-old secretary at the Gaumont Film Company, after she asked her employer's permission to try directing a short scene in her own time, this staged fable of a fairy pulling babies from a cabbage patch is widely regarded as one of the very first narrative fiction films, among the earliest instances anywhere of a story told on film rather than a recorded fragment of real life.<\/p>","image":"images/alice-guy-blache/la-fee-aux-choux.jpg","credit":{"file":"File:La Fée aux choux.png","source":"https://commons.wikimedia.org/wiki/File:La_F%C3%A9e_aux_choux.png","author":"Alice Guy","license":"Public domain","license_url":null}},{"id":"consequences-of-feminism","title":"Les Résultats du féminisme (The Consequences of Feminism)","year":"1906","medium":"Silent film, black-and-white, 35mm, about 7 minutes","location":"Gaumont Film Company, Paris, France","description":"<p>A comic satire imagining a France with gender roles reversed: men sew, mind babies and are harassed on the street, while women lounge in cafés and hold public power. By the end the men revolt and reclaim their old position, but the film's real effect was to make contemporary gender norms look as arbitrary and absurd from either direction.<\/p>","image":"images/alice-guy-blache/consequences-of-feminism.jpg","credit":{"file":"File:Les Résultats du féminisme - scénario - btv1b53002310f (1 of 3).jpg","source":"https://commons.wikimedia.org/wiki/File:Les_R%C3%A9sultats_du_f%C3%A9minisme_-_sc%C3%A9nario_-_btv1b53002310f_(1_of_3).jpg","author":null,"license":"Public domain","license_url":null}},{"id":"making-an-american-citizen","title":"Making an American Citizen","year":"1912","medium":"Silent film, black-and-white, 35mm, about 12 minutes","location":"Solax Company, Fort Lee, New Jersey, United States","description":"<p>A Russian immigrant who mistreats his wife as a beast of burden is gradually reformed by American law and custom until he treats her as an equal, a social-issue drama typical of the films Guy directed as head of her own American studio, tackling immigration and gender politics well outside the era's usual comic or melodramatic conventions.<\/p>","image":"images/alice-guy-blache/making-an-american-citizen.jpg","credit":{"file":"File:Still from Making American Citizen(1912).jpg","source":"https://commons.wikimedia.org/wiki/File:Still_from_Making_American_Citizen(1912).jpg","author":"\"The Moving Picture News,\" October 19, 1912 (Image by Solax Release)","license":"Public domain","license_url":null}},{"id":"falling-leaves","title":"Falling Leaves","year":"1912","medium":"Silent film, black-and-white, 35mm, about 13 minutes","location":"Solax Company, Fort Lee, New Jersey, United States","description":"<p>A young girl, overhearing that her tuberculosis-stricken older sister will die \"when the last leaf falls,\" secretly ties the autumn leaves back onto a tree branch by branch to keep her sister alive, a sentimental drama built on a single sustained visual idea that anticipates the same premise later used in O. Henry's story \"The Last Leaf.\"<\/p>","image":"images/alice-guy-blache/falling-leaves.jpg","credit":{"file":"File:Darwin Karr (Falling Leaves).jpg","source":"https://commons.wikimedia.org/wiki/File:Darwin_Karr_(Falling_Leaves).jpg","author":"Alice Guy-Blaché","license":"Public domain","license_url":null}},{"id":"two-little-strangers","title":"Two Little Strangers","year":"1912","medium":"Silent film, black-and-white, 35mm, about 12 minutes","location":"Solax Company, Fort Lee, New Jersey, United States","description":"<p>One of hundreds of one- and two-reel dramas and comedies Guy directed or supervised at Solax, the company she ran as artistic director, most now lost, surviving today largely through stills and studio records like this frame preserved in the EYE Filmmuseum's collection.<\/p>","image":"images/alice-guy-blache/two-little-strangers.jpg","credit":{"file":"File:Still from Alice Guy-Blaché - film Two little strangers - 1912 - Solax - EYE FOT414158.jpg","source":"https://commons.wikimedia.org/wiki/File:Still_from_Alice_Guy-Blach%C3%A9_-_film_Two_little_strangers_-_1912_-_Solax_-_EYE_FOT414158.jpg","author":"Alice Guy-Blaché","license":"Public domain","license_url":null}}]},{"slug":"buster-keaton","name":"Buster Keaton","lifespan":"1895–1966","born":1895,"died":1966,"year_label":"1895","region":"Americas","country":"United States","movements":["Silent film comedy"],"discipline":["Film"],"summary":"The deadpan \"Great Stone Face\" of silent comedy, who wrote, directed and performed his own increasingly dangerous physical stunts in some of the era's most technically ambitious films.","sections":[{"title":"Overview","html":"<p>Buster Keaton was one of silent cinema's two great comic stars, alongside Charlie Chaplin, but built his comedy on the opposite principle: an expressionless, unblinking face set against wildly acrobatic, meticulously engineered physical stunts that he performed himself, often at genuine personal risk. Across a run of shorts and features he wrote, directed and starred in during the 1920s, he turned trains, boats, houses and entire landscapes into elaborate mechanical props for sight gags of a precision that still impresses stunt professionals a century later.<\/p>"},{"title":"Life","html":"<p>Keaton was born in 1895 into a vaudeville family and was performing on stage in the family act, The Three Keatons, from the age of three, taking comic falls that built the physical control his later film work depended on. He entered film in 1917 as a supporting player to Roscoe \"Fatty\" Arbuckle, and by 1920 was writing, directing and starring in his own two-reel comedies, moving into features with <em>Our Hospitality<\/em> (1923) and, across the mid-1920s, the run of films now considered his finest work. <em>The General<\/em> (1926), now his most acclaimed film, was a costly box-office failure on release, and by 1928 financial pressure pushed him into a contract with MGM that stripped him of the creative control his best work had depended on. The following decade brought professional decline, a difficult divorce, and alcoholism. From the 1950s, a new generation of critics and filmmakers rediscovered his silent work, and Keaton, working again as an actor and consultant into his final years, received an honorary Academy Award in 1959. He died of lung cancer in 1966.<\/p>"},{"title":"Style & Technique","html":"<p>Keaton's \"Great Stone Face\" persona, an expression that registers almost nothing even in the middle of physical chaos, was itself a comic technique: the less his face reacted, the funnier and more dangerous the surrounding disaster looked by contrast. He built gags around real, large-scale mechanical objects, a house, a train, an ocean liner, rather than studio miniatures, and staged stunts, most famously the collapsing building facade in <em>Steamboat Bill, Jr.<\/em>, with almost no margin for error, trusting his own precisely measured mark on the ground rather than a stunt double or special effect. In <em>Sherlock Jr.<\/em> he also used carefully calculated in-camera effects, rather than editing tricks, to place himself convincingly inside a shifting dream of film scenes.<\/p>"},{"title":"Legacy","html":"<p>Keaton is now ranked with Chaplin as one of the two defining artists of silent-film comedy, and <em>The General<\/em> regularly appears on lists of the greatest films ever made. His influence runs through generations of physical comedians and stunt performers, including Jackie Chan, who has cited Keaton's insistence on real, dangerous, camera-visible stunts as a direct model for his own work. Critical rediscovery of his films from the 1950s onward, notably through James Agee's influential essay \"Comedy's Greatest Era\" and later restoration efforts, restored Keaton's reputation after decades in which his films had been eclipsed by Chaplin's more overtly sentimental fame.<\/p>"}],"cover":"the-general","wikipedia":"https://en.wikipedia.org/wiki/Buster_Keaton","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/buster-keaton.md","works":[{"id":"one-week","title":"One Week","year":"1920","medium":"Silent film, black-and-white, 35mm, about 25 minutes","location":"Comique Film Corporation, United States","description":"<p>Keaton's first film as his own director, released just after he left Roscoe Arbuckle's unit to run his own studio: a newlywed couple try to assemble a mail-order build-it-yourself house from numbered parts that a jealous rival has secretly mislabelled, producing a lopsided, spinning structure. Its house-building gags set the template for the mechanically elaborate stunts of his features.<\/p>","image":"images/buster-keaton/one-week.jpg","credit":{"file":"File:Keaton One Week 1920.jpg","source":"https://commons.wikimedia.org/wiki/File:Keaton_One_Week_1920.jpg","author":"Eddie Cline, Buster Keaton","license":"Public domain","license_url":null}},{"id":"sherlock-jr","title":"Sherlock Jr.","year":"1924","medium":"Silent film, black-and-white, 35mm, about 45 minutes","location":"Buster Keaton Productions, United States","description":"<p>A film projectionist falls asleep and dreams himself into the movie he is screening, only to be thrown between rapidly changing film scenes, streets, cliffs, oceans, that shift under his feet with each cut. Achieved with precise in-camera measurements rather than trick editing, its dream sequence is still studied as one of cinema's most technically daring effects shots.<\/p>","image":"images/buster-keaton/sherlock-jr.jpg","credit":{"file":"File:Buster keaton in sherlock jr, 1924.jpg","source":"https://commons.wikimedia.org/wiki/File:Buster_keaton_in_sherlock_jr,_1924.jpg","author":"Buster Keaton; Metro Pictures Corporation","license":"Public domain","license_url":null}},{"id":"the-navigator","title":"The Navigator","year":"1924","medium":"Silent film, black-and-white, 35mm, about 59 minutes","location":"Buster Keaton Productions, United States","description":"<p>Two pampered, helpless passengers find themselves alone aboard a huge ocean liner adrift at sea and must learn, through slapstick trial and error, to feed, navigate and defend themselves. Keaton's biggest commercial success of the 1920s, it turned an entire ocean liner, rented for the production, into a single elaborate comic prop.<\/p>","image":"images/buster-keaton/the-navigator.jpg","credit":{"file":"File:Buster Keaton in The Navigator.jpg","source":"https://commons.wikimedia.org/wiki/File:Buster_Keaton_in_The_Navigator.jpg","author":"Buster Keaton","license":"Public domain","license_url":null}},{"id":"the-general","title":"The General","year":"1926","medium":"Silent film, black-and-white, 35mm, about 75 minutes","location":"Buster Keaton Productions, United States","description":"<p>A Confederate railway engineer chases his stolen locomotive, and the woman he loves, across Civil War battle lines in an action comedy built around full-scale trains rather than models, including a real locomotive plunged off a burning bridge, the most expensive single shot of the silent era. A box-office disappointment on release, it is now widely ranked among the greatest films ever made.<\/p>","image":"images/buster-keaton/the-general.jpg","credit":{"file":"File:The General 18.jpg","source":"https://commons.wikimedia.org/wiki/File:The_General_18.jpg","author":"film screenshot (United Artists)","license":"Public domain","license_url":null}},{"id":"steamboat-bill-jr","title":"Steamboat Bill, Jr.","year":"1928","medium":"Silent film, black-and-white, 35mm, about 71 minutes","location":"Buster Keaton Productions, United States","description":"<p>A college dandy tries to win his riverboat-captain father's respect ahead of a cyclone that levels the town. Its climactic stunt, a two-ton house facade collapsing directly onto Keaton, who survives only because he is standing precisely where an open attic window will fall around him, is still cited as one of the most dangerous shots ever filmed, with almost no margin for error.<\/p>","image":"images/buster-keaton/steamboat-bill-jr.jpg","credit":{"file":"File:Steamboat Bill, Jr. (United Artists, 1928). Pressbook 02.jpg","source":"https://commons.wikimedia.org/wiki/File:Steamboat_Bill,_Jr._(United_Artists,_1928)._Pressbook_02.jpg","author":"United Artists","license":"Public domain","license_url":null}}]},{"slug":"sergei-eisenstein","name":"Sergei Eisenstein","lifespan":"1898–1948","born":1898,"died":1948,"year_label":"1898","region":"Europe","country":"Soviet Union (born in Latvia)","movements":["Soviet montage theory"],"discipline":["Film"],"summary":"The Soviet director and theorist who turned film editing itself into an argument, most famously in the Odessa Steps sequence of Battleship Potemkin.","sections":[{"title":"Overview","html":"<p>Sergei Eisenstein was the leading figure of Soviet montage cinema and one of the most influential film theorists of the twentieth century, arguing that the essential creative act in filmmaking was not the individual shot but the collision between shots. His films used editing rhythm, crowds rather than individual heroes, and startling juxtapositions to build political and emotional meaning directly into the structure of a sequence, most famously in the Odessa Steps massacre in <em>Battleship Potemkin<\/em>, still one of the most analysed passages in cinema.<\/p>"},{"title":"Life","html":"<p>Eisenstein was born in Riga, then part of the Russian Empire, in 1898, the son of a prosperous civil engineer, and initially trained in engineering and architecture himself. The Russian Revolution and Civil War redirected him into theatre, working on agitprop productions for the Red Army before joining Vsevolod Meyerhold's experimental Proletkult Theatre in Moscow. He moved into film in the early 1920s, and his second feature, <em>Battleship Potemkin<\/em> (1925), made for the twentieth anniversary of the 1905 Revolution, brought him international fame. Invited to Hollywood and then Mexico in the early 1930s, he found both his American studio project and his ambitious independent Mexican film, left unfinished, blocked by financial and political pressures, and he returned to a Soviet Union increasingly hostile to his experimental methods; his 1937 film <em>Bezhin Meadow<\/em> was suppressed and its negative destroyed. He regained official favour with <em>Alexander Nevsky<\/em> (1938) and spent his final years on the two-part <em>Ivan the Terrible<\/em>, whose second part Stalin personally banned. Eisenstein died of a heart attack in Moscow in 1948, shortly after finishing that second part.<\/p>"},{"title":"Style & Technique","html":"<p>Eisenstein theorised montage not as neutral continuity editing but as a form of argument: cutting between shots, he held, could generate ideas that existed in neither image alone, a method he called intellectual montage, most bluntly demonstrated in <em>Strike<\/em>'s intercutting of a massacre with footage of cattle being slaughtered. He cast largely non-professional actors chosen for physical \"type\" rather than performance skill in his silent films, and treated crowds, rather than individual protagonists, as his true subject. By <em>Alexander Nevsky<\/em> and <em>Ivan the Terrible<\/em>, working now with sound and often with the composer Sergei Prokofiev, he extended the same rhythmic, conceptual editing principles to music, choreographed mass combat, and starkly stylised performance.<\/p>"},{"title":"Legacy","html":"<p>Eisenstein's theoretical writings, collected in books such as <em>Film Form<\/em> and <em>The Film Sense<\/em>, became foundational texts of film studies worldwide, and the Odessa Steps sequence has been directly quoted or parodied by filmmakers from Brian De Palma to countless others. Despite, and partly because of, his repeated conflicts with Soviet cultural authorities, he is generally regarded as one of the most important directors and film theorists in the medium's history, and <em>Battleship Potemkin<\/em> remains a fixture of nearly every list of the greatest films ever made.<\/p>"}],"cover":"battleship-potemkin","wikipedia":"https://en.wikipedia.org/wiki/Sergei_Eisenstein","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/sergei-eisenstein.md","works":[{"id":"strike","title":"Strike","year":"1925","medium":"Silent film, black-and-white, 35mm, about 82 minutes","location":"Goskino, Soviet Union","description":"<p>Eisenstein's first feature, a dramatisation of a factory strike brutally crushed by police and company spies in Tsarist Russia, made with a cast largely of non-professional workers chosen for their faces and bearing rather than acting experience. Its climactic massacre, intercut with shots of cattle being slaughtered, is an early, blunt demonstration of his theory that colliding images could generate meaning neither contained alone.<\/p>","image":"images/sergei-eisenstein/strike.jpg","credit":{"file":"File:Stachka.jpg","source":"https://commons.wikimedia.org/wiki/File:Stachka.jpg","author":"Sergueï Eisenstein","license":"Public domain","license_url":null}},{"id":"battleship-potemkin","title":"Battleship Potemkin","year":"1925","medium":"Silent film, black-and-white, 35mm, about 75 minutes","location":"Goskino, Soviet Union","description":"<p>Made to mark the twentieth anniversary of the failed 1905 Revolution, dramatising a real mutiny aboard a Black Sea battleship. Its centrepiece, the Odessa Steps sequence, in which Tsarist soldiers massacre civilians on a monumental staircase, a runaway pram bouncing down the steps among them, is among the most studied, quoted and parodied passages in film history.<\/p>","image":"images/sergei-eisenstein/battleship-potemkin.jpg","credit":{"file":"File:Potemkin-still1.jpg","source":"https://commons.wikimedia.org/wiki/File:Potemkin-still1.jpg","author":"Sergei Eisenstein","license":"Public domain","license_url":null}},{"id":"october","title":"October (Ten Days That Shook the World)","year":"1927–1928","medium":"Silent film, black-and-white, 35mm, about 95 minutes","location":"Sovkino, Soviet Union","description":"<p>Commissioned to mark the tenth anniversary of the October Revolution, reconstructing the storming of the Winter Palace with thousands of extras, many of whom had taken part in the actual events a decade earlier. Eisenstein used the film to push \"intellectual montage\" furthest, cutting to unrelated images, a mechanical peacock, religious icons, purely for ironic or conceptual effect.<\/p>","image":"images/sergei-eisenstein/october.jpg","credit":{"file":"File:Eisenstein Zimnii.jpg","source":"https://commons.wikimedia.org/wiki/File:Eisenstein_Zimnii.jpg","author":"Sergei Eisenstein","license":"Public domain","license_url":null}},{"id":"alexander-nevsky","title":"Alexander Nevsky","year":"1938","medium":"Sound film, black-and-white, 35mm, about 112 minutes","location":"Mosfilm, Soviet Union","description":"<p>Eisenstein's return to official favour after years of suppressed and abandoned projects, a patriotic historical epic about the 13th-century prince who defeated invading Teutonic knights on a frozen lake, released as tensions with Nazi Germany were rising. Its \"Battle on the Ice\" sequence, scored by Sergei Prokofiev, choreographs mass combat with the same rhythmic montage Eisenstein had developed for crowds in his silent films.<\/p>","image":"images/sergei-eisenstein/alexander-nevsky.jpg","credit":{"file":"File:Nevski7.jpg","source":"https://commons.wikimedia.org/wiki/File:Nevski7.jpg","author":"Sergey Eisenstein (director)","license":"Public domain","license_url":null}},{"id":"ivan-the-terrible","title":"Ivan the Terrible","year":"1944–1958","medium":"Sound film, black-and-white and colour, 35mm, two completed parts","location":"Mosfilm, Soviet Union","description":"<p>A stylised, operatic two-part biography of the 16th-century tsar, shot with sharply angled lighting and stark, mask-like performances closer to Kabuki theatre than naturalistic acting. Part I won Eisenstein a Stalin Prize, but Stalin personally banned Part II for what he read as a veiled critique of his own purges; it was not released until 1958, a decade after Eisenstein's death, and a planned Part III was never completed.<\/p>","image":"images/sergei-eisenstein/ivan-the-terrible.jpg","credit":{"file":"File:Ivan Grozny Cherkasov and Zharov by Moskvin.jpg","source":"https://commons.wikimedia.org/wiki/File:Ivan_Grozny_Cherkasov_and_Zharov_by_Moskvin.jpg","author":"Главархив Москвы","license":"CC BY 4.0","license_url":"https://creativecommons.org/licenses/by/4.0"}}]},{"slug":"amrita-sher-gil","name":"Amrita Sher-Gil","lifespan":"1913–1941","born":1913,"died":1941,"year_label":"1913","region":"South Asia","country":"India (born in Hungary)","movements":["Indian modernism"],"discipline":["Painting"],"summary":"Hungarian-Indian painter and pioneer of modern Indian art, who fused European modernism with Indian tradition in a career of barely a decade.","sections":[{"title":"Overview","html":"<p>Amrita Sher-Gil is often called India's first great modern woman artist. Trained in Paris, she returned to India determined to paint the country and its people, especially the women whose lives she saw as marked by silence and patience. She combined the lessons of Gauguin, Cézanne and the Post-Impressionists with the ancient murals of Ajanta and the miniature painting of the Mughal and Rajput courts. She died at just 28, but her small body of work had a lasting impact. The Government of India has declared her paintings National Art Treasures.<\/p>"},{"title":"Life","html":"<p>Amrita Sher-Gil was born in Budapest on 30 January 1913. Her father, Umrao Singh Sher-Gil Majithia, was a Sikh aristocrat and scholar of Sanskrit and Persian. Her mother, Marie Antoinette Gottesmann, was a Hungarian-Jewish opera singer. The family moved to India in 1921 and settled in Shimla, where Amrita began to paint as a child.<\/p>\n<p>In 1929 she went to Paris to study at the Académie de la Grande Chaumière and then the École des Beaux-Arts. She quickly won recognition. Her painting <em>Young Girls<\/em> (1932) led to her election in 1933 as an associate of the Grand Salon in Paris, its youngest member and the only Asian. Yet she felt drawn to India, writing that Europe belonged to Picasso, Matisse and Braque, while India belonged only to her.<\/p>\n<p>She returned to India in 1934. In 1937 she travelled through South India, where the Buddhist murals at Ajanta and the frescoes of Kerala transformed her style. In 1938 she married her Hungarian cousin, Victor Egan, a doctor. After a year in Hungary they settled at Saraya in Uttar Pradesh and moved to Lahore in 1941. Days before the opening of her first major solo show there, she fell seriously ill. She died on 5 December 1941, aged 28.<\/p>"},{"title":"Style & Technique","html":"<p>Sher-Gil's Paris work is European in manner, with confident self-portraits, portraits and nudes influenced by Post-Impressionism. In India she simplified her forms into large, solid, monumental figures and flat planes of rich, warm colour: ochres, reds, deep greens and browns. Her figures are often still and introspective.<\/p>\n<p>After 1937 she absorbed the flowing line and graceful groupings of the Ajanta murals, and later the decorative patterns, flat perspective and small scale of Mughal and Pahari miniatures. She painted the rural poor and women's domestic lives with dignity and empathy rather than exotic romanticism.<\/p>"},{"title":"Legacy","html":"<p>Sher-Gil became a symbol of modern Indian art and of the independent woman artist. Most of her work is held by the National Gallery of Modern Art in New Delhi, and some hangs in the Lahore Museum. In 1976 the Indian government declared her paintings National Art Treasures, which restricts their export. Her work has set auction records, and her life has inspired novels, plays and films. Amrita Shergil Marg, a road in New Delhi, is named after her.<\/p>"}],"cover":"three-girls","wikipedia":"https://en.wikipedia.org/wiki/Amrita_Sher-Gil","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/amrita-sher-gil.md","works":[{"id":"self-portrait-1930","title":"Self-Portrait (Self-Portrait 7)","year":"1930","medium":"Oil on canvas","location":"National Gallery of Modern Art, New Delhi","description":"<p>Painted in Paris when she was 17, one of some 19 self-portraits she made in Europe. She leans toward the viewer, hair loose and shoulders bare, confident and playful. The painting shows how quickly she absorbed the lessons of Post-Impressionism and the European tradition of self-portraiture.<\/p>","image":"images/amrita-sher-gil/self-portrait-1930.jpg","credit":{"file":"File:Amrita Sher-Gil Self-portrait.jpg","source":"https://commons.wikimedia.org/wiki/File:Amrita_Sher-Gil_Self-portrait.jpg","author":"Amrita Sher-Gil","license":"Public domain","license_url":null}},{"id":"three-girls","title":"Three Girls (Group of Young Girls)","year":"1935","medium":"Oil on canvas","location":"National Gallery of Modern Art, New Delhi","description":"<p>Three young Indian women sit close together, silent and withdrawn, their faces sombre and their clothes glowing in deep reds, greens and ochres. Painted soon after her return to India, it expresses the waiting and melancholy she saw in the lives of Indian women. It won the gold medal of the Bombay Art Society in 1937.<\/p>","image":"images/amrita-sher-gil/three-girls.jpg","credit":{"file":"File:Amrita Sher-Gil Group of Three Girls.jpg","source":"https://commons.wikimedia.org/wiki/File:Amrita_Sher-Gil_Group_of_Three_Girls.jpg","author":"Amrita Sher-Gil","license":"Public domain","license_url":null}},{"id":"brides-toilet","title":"Bride's Toilet","year":"1937","medium":"Oil on canvas, 144.5 × 86 cm","location":"National Gallery of Modern Art, New Delhi","description":"<p>Women prepare a young bride for her wedding: one combs her hair, another brings a tray, a child sits nearby. The bride's expression is quiet and uncertain. Part of her \"South Indian trilogy\", painted after her visit to the Ajanta caves, it combines the flat colour and flowing lines of ancient Indian murals with a modern, psychological intensity.<\/p>","image":"images/amrita-sher-gil/brides-toilet.jpg","credit":{"file":"File:Amrita Sger-Gil Bride's Toilet.jpg","source":"https://commons.wikimedia.org/wiki/File:Amrita_Sger-Gil_Bride%27s_Toilet.jpg","author":"Amrita Sher-Gil","license":"Public domain","license_url":null}},{"id":"brahmacharis","title":"Brahmacharis","year":"1937","medium":"Oil on canvas, 144.5 × 86.5 cm","location":"National Gallery of Modern Art, New Delhi","description":"<p>A group of young Brahmin students, bare-chested with sacred threads, sit on the ground in solemn contemplation. The dark skin tones set against white cloth and the monumental, simplified figures show the influence of the Ajanta frescoes. It is another painting from the South Indian trilogy.<\/p>","image":"images/amrita-sher-gil/brahmacharis.jpg","credit":{"file":"File:Brahmacharis 1937.jpg","source":"https://commons.wikimedia.org/wiki/File:Brahmacharis_1937.jpg","author":"Amrita Sher-Gil","license":"Public domain","license_url":null}},{"id":"village-scene","title":"Village Scene","year":"1938","medium":"Oil on canvas","location":"Private collection","description":"<p>Women sit talking beside a long, whitewashed house with red-barred windows, while a lone figure wrapped in a yellow shawl stands in the dusky courtyard near a ladder. The flat, glowing earth colours and still, simplified figures recall the Indian miniature painting that Sher-Gil studied closely after 1937. When it came up for auction in 2006, it sold for $1.6 million, then one of the highest prices ever paid for an Indian painting.<\/p>","image":"images/amrita-sher-gil/village-scene.jpg","credit":{"file":"File:Amrita Sher-Gil Village Scene 1938 Simla.jpg","source":"https://commons.wikimedia.org/wiki/File:Amrita_Sher-Gil_Village_Scene_1938_Simla.jpg","author":"Amrita Sher-Gil","license":"Public domain","license_url":null}},{"id":"haldi-grinders","title":"Haldi Grinders","year":"1940","medium":"Oil on canvas, 74.7 × 100 cm","location":"National Gallery of Modern Art, New Delhi","description":"<p>Women in red and orange grind turmeric (<em>haldi<\/em>) under the shade of trees in a village courtyard. Painted at Saraya in Uttar Pradesh, where she lived in her last years, it has the decorative patterning and bright, flat colour of Indian miniatures, applied to the everyday labour of rural women.<\/p>","image":"images/amrita-sher-gil/haldi-grinders.jpg","credit":{"file":"File:Haldi Grinders 1940.jpg","source":"https://commons.wikimedia.org/wiki/File:Haldi_Grinders_1940.jpg","author":"Amrita Sher-Gil","license":"Public domain","license_url":null}}]}],"regions":["Europe","West & Central Asia","South Asia","East Asia","Americas"],"disciplines":["Painting","Sculpture","Architecture","Design","Film","Literature"],"repo":"https://github.com/groot99-droid/Art-Talk"};
const REGION_VAR = { "Europe": "--europe", "West & Central Asia": "--west-asia", "Africa": "--africa", "South Asia": "--south-asia", "East Asia": "--east-asia", "Southeast Asia": "--se-asia", "Oceania": "--oceania", "Americas": "--americas" };
const yearLabel = y => y < 1 ? `${-y} BCE` : String(y);
const centuryOf = y => y < 1 ? -(Math.floor((-y - 1) / 100) + 1) * 100 : Math.floor(y / 100) * 100;
const centuryLabel = c => c < 0 ? `${-c}s BCE` : `${c}s`;
const listJoin = xs => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = r => `var(${REGION_VAR[r] || "--muted"})`;
const bySlug = Object.fromEntries(DATA.artists.map(a => [a.slug, a]));
const state = { region: "All", discipline: "All", q: "" };

/* Theme */
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("art-talk-theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("art-talk-theme", next); } catch (e) {}
  });
})();

/* Header */
const nWorks = DATA.artists.reduce((n, a) => n + a.works.length, 0);
const first = Math.min(...DATA.artists.map(a => a.born));
const last = Math.max(...DATA.artists.map(a => a.died));
$("#lede").textContent = `${DATA.artists.length} artists from ${DATA.regions.length} regions of the world across ${DATA.disciplines.length} disciplines — ${listJoin(DATA.disciplines.map(d => d.toLowerCase()))} — ${yearLabel(first)}–${yearLabel(last)}, with ${nWorks} key works. Choose an artist to read their story and see their work.`;
$("#footer").innerHTML = `Text written for Art-Talk. Images from <a href="https://commons.wikimedia.org/">Wikimedia Commons</a>, public domain or under the free license given with each work. Source and Markdown files: <a href="${esc(DATA.repo)}">${esc(DATA.repo.replace("https://", ""))}</a>.`;

/* Filters */
function chipCount(key, v) {
  if (v === "All") return DATA.artists.length;
  return DATA.artists.filter(a => key === "region" ? a.region === v : a.discipline.includes(v)).length;
}
function renderChipRow(sel, key, values, colored) {
  const opts = ["All", ...values];
  $(sel).innerHTML = opts.map(v => {
    const n = chipCount(key, v);
    const style = colored ? ` style="--c:${color(v)}"` : "";
    const dot = colored && v !== "All" ? '<span class="dot"></span>' : "";
    return `<button class="chip" type="button" data-${key}="${esc(v)}" aria-pressed="${state[key] === v}"${style}>
      ${dot}${esc(v)} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
}
function renderChips() {
  renderChipRow("#chips", "region", DATA.regions, true);
  renderChipRow("#chips2", "discipline", DATA.disciplines, false);
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-region]");
  if (!b) return;
  state.region = b.dataset.region;
  renderChips(); renderTimeline();
});
$("#chips2").addEventListener("click", e => {
  const b = e.target.closest("[data-discipline]");
  if (!b) return;
  state.discipline = b.dataset.discipline;
  renderChips(); renderTimeline();
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); renderTimeline(); });

function matches(a) {
  if (state.region !== "All" && a.region !== state.region) return false;
  if (state.discipline !== "All" && !a.discipline.includes(state.discipline)) return false;
  if (!state.q) return true;
  const hay = [a.name, a.country, a.movements.join(" "), ...a.works.map(w => w.title)].join(" ").toLowerCase();
  return hay.includes(state.q);
}

/* Timeline */
function renderTimeline() {
  const list = DATA.artists.filter(matches);
  $("#count").textContent = list.length === DATA.artists.length ? "" : `Showing ${list.length} of ${DATA.artists.length} artists`;
  if (!list.length) { $("#timeline").innerHTML = `<p class="empty">No artists match that search.</p>`; return; }
  let html = "", century = null;
  for (const a of list) {
    const c = centuryOf(a.born);
    if (c !== century) {
      if (century !== null) html += "</section>";
      century = c;
      html += `<section class="century"><h2>${centuryLabel(c)}</h2>`;
    }
    const cover = a.works.find(w => w.id === a.cover) || a.works[0];
    html += `<article class="entry" style="--c:${color(a.region)}">
      <span class="year">${esc(a.year_label)}</span>
      <button class="card" type="button" data-slug="${esc(a.slug)}" aria-label="${esc(a.name)}, ${esc(a.lifespan)}">
        <div class="cover"><img src="${esc(cover.image)}" alt="" loading="lazy"></div>
        <div class="body">
          <h3>${esc(a.name)}</h3>
          <div class="meta">${esc(a.lifespan)} · <span class="region">${esc(a.country)}</span> · ${esc(a.movements.join(", "))}</div>
          <p class="summary">${a.summary}</p>
          <div class="thumbs">${a.works.map(w => `<img src="${esc(w.image)}" alt="" loading="lazy">`).join("")}</div>
        </div>
      </button>
    </article>`;
  }
  html += "</section>";
  $("#timeline").innerHTML = html;
}
$("#timeline").addEventListener("click", e => {
  const card = e.target.closest("[data-slug]");
  if (card) location.hash = card.dataset.slug;
});

/* Detail panel */
const panel = $("#panel");
function openArtist(slug) {
  const a = bySlug[slug];
  if (!a) return;
