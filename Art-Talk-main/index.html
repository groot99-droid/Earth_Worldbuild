e pigment. Thousands of impressions were made, and it has become perhaps the most famous Japanese artwork in the world.<\/p>","image":"images/hokusai/great-wave.jpg","credit":{"file":"File:Tsunami by hokusai 19th century.jpg","source":"https://commons.wikimedia.org/wiki/File:Tsunami_by_hokusai_19th_century.jpg","author":"Katsushika Hokusai","license":"Public domain","license_url":null}},{"id":"fine-wind-clear-morning","title":"Fine Wind, Clear Morning (\"Red Fuji\")","year":"c. 1831","medium":"Woodblock print, ink and colour on paper, 25.7 × 38 cm","location":"Impressions in many collections (e.g. Metropolitan Museum of Art)","description":"<p>Mount Fuji, turned red by early morning light in late summer, rises against a blue sky filled with rows of mackerel clouds. Almost nothing else is shown: a few trees at its base. The utter simplicity makes it one of the boldest images of the series and an icon of the sacred mountain.<\/p>","image":"images/hokusai/fine-wind-clear-morning.jpg","credit":{"file":"File:Katsushika Hokusai - Fine Wind, Clear Morning (Gaifū kaisei) - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Katsushika_Hokusai_-_Fine_Wind,_Clear_Morning_(Gaif%C5%AB_kaisei)_-_Google_Art_Project.jpg","author":"Katsushika Hokusai","license":"Public domain","license_url":null}},{"id":"thunderstorm-beneath-the-summit","title":"Thunderstorm Beneath the Summit","year":"c. 1831","medium":"Woodblock print, ink and colour on paper","location":"Impressions in many collections","description":"<p>The companion to <em>Red Fuji<\/em>. The mountain's peak rises serenely into clear sky, while far below on its dark slopes a zigzag of lightning flashes through the storm. The contrast between the calm summit and the violent weather beneath suggests the mountain's permanence above the storms of the world.<\/p>","image":"images/hokusai/thunderstorm-beneath-the-summit.jpg","credit":{"file":"File:Katsushika Hokusai, tempesta sotto la vetta, dalla serie delle 36 vedute del monte fuji, 1831 ca.jpg","source":"https://commons.wikimedia.org/wiki/File:Katsushika_Hokusai,_tempesta_sotto_la_vetta,_dalla_serie_delle_36_vedute_del_monte_fuji,_1831_ca.jpg","author":"Sailko","license":"CC BY 3.0","license_url":"https://creativecommons.org/licenses/by/3.0"}},{"id":"ejiri-in-suruga","title":"Ejiri in Suruga Province","year":"c. 1832","medium":"Woodblock print, ink and colour on paper","location":"Impressions in many collections (e.g. Metropolitan Museum of Art)","description":"<p>A sudden gust sweeps across a marshy road. Travellers bend double and clutch their hats, and a stream of papers flies from a woman's kimono into the sky. Fuji is reduced to a simple white outline in the background. Hokusai captures an invisible force, wind, through its effects. Photographer Jeff Wall restaged the scene in 1993.<\/p>","image":"images/hokusai/ejiri-in-suruga.jpg","credit":{"file":"File:冨嶽三十六景 駿州江尻-Ejiri in Suruga Province (Sunshū Ejiri), from the series Thirty-six Views of Mount Fuji (Fugaku sanjūrokkei) MET DP141030.jpg","source":"https://commons.wikimedia.org/wiki/File:%E5%86%A8%E5%B6%BD%E4%B8%89%E5%8D%81%E5%85%AD%E6%99%AF_%E9%A7%BF%E5%B7%9E%E6%B1%9F%E5%B0%BB-Ejiri_in_Suruga_Province_(Sunsh%C5%AB_Ejiri),_from_the_series_Thirty-six_Views_of_Mount_Fuji_(Fugaku_sanj%C5%ABrokkei)_MET_DP141030.jpg","author":"Katsushika Hokusai","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"kirifuri-waterfall","title":"Kirifuri Waterfall at Kurokami Mountain in Shimotsuke","year":"c. 1832","medium":"Woodblock print, ink and colour on paper","location":"Impressions in many collections (e.g. Metropolitan Museum of Art)","description":"<p>From the series <em>A Tour of the Waterfalls of the Provinces<\/em>. The falls pour down the rock face in branching, finger-like streams of blue and white, while tiny pilgrims gaze up in wonder. Hokusai treats falling water as a living, almost animal form. The series shows his lifelong fascination with water in every state.<\/p>","image":"images/hokusai/kirifuri-waterfall.jpg","credit":{"file":"File:Kirifuri Waterfall at Kurokami Mountain in Shimotsuke MET DP141256.jpg","source":"https://commons.wikimedia.org/wiki/File:Kirifuri_Waterfall_at_Kurokami_Mountain_in_Shimotsuke_MET_DP141256.jpg","author":"Katsushika Hokusai","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}}]},{"slug":"turner","name":"J. M. W. Turner","lifespan":"1775–1851","born":1775,"died":1851,"year_label":"1775","region":"Europe","country":"United Kingdom","movements":["Romanticism"],"discipline":["Painting"],"summary":"The \"painter of light\", whose storms, sunsets and steam turned landscape into swirling visions of colour and atmosphere.","sections":[{"title":"Overview","html":"<p>Joseph Mallord William Turner was the greatest British landscape painter and one of the boldest colourists in European art. Beginning as a precise topographical watercolourist, he grew ever more daring. His late paintings dissolve ships, trains and cities into vortices of light, mist and weather that baffled critics but look strikingly modern today. He left most of his work to the British nation, and Britain's leading contemporary art award, the Turner Prize, is named after him.<\/p>"},{"title":"Life","html":"<p>Turner was born in Covent Garden, London, in April 1775, the son of a barber and wigmaker. His mother suffered from mental illness and was committed to an asylum. At 14 he entered the Royal Academy Schools, and at 15 he exhibited his first watercolour at the Academy. His father proudly displayed his son's drawings in the barbershop window.<\/p>\n<p>Turner rose fast. He was elected a full Royal Academician in 1802, at just 26, and later became the Academy's Professor of Perspective. He travelled tirelessly, sketching in Britain, the Alps, France, Germany and Italy, especially Venice, and filled hundreds of sketchbooks. He was famous for arriving on \"varnishing days\" before exhibitions and transforming a barely begun canvas on the gallery wall.<\/p>\n<p>He never married, though he had two daughters with Sarah Danby. In later life he lived secretly in Chelsea with his companion Sophia Booth, under the name \"Mr Booth\". The critic John Ruskin championed him in <em>Modern Painters<\/em> (1843) against those who mocked his late style. He died in Chelsea on 19 December 1851 and was buried in St Paul's Cathedral.<\/p>"},{"title":"Style & Technique","html":"<p>Turner's early work followed the classical landscapes of Claude Lorrain and the Dutch marine painters. His study of light led him to brighten his palette, and he often worked over white grounds with thin washes of colour, like a watercolourist working in oil. He scraped, scratched and rubbed his canvases and applied paint thickly with knives.<\/p>\n<p>By the 1830s he was painting natural forces themselves: storms, blizzards, fire, sunlight, steam. Composition became a swirling vortex, and solid objects melted into colour. He was fascinated by the new industrial age and painted steamships and railways alongside Venetian lagoons and Alpine passes.<\/p>"},{"title":"Legacy","html":"<p>Turner left around 300 oil paintings and some 30,000 sketches and watercolours to the nation. The Turner Bequest is held mainly at Tate Britain, whose Clore Gallery opened in 1987 to display it. Monet and Pissarro studied his work in London in 1870–1871. His late paintings are often seen as forerunners of Impressionism and abstract art. The Turner Prize has been awarded annually since 1984, and in 2020 his self-portrait and <em>The Fighting Temeraire<\/em> appeared on the new £20 polymer banknote.<\/p>"}],"cover":"fighting-temeraire","wikipedia":"https://en.wikipedia.org/wiki/J._M._W._Turner","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/turner.md","works":[{"id":"hannibal","title":"Snow Storm: Hannibal and His Army Crossing the Alps","year":"1812","medium":"Oil on canvas, 146 × 237.5 cm","location":"Tate Britain, London","description":"<p>A vast black vortex of storm cloud swirls over Hannibal's army, and his troops are almost lost in the chaos below. Turner is said to have based the sky on a thunderstorm he watched over Yorkshire. Painted as Napoleon's armies marched on Russia, it carries a warning about the fate of empires. Its whirling composition anticipates his later work.<\/p>","image":"images/turner/hannibal.jpg","credit":{"file":"File:Joseph Mallord William Turner 081.jpg","source":"https://commons.wikimedia.org/wiki/File:Joseph_Mallord_William_Turner_081.jpg","author":"J. M. W. Turner","license":"Public domain","license_url":null}},{"id":"burning-of-parliament","title":"The Burning of the Houses of Lords and Commons, 16 October 1834","year":"1834–1835","medium":"Oil on canvas, 92 × 123 cm","location":"Philadelphia Museum of Art","description":"<p>Turner watched the fire that destroyed the old Palace of Westminster from a boat on the Thames, sketching furiously. In this version, flames and smoke pour upward into the night sky and reflect in the river, while crowds watch from Westminster Bridge. Fire and water, light and darkness, became his great subjects.<\/p>","image":"images/turner/burning-of-parliament.jpg","credit":{"file":"File:Joseph Mallord William Turner, English - The Burning of the Houses of Lords and Commons, October 16, 1834 - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Joseph_Mallord_William_Turner,_English_-_The_Burning_of_the_Houses_of_Lords_and_Commons,_October_16,_1834_-_Google_Art_Project.jpg","author":"J. M. W. Turner","license":"Public domain","license_url":null}},{"id":"fighting-temeraire","title":"The Fighting Temeraire","year":"1839","medium":"Oil on canvas, 90.7 × 121.6 cm","location":"National Gallery, London","description":"<p>The <em>Temeraire<\/em>, a veteran warship from the Battle of Trafalgar, is towed up the Thames by a small, smoke-belching steam tug to be broken up for scrap. The pale, ghostly sailing ship glides against a blazing sunset. It is an elegy for the age of sail giving way to steam. Turner called it his \"darling\" and refused to sell it. In 2005 it was voted Britain's greatest painting, and it appears on the Bank of England's £20 note.<\/p>","image":"images/turner/fighting-temeraire.jpg","credit":{"file":"File:The Fighting Temeraire, JMW Turner, National Gallery.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Fighting_Temeraire,_JMW_Turner,_National_Gallery.jpg","author":"J. M. W. Turner","license":"Public domain","license_url":null}},{"id":"slave-ship","title":"The Slave Ship (Slavers Throwing Overboard the Dead and Dying, Typhoon Coming On)","year":"1840","medium":"Oil on canvas, 90.8 × 122.6 cm","location":"Museum of Fine Arts, Boston","description":"<p>A ship sails into a blood-red storm while shackled bodies sink into the churning sea, attacked by fish and gulls. Turner was inspired by the <em>Zong<\/em> massacre of 1781, when enslaved Africans were thrown overboard so the owners could claim insurance. He showed it during the 1840 campaign to end slavery worldwide. John Ruskin owned it and called it the noblest sea Turner ever painted.<\/p>","image":"images/turner/slave-ship.jpg","credit":{"file":"File:Slave-ship.jpg","source":"https://commons.wikimedia.org/wiki/File:Slave-ship.jpg","author":"J. M. W. Turner","license":"Public domain","license_url":null}},{"id":"snow-storm-steam-boat","title":"Snow Storm – Steam-Boat off a Harbour's Mouth","year":"1842","medium":"Oil on canvas, 91.4 × 121.9 cm","location":"Tate Britain, London","description":"<p>A steamboat is barely visible at the centre of a vortex of snow, spray and smoke. Turner claimed he had himself tied to a ship's mast for four hours during the storm in order to experience it. The story is probably invented, but the painting's dizzying energy seems to make it believable. One critic dismissed it as \"soapsuds and whitewash\".<\/p>","image":"images/turner/snow-storm-steam-boat.jpg","credit":{"file":"File:Joseph Mallord William Turner - Snow Storm - Steam-Boat off a Harbour's Mouth - WGA23178.jpg","source":"https://commons.wikimedia.org/wiki/File:Joseph_Mallord_William_Turner_-_Snow_Storm_-_Steam-Boat_off_a_Harbour%27s_Mouth_-_WGA23178.jpg","author":"J. M. W. Turner","license":"Public domain","license_url":null}},{"id":"rain-steam-and-speed","title":"Rain, Steam and Speed – The Great Western Railway","year":"1844","medium":"Oil on canvas, 91 × 121.8 cm","location":"National Gallery, London","description":"<p>A steam train charges toward us across Maidenhead Railway Bridge over the Thames, its black funnel emerging from a golden haze of rain and light. A tiny hare races ahead of it on the tracks. It is one of the first great paintings of modern technology, and one of Turner's most daring dissolutions of form into atmosphere.<\/p>","image":"images/turner/rain-steam-and-speed.jpg","credit":{"file":"File:Turner - Rain, Steam and Speed - National Gallery file.jpg","source":"https://commons.wikimedia.org/wiki/File:Turner_-_Rain,_Steam_and_Speed_-_National_Gallery_file.jpg","author":"J. M. W. Turner","license":"Public domain","license_url":null}}]},{"slug":"jane-austen","name":"Jane Austen","lifespan":"1775–1817","born":1775,"died":1817,"year_label":"1775","region":"Europe","country":"England","movements":["Regency literature"],"discipline":["Literature"],"summary":"The English novelist whose six domestic comedies of manners, courtship and money remain among the most widely read novels in the language.","sections":[{"title":"Overview","html":"<p>Jane Austen wrote six completed novels, published anonymously during her lifetime, that turned the narrow social world of the English gentry, courtship, inheritance, class anxiety and the search for a good marriage, into some of the most enduringly popular fiction in English. Her narrow ironic focus and precise control of free indirect narration, letting a story's language slide into a character's own voice without announcing it, influenced the development of the novel as a form well beyond her own century.<\/p>"},{"title":"Life","html":"<p>Austen was born in 1775 in Steventon, Hampshire, the seventh of eight children of a country clergyman, and grew up in a family that encouraged reading, amateur theatre and writing from childhood; her early, often absurdist \"juvenilia\" already show a sharp comic sensibility. She began drafting early versions of what became <em>Sense and Sensibility<\/em> and <em>Pride and Prejudice<\/em> in her twenties, though publication came only later, after her father's death and years of family financial instability had settled the family at Chawton Cottage in Hampshire. <em>Sense and Sensibility<\/em> appeared in 1811, credited only to \"A Lady,\" and four more novels followed over the next six years, each published anonymously, with only close family aware of her authorship. She fell ill, probably with Addison's disease though the exact cause remains debated, and died in 1817 at 41, with her authorship publicly acknowledged only in a biographical notice her brother attached to the posthumous publication of her final two novels.<\/p>"},{"title":"Style & Technique","html":"<p>Austen worked within a deliberately narrow social canvas, mainly the English gentry and their immediate social concerns, courtship, income, inheritance, rather than the broader historical and political events of her turbulent era. Her most distinctive technical achievement is her mastery of free indirect discourse, narrating events in the third person while letting the prose subtly absorb a character's own irony, self-deception or blind spots, so that a reader senses a character's error before the character does. Her irony operates at the level of the sentence as much as the plot, producing comedy that depends on precise, economical language rather than incident.<\/p>"},{"title":"Legacy","html":"<p>Austen's six novels have remained continuously in print since her death and are now among the most widely read and adapted works in English literature, generating a large and continuing industry of film, television and stage adaptation. Her technical innovations in narrative point of view influenced the development of the novel through the nineteenth and twentieth centuries, and she is now routinely placed among the greatest novelists in the English language, a reputation that grew steadily after her death rather than during the modest, anonymous success of her own lifetime.<\/p>"}],"cover":"pride-and-prejudice","wikipedia":"https://en.wikipedia.org/wiki/Jane_Austen","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/jane-austen.md","works":[{"id":"sense-and-sensibility","title":"Sense and Sensibility","year":"1811","medium":"Novel, first edition title page","location":"Published by Thomas Egerton, London, England","description":"<p>Austen's first published novel, issued anonymously as \"By a Lady,\" follows two sisters of contrasting temperament, one guided by prudent restraint and one by open emotion, through courtship and financial precarity after their father's death leaves them dependent on relatives.<\/p>","image":"images/jane-austen/sense-and-sensibility.jpg","credit":{"file":"File:SenseAndSensibilityTitlePage.jpg","source":"https://commons.wikimedia.org/wiki/File:SenseAndSensibilityTitlePage.jpg","author":"Jane Austen (1775-1817)","license":"Public domain","license_url":null}},{"id":"pride-and-prejudice","title":"Pride and Prejudice","year":"1813","medium":"Novel, first edition title page","location":"Published by Thomas Egerton, London, England","description":"<p>Austen's best-known novel, following the sharp-witted Elizabeth Bennet and the proud, initially off-putting Mr Darcy as misunderstanding and social pressure over five sisters' marriage prospects slowly give way to mutual respect, still one of the most widely read novels in the English language.<\/p>","image":"images/jane-austen/pride-and-prejudice.jpg","credit":{"file":"File:PrideAndPrejudiceTitlePage.jpg","source":"https://commons.wikimedia.org/wiki/File:PrideAndPrejudiceTitlePage.jpg","author":"Jane Austen (1775-1817)","license":"Public domain","license_url":null}},{"id":"mansfield-park","title":"Mansfield Park","year":"1814","medium":"Novel, first edition title page","location":"Published by Thomas Egerton, London, England","description":"<p>Austen's longest and most morally serious novel, following the quiet, principled Fanny Price as a poor relation raised among wealthy cousins, and touching, more directly than her other novels, on the West Indian slave-plantation wealth underpinning the English gentry households she otherwise portrays with comic detachment.<\/p>","image":"images/jane-austen/mansfield-park.jpg","credit":{"file":"File:MansfieldParkTitlePage.jpg","source":"https://commons.wikimedia.org/wiki/File:MansfieldParkTitlePage.jpg","author":"Jane Austen (1775 - 1817)","license":"Public domain","license_url":null}},{"id":"emma","title":"Emma","year":"1815","medium":"Novel, first edition title page","location":"Published by John Murray, London, England","description":"<p>A comedy of misplaced matchmaking, following the wealthy, well-meaning but overconfident Emma Woodhouse as her attempts to arrange other people's romances repeatedly misfire, widely admired for the tightly controlled irony of its narration, which lets readers see through Emma's misjudgements well before she does.<\/p>","image":"images/jane-austen/emma.jpg","credit":{"file":"File:EmmaTitlePage.jpg","source":"https://commons.wikimedia.org/wiki/File:EmmaTitlePage.jpg","author":"Jane Austen","license":"Public domain","license_url":null}},{"id":"northanger-persuasion","title":"Northanger Abbey and Persuasion","year":"1817","medium":"Novel, first edition title page, published together in four volumes","location":"Published posthumously by John Murray, London, England","description":"<p>Two novels published together the year after Austen's death, with a biographical notice by her brother revealing her authorship publicly for the first time. Northanger Abbey gently satirises Gothic novel conventions, while Persuasion, her last completed work, follows a quieter, more autumnal story of a woman reconsidering a broken engagement years later.<\/p>","image":"images/jane-austen/northanger-persuasion.jpg","credit":{"file":"File:NorthangerPersuasionTitlePage.jpg","source":"https://commons.wikimedia.org/wiki/File:NorthangerPersuasionTitlePage.jpg","author":"Unknown author Unknown author","license":"Public domain","license_url":null}}]},{"slug":"hiroshige","name":"Utagawa Hiroshige","lifespan":"1797–1858","born":1797,"died":1858,"year_label":"1797","region":"East Asia","country":"Japan","movements":["Ukiyo-e"],"discipline":["Painting"],"summary":"The poet of the Japanese landscape print, whose rain, snow, moonlight and travellers on the road inspired Van Gogh and the Impressionists.","sections":[{"title":"Overview","html":"<p>Utagawa Hiroshige was the last great master of the ukiyo-e woodblock print. Where his older rival Hokusai was dramatic and restless, Hiroshige was lyrical and atmospheric. He captured the mood of a place at a particular moment: travellers caught in a downpour, a village under silent snow, cherry blossoms by moonlight. His series <em>The Fifty-three Stations of the Tōkaidō<\/em> and <em>One Hundred Famous Views of Edo<\/em> were enormous commercial successes. In Europe his bold compositions and colours helped spark the craze for Japanese art.<\/p>"},{"title":"Life","html":"<p>Hiroshige was born in Edo (modern Tokyo) in 1797 into a samurai family, the Andō, whose hereditary job was fire warden at Edo Castle. Both his parents died when he was about 12, and he inherited his father's post. Around 1811 he became a pupil of the print designer Utagawa Toyohiro, who gave him the name Hiroshige.<\/p>\n<p>His early work was conventional: actors, beautiful women and warriors. He later handed the fire warden post on to a relative and turned to landscape. The success of Hokusai's <em>Thirty-six Views of Mount Fuji<\/em> had opened a new market. According to tradition, in 1832 he travelled the Tōkaidō, the great highway between Edo and Kyoto, with an official delegation. The prints he published in 1833–1834 made him the most popular landscape artist in Japan.<\/p>\n<p>He went on to produce thousands of designs, including series on the Kisokaidō highway, the provinces of Japan, and birds and flowers. In 1856, aged about 60, he became a Buddhist monk, but he kept working on his last great project, <em>One Hundred Famous Views of Edo<\/em>. He died in Edo on 12 October 1858, probably in a cholera epidemic, leaving a farewell poem about travelling west to see the famous sights of the Western Paradise.<\/p>"},{"title":"Style & Technique","html":"<p>Hiroshige designed his prints; carvers and printers made them. His designs use soft colour gradations (<em>bokashi<\/em>), printed by wiping ink across the block, to suggest dawn, dusk, mist and moonlight. He was a master of weather: rain drawn as fine lines, snow as blank paper, wind shown through bending trees and flying hats.<\/p>\n<p>In his late series <em>One Hundred Famous Views of Edo<\/em> he adopted a vertical format and strikingly modern compositions. A huge object in the foreground, such as a branch, a horse's leg or a lantern, frames a distant view. The effect is close to a photographer's use of depth of field. His deep blue, made with imported Prussian blue, is sometimes called \"Hiroshige blue\".<\/p>"},{"title":"Legacy","html":"<p>Hiroshige's prints poured into Europe after Japan opened to trade, where artists collected them eagerly. Vincent van Gogh painted careful copies of <em>Plum Park in Kameido<\/em> and <em>Sudden Shower<\/em>. Whistler's nocturnes of the Thames and Monet's Japanese bridge at Giverny show his influence, as do the Art Nouveau posters of the 1890s. In Japan his views remain the classic images of old Edo and the Tōkaidō. Frank Lloyd Wright was a major collector and dealer of his prints.<\/p>"}],"cover":"sudden-shower","wikipedia":"https://en.wikipedia.org/wiki/Hiroshige","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/hiroshige.md","works":[{"id":"nihonbashi-morning","title":"Nihonbashi: Morning View (The Fifty-three Stations of the Tōkaidō, No. 1)","year":"1833–1834","medium":"Woodblock print, ink and colour on paper","location":"Impressions in many collections (e.g. Metropolitan Museum of Art)","description":"<p>The first print of the series that made Hiroshige famous. At dawn, a feudal lord's procession marches over Edo's Nihonbashi bridge, the starting point of the Tōkaidō highway, while fish sellers hurry past with their loads. The great wooden gates open like a curtain on the journey ahead.<\/p>","image":"images/hiroshige/nihonbashi-morning.jpg","credit":{"file":"File:東海道五十三次之内 日本橋 朝之景-Stations One- Morning View of Nihonbashi MET DP122174.jpg","source":"https://commons.wikimedia.org/wiki/File:%E6%9D%B1%E6%B5%B7%E9%81%93%E4%BA%94%E5%8D%81%E4%B8%89%E6%AC%A1%E4%B9%8B%E5%86%85_%E6%97%A5%E6%9C%AC%E6%A9%8B_%E6%9C%9D%E4%B9%8B%E6%99%AF-Stations_One-_Morning_View_of_Nihonbashi_MET_DP122174.jpg","author":"Utagawa Hiroshige","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"kanbara-night-snow","title":"Kanbara: Night Snow (The Fifty-three Stations of the Tōkaidō, No. 16)","year":"1833–1834","medium":"Woodblock print, ink and colour on paper","location":"Impressions in many collections (e.g. Museum of Fine Arts, Boston)","description":"<p>Snow blankets a mountain village at night, muffling every sound, as three figures trudge uphill under umbrellas and straw capes. Kanbara, on the warm Pacific coast, rarely sees snow. Hiroshige invented the scene for its poetic mood. The subtle grey gradations of the night sky, printed by wiping the block, show the refinement of Edo printmaking.<\/p>","image":"images/hiroshige/kanbara-night-snow.jpg","credit":{"file":"File:Hiroshige-53-Stations-Hoeido-16-Kanbara-MFA-01.jpg","source":"https://commons.wikimedia.org/wiki/File:Hiroshige-53-Stations-Hoeido-16-Kanbara-MFA-01.jpg","author":"Utagawa Hiroshige","license":"Public domain","license_url":null}},{"id":"shono-driving-rain","title":"Shōno: Driving Rain (The Fifty-three Stations of the Tōkaidō, No. 46)","year":"1833–1834","medium":"Woodblock print, ink and colour on paper","location":"Impressions in many collections (e.g. Edo-Tokyo Museum)","description":"<p>A sudden downpour sweeps across a hillside. Palanquin bearers and travellers run for shelter, bent against the wind, while bamboo groves toss in silhouette. The rain is drawn as fine diagonal lines across the whole sheet. It is one of the most celebrated images of weather in Japanese art.<\/p>","image":"images/hiroshige/shono-driving-rain.jpg","credit":{"file":"File:Hiroshige-53-Stations-Hoeido-46-Shono-Edo-Tokyo-M-01.jpg","source":"https://commons.wikimedia.org/wiki/File:Hiroshige-53-Stations-Hoeido-46-Shono-Edo-Tokyo-M-01.jpg","author":"Utagawa Hiroshige","license":"Public domain","license_url":null}},{"id":"plum-park-kameido","title":"Plum Park in Kameido (One Hundred Famous Views of Edo, No. 30)","year":"1857","medium":"Woodblock print, ink and colour on paper, 36 × 24 cm","location":"Impressions in many collections (e.g. Rijksmuseum, Amsterdam)","description":"<p>A gnarled plum branch, dotted with white blossoms, fills the foreground so closely that it seems to press against our eyes. Visitors admire the orchard beyond, beneath a sky shading from red to white. Vincent van Gogh copied this print in oil in 1887, and its dramatic cropping became a lesson for European modernists.<\/p>","image":"images/hiroshige/plum-park-kameido.jpg","credit":{"file":"File:De pruimenboomgaard te Kameido-Rijksmuseum RP-P-1956-743.jpeg","source":"https://commons.wikimedia.org/wiki/File:De_pruimenboomgaard_te_Kameido-Rijksmuseum_RP-P-1956-743.jpeg","author":"Utagawa; Hiroshige (I) , Utagawa died 1858; Uoya Eikichi Hiroshige (I)","license":"Public domain","license_url":null}},{"id":"sudden-shower","title":"Sudden Shower over Shin-Ōhashi Bridge and Atake (One Hundred Famous Views of Edo, No. 58)","year":"1857","medium":"Woodblock print, ink and colour on paper, 36 × 24 cm","location":"Impressions in many collections (e.g. Brooklyn Museum)","description":"<p>A summer storm breaks over a wooden bridge in Edo. People scurry across under hats and straw mats, and the far bank fades into grey. The rain is printed from two separate blocks, crossing at different angles, to suggest a heavy downpour. Van Gogh painted his own version, <em>Bridge in the Rain<\/em>, in 1887.<\/p>","image":"images/hiroshige/sudden-shower.jpg","credit":{"file":"File:Utagawa Hiroshige - Evening Shower at Atake and the Great Bridge.jpg","source":"https://commons.wikimedia.org/wiki/File:Utagawa_Hiroshige_-_Evening_Shower_at_Atake_and_the_Great_Bridge.jpg","author":"Utagawa Hiroshige","license":"Public domain","license_url":null}},{"id":"fireworks-at-ryogoku","title":"Fireworks at Ryōgoku (One Hundred Famous Views of Edo, No. 98)","year":"1858","medium":"Woodblock print, ink and colour on paper, 36 × 24 cm","location":"Impressions in many collections (e.g. Metropolitan Museum of Art)","description":"<p>A single firework bursts in a shower of sparks over the Sumida River at night, while pleasure boats crowd the dark water below the Ryōgoku bridge. The deep, velvety blues and blacks and the tiny points of light anticipate Whistler's <em>Nocturne in Black and Gold: The Falling Rocket<\/em> (1875).<\/p>","image":"images/hiroshige/fireworks-at-ryogoku.jpg","credit":{"file":"File:名所江戶百景 両国花火-Fireworks at Ryōgoku Bridge, from the series One Hundred Famous Views of Edo MET DP121524.jpg","source":"https://commons.wikimedia.org/wiki/File:%E5%90%8D%E6%89%80%E6%B1%9F%E6%88%B6%E7%99%BE%E6%99%AF_%E4%B8%A1%E5%9B%BD%E8%8A%B1%E7%81%AB-Fireworks_at_Ry%C5%8Dgoku_Bridge,_from_the_series_One_Hundred_Famous_Views_of_Edo_MET_DP121524.jpg","author":"Utagawa Hiroshige","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}}]},{"slug":"leo-tolstoy","name":"Leo Tolstoy","lifespan":"1828–1910","born":1828,"died":1910,"year_label":"1828","region":"Europe","country":"Russian Empire","movements":["Realism"],"discipline":["Literature"],"summary":"The Russian novelist whose sweeping social epics and stark late parables of mortality and conscience made him one of the most influential moral voices of his century.","sections":[{"title":"Overview","html":"<p>Leo Tolstoy is regarded as one of the greatest novelists in world literature, best known for two vast works of Russian realism, <em>War and Peace<\/em> and <em>Anna Karenina<\/em>, that combine intimate personal drama with sweeping historical and philosophical ambition. In the second half of his life a profound religious and moral crisis redirected him toward shorter, starker fiction and nonfiction on faith, mortality and nonviolence that influenced moral and political thinkers, including Mahatma Gandhi, well beyond the literary world.<\/p>"},{"title":"Life","html":"<p>Tolstoy was born in 1828 into an aristocratic family at Yasnaya Polyana, the family estate south of Moscow he would inherit and manage for most of his life. He served briefly as an army officer during the Crimean War, an experience that shaped his unsentimental early writing on combat, before turning fully to literature and estate management. Through the 1860s and 1870s he wrote his two major novels, <em>War and Peace<\/em> and <em>Anna Karenina<\/em>, while also experimenting with peasant education, founding a school for the children on his estate. In the years after <em>Anna Karenina<\/em> he underwent an intense spiritual crisis, described in his memoir <em>A Confession<\/em>, that led him to reject the Russian Orthodox Church, embrace an ascetic, pacifist reading of Christian ethics, and increasingly disown his own earlier fiction as morally frivolous. His last decades were marked by growing international fame as a moral and religious thinker, tension with his wife and the Orthodox Church, and a final, dramatic flight from his estate in old age; he died of pneumonia at a remote railway station in 1910, having collapsed during that journey.<\/p>"},{"title":"Style & Technique","html":"<p>Tolstoy's major novels move fluidly between intimate psychological detail and broad historical and philosophical argument, most famously in <em>War and Peace<\/em>'s long essayistic digressions on the forces that actually drive historical events, which Tolstoy argued lay far beyond the control of any single general or emperor. His prose favours plain, direct description over ornamental style, aiming for what he considered moral and psychological truth rather than literary display. After his religious crisis, his later fiction, <em>The Death of Ivan Ilyich<\/em>, <em>The Kreutzer Sonata<\/em>, <em>Resurrection<\/em>, grew shorter, starker and more didactic, using narrower, more claustrophobic stories to press a single moral question rather than the panoramic social canvas of his earlier novels.<\/p>"},{"title":"Legacy","html":"<p><em>War and Peace<\/em> and <em>Anna Karenina<\/em> are routinely ranked among the greatest novels ever written, and Tolstoy's realist technique influenced the development of the novel worldwide. His later ethical and religious writing, arguing for nonviolent resistance to evil, directly influenced Mahatma Gandhi, who corresponded with Tolstoy near the end of the writer's life, and through Gandhi fed into the broader twentieth-century tradition of nonviolent political resistance. Yasnaya Polyana, his family estate, is preserved as a museum and remains a major literary pilgrimage site in Russia.<\/p>"}],"cover":"war-and-peace","wikipedia":"https://en.wikipedia.org/wiki/Leo_Tolstoy","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/leo-tolstoy.md","works":[{"id":"war-and-peace","title":"War and Peace","year":"1869","medium":"Novel, first edition title page","location":"Published in Moscow, Russian Empire","description":"<p>A sprawling novel following five aristocratic families through the Napoleonic Wars, mixing intimate personal drama with long philosophical digressions on history and free will. Its scale and ambition, several hundred named characters moving across a decade of war and peace, made it an immediate landmark of Russian and world literature.<\/p>","image":"images/leo-tolstoy/war-and-peace.jpg","credit":{"file":"File:Tolstoy - War and Peace - first edition, 1869.jpg","source":"https://commons.wikimedia.org/wiki/File:Tolstoy_-_War_and_Peace_-_first_edition,_1869.jpg","author":"Leo Tolstoy","license":"Public domain","license_url":null}},{"id":"anna-karenina","title":"Anna Karenina","year":"1877","medium":"Novel, first edition title page","location":"Published in Moscow, Russian Empire","description":"<p>A married aristocrat's affair and social ruin, set against a parallel story of a landowner's search for meaning through farming and family life, opens with one of the most quoted lines in fiction: \"All happy families are alike; each unhappy family is unhappy in its own way.\"<\/p>","image":"images/leo-tolstoy/anna-karenina.jpg","credit":{"file":"File:AnnaKareninaTitle.jpg","source":"https://commons.wikimedia.org/wiki/File:AnnaKareninaTitle.jpg","author":"Leo Tolstoy","license":"Public domain","license_url":null}},{"id":"death-of-ivan-ilyich","title":"The Death of Ivan Ilyich","year":"1886","medium":"Novella, first edition title page","location":"Published in Moscow, Russian Empire","description":"<p>A short, unsparing novella following a mid-ranking judge's slow, isolating death from illness, and his dawning realisation that his comfortable, conventional life had been essentially meaningless. Written after Tolstoy's own religious crisis, it is often read as his starkest statement on mortality.<\/p>","image":"images/leo-tolstoy/death-of-ivan-ilyich.jpg","credit":{"file":"File:The Death of Ivan Ilyich.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Death_of_Ivan_Ilyich.jpg","author":"Leo Tolstoy","license":"Public domain","license_url":null}},{"id":"kreutzer-sonata","title":"The Kreutzer Sonata","year":"1889","medium":"Novella, first edition title page","location":"Published in Russian Empire (initially banned by censors)","description":"<p>A jealous husband's confession of murdering his wife over a suspected affair becomes the occasion for a bitter attack on marriage, sexual desire and upper-class hypocrisy. Its unsparing content led Russian censors to ban it outright, and it circulated for a time only in hand-copied and foreign editions.<\/p>","image":"images/leo-tolstoy/kreutzer-sonata.jpg","credit":{"file":"File:Titelseite Tolstoi Kreutzer-Sonate 1890.jpg","source":"https://commons.wikimedia.org/wiki/File:Titelseite_Tolstoi_Kreutzer-Sonate_1890.jpg","author":"Karli22","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"resurrection","title":"Resurrection","year":"1899","medium":"Novel, first edition title page","location":"Published in Russian Empire","description":"<p>Tolstoy's last novel, following an aristocrat who serves on the jury that wrongly convicts a woman he had once seduced and abandoned, and who sets out to seek both her forgiveness and his own moral reform. Its royalties were directed to fund the emigration of the Doukhobors, a persecuted Russian pacifist sect.<\/p>","image":"images/leo-tolstoy/resurrection.jpg","credit":{"file":"File:Resurrection 1899.jpg","source":"https://commons.wikimedia.org/wiki/File:Resurrection_1899.jpg","author":"Vladimir Chertkov","license":"Public domain","license_url":null}}]},{"slug":"christopher-dresser","name":"Christopher Dresser","lifespan":"1834–1904","born":1834,"died":1904,"year_label":"1834","region":"Europe","country":"England","movements":["Aesthetic Movement","Anglo-Japanese design"],"discipline":["Design"],"summary":"A botanist turned industrial designer whose radically geometric silverware and ceramics anticipated 20th-century modernism by decades.","sections":[{"title":"Overview","html":"<p>Christopher Dresser is now regarded as one of the first modern industrial designers, a figure who worked as an independent design consultant across dozens of manufacturers and materials, metalwork, ceramics, glass, textiles, decades before that way of working became standard practice. Trained first as a botanist, he built an entire design theory on the underlying geometric structure of plants rather than their decorative surface, producing objects so stripped of ornament that many look, to modern eyes, startlingly ahead of their time.<\/p>"},{"title":"Life","html":"<p>Dresser was born in Glasgow in 1834 and trained at the Government School of Design in London, where his early ambitions leaned toward botany rather than design; he lectured on botany and, in 1859, received an honorary doctorate from the University of Jena for his research into plant structure. He shifted fully into design in the 1860s, publishing influential theoretical books, <em>The Art of Decorative Design<\/em> (1862) and <em>Principles of Decorative Design<\/em> (1873), that argued ornament should follow the underlying structural logic of natural forms rather than copy their surface appearance. In 1876 and 1877 he travelled to Japan, one of the first Western designers to do so, partly on commission from Tiffany &amp; Co. to report on Japanese art and manufacturing; the trip reshaped his sense of asymmetry, restraint and structural honesty for the rest of his career. He designed prolifically for manufacturers including Minton, Wedgwood, Coalbrookdale, Hukin &amp; Heath and James Dixon &amp; Sons, and served as art director of the Linthorpe Art Pottery, until his death in 1904.<\/p>"},{"title":"Style & Technique","html":"<p>Where William Morris, his contemporary, based ornament on naturalistic copies of plant forms, Dresser worked the opposite way, reducing plants and shells to their underlying geometric structure and building objects from that abstraction rather than from decorative imitation. He embraced industrial materials and mass-production methods, electroplating, moulded earthenware, that many reform-minded designers of his generation rejected, seeing no conflict between good design and the machine. His study of Japanese design reinforced this instinct toward asymmetry, negative space and visible function over applied decoration, producing angular teapots, kettles and vases that read as strikingly modern even now.<\/p>"},{"title":"Legacy","html":"<p>Long overshadowed in design history by William Morris and the more overtly craft-based wing of the Aesthetic Movement, Dresser has been substantially rediscovered since the late twentieth century, and major retrospectives have presented his most radical metalwork as a direct ancestor of modernist industrial design. His insistence that a mass-manufactured object could be both functional and beautiful, without applied ornament to justify it, anticipated design principles usually credited to the Bauhaus a generation later.<\/p>"}],"cover":"dresser-teapot","wikipedia":"https://en.wikipedia.org/wiki/Christopher_Dresser","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/christopher-dresser.md","works":[{"id":"dresser-teapot","title":"Electroplated teapot","year":"1879","medium":"Silver-plated metal and ebony","location":"Manufactured by James Dixon & Sons, Sheffield, England","description":"<p>A geometric, faceted teapot so stripped of ornament that it is still routinely mistaken for a much later, mid-20th-century object. Its angular silhouette and ebony insulated handle put function ahead of any decorative flourish, decades before \"form follows function\" became a slogan of modernist design.<\/p>","image":"images/christopher-dresser/dresser-teapot.jpg","credit":{"file":"File:Christopher Dresser - Teapot - 1879.jpg","source":"https://commons.wikimedia.org/wiki/File:Christopher_Dresser_-_Teapot_-_1879.jpg","author":null,"license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}},{"id":"dresser-toast-rack","title":"Toast rack","year":"c. 1880","medium":"Silver","location":"Manufactured by Tiffany & Co., New York","description":"<p>A rack of slotted silver fins holding toast upright, reduced to the simplest structural shape that will do the job, with no applied ornament at all. Dresser designed for manufacturers on both sides of the Atlantic, and pieces like this show how thoroughly his geometric vocabulary could travel across markets and materials.<\/p>","image":"images/christopher-dresser/dresser-toast-rack.jpg","credit":{"file":"File:Toast Rack by Christopher Dresser (1834-1904), made by Tiffany & Co., New York, c. 1880, silver - Brooklyn Museum - Brooklyn, NY - DSC08876.JPG","source":"https://commons.wikimedia.org/wiki/File:Toast_Rack_by_Christopher_Dresser_(1834-1904),_made_by_Tiffany_%26_Co.,_New_York,_c._1880,_silver_-_Brooklyn_Museum_-_Brooklyn,_NY_-_DSC08876.JPG","author":"Daderot","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"dresser-kettle","title":"Electroplate kettle and stand","year":"1878","medium":"Electroplated metal and ebony","location":"Manufactured by Hukin & Heath, Birmingham, England","description":"<p>A kettle on a tripod stand designed for mass production by electroplating, one of the first designs Dresser registered after Japanese design principles, simplicity, asymmetry, structural honesty, reshaped his sense of ornament following his 1876–77 study trip to Japan.<\/p>","image":"images/christopher-dresser/dresser-kettle.jpg","credit":{"file":"File:Electroplate kettle and stand with burner, designed by Christopher Dresser, made by Hukin & Heath, design registered May 6, 1878 - British Museum - DSC00162.jpg","source":"https://commons.wikimedia.org/wiki/File:Electroplate_kettle_and_stand_with_burner,_designed_by_Christopher_Dresser,_made_by_Hukin_%26_Heath,_design_registered_May_6,_1878_-_British_Museum_-_DSC00162.jpg","author":"Daderot","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"dresser-decanter","title":"Decanter","year":"c. 1881","medium":"Glass, silver and ebonised wood","location":"Manufactured by Hukin & Heath, Birmingham, England","description":"<p>A claret decanter built around a plain glass cylinder cradled in a silver frame, its stability and pouring action worked out as an engineering problem rather than decorated after the fact. Dresser designed dozens of variations on this glass-and-metal claret jug format for several manufacturers.<\/p>","image":"images/christopher-dresser/dresser-decanter.jpg","credit":{"file":"File:Decanter by Christopher Dresser (1834-1904), made by Hukin & Heath (1878-1887), Birmingham, England, designed c. 1881, glass, silver, ebonized wood - Brooklyn Museum - Brooklyn, NY - DSC08879.JPG","source":"https://commons.wikimedia.org/wiki/File:Decanter_by_Christopher_Dresser_(1834-1904),_made_by_Hukin_%26_Heath_(1878-1887),_Birmingham,_England,_designed_c._1881,_glass,_silver,_ebonized_wood_-_Brooklyn_Museum_-_Brooklyn,_NY_-_DSC08879.JPG","author":"Daderot","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"linthorpe-vase","title":"Linthorpe \"sea urchin\" vase","year":"1879–1892","medium":"Glazed earthenware","location":"Linthorpe Art Pottery, Middlesbrough, England","description":"<p>Dresser served as art director of the Linthorpe Art Pottery, designing organic, asymmetrical forms finished in dripping, mixed glazes that let each piece vary slightly in the kiln. Shapes like this one, echoing gourds, shells and sea creatures, drew on his early training as a botanist as much as on Japanese ceramic traditions.<\/p>","image":"images/christopher-dresser/linthorpe-vase.jpg","credit":{"file":"File:Christopher dresser per linthorpe art pottery, contenitore sea urchin, linthorpe UK 1879-92.jpg","source":"https://commons.wikimedia.org/wiki/File:Christopher_dresser_per_linthorpe_art_pottery,_contenitore_sea_urchin,_linthorpe_UK_1879-92.jpg","author":"Sailko","license":"CC BY 3.0","license_url":"https://creativecommons.org/licenses/by/3.0"}}]},{"slug":"william-morris","name":"William Morris","lifespan":"1834–1896","born":1834,"died":1896,"year_label":"1834","region":"Europe","country":"England","movements":["Arts and Crafts movement","Pre-Raphaelite circle"],"discipline":["Design"],"summary":"The founder of the Arts and Crafts movement, whose hand-crafted wallpapers, textiles and books argued that everyday objects should be both useful and beautiful.","sections":[{"title":"Overview","html":"<p>William Morris was the central figure of the Arts and Crafts movement, a designer, writer and socialist who rejected the cheap, mechanised ornament of Victorian mass production in favour of patterns drawn directly from close observation of the natural world and made by traditional, labour-intensive craft methods. His wallpapers and textiles, many still in production today, made his name as a decorative artist, while his final project, the Kelmscott Press, tried to bring the same standard of craftsmanship to the printed book.<\/p>"},{"title":"Life","html":"<p>Morris was born in 1834 in Walthamstow, near London, into a family that had grown wealthy through a Cornish copper mine. At Oxford he met the painter Edward Burne-Jones and, through him, the circle around the Pre-Raphaelite painter Dante Gabriel Rossetti, whose rejection of academic convention shaped his own aesthetic outlook. Unable to find furnishings he considered well made for his new home, Red House, he founded a decorative arts firm in 1861 with Burne-Jones, Rossetti, the architect Philip Webb and others, reorganised in 1875 as Morris &amp; Co., producing wallpaper, textiles, furniture, stained glass and carpets designed largely by Morris himself. He became an increasingly committed socialist in his later years, founding the Socialist League in 1884 and writing extensively on politics and utopian fiction alongside his design work. In 1891 he founded the Kelmscott Press, and its climactic production, an illustrated edition of Chaucer, was completed only months before he died in 1896.<\/p>"},{"title":"Style & Technique","html":"<p>Morris designed by studying real plants, willow, honeysuckle, acanthus, strawberry-thieving thrushes, directly from nature and then disciplining them into dense, flattened, endlessly repeating patterns suited to a printed roll or woven bolt of cloth. He insisted on reviving slow, labour-intensive traditional techniques, hand block-printing and indigo-discharge dyeing for textiles, letterpress printing from hand-cut type for books, over the faster industrial methods of his day, on the belief that only hand craftsmanship could produce lasting quality and honest beauty. His guiding principle, \"have nothing in your house that you do not know to be useful or believe to be beautiful,\" summarised a design philosophy he pursued, not without irony, in luxury goods that only the wealthy could generally afford.<\/p>"},{"title":"Legacy","html":"<p>Morris's insistence on craftsmanship, honest materials and design rooted in nature became the founding programme of the international Arts and Crafts movement and fed indirectly into Art Nouveau and even the industrial-design thinking of the Bauhaus a generation later. Morris &amp; Co.'s wallpapers and textiles, including Strawberry Thief and Willow Bough, remain in commercial production more than a century after his death. The Kelmscott Press, and the Chaucer above all, launched the private-press movement that shaped serious book design throughout the twentieth century.<\/p>"}],"cover":"strawberry-thief","wikipedia":"https://en.wikipedia.org/wiki/William_Morris","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/william-morris.md","works":[{"id":"red-house","title":"Red House","year":"1859–1860","medium":"Red brick, designed with architect Philip Webb","location":"Bexleyheath, England","description":"<p>Morris's own marital home, designed with his close friend, the architect Philip Webb, in plain red brick rather than the stucco and historical ornament fashionable at the time. Morris, Burne-Jones and their circle hand-decorated its interior with murals, furniture and embroidery, and its blend of medieval and vernacular English building traditions has been called the starting point of the Arts and Crafts movement.<\/p>","image":"images/william-morris/red-house.jpg","credit":{"file":"File:Philip Webb's Red House in Upton.jpg","source":"https://commons.wikimedia.org/wiki/File:Philip_Webb%27s_Red_House_in_Upton.jpg","author":"Ethan Doyle White","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}},{"id":"trellis","title":"Trellis","year":"1862","medium":"Block-printed wallpaper","location":"Morris, Marshall, Faulkner & Co., London, England","description":"<p>Morris's first wallpaper design, drawn directly from the rose trellis in the garden of his own Red House, with birds added by Philip Webb. Its dense, flattened pattern of climbing roses set the template for the repeating botanical designs that would define his work: closely observed nature disciplined into a workable, endlessly repeatable print block.<\/p>","image":"images/william-morris/trellis.jpg","credit":{"file":"File:William Morris design for Trellis wallpaper 1862.jpg","source":"https://commons.wikimedia.org/wiki/File:William_Morris_design_for_Trellis_wallpaper_1862.jpg","author":"William Morris","license":"Public domain","license_url":null}},{"id":"strawberry-thief","title":"Strawberry Thief","year":"1883","medium":"Indigo-discharge printed cotton textile","location":"Merton Abbey Works, Surrey, England","description":"<p>Named for the thrushes that stole fruit from Morris's own kitchen garden, this design took months to perfect using the indigo-discharge method, a slow, labour-intensive dyeing process Morris insisted on reviving over cheaper synthetic-dye printing because of the richer colour and permanence it gave. Still in production today, it remains one of the best-known textile patterns ever made.<\/p>","image":"images/william-morris/strawberry-thief.jpg","credit":{"file":"File:Strawberrythief.jpg","source":"https://commons.wikimedia.org/wiki/File:Strawberrythief.jpg","author":"The original uploader was VAwebteam at English Wikipedia .","license":"Public domain","license_url":null}},{"id":"willow-bough","title":"Willow Bough","year":"1887","medium":"Block-printed wallpaper","location":"Morris & Co., London, England","description":"<p>A dense, interlocking pattern of willow leaves derived from trees Morris studied along the River Thames near his country home, Kelmscott Manor. Among the most technically demanding of his wallpapers to print, requiring numerous separate blocks, it remains one of his most widely reproduced designs.<\/p>","image":"images/william-morris/willow-bough.jpg","credit":{"file":"File:Morris Willow Bough 1887.jpg","source":"https://commons.wikimedia.org/wiki/File:Morris_Willow_Bough_1887.jpg","author":"William Morris","license":"Public domain","license_url":null}},{"id":"kelmscott-chaucer","title":"The Kelmscott Chaucer","year":"1896","medium":"Letterpress printed book, Morris's own \"Chaucer\" typeface with illustrations by Edward Burne-Jones","location":"Kelmscott Press, Hammersmith, England","description":"<p>The masterpiece of the private press Morris founded in 1891 to revive medieval standards of book design against industrial mass printing: 87 woodcut illustrations by his lifelong friend Edward Burne-Jones, ornamental borders designed by Morris himself, and a typeface he cut based on 15th-century models. Finished only months before his death, it became the most influential book of the private-press movement that followed.<\/p>","image":"images/william-morris/kelmscott-chaucer.jpg","credit":{"file":"File:KelmscottChaucerSpread.jpg","source":"https://commons.wikimedia.org/wiki/File:KelmscottChaucerSpread.jpg","author":"Photo by Elif Ayiter. Book: William Morris and Edward Burne-Jones.","license":"CC BY 3.0","license_url":"https://creativecommons.org/licenses/by/3.0"}}]},{"slug":"monet","name":"Claude Monet","lifespan":"1840–1926","born":1840,"died":1926,"year_label":"1840","region":"Europe","country":"France","movements":["Impressionism"],"discipline":["Painting"],"summary":"The founder of Impressionism, who spent his life painting the changing effects of light, from Paris railway stations to the water lilies of Giverny.","sections":[{"title":"Overview","html":"<p>Claude Monet was the leader and purest practitioner of Impressionism. His painting <em>Impression, Sunrise<\/em> gave the movement its name. Working outdoors whenever he could, he tried to capture fleeting effects of light, weather and atmosphere with rapid strokes of pure colour. In later life he painted series of the same subject, such as haystacks, poplars, Rouen Cathedral and the Thames, in changing conditions. He ended with the vast, almost abstract water lily paintings made in his garden at Giverny, which later inspired abstract painters.<\/p>"},{"title":"Life","html":"<p>Monet was born in Paris on 14 November 1840 and grew up in the port of Le Havre, where as a teenager he sold caricatures of local people. The landscape painter Eugène Boudin persuaded him to paint outdoors, <em>en plein air<\/em>, a turning point in his life. In Paris he met Camille Pissarro, and in the studio of Charles Gleyre he befriended Renoir, Sisley and Bazille.<\/p>\n<p>The 1860s and 1870s were years of poverty and struggle. His model and companion Camille Doncieux bore their son Jean in 1867, and they married in 1870. During the Franco-Prussian War he took refuge in London, where he saw Turner's paintings and met the dealer Paul Durand-Ruel. Back in France he painted at Argenteuil on the Seine. In 1874 he and his friends held their own exhibition, independent of the official Salon. Critics mocked them, and the name \"Impressionist\" stuck.<\/p>\n<p>Camille died in 1879. Monet later married Alice Hoschedé, and in 1883 the combined family settled at Giverny, in Normandy. Success came slowly and then decisively in the 1890s. He bought the house and created a flower garden and a water garden with a Japanese bridge, which became his main subject. In his last decade he fought cataracts, which changed his colour vision, and worked on the giant <em>Grandes Décorations<\/em>, which he gave to the French state as a monument to peace after the First World War. He died at Giverny on 5 December 1926.<\/p>"},{"title":"Style & Technique","html":"<p>Monet applied colour in short, broken strokes, placing pure hues side by side instead of blending them. He painted shadows in blues and purples rather than brown or black, and often abandoned careful drawing and finish. His aim was to record what the eye actually sees in a particular moment of light: an \"impression\".<\/p>\n<p>His series paintings took this further. By painting the same motif again and again, he showed that light and atmosphere transform any subject. In his late water lily canvases, some many metres long, there is no horizon. Surface, depth and reflection merge in fields of colour and gestural brushwork.<\/p>"},{"title":"Legacy","html":"<p>Impressionism, once mocked, became the most popular movement in the history of art, and Monet its best-loved painter. His series, and especially the late water lilies, were rediscovered in the 1950s by the Abstract Expressionists, and critics saw them as precursors of painters such as Jackson Pollock and Mark Rothko. His house and gardens at Giverny, restored and opened to the public in 1980, draw hundreds of thousands of visitors each year. In 2019 one of his <em>Haystacks<\/em> sold for $110.7 million.<\/p>"}],"cover":"impression-sunrise","wikipedia":"https://en.wikipedia.org/wiki/Claude_Monet","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/monet.md","works":[{"id":"impression-sunrise","title":"Impression, Sunrise","year":"1872","medium":"Oil on canvas, 48 × 63 cm","location":"Musée Marmottan Monet, Paris","description":"<p>The port of Le Havre at dawn, sketched in a few quick strokes of blue and grey, with a small orange sun and its reflection dabbed onto the water. Shown at the first independent exhibition of 1874, it gave the critic Louis Leroy a mocking name for the whole group: the \"Impressionists\". The painters adopted the name themselves.<\/p>","image":"images/monet/impression-sunrise.jpg","credit":{"file":"File:Monet - Impression, Sunrise.jpg","source":"https://commons.wikimedia.org/wiki/File:Monet_-_Impression,_Sunrise.jpg","author":"Claude Monet","license":"Public domain","license_url":null}},{"id":"woman-with-a-parasol","title":"Woman with a Parasol – Madame Monet and Her Son","year":"1875","medium":"Oil on canvas, 100 × 81 cm","location":"National Gallery of Art, Washington","description":"<p>Monet's wife, Camille, stands on a breezy hilltop seen from below, her veil and white dress blowing, while their son Jean watches from further off. Painted quickly outdoors, it is less a portrait than a record of sunlight, wind and a passing moment, like a snapshot of a family walk.<\/p>","image":"images/monet/woman-with-a-parasol.jpg","credit":{"file":"File:Claude Monet - Woman with a Parasol - Madame Monet and Her Son - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Woman_with_a_Parasol_-_Madame_Monet_and_Her_Son_-_Google_Art_Project.jpg","author":"Claude Monet","license":"Public domain","license_url":null}},{"id":"gare-saint-lazare","title":"La Gare Saint-Lazare","year":"1877","medium":"Oil on canvas, 75 × 104 cm","location":"Musée d'Orsay, Paris","description":"<p>Monet obtained permission to set up his easel inside the Paris railway station and painted a dozen views of its trains, iron roof and billowing steam. This one captures locomotives puffing clouds of blue and white smoke under the glass canopy. It celebrates modern life and turns the station into a cathedral of light and vapour.<\/p>","image":"images/monet/gare-saint-lazare.jpg","credit":{"file":"File:Claude Monet - The Saint-Lazare Station - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_The_Saint-Lazare_Station_-_Google_Art_Project.jpg","author":"Claude Monet","license":"Public domain","license_url":null}},{"id":"haystacks","title":"Stacks of Wheat (End of Summer)","year":"1890–1891","medium":"Oil on canvas, 60 × 100 cm","location":"Art Institute of Chicago","description":"<p>Two tall stacks of harvested wheat near Monet's home at Giverny, painted in warm late-summer light. It is part of a series of some 25 canvases of the same subject in different seasons, weather and times of day. Monet worked on several canvases at once, switching as the light changed. The series, shown in 1891, was a triumph.<\/p>","image":"images/monet/haystacks.jpg","credit":{"file":"File:Claude Monet - Stacks of Wheat (End of Summer) - 1985.1103 - Art Institute of Chicago.jpg","source":"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Stacks_of_Wheat_(End_of_Summer)_-_1985.1103_-_Art_Institute_of_Chicago.jpg","author":"Claude Monet","license":"Public domain","license_url":null}},{"id":"rouen-cathedral","title":"Rouen Cathedral, West Façade, Sunlight","year":"1894","medium":"Oil on canvas, 100 × 66 cm","location":"National Gallery of Art, Washington","description":"<p>Renting rooms opposite the Gothic cathedral of Rouen, Monet painted its façade more than 30 times at different hours. In this bright-afternoon version, the stone dissolves into crusty layers of cream, gold and blue shadow. The subject is no longer the building but the light that falls on it.<\/p>","image":"images/monet/rouen-cathedral.jpg","credit":{"file":"File:Claude Monet, Rouen Cathedral, West Façade, Sunlight, 1894, NGA 46654.jpg","source":"https://commons.wikimedia.org/wiki/File:Claude_Monet,_Rouen_Cathedral,_West_Fa%C3%A7ade,_Sunlight,_1894,_NGA_46654.jpg","author":"Claude Monet","license":"Public domain","license_url":null}},{"id":"water-lilies","title":"Water Lilies","year":"1906","medium":"Oil on canvas, 89.9 × 94.1 cm","location":"Art Institute of Chicago","description":"<p>Looking down at the surface of the pond Monet created in his garden at Giverny, we see floating lily pads and flowers mixed with reflections of sky and trees, with no horizon or bank. Monet painted about 250 water lily pictures in his last 30 years. The largest, the <em>Grandes Décorations<\/em>, fill two oval rooms at the Musée de l'Orangerie in Paris.<\/p>","image":"images/monet/water-lilies.jpg","credit":{"file":"File:Claude Monet - Water Lilies - 1906, Ryerson.jpg","source":"https://commons.wikimedia.org/wiki/File:Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg","author":"Claude Monet","license":"Public domain","license_url":null}}]},{"slug":"velasco","name":"José María Velasco","lifespan":"1840–1912","born":1840,"died":1912,"year_label":"1840","region":"Americas","country":"Mexico","movements":["Landscape painting","Academic realism"],"discipline":["Painting"],"summary":"Mexico's great landscape painter, who captured the Valley of Mexico with the eye of both an artist and a scientist.","sections":[{"title":"Overview","html":"<p>José María Velasco is the most important Mexican painter of the 19th century. He is best known for his panoramic views of the Valley of Mexico. In these he recorded the plants, rocks, lakes, volcanoes and light of central Mexico with extraordinary precision, while giving them a sense of grandeur and national pride. Velasco was also a trained naturalist who illustrated scientific publications on botany, zoology and geology. His landscapes gave Mexico a visual identity after independence and influenced later painters, including the muralist Diego Rivera.<\/p>"},{"title":"Life","html":"<p>Velasco was born on 6 July 1840 in Temascalcingo, in the State of Mexico. His family moved to Mexico City in 1849. In 1858 he entered the Academy of San Carlos, where he studied landscape with the Italian painter Eugenio Landesio, who taught his students to observe nature closely and to paint outdoors. He also studied botany, zoology, anatomy, physics and mathematics, interests that ran through his whole career.<\/p>\n<p>He won his first prizes in the 1860s and succeeded Landesio as professor of landscape painting at the Academy in 1877. Among his students was the young Diego Rivera. He worked as a scientific illustrator for the National Museum and on expeditions, and he painted archaeological sites such as Teotihuacan.<\/p>\n<p>Velasco represented Mexico at international exhibitions, including the Paris Universal Exposition of 1889, where he won a medal, and the 1893 Chicago World's Columbian Exposition. One of his views of the Valley of Mexico was given to Pope Leo XIII and is now in the Vatican Museums. He died in Mexico City on 26 August 1912, during the early years of the Mexican Revolution.<\/p>"},{"title":"Style & Technique","html":"<p>Velasco combined academic precision with scientific observation. He studied the geology of rocks, the structure of plants and the effects of atmosphere and distance, and he worked from outdoor sketches and studies to create large studio compositions. His panoramas often place a detailed foreground of cacti, rocks and scrub against an immense, luminous distance of plain, lake and volcano.<\/p>\n<p>His palette is clear and bright, capturing the sharp light of the Mexican high plateau. He included signs of the modern world, such as railways, bridges and haciendas, alongside nature and ancient ruins, and he presented them in a calm, balanced harmony.<\/p>"},{"title":"Legacy","html":"<p>Velasco created the classic image of the Mexican landscape. His views of the Valley of Mexico are national icons, reproduced in schoolbooks and on stamps, and they record a landscape of lakes and open plains that has since been swallowed by Mexico City. Diego Rivera acknowledged him as a master. The Museo José María Velasco in Toluca opened in 1992, and in 2025 the National Gallery in London held <em>José María Velasco: A View of Mexico<\/em>, his first exhibition in the United Kingdom.<\/p>"}],"cover":"valley-of-mexico","wikipedia":"https://en.wikipedia.org/wiki/Jos%C3%A9_Mar%C3%ADa_Velasco_G%C3%B3mez","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/velasco.md","works":[{"id":"valley-of-mexico","title":"The Valley of Mexico from the Santa Isabel Mountain Range","year":"1875","medium":"Oil on canvas","location":"Museo Nacional de Arte (MUNAL), Mexico City","description":"<p>Velasco's most celebrated subject. From a hillside of scrub and cactus, the vast basin of the Valley of Mexico stretches out under an immense sky, with Lake Texcoco, the distant city and the snowy volcanoes on the horizon. Every plant and rock in the foreground is botanically and geologically accurate, yet the panorama feels epic. It became an image of the Mexican nation itself.<\/p>","image":"images/velasco/valley-of-mexico.jpg","credit":{"file":"File:José María Velasco - The Valley of Mexico from the Santa Isabel Mountain Range - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg","author":"José María Velasco (1840 - 1912) – painter (Mexican) Born in State of Mexico. Details on Google Art Project","license":"Public domain","license_url":null}},{"id":"pyramid-of-the-sun","title":"The Pyramid of the Sun at Teotihuacan","year":"1878","medium":"Oil on canvas","location":"Museo Nacional de Arte (MUNAL), Mexico City","description":"<p>The great pre-Hispanic pyramid of Teotihuacan, then still overgrown and only partly excavated, rises above the plain under a luminous sky. Velasco took part in scientific and archaeological expeditions, and paintings like this linked Mexico's ancient past to its modern national identity.<\/p>","image":"images/velasco/pyramid-of-the-sun.jpg","credit":{"file":"File:La Pirámide del Sol en Teotihuacán - 1878 - José María Velasco - MUNAL.jpg","source":"https://commons.wikimedia.org/wiki/File:La_Pir%C3%A1mide_del_Sol_en_Teotihuac%C3%A1n_-_1878_-_Jos%C3%A9_Mar%C3%ADa_Velasco_-_MUNAL.jpg","author":"José María Velasco Gómez Obregón","license":"Public domain","license_url":null}},{"id":"metlac-bridge","title":"The Curved Bridge over the Metlac Ravine","year":"1881","medium":"Oil on canvas","location":"Museo Nacional de Arte (MUNAL), Mexico City","description":"<p>A steam train crosses a spectacular curved railway bridge over a deep tropical ravine on the line between Mexico City and Veracruz. The painting celebrates modern engineering within an overwhelming natural landscape. It is Velasco's answer to Turner's <em>Rain, Steam and Speed<\/em>, and a record of Mexico's rapid modernisation under Porfirio Díaz.<\/p>","image":"images/velasco/metlac-bridge.jpg","credit":{"file":"File:El puente curvo de la barranca de Metlac - 1881 - José María Velasco Gómez Obregón.jpg","source":"https://commons.wikimedia.org/wiki/File:El_puente_curvo_de_la_barranca_de_Metlac_-_1881_-_Jos%C3%A9_Mar%C3%ADa_Velasco_G%C3%B3mez_Obreg%C3%B3n.jpg","author":"José María Velasco Gómez y Obregón","license":"Public domain","license_url":null}},{"id":"ahuehuete-noche-triste","title":"The Ahuehuete of the Noche Triste","year":"1885","medium":"Oil on canvas","location":"Mexico City","description":"<p>A portrait of a famous ancient cypress tree in Mexico City. By tradition, the Spanish conquistador Hernán Cortés wept beneath it after his defeat by the Aztecs on the <em>Noche Triste<\/em> (\"Sad Night\") of 1520. Velasco treats the gnarled tree as a living monument to Mexican history.<\/p>","image":"images/velasco/ahuehuete-noche-triste.jpg","credit":{"file":"File:Ahuehuete-noche-triste.jpg","source":"https://commons.wikimedia.org/wiki/File:Ahuehuete-noche-triste.jpg","author":"Painting by mexican painter José María Velasco.","license":"Public domain","license_url":null}},{"id":"cardon-oaxaca","title":"Cardón Cactus, State of Oaxaca","year":"1887","medium":"Oil on canvas","location":"Museo Nacional de Arte (MUNAL), Mexico City","description":"<p>A giant columnar cactus towers over a dry, rocky landscape in southern Mexico, painted with the precision of a botanical illustration. Velasco trained in botany and zoology, and here he makes a native plant into the heroic protagonist of the picture, a symbol of Mexican nature.<\/p>","image":"images/velasco/cardon-oaxaca.jpg","credit":{"file":"File:Cardon cactus by Velasco 1887.jpg","source":"https://commons.wikimedia.org/wiki/File:Cardon_cactus_by_Velasco_1887.jpg","author":"Chiswick Chap","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"great-comet-of-1882","title":"The Great Comet of 1882","year":"1910","medium":"Oil on canvas","location":"Museo Nacional de Arte (MUNAL), Mexico City","description":"<p>A brilliant comet streaks across the pre-dawn sky above the dark Valley of Mexico. In 1910, the year Halley's Comet returned, Velasco painted this memory of the spectacular Great Comet he had seen in 1882. The painting reflects his lifelong interest in science and the night sky.<\/p>","image":"images/velasco/great-comet-of-1882.jpg","credit":{"file":"File:The Great Comet of 1882 by Velasco 1910.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Great_Comet_of_1882_by_Velasco_1910.jpg","author":"Chiswick Chap","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}}]},{"slug":"mary-cassatt","name":"Mary Cassatt","lifespan":"1844–1926","born":1844,"died":1926,"year_label":"1844","region":"Americas","country":"United States (worked in France)","movements":["Impressionism"],"discipline":["Painting"],"summary":"The only American to exhibit with the French Impressionists, celebrated for her tender, unsentimental images of women and children.","sections":[{"title":"Overview","html":"<p>Mary Cassatt was born in Pennsylvania but spent most of her adult life in France. There she became a close friend of Edgar Degas and a full member of the Impressionist circle. She painted the private lives of women: at the theatre, drinking tea, reading, and above all caring for children. She observed them with honesty and without sentimentality. She was also an innovative printmaker and an influential adviser to American collectors, and she helped bring Impressionism to the United States.<\/p>"},{"title":"Life","html":"<p>Cassatt was born on 22 May 1844 in Allegheny City, now part of Pittsburgh, into a wealthy family. As a child she lived in Europe for several years. Against her father's wishes she studied at the Pennsylvania Academy of the Fine Arts from 1860, then left for Paris in 1866. Women could not enter the École des Beaux-Arts, so she studied privately and copied Old Masters in the Louvre.<\/p>\n<p>She had paintings accepted at the official Salon, but grew frustrated with its conservative taste. In 1877 Degas invited her to exhibit with the Impressionists, and she accepted with delight. She showed with them in 1879, 1880, 1881 and 1886. Her parents and sister Lydia moved to Paris to live with her, and her family became her favourite models.<\/p>\n<p>In 1890 a large exhibition of Japanese prints in Paris inspired her to make a set of ten colour prints combining drypoint and aquatint, now considered masterpieces. In 1893 she painted a large mural, <em>Modern Woman<\/em>, for the Woman's Building at the World's Columbian Exposition in Chicago; it has since been lost. She advised her friend Louisine Havemeyer and other Americans on buying Old Masters and Impressionists, many of which are now in the Metropolitan Museum. Failing eyesight forced her to stop working around 1914. She died at her château near Paris on 14 June 1926.<\/p>"},{"title":"Style & Technique","html":"<p>Cassatt combined Impressionism's bright colour and loose brushwork with a strong sense of drawing learned from Degas and the Old Masters. Her figures are solid and carefully constructed, even when the backgrounds dissolve into quick strokes. She worked in oil, pastel, and printmaking.<\/p>\n<p>From Japanese prints she took flat areas of colour, strong outlines, unusual viewpoints and cropped compositions. Her mothers and children are ordinary people absorbed in daily tasks: bathing, feeding, holding. Their gestures of care are observed exactly. She painted women as active, thinking people.<\/p>"},{"title":"Legacy","html":"<p>Cassatt helped shape American taste for modern French painting, which is why American museums hold such rich Impressionist collections. France made her a Chevalier of the Légion d'honneur in 1904. She supported the women's suffrage movement and lent works to exhibitions that raised money for it. Her images of mothers and children remain among the most reproduced of the period, and her colour prints are prized as some of the finest of the 19th century.<\/p>"}],"cover":"the-childs-bath","wikipedia":"https://en.wikipedia.org/wiki/Mary_Cassatt","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/mary-cassatt.md","works":[{"id":"little-girl-in-a-blue-armchair","title":"Little Girl in a Blue Armchair","year":"1878","medium":"Oil on canvas, 89.5 × 129.8 cm","location":"National Gallery of Art, Washington","description":"<p>A small girl sprawls, bored and slouching, in an overstuffed armchair while a dog naps in the chair beside her. Cassatt shows a child as she really behaves, not posed and sweet. Degas helped with the background. When the painting was rejected by the American section of the 1878 Paris World's Fair, Cassatt was furious.<\/p>","image":"images/mary-cassatt/little-girl-in-a-blue-armchair.jpg","credit":{"file":"File:Cassat - Blue Armchair NGA.jpg","source":"https://commons.wikimedia.org/wiki/File:Cassat_-_Blue_Armchair_NGA.jpg","author":"Mary Cassatt","license":"Public domain","license_url":null}},{"id":"in-the-loge","title":"In the Loge","year":"1878","medium":"Oil on canvas, 81.3 × 66 cm","location":"Museum of Fine Arts, Boston","description":"<p>A woman in black sits in a box at the Paris opera, peering through her opera glasses, while a man in a distant box trains his glasses on her. Cassatt reverses the usual situation: here the woman is the one who actively looks, even as she is being watched. It was one of the first works she showed in America.<\/p>","image":"images/mary-cassatt/in-the-loge.jpg","credit":{"file":"File:Mary Stevenson Cassatt - In the Loge - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Mary_Stevenson_Cassatt_-_In_the_Loge_-_Google_Art_Project.jpg","author":"Mary Cassatt","license":"Public domain","license_url":null}},{"id":"woman-with-a-pearl-necklace","title":"Woman with a Pearl Necklace in a Loge","year":"1879","medium":"Oil on canvas, 81.3 × 59.7 cm","location":"Philadelphia Museum of Art","description":"<p>The artist's sister Lydia sits in a theatre box, her pink dress and skin glowing in the gaslight, while a mirror behind her reflects the chandeliers and balconies. Shown at the fourth Impressionist exhibition in 1879, it was praised by critics and helped establish Cassatt's reputation in Paris.<\/p>","image":"images/mary-cassatt/woman-with-a-pearl-necklace.jpg","credit":{"file":"File:Mary Cassatt - Woman with a Pearl Necklace.jpg","source":"https://commons.wikimedia.org/wiki/File:Mary_Cassatt_-_Woman_with_a_Pearl_Necklace.jpg","author":"Mary Cassatt","license":"Public domain","license_url":null}},{"id":"the-childs-bath","title":"The Child's Bath","year":"1893","medium":"Oil on canvas, 100.3 × 66 cm","location":"Art Institute of Chicago","description":"<p>A woman washes a young child's feet in a basin, both of them looking down, absorbed. The steep, tilted viewpoint, bold patterns and strong outlines show the influence of Japanese prints. It is Cassatt's best-known treatment of her central theme, the everyday bond between mothers and children.<\/p>","image":"images/mary-cassatt/the-childs-bath.jpg","credit":{"file":"File:Mary Cassatt - The Child's Bath - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Mary_Cassatt_-_The_Child%27s_Bath_-_Google_Art_Project.jpg","author":"Mary Cassatt","license":"Public domain","license_url":null}},{"id":"the-boating-party","title":"The Boating Party","year":"1893–1894","medium":"Oil on canvas, 90 × 117 cm","location":"National Gallery of Art, Washington","description":"<p>A man rows a woman and a baby across a bright blue bay. The curving yellow boat, the flat areas of colour and the high horizon, cut off at the top, come from Japanese prints. The oarsman's dark bulk fills the foreground, and every line of the composition leads to the baby.<\/p>","image":"images/mary-cassatt/the-boating-party.jpg","credit":{"file":"File:Mary Cassatt - The Boating Party - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Mary_Cassatt_-_The_Boating_Party_-_Google_Art_Project.jpg","author":"Mary Cassatt","license":"Public domain","license_url":null}},{"id":"summertime","title":"Summertime","year":"1894","medium":"Oil on canvas, 100.7 × 81.3 cm","location":"Terra Foundation for American Art, Chicago","description":"<p>A woman and a girl lean over the side of a small boat to watch ducks on a pond, painted with the loose, bright brushwork of Impressionism. The water shimmers with reflected colour. This is one of Cassatt's most purely Impressionist outdoor pic
