tures, painted during summers in the French countryside.<\/p>","image":"images/mary-cassatt/summertime.jpg","credit":{"file":"File:Mary Cassatt - Summertime - TFAA 1988.25.jpg","source":"https://commons.wikimedia.org/wiki/File:Mary_Cassatt_-_Summertime_-_TFAA_1988.25.jpg","author":"Mary Cassatt","license":"Public domain","license_url":null}}]},{"slug":"louis-comfort-tiffany","name":"Louis Comfort Tiffany","lifespan":"1848–1933","born":1848,"died":1933,"year_label":"1848","region":"Americas","country":"United States","movements":["Art Nouveau","Aesthetic Movement"],"discipline":["Design"],"summary":"The American designer whose iridescent Favrile glass, stained-glass windows and lamps became the signature look of American Art Nouveau.","sections":[{"title":"Overview","html":"<p>Louis Comfort Tiffany, son of the jeweller Charles Lewis Tiffany, built one of the most successful design enterprises in American decorative art around a single material innovation: Favrile glass, whose shimmering colour and texture come from the glass itself rather than from paint applied to its surface. From stained-glass windows and mosaic interiors to the lamps that still bear his name, Tiffany Studios turned that material into an entire vocabulary of nature-derived Art Nouveau design, though recent scholarship has shown many of its most celebrated individual designs to be the work of staff designers, especially Clara Driscoll, working under Tiffany's overall direction.<\/p>"},{"title":"Life","html":"<p>Tiffany was born in New York in 1848 and originally trained as a painter, studying under the landscape painter George Inness, before turning to interior design and decorative arts in the 1870s. His decorating firm undertook prominent commissions, including a redecoration of state rooms in the White House in 1882 for President Chester Arthur, later removed by a subsequent administration. In 1885 he founded what became Tiffany Studios, concentrating on stained glass, and in 1894 patented Favrile glass, the iridescent material that became the foundation of the studio's output in windows, lamps, vases and mosaics. His Byzantine-style chapel interior for the 1893 World's Columbian Exposition in Chicago won international acclaim and established Tiffany Studios as a leading design house. He built an elaborate estate, Laurelton Hall, on Long Island as a personal showcase of his work, and continued directing the studio's design output until financial losses during the Depression forced its closure. He died in New York in 1933.<\/p>"},{"title":"Style & Technique","html":"<p>Tiffany drew his motifs directly from nature, dragonflies, wisteria, peacock feathers, water lilies, and worked to make colour and texture properties of the glass itself rather than additions painted onto it. Favrile glass built iridescent, metallic colour into molten glass through mineral oxides; \"drapery glass,\" another Tiffany Studios innovation, was manipulated while still hot to form folds resembling real fabric, letting a window suggest robes or foliage in relief rather than as a flat painted image. Tiffany oversaw the studio's overall aesthetic and technical direction, while much of the detailed design of individual pieces, particularly its famous lamps, was carried out by staff designers, above all Clara Driscoll, who led the studio's women's glass-cutting department.<\/p>"},{"title":"Legacy","html":"<p>Tiffany lamps and windows are today among the most valuable and recognisable objects in American decorative art, and Favrile glass remains a benchmark for art glass technique. For most of the twentieth century, Tiffany was credited as the sole designer of Tiffany Studios' output; the rediscovery in the mid-2000s of letters written by Clara Driscoll substantially revised that picture, crediting her and the women of the \"Tiffany Girls\" department with designing several of the studio's most famous lamps, including the Dragonfly, a correction now generally accepted by museums and scholars.<\/p>"}],"cover":"dragonfly-lamp","wikipedia":"https://en.wikipedia.org/wiki/Louis_Comfort_Tiffany","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/louis-comfort-tiffany.md","works":[{"id":"favrile-glass","title":"Favrile glass","year":"1894","medium":"Blown iridescent art glass","location":"Tiffany Glass and Decorating Company, Corona, New York","description":"<p>A patented iridescent glass Tiffany developed by mixing metallic oxides directly into molten glass, so its shimmering, oil-slick surface colour is built into the material itself rather than painted on afterward. Favrile glass became the raw material for nearly everything Tiffany Studios produced, from windows to vases to lampshades.<\/p>","image":"images/louis-comfort-tiffany/favrile-glass.jpg","credit":{"file":"File:Favrile.jpg","source":"https://commons.wikimedia.org/wiki/File:Favrile.jpg","author":"VAwebteam at English Wikipedia","license":"CC BY-SA 3.0","license_url":"http://creativecommons.org/licenses/by-sa/3.0/"}},{"id":"dragonfly-lamp","title":"Dragonfly table lamp","year":"c. 1900","medium":"Leaded Favrile glass and bronze","location":"Tiffany Studios, Corona, New York","description":"<p>One of Tiffany Studios' most celebrated lamp designs, its shade built from hundreds of small cut pieces of glass forming dragonflies with wings of rippled, filigree-edged glass around a mosaic-glass base. Long credited to Tiffany personally, it is now attributed, following the rediscovery of her letters in the 2000s, to Clara Driscoll, head of the studio's women's glass department.<\/p>","image":"images/louis-comfort-tiffany/dragonfly-lamp.jpg","credit":{"file":"File:Tiffany dragonfly hg.jpg","source":"https://commons.wikimedia.org/wiki/File:Tiffany_dragonfly_hg.jpg","author":"Hannes Grobe 19:33, 20 June 2007 (UTC)","license":"CC BY-SA 2.5","license_url":"https://creativecommons.org/licenses/by-sa/2.5"}},{"id":"tiffany-chapel","title":"Tiffany Chapel","year":"1893","medium":"Marble, mosaic and leaded Favrile glass","location":"Originally built for the World's Columbian Exposition, Chicago; later Laurelton Hall, New York","description":"<p>A complete Byzantine-influenced interior, mosaic columns, a baptismal font and stained-glass windows, built to showcase Tiffany's full range of decorative techniques at the 1893 Chicago World's Fair, where it won several awards and established his international reputation almost overnight.<\/p>","image":"images/louis-comfort-tiffany/tiffany-chapel.jpg","credit":{"file":"File:Tiffany Chapel from HABS crop.jpg","source":"https://commons.wikimedia.org/wiki/File:Tiffany_Chapel_from_HABS_crop.jpg","author":"G.G. from Hoxie, Kansas, USA; cropped by Beyond My Ken ( talk ) 16:18, 29 June 2011 (UTC)","license":"CC BY 2.0","license_url":"https://creativecommons.org/licenses/by/2.0"}},{"id":"righteous-shall-receive","title":"The Righteous Shall Receive a Crown of Glory","year":"1901","medium":"Leaded Favrile glass window","location":"Tiffany Studios, Corona, New York","description":"<p>A memorial window built almost entirely from richly textured \"drapery glass,\" sheets of glass manipulated while molten to form folds resembling actual fabric, letting Tiffany suggest robes and landscape without a single painted line, an effect unique to his studio's glass-making technique.<\/p>","image":"images/louis-comfort-tiffany/righteous-shall-receive.jpg","credit":{"file":"File:Louis Comfort Tiffany - The Righteous Shall Receive A Crown of Glory, 1901.jpg","source":"https://commons.wikimedia.org/wiki/File:Louis_Comfort_Tiffany_-_The_Righteous_Shall_Receive_A_Crown_of_Glory,_1901.jpg","author":"Louis Comfort Tiffany; design by Frederick Wilson","license":"Public domain","license_url":null}},{"id":"laurelton-hall","title":"Laurelton Hall","year":"1902–1905","medium":"Stucco, tile and stained glass over a steel frame","location":"Long Island, New York","description":"<p>Tiffany's own eighty-room estate on Long Island, designed as a total showcase of his work, from its stained-glass windows and mosaic-tiled courtyard fountain to its furniture and landscaping. Largely abandoned after the Depression and destroyed by fire in 1957, its surviving architectural fragments and windows are now held by the Charles Hosmer Morse Museum of American Art.<\/p>","image":"images/louis-comfort-tiffany/laurelton-hall.jpg","credit":{"file":"File:Laurelton Hall (demolished) from HABS (3707667352).jpg","source":"https://commons.wikimedia.org/wiki/File:Laurelton_Hall_(demolished)_from_HABS_(3707667352).jpg","author":"whitewall buick from Hoxie, Kansas, USA","license":"CC BY 2.0","license_url":"https://creativecommons.org/licenses/by/2.0"}}]},{"slug":"raja-ravi-varma","name":"Raja Ravi Varma","lifespan":"1848–1906","born":1848,"died":1906,"year_label":"1848","region":"South Asia","country":"India (Travancore)","movements":["Academic realism","Indian modern painting"],"discipline":["Painting"],"summary":"The painter-prince of Travancore who brought European oil painting to Indian myths, and whose prints put gods and heroines in homes across India.","sections":[{"title":"Overview","html":"<p>Raja Ravi Varma was the most famous Indian painter of the 19th century and one of the first to master European academic oil painting. He used it to paint scenes from the Hindu epics, the <em>Ramayana<\/em> and <em>Mahabharata<\/em>, and from classical Sanskrit literature, along with elegant portraits. He gave gods, goddesses and heroines a realistic human form. When he set up his own printing press, cheap colour reproductions of his paintings spread his images into homes, temples and calendars across India, and they shaped how millions of people imagined their myths.<\/p>"},{"title":"Life","html":"<p>Ravi Varma was born on 29 April 1848 at Kilimanoor, near Thiruvananthapuram in the princely state of Travancore, into an aristocratic family related to the ruling house. His uncle, the painter Raja Raja Varma, noticed his talent. At 14 he was taken to the palace in Thiruvananthapuram under the patronage of Maharaja Ayilyam Thirunal. He learned watercolour from the palace painter and studied the technique of oil painting partly by watching the visiting European portraitist Theodore Jensen.<\/p>\n<p>His reputation grew quickly. A portrait won a prize at the 1873 Vienna exhibition, and his work was shown at the 1893 World's Columbian Exposition in Chicago. Princely rulers across India commissioned portraits and mythological scenes from him. For Maharaja Sayajirao Gaekwad III of Baroda he painted a series of Puranic subjects in 1888–1890.<\/p>\n<p>To make his art available to ordinary people, in 1894 he set up a lithographic press in Bombay, later moved to Malavli near Lonavala. It produced colour prints (oleographs) of his paintings of deities and heroines, which sold in huge numbers. Critics accused him of vulgarising sacred subjects, and some prints were attacked as indecent, but they made him a household name. In 1904 the British Viceroy awarded him the Kaisar-i-Hind Gold Medal. He died at Kilimanoor on 2 October 1906.<\/p>"},{"title":"Style & Technique","html":"<p>Ravi Varma combined the realism of Victorian academic painting, with its careful modelling, lighting, perspective and rich surfaces, with Indian subjects, costumes and settings. His heroines are based on real women, often in the Maharashtrian nine-yard sari or Kerala dress. They are set in palaces, forests and riversides that recall European history painting and theatre.<\/p>\n<p>He staged mythological scenes at their most dramatic moments, with expressive gestures and emotional faces. His portraits of Indian aristocrats and ordinary women are tender and closely observed. The oleographs simplified his paintings into bright, clear images suited to mass reproduction.<\/p>"},{"title":"Legacy","html":"<p>Ravi Varma's images transformed popular religious art in India. The look of gods and goddesses in calendar art, comics and film posters still descends from his prints. The early Indian filmmaker Dadasaheb Phalke worked at his press before making India's first feature film in 1913. Later nationalist artists of the Bengal School, such as Abanindranath Tagore, rejected his Western style. Today he is celebrated as a pioneer of modern Indian art, his paintings sell for record prices, and the Kerala government's highest award for art, the Raja Ravi Varma Puraskaram, bears his name.<\/p>"}],"cover":"shakuntala","wikipedia":"https://en.wikipedia.org/wiki/Raja_Ravi_Varma","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/raja-ravi-varma.md","works":[{"id":"galaxy-of-musicians","title":"Galaxy of Musicians","year":"1889","medium":"Oil on canvas","location":"Sri Jayachamarajendra Art Gallery (Jaganmohan Palace), Mysuru","description":"<p>Eleven women, each dressed in the clothing of a different region or community of India, play instruments including the veena, tanpura, sitar and tabla. The painting is a celebration of the subcontinent's diversity brought together in harmony. It is sometimes read as an early image of an Indian nation.<\/p>","image":"images/raja-ravi-varma/galaxy-of-musicians.jpg","credit":{"file":"File:Raja Ravi Varma, Galaxy of Musicians.jpg","source":"https://commons.wikimedia.org/wiki/File:Raja_Ravi_Varma,_Galaxy_of_Musicians.jpg","author":"Raja Ravi Varma","license":"Public domain","license_url":null}},{"id":"there-comes-papa","title":"There Comes Papa","year":"1893","medium":"Oil on canvas","location":"Kowdiar Palace, Thiruvananthapuram","description":"<p>The artist's daughter Mahaprabha stands holding her infant son and points toward the unseen father arriving at the left, while a small dog looks the same way. Painted with European realism and set in an elegant Kerala interior, it was shown at the World's Columbian Exposition in Chicago in 1893. Critics have linked its absent father to the matrilineal customs of Kerala's Nair community.<\/p>","image":"images/raja-ravi-varma/there-comes-papa.jpg","credit":{"file":"File:Raja Ravi Varma, There Comes Papa (1893).jpg","source":"https://commons.wikimedia.org/wiki/File:Raja_Ravi_Varma,_There_Comes_Papa_(1893).jpg","author":"Raja Ravi Varma","license":"Public domain","license_url":null}},{"id":"jatayu-vadham","title":"Jatayu Vadham (The Killing of Jatayu)","year":"1895","medium":"Oil on canvas","location":"India","description":"<p>A scene from the <em>Ramayana<\/em>: the demon king Ravana, carrying off Sita in his flying chariot, slashes the wing of the brave vulture-king Jatayu, who tried to rescue her. Sita recoils in horror. Ravi Varma staged the myth like a Western history painting, full of movement, theatrical gesture and dramatic sky.<\/p>","image":"images/raja-ravi-varma/jatayu-vadham.jpg","credit":{"file":"File:Ravi Varma-Ravana Sita Jathayu.jpg","source":"https://commons.wikimedia.org/wiki/File:Ravi_Varma-Ravana_Sita_Jathayu.jpg","author":"Raja Ravi Varma","license":"Public domain","license_url":null}},{"id":"shakuntala","title":"Shakuntala","year":"1898","medium":"Oil on canvas","location":"India","description":"<p>Shakuntala, heroine of Kalidasa's great Sanskrit play, pretends to pull a thorn from her foot so that she can look back for a last glimpse of King Dushyanta, while her friends tease her. The twist of her body invites us into the story. Through prints this became one of the most familiar images in India.<\/p>","image":"images/raja-ravi-varma/shakuntala.jpg","credit":{"file":"File:Raja Ravi Varma - Mahabharata - Shakuntala.jpg","source":"https://commons.wikimedia.org/wiki/File:Raja_Ravi_Varma_-_Mahabharata_-_Shakuntala.jpg","author":"Raja Ravi Varma","license":"Public domain","license_url":null}},{"id":"hamsa-damayanti","title":"Hamsa Damayanti","year":"1899","medium":"Oil on canvas","location":"India","description":"<p>Princess Damayanti leans against a pillar by a palace pool, listening to a golden swan that tells her of the virtues of King Nala. The story comes from the <em>Mahabharata<\/em>. Her pensive, graceful pose and elegant sari made this one of Ravi Varma's most popular images of ideal Indian womanhood, reproduced endlessly in calendars and prints.<\/p>","image":"images/raja-ravi-varma/hamsa-damayanti.jpg","credit":{"file":"File:Ravi Varma-Princess Damayanthi talking with Royal Swan about Nala.jpg","source":"https://commons.wikimedia.org/wiki/File:Ravi_Varma-Princess_Damayanthi_talking_with_Royal_Swan_about_Nala.jpg","author":"Raja Ravi Varma","license":"Public domain","license_url":null}},{"id":"victory-of-meghanada","title":"Victory of Meghanada","year":"1905","medium":"Oil on canvas","location":"India","description":"<p>Another <em>Ramayana<\/em> scene. Ravana's son Meghanada (Indrajit), having defeated the god Indra, presents the spoils of heaven to his father's court, including captive celestial women. The large, crowded composition, painted in the artist's last years, shows his ambition to create an Indian equivalent of European grand history painting.<\/p>","image":"images/raja-ravi-varma/victory-of-meghanada.jpg","credit":{"file":"File:Victory of Meghanada by RRV.jpg","source":"https://commons.wikimedia.org/wiki/File:Victory_of_Meghanada_by_RRV.jpg","author":"Raja Ravi Varma","license":"Public domain","license_url":null}}]},{"slug":"antoni-gaudi","name":"Antoni Gaudí","lifespan":"1852–1926","born":1852,"died":1926,"year_label":"1852","region":"Europe","country":"Spain","movements":["Catalan Modernisme","Art Nouveau"],"discipline":["Architecture"],"summary":"The visionary architect of Catalan Modernisme, whose organic, structurally daring buildings, above all the still-unfinished Sagrada Família, made Barcelona his lifelong canvas.","sections":[{"title":"Overview","html":"<p>Antoni Gaudí i Cornet was the leading figure of Catalan Modernisme, the regional cousin of Art Nouveau, and arguably the most original architect of his era. Rather than draw from a pattern book of historical styles, he built as if imitating nature itself, using catenary arches, branching columns and hyperbolic vaults he considered ready-made by God, and clad them in shattered tile mosaic of his own invention. Almost all his mature work stands in a few square kilometres of Barcelona, commissioned largely by one devoted patron, and it culminates in a cathedral he knew he would never live to finish.<\/p>"},{"title":"Life","html":"<p>Gaudí was born on 25 June 1852 in Reus, Catalonia, the youngest son of a coppersmith; he later credited his father's boiler-making workshop, and its stock of curved copper vessels, with teaching him to see three-dimensional space before he could draw it on paper. Chronic rheumatism kept him from playing outdoors as a child, and he spent long hours instead observing plants and animals around his family's summer home. He studied at the Barcelona School of Architecture, graduating in 1878; the school's director is said to have remarked, on signing his diploma, that they had just given it to either a madman or a genius.<\/p>\n<p>That same year, a display case Gaudí designed for a Barcelona glove-maker caught the eye of the industrialist Eusebi Güell at the Paris World's Fair. Güell became his patron for the rest of his career, commissioning Palau Güell, Park Güell, a crypt for his textile colony, and more. Gaudí never married, grew increasingly devout with age, and by his sixties lived an almost monastic life, fasting for long stretches and devoting himself entirely to the Sagrada Família. On 7 June 1926, walking to church in worn, shabby clothes, he was struck by a tram; mistaken for a beggar, he received only delayed care, and died on 10 June 1926. Barcelona gave him a funeral procession several kilometres long, and he was buried in the crypt of his unfinished basilica.<\/p>"},{"title":"Style & Technique","html":"<p>Gaudí modelled his forms directly on nature: tree trunks became columns, honeycombs became vault cells, animal bones and shells suggested balconies and roofs. To find the ideal shape for a compression-only stone arch, he hung scale models of chains and sandbags and photographed them upside down, letting gravity solve the engineering for him before a single stone was cut. He revived trencadís, mosaic made from broken tile and crockery, as a cheap, weatherproof and endlessly flexible skin, and combined it with wrought iron, carved stone and stained glass made by craftsmen he trained himself. His early work leaned on Mudéjar and Gothic revival forms; from Casa Batlló onward these dissolved into an almost biomorphic vocabulary in which straight lines are rare.<\/p>"},{"title":"Legacy","html":"<p>Gaudí was a local celebrity in his lifetime but little known abroad, and modernist critics dismissed him after his death as a wilful eccentric outside the mainstream of 20th-century architecture. Salvador Dalí and the Surrealists were early champions; later architects and engineers, confronting computer-modelled free-form structures of their own, recognised how far ahead of his tools Gaudí's geometry had been. Seven of his Barcelona works are inscribed together as a UNESCO World Heritage Site. The Sagrada Família, funded entirely by ticket sales and donations rather than public money, is now one of the most visited monuments in Europe, with its main towers targeted for completion around the centenary of his death.<\/p>"}],"cover":"sagrada-familia","wikipedia":"https://en.wikipedia.org/wiki/Antoni_Gaud%C3%AD","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/antoni-gaudi.md","works":[{"id":"casa-vicens","title":"Casa Vicens","year":"1883–1885","medium":"Brick, ceramic tile and wrought iron","location":"Carrer de les Carolines, Barcelona, Spain","description":"<p>Gaudí's first major commission, built as a summer house for a tile manufacturer, and the building that announced his style: Mudéjar-inflected brickwork studded with green-and-white ceramic tiles shaped like marigolds, the flower that grew wild on the site. Iron palm-frond railings, cast from real leaves, guard the garden gate. It became a UNESCO World Heritage Site in 2005 and opened to the public as a museum in 2017.<\/p>","image":"images/antoni-gaudi/casa-vicens.jpg","credit":{"file":"File:Gaudí - Casa Vicens.JPG","source":"https://commons.wikimedia.org/wiki/File:Gaud%C3%AD_-_Casa_Vicens.JPG","author":"Canaan","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"palau-guell","title":"Palau Güell","year":"1886–1888","medium":"Stone, iron and Uruguayan pine, over a parabolic-arched brick basement","location":"Carrer Nou de la Rambla, Barcelona, Spain","description":"<p>A townhouse built just off Barcelona's Rambla for his lifelong patron, the industrialist Eusebi Güell. Behind a plain stone facade, Gaudí stacked parabolic arches to bring light into the dark, narrow site, and topped the roof with twenty tiled chimneys and ventilation cones, each a distinct sculptural experiment in trencadís, mosaic made of broken tile. It marks his shift from historical revival styles toward a structural language of his own.<\/p>","image":"images/antoni-gaudi/palau-guell.jpg","credit":{"file":"File:Palau Güell, Antoni Gaudi, Barcelona 2.jpg","source":"https://commons.wikimedia.org/wiki/File:Palau_G%C3%BCell,_Antoni_Gaudi,_Barcelona_2.jpg","author":"Thomas Ledl","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"park-guell","title":"Park Güell","year":"1900–1914","medium":"Stone, concrete and trencadís mosaic, laid out over 17 hectares","location":"La Salut, Barcelona, Spain","description":"<p>Commissioned by Eusebi Güell as an English-style garden city of sixty houses, of which only two were ever built; the failed development became a public park instead. Its centrepiece is a Doric-columned market hall topped by a serpentine bench encrusted with shattered tile and glass, and a mosaic salamander on the entrance stairway that became an emblem of the city. Gaudí lived in one of its show houses for nearly twenty years.<\/p>","image":"images/antoni-gaudi/park-guell.jpg","credit":{"file":"File:Parc guell - panoramio.jpg","source":"https://commons.wikimedia.org/wiki/File:Parc_guell_-_panoramio.jpg","author":"essetefano","license":"CC BY 3.0","license_url":"https://creativecommons.org/licenses/by/3.0"}},{"id":"casa-batllo","title":"Casa Batlló","year":"1904–1906","medium":"Sandstone facade, trencadís mosaic, cast iron and stained glass","location":"Passeig de Gràcia, Barcelona, Spain","description":"<p>A radical remodelling of an existing apartment block, its facade a rippling field of blue-green mosaic and bone-shaped balconies that earned it the nickname Casa dels Ossos, \"House of Bones.\" The tiled, arched roofline is usually read as a dragon's back, tied to the legend of St George, patron saint of Catalonia. Almost no straight line survives inside; even the light-wells are tiled in shades of blue graded from dark at the top to pale at the bottom, to spread daylight evenly.<\/p>","image":"images/antoni-gaudi/casa-batllo.jpg","credit":{"file":"File:Casa Batllo Overview Barcelona Spain cut.jpg","source":"https://commons.wikimedia.org/wiki/File:Casa_Batllo_Overview_Barcelona_Spain_cut.jpg","author":"ChristianSchd","license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0"}},{"id":"casa-mila","title":"Casa Milà (La Pedrera)","year":"1906–1912","medium":"Load-bearing limestone facade over a free-standing iron frame","location":"Passeig de Gràcia, Barcelona, Spain","description":"<p>Gaudí's last private commission before he devoted himself entirely to the Sagrada Família: an apartment building whose undulating stone facade earned it the nickname La Pedrera, \"the quarry.\" A structure of iron columns and floor slabs freed the walls of any load-bearing role, allowing curved, column-free interiors below a rooftop forest of chimneys and stairwells sculpted into helmeted, faceless warriors.<\/p>","image":"images/antoni-gaudi/casa-mila.jpg","credit":{"file":"File:Casa Milà, general view.jpg","source":"https://commons.wikimedia.org/wiki/File:Casa_Mil%C3%A0,_general_view.jpg","author":"Thomas Ledl","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"sagrada-familia","title":"Sagrada Família","year":"1882–present","medium":"Stone masonry and reinforced concrete, with hyperboloid and helicoidal vaulting","location":"Eixample, Barcelona, Spain","description":"<p>Gaudí took over this votive church in 1883, a year after it was begun, and rebuilt it around tree-like branching columns and parabolic vaults, with light filtered through forests of stained glass. He worked out its geometry largely through string-and-weight models rather than drawings. He gave his last forty years, and after 1914 his sole attention, to the project, eventually living on site. Still unfinished at his death, it remains under construction today, funded entirely by visitors and donations.<\/p>","image":"images/antoni-gaudi/sagrada-familia.jpg","credit":{"file":"File:SF maig 2 cropped.jpg","source":"https://commons.wikimedia.org/wiki/File:SF_maig_2_cropped.jpg","author":"Canaan","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}}]},{"slug":"van-gogh","name":"Vincent van Gogh","lifespan":"1853–1890","born":1853,"died":1890,"year_label":"1853","region":"Europe","country":"Netherlands (worked in France)","movements":["Post-Impressionism"],"discipline":["Painting"],"summary":"The Dutch painter whose vivid colour and expressive brushwork, created in a mere decade, made him the most famous artist of modern times.","sections":[{"title":"Overview","html":"<p>Vincent van Gogh painted for only about ten years, and most of his best-known works come from the last two. In that time he produced around 2,100 works, including some 860 oil paintings, and he sold almost nothing. His thick, swirling brushstrokes and intense, non-naturalistic colours turned the lessons of Impressionism and Japanese prints into a personal language of emotion. His letters, mainly to his brother Theo, are among the most moving documents of any artist's life. Today his paintings sell for record prices and draw millions of visitors.<\/p>"},{"title":"Life","html":"<p>Van Gogh was born on 30 March 1853 in Zundert, in the southern Netherlands, the son of a Protestant minister. At 16 he joined the art dealers Goupil &amp; Cie, working in The Hague, London and Paris, but was dismissed in 1876. He tried teaching and then preaching, living among coal miners in the Borinage in Belgium. In 1880, at 27, he decided to become an artist. His younger brother Theo, an art dealer, would support him for the rest of his life.<\/p>\n<p>He taught himself largely through drawing, working in the Netherlands and painting dark peasant scenes such as <em>The Potato Eaters<\/em> (1885). In 1886 he moved to Paris to live with Theo. There he met Pissarro, Toulouse-Lautrec, Émile Bernard and Gauguin, and discovered Impressionist colour and Japanese prints. His palette brightened dramatically.<\/p>\n<p>In February 1888 he moved to Arles in the south of France, dreaming of an artists' colony. Gauguin joined him in October, but the partnership collapsed in December. After a violent argument Van Gogh cut off part of his own ear. Repeated mental crises followed, and in May 1889 he voluntarily entered the asylum at Saint-Rémy-de-Provence, where he painted <em>The Starry Night<\/em>. In May 1890 he moved to Auvers-sur-Oise near Paris, under the care of Dr Paul Gachet. There he painted at a furious pace, about one canvas a day. On 27 July 1890 he shot himself in a field, and he died two days later, aged 37.<\/p>"},{"title":"Style & Technique","html":"<p>Van Gogh built his paintings from bold, directional brushstrokes of thick paint (<em>impasto<\/em>), which give his skies, fields and cypresses a sense of movement and energy. He used colour for emotional expression rather than accuracy. He set complementary colours against each other, such as blue and orange or red and green, to make them vibrate.<\/p>\n<p>From Japanese prints he took flat areas of colour, strong outlines and unusual viewpoints. He often painted outdoors, directly from the subject, and wrote detailed explanations of his aims to Theo. Even in his most intense works, his compositions are carefully planned, and he made many drawings and repeated versions.<\/p>"},{"title":"Legacy","html":"<p>Theo died six months after Vincent. Theo's widow, Johanna van Gogh-Bonger, devoted her life to promoting Vincent's work and published his letters in 1914. By the early 20th century his influence on Fauvism and German Expressionism was enormous. His life story, retold in Irving Stone's novel <em>Lust for Life<\/em> (1934) and its film, created the popular myth of the tortured genius. The Van Gogh Museum in Amsterdam opened in 1973, and paintings such as <em>Portrait of Dr Gachet<\/em> have set auction records.<\/p>"}],"cover":"starry-night","wikipedia":"https://en.wikipedia.org/wiki/Vincent_van_Gogh","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/van-gogh.md","works":[{"id":"potato-eaters","title":"The Potato Eaters","year":"1885","medium":"Oil on canvas, 82 × 114 cm","location":"Van Gogh Museum, Amsterdam","description":"<p>A peasant family in the Dutch village of Nuenen shares a meal of potatoes by the light of an oil lamp. Van Gogh deliberately painted their faces and hands coarse, the colour \"of a dusty potato\", to show people who had \"tilled the earth themselves with these very hands\". It was his first ambitious figure painting. It is dark, earthy and deeply sympathetic.<\/p>","image":"images/van-gogh/potato-eaters.jpg","credit":{"file":"File:De aardappeleters - s0005V1962 - Van Gogh Museum.jpg","source":"https://commons.wikimedia.org/wiki/File:De_aardappeleters_-_s0005V1962_-_Van_Gogh_Museum.jpg","author":"Vincent van Gogh","license":"Public domain","license_url":null}},{"id":"sunflowers","title":"Sunflowers","year":"1888","medium":"Oil on canvas, 92.1 × 73 cm","location":"National Gallery, London","description":"<p>Fifteen sunflowers, some bright and fresh, some wilting and going to seed, in a yellow vase on a yellow table against a yellow wall. Van Gogh painted it in Arles to decorate the room of his friend Paul Gauguin. He made several versions, and the series became his signature: an exploration of how far one colour could go, and a symbol of gratitude and friendship.<\/p>","image":"images/van-gogh/sunflowers.jpg","credit":{"file":"File:Vincent Willem van Gogh 127.jpg","source":"https://commons.wikimedia.org/wiki/File:Vincent_Willem_van_Gogh_127.jpg","author":"Vincent van Gogh","license":"Public domain","license_url":null}},{"id":"bedroom-in-arles","title":"The Bedroom","year":"1888","medium":"Oil on canvas, 72.4 × 91.3 cm","location":"Van Gogh Museum, Amsterdam","description":"<p>Van Gogh's own room in the Yellow House in Arles, painted with flat, bright colours and a steeply tilted floor. He wrote that it should express \"absolute restfulness\" and suggest sleep. The simple furniture and paired objects hint at his hope that Gauguin would come to share his life. He painted three versions.<\/p>","image":"images/van-gogh/bedroom-in-arles.jpg","credit":{"file":"File:Vincent van Gogh - De slaapkamer - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg","author":null,"license":"Public domain","license_url":null}},{"id":"starry-night","title":"The Starry Night","year":"1889","medium":"Oil on canvas, 73.7 × 92.1 cm","location":"Museum of Modern Art, New York","description":"<p>The view from Van Gogh's window at the asylum in Saint-Rémy, just before sunrise, transformed by memory and imagination. The sky swirls with spiralling wind, eleven blazing stars and a crescent moon, over a quiet village with an invented church spire and a flame-like cypress. He himself was unsure of it, but it has become one of the most recognised paintings in the world.<\/p>","image":"images/van-gogh/starry-night.jpg","credit":{"file":"File:Van Gogh - Starry Night - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg","author":"Vincent van Gogh","license":"Public domain","license_url":null}},{"id":"almond-blossoms","title":"Almond Blossom","year":"1890","medium":"Oil on canvas, 73.3 × 92.4 cm","location":"Van Gogh Museum, Amsterdam","description":"<p>Branches of white almond blossom against a clear blue sky, a symbol of new life. Van Gogh painted it in February 1890 to celebrate the birth of his nephew, Theo's son, who was named Vincent Willem after him. The bold outlines and flat background owe much to Japanese prints. The baby later helped found the Van Gogh Museum.<\/p>","image":"images/van-gogh/almond-blossoms.jpg","credit":{"file":"File:Vincent van Gogh - Almond blossom - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_Almond_blossom_-_Google_Art_Project.jpg","author":"Vincent van Gogh","license":"Public domain","license_url":null}},{"id":"wheatfield-with-crows","title":"Wheatfield with Crows","year":"1890","medium":"Oil on canvas, 50.5 × 103 cm","location":"Van Gogh Museum, Amsterdam","description":"<p>A wide field of wheat under a dark, stormy blue sky, with black crows flying low and three paths leading nowhere. Painted at Auvers-sur-Oise in July 1890, weeks before his death, it is often wrongly called his last painting. Van Gogh wrote of such fields as expressing \"sadness, extreme loneliness\", but also the healthy, strengthening power of the countryside.<\/p>","image":"images/van-gogh/wheatfield-with-crows.jpg","credit":{"file":"File:Korenveld met kraaien - s0149V1962 - Van Gogh Museum.jpg","source":"https://commons.wikimedia.org/wiki/File:Korenveld_met_kraaien_-_s0149V1962_-_Van_Gogh_Museum.jpg","author":"Vincent van Gogh","license":"Public domain","license_url":null}}]},{"slug":"henry-ossawa-tanner","name":"Henry Ossawa Tanner","lifespan":"1859–1937","born":1859,"died":1937,"year_label":"1859","region":"Americas","country":"United States (worked in France)","movements":["Realism","Symbolism"],"discipline":["Painting"],"summary":"The first African American painter to win international fame, known for his dignified genre scenes and luminous biblical paintings.","sections":[{"title":"Overview","html":"<p>Henry Ossawa Tanner was the most accomplished African American artist of the 19th century and the first to gain international acclaim. Frustrated by racism in the United States, he settled in Paris in 1891 and built his career there, winning medals at the Paris Salon. He is best known for two groups of paintings. The first is a few powerful genre scenes of Black American life that challenged racist stereotypes. The second is his many religious paintings, bathed in glowing blue and gold light and informed by travels in the Holy Land.<\/p>"},{"title":"Life","html":"<p>Tanner was born on 21 June 1859 in Pittsburgh, Pennsylvania, the eldest of nine children. His father, Benjamin Tucker Tanner, became a bishop of the African Methodist Episcopal Church, and his mother, Sarah, had escaped slavery via the Underground Railroad. The family moved to Philadelphia. At 13, seeing a painter at work in a park, Henry decided to become an artist.<\/p>\n<p>In 1879 he enrolled at the Pennsylvania Academy of the Fine Arts, studying with Thomas Eakins, who encouraged his realism. He was the only Black student and faced harassment. After years of struggle, including running a photography studio in Atlanta, he left for Europe in 1891 and studied at the Académie Julian in Paris. On a return visit to the United States in 1893 he painted <em>The Banjo Lesson<\/em> and <em>The Thankful Poor<\/em>.<\/p>\n<p>Back in France, he turned to biblical subjects. <em>The Resurrection of Lazarus<\/em> won a medal at the 1897 Salon, and the French government bought it. His patron Rodman Wanamaker paid for trips to Egypt and Palestine to study the landscapes and people of the Bible. He married a white Swedish-American singer, Jessie Olssen, in 1899. Their son Jesse was born in 1903. Tanner lived in Paris and in the artists' colony of Trépied on the Normandy coast, and was made a Chevalier of the Légion d'honneur in 1923. He died in Paris on 25 May 1937.<\/p>"},{"title":"Style & Technique","html":"<p>Tanner's early work reflects the realism of Thomas Eakins, with solid figures, careful observation and honest treatment of everyday life. In France his style became softer and more atmospheric. He came to prefer a limited palette dominated by deep blues and blue-greens, which became his signature, with glowing highlights of gold light.<\/p>\n<p>In his religious paintings he aimed for historical and emotional truth. He studied the landscapes, architecture and costumes of the Middle East and modelled biblical figures on ordinary people. He often reworked his canvases for years, building up layers of glazes to achieve their mysterious, luminous effects.<\/p>"},{"title":"Legacy","html":"<p>Tanner opened a path for African American artists. He advised younger painters such as William Edouard Scott and Hale Woodruff, and he was a hero to the artists of the Harlem Renaissance. In 1996 his <em>Sand Dunes at Sunset, Atlantic City<\/em> became the first painting by an African American artist in the White House collection. Major retrospectives, including <em>Modern Spirit<\/em> at the Pennsylvania Academy of the Fine Arts in 2012, have secured his place in American art history. A US postage stamp honoured him in 1973.<\/p>"}],"cover":"the-banjo-lesson","wikipedia":"https://en.wikipedia.org/wiki/Henry_Ossawa_Tanner","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/henry-ossawa-tanner.md","works":[{"id":"the-banjo-lesson","title":"The Banjo Lesson","year":"1893","medium":"Oil on canvas, 124.5 × 90.2 cm","location":"Hampton University Museum, Virginia","description":"<p>An elderly Black man patiently teaches a small boy on his lap to play the banjo, in a simple room lit by a warm fire and cool daylight. Tanner deliberately countered the demeaning minstrel-show stereotypes of Black musicians. He showed instead the dignity, tenderness and knowledge passed from one generation to the next. It is one of the landmarks of African American art.<\/p>","image":"images/henry-ossawa-tanner/the-banjo-lesson.jpg","credit":{"file":"File:Henry Ossawa Tanner, The Banjo Lesson (darker).jpg","source":"https://commons.wikimedia.org/wiki/File:Henry_Ossawa_Tanner,_The_Banjo_Lesson_(darker).jpg","author":"Henry Ossawa Tanner","license":"Public domain","license_url":null}},{"id":"the-thankful-poor","title":"The Thankful Poor","year":"1894","medium":"Oil on canvas, 90.2 × 112.4 cm","location":"Private collection","description":"<p>A grandfather and grandson bow their heads in grace over a modest meal. Based on photographs Tanner took, the painting presents a Black family with quiet spiritual strength, reflecting the values of his father, a bishop of the African Methodist Episcopal Church. In 1981 it set an auction record for an African American artist.<\/p>","image":"images/henry-ossawa-tanner/the-thankful-poor.jpg","credit":{"file":"File:The Thankful Poor, 1894. Henry Ossawa Tanner.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Thankful_Poor,_1894._Henry_Ossawa_Tanner.jpg","author":"Henry Ossawa Tanner","license":"Public domain","license_url":null}},{"id":"resurrection-of-lazarus","title":"The Resurrection of Lazarus","year":"1896","medium":"Oil on canvas, 95 × 120.5 cm","location":"Musée d'Orsay, Paris","description":"<p>In a dim tomb, Christ gestures as the pale Lazarus stirs back to life, watched by astonished onlookers in Middle Eastern dress. The painting won a medal at the 1897 Paris Salon and was bought by the French state, a rare honour for any American. It made Tanner famous on both sides of the Atlantic.<\/p>","image":"images/henry-ossawa-tanner/resurrection-of-lazarus.jpg","credit":{"file":"File:Resurrection of Lazarus by Henry Ossawa Tanner.jpg","source":"https://commons.wikimedia.org/wiki/File:Resurrection_of_Lazarus_by_Henry_Ossawa_Tanner.jpg","author":"Henry Ossawa Tanner","license":"Public domain","license_url":null}},{"id":"the-annunciation","title":"The Annunciation","year":"1898","medium":"Oil on canvas, 144.8 × 181 cm","location":"Philadelphia Museum of Art","description":"<p>Painted after Tanner's first trip to Palestine, it shows Mary as a young Middle Eastern girl in a rumpled nightdress, sitting on her bed. Instead of a winged figure, the angel Gabriel appears as a column of golden light. The mix of everyday realism and mystical glow is typical of Tanner's religious work. It was the first of his paintings bought by an American museum.<\/p>","image":"images/henry-ossawa-tanner/the-annunciation.jpg","credit":{"file":"File:The Annunciation, Philadelphia Museum of Art, W1899-1-1-pma, by Henry Ossawa Tanner.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Annunciation,_Philadelphia_Museum_of_Art,_W1899-1-1-pma,_by_Henry_Ossawa_Tanner.jpg","author":"Henry Ossawa Tanner","license":"Public domain","license_url":null}},{"id":"the-seine","title":"The Seine","year":"c. 1902","medium":"Oil on canvas, 22.8 × 33 cm","location":"National Gallery of Art, Washington","description":"<p>A small, atmospheric view of the river in Paris at dusk, with a bridge and quays dissolving into blue haze. Tanner lived in France for most of his career, and he painted many such tonal, poetic landscapes, influenced by Whistler, alongside his large religious works.<\/p>","image":"images/henry-ossawa-tanner/the-seine.jpg","credit":{"file":"File:Henry Ossawa Tanner, The Seine, c. 1902, NGA 52624.jpg","source":"https://commons.wikimedia.org/wiki/File:Henry_Ossawa_Tanner,_The_Seine,_c._1902,_NGA_52624.jpg","author":"Henry Ossawa Tanner","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}},{"id":"daniel-in-the-lions-den","title":"Daniel in the Lions' Den","year":"1907–1918","medium":"Oil on paper mounted on canvas","location":"Los Angeles County Museum of Art","description":"<p>The prophet Daniel stands calmly in the pit while lions pace around him, lit by a shaft of light from a high window. Tanner reworked the subject over many years. The deep blue-green tones and glowing light are characteristic of his mature style, and they give the scene a quiet, spiritual mood rather than violent drama.<\/p>","image":"images/henry-ossawa-tanner/daniel-in-the-lions-den.jpg","credit":{"file":"File:Daniel in the Lions' Den LACMA 22.6.3.jpg","source":"https://commons.wikimedia.org/wiki/File:Daniel_in_the_Lions%27_Den_LACMA_22.6.3.jpg","author":"Henry Ossawa Tanner (United States, Pennsylvania, Pittsburgh, 1859-1937)","license":"Public domain","license_url":null}}]},{"slug":"alphonse-mucha","name":"Alphonse Mucha","lifespan":"1860–1939","born":1860,"died":1939,"year_label":"1860","region":"Europe","country":"Austria-Hungary (Moravia, now Czech Republic)","movements":["Art Nouveau"],"discipline":["Design"],"summary":"The Moravian-born designer whose decorative posters for Sarah Bernhardt and countless commercial clients defined the visual style of Art Nouveau.","sections":[{"title":"Overview","html":"<p>Alphonse Mucha became, almost overnight, the defining graphic designer of the Art Nouveau era after a chance commission to design a poster for Sarah Bernhardt in 1894. His formula, elongated figures of women set within intricate, jewel-like ornamental frames, was reproduced across theatre posters, cigarette papers, bicycles and calendars, making his decorative style one of the most widely seen visual languages of the 1890s and 1900s. He resisted the \"Art Nouveau\" label himself, seeing his true purpose in a vast, largely separate project celebrating the history of the Slavic peoples.<\/p>"},{"title":"Life","html":"<p>Mucha was born in 1860 in Ivančice, in Moravia, then part of Austria-Hungary, and worked as a theatrical scene painter before moving to Paris in 1887 to study and work as an illustrator. His career changed direction in December 1894, when a Paris printing house needed a poster for Sarah Bernhardt's play <em>Gismonda<\/em> at short notice over the holiday season and turned to Mucha as the only designer available; its success led Bernhardt to sign him to a six-year contract producing posters, sets and costumes for her theatre. Through the following decade he designed a steady stream of commercial advertising and decorative panels, and in 1902 published <em>Documents décoratifs<\/em>, a pattern book of his ornamental style aimed at other designers and craftsmen, spreading his influence across European decorative art. From around 1910 he devoted much of his remaining career to <em>The Slav Epic<\/em>, a cycle of twenty monumental canvases on Slavic history that he considered his true life's work, donating it to the city of Prague. Shortly after Nazi Germany occupied Czechoslovakia in 1939, Mucha, a prominent Czech nationalist, was arrested and interrogated by the Gestapo; he died months later, reportedly of complications following his detention.<\/p>"},{"title":"Style & Technique","html":"<p>Mucha's mature style placed decorative female figures, often personifying a season, a flower or a product, at the centre of tall, narrow compositions framed by intricate ornamental haloes and borders drawing on Byzantine mosaic and Rococo decoration, rendered in muted, harmonious colour lithography. Because his work was produced as inexpensive printed posters and panels rather than one-off paintings, it reached a far wider public than gallery art of the period, effectively carrying fine decorative design into shops, cafés and middle-class living rooms across Europe.<\/p>"},{"title":"Legacy","html":"<p>Mucha's decorative vocabulary became so closely associated with the period that \"Mucha style\" is often used interchangeably with \"Art Nouveau\" itself, and his posters remain among the most reproduced graphic designs from the era. His influence resurfaced directly in the psychedelic concert-poster art of the 1960s, whose designers frequently borrowed his flowing hair and ornamental frames. In the Czech Republic he is remembered above all as a national artistic figure through <em>The Slav Epic<\/em>, now on permanent public display in Prague.<\/p>"}],"cover":"gismonda","wikipedia":"https://en.wikipedia.org/wiki/Alphonse_Mucha","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/alphonse-mucha.md","works":[{"id":"gismonda","title":"Gismonda","year":"1894","medium":"Colour lithograph poster","location":"Paris, France","description":"<p>A rush job taken on over the Christmas holidays when no other designer was available, this poster for Sarah Bernhardt's play made Mucha famous overnight. Its unusually tall, narrow format and muted, mosaic-like decoration were so unlike conventional theatre advertising that Bernhardt signed him to a six-year contract designing posters, sets and costumes for her productions.<\/p>","image":"images/alphonse-mucha/gismonda.jpg","credit":{"file":"File:Alphonse Mucha - Poster for Victorien Sardou's Gismonda starring Sarah Bernhardt.jpg","source":"https://commons.wikimedia.org/wiki/File:Alphonse_Mucha_-_Poster_for_Victorien_Sardou%27s_Gismonda_starring_Sarah_Bernhardt.jpg","author":"Alphonse Mucha / Adam Cuerden","license":"Public domain","license_url":null}},{"id":"job-poster","title":"Job (cigarette papers)","year":"1896","medium":"Colour lithograph poster","location":"Paris, France","description":"<p>An advertisement for a brand of cigarette rolling papers, its central figure's hair spiralling out to fill the entire circular frame in smoke-like tendrils. It became one of the most widely reproduced commercial posters of the era, spreading the \"Mucha style\" of decorative female figures far beyond theatre advertising into everyday consumer branding.<\/p>","image":"images/alphonse-mucha/job-poster.jpg","credit":{"file":"File:Alphonse Mucha - Advertisment for Job cigarettes, 1896.jpg","source":"https://commons.wikimedia.org/wiki/File:Alphonse_Mucha_-_Advertisment_for_Job_cigarettes,_1896.jpg","author":"Alphonse Mucha","license":"Public domain","license_url":null}},{"id":"zodiac","title":"Zodiac","year":"1896","medium":"Colour lithograph","location":"Paris, France","description":"<p>Originally a calendar design for a printing house, later reissued on its own as a decorative panel, showing a woman in profile crowned by a jewelled halo bearing the twelve zodiac signs. Its ornamental frame, rather than the figure itself, became the design's most imitated element, reproduced on countless later calendars, biscuit tins and packaging.<\/p>","image":"images/alphonse-mucha/zodiac.jpg","credit":{"file":"File:Alphonse Mucha - Zodiac.jpg","source":"https://commons.wikimedia.org/wiki/File:Alphonse_Mucha_-_Zodiac.jpg","author":"Alphonse Mucha","license":"Public domain","license_url":null}},{"id":"the-seasons","title":"The Seasons","year":"1896","medium":"Colour lithograph, four-panel decorative series","location":"Paris, France","description":"<p>A set of four decorative panels personifying Spring, Summer, Autumn and Winter as women set against stylised landscapes, sold as affordable prints for middle-class homes rather than as advertising. Series like this made Mucha's decorative style available well beyond the theatre-poster market that had launched him.<\/p>","image":"images/alphonse-mucha/the-seasons.jpg","credit":{"file":"File:Alfons Mucha - The Seasons (series), 1896.jpg","source":"https://commons.wikimedia.org/wiki/File:Alfons_Mucha_-_The_Seasons_(series),_1896.jpg","author":"Alphonse Mucha","license":"Public domain","license_url":null}},{"id":"cycles-perfecta","title":"Cycles Perfecta","year":"1902","medium":"Colour lithograph poster","location":"Paris, France","description":"<p>An advertisement for a French bicycle brand, its rider's windswept hair turned into the same decorative, flowing arabesques Mucha had developed for theatre posters years earlier, showing how thoroughly his ornamental vocabulary had by then become the default look of French commercial advertising.<\/p>","image":"images/alphonse-mucha/cycles-perfecta.jpg","credit":{"file":"File:Alfons Mucha - 1902 - Cycles Perfecta.jpg","source":"https://commons.wikimedia.org/wiki/File:Alfons_Mucha_-_1902_-_Cycles_Perfecta.jpg","author":"Alphonse Mucha","license":"Public domain","license_url":null}}]},{"slug":"georges-melies","name":"Georges Méliès","lifespan":"1861–1938","born":1861,"died":1938,"year_label":"1861","region":"Europe","country":"France","movements":["Early cinema","Trick film"],"discipline":["Film"],"summary":"The stage magician turned filmmaker who invented cinema's first special effects and its first trip to the Moon.","sections":[{"title":"Overview","html":"<p>Georges Méliès was a Paris stage magician who, within a year of seeing the Lumière brothers' first film screening in 1895, built his own camera, opened a working film studio, and began inventing the visual grammar of trick photography almost from nothing. Over roughly 500 films made in under twenty years, he pioneered stop-motion substitution, multiple exposure, dissolves and hand-painted colour, and turned cinema from a novelty for recording reality into a machine for staging the impossible.<\/p>"},{"title":"Life","html":"<p>Méliès was born in Paris in 1861 to a prosperous shoe-manufacturing family and trained as a painter before buying the Théâtre Robert-Houdin, a famous conjuring theatre, in 1888. After attending the Lumière brothers' first public film screening in December 1895, he tried to buy a camera from them and was refused, so he acquired one from a British inventor instead and built his own studio at Montreuil, complete with a glass-walled stage that let him control light like a photographer. Around 1896 he discovered, by accident when his camera jammed mid-shot, that stopping and restarting filming could make objects vanish or transform, the basis of the trick films that made him internationally famous, culminating in <em>A Trip to the Moon<\/em> in 1902. American piracy of his films, the rise of narrative-driven studio filmmaking, and the disruption of the First World War ruined his business; he was reduced to running a toy stall in a Paris train station before being rediscovered and honoured late in life. He died in Paris in 1938.<\/p>"},{"title":"Style & Technique","html":"<p>Méliès treated the camera as a magician's prop rather than a recording device, developing the \"stop trick\" (halting the camera to swap or remove a subject, then resuming filming to create a seamless transformation), multiple exposure, dissolves, and elaborate hand-painted glass and canvas sets built to force perspective. Colour prints were tinted by hand, frame by frame, in an assembly line of women colourists at his studio. Where the Lumières had pointed a camera at real life, Méliès built an entire theatrical world in front of it, closer to stage illusion than documentary.<\/p>"},{"title":"Legacy","html":"<p>Méliès is now regarded as the father of narrative and special-effects filmmaking, and <em>A Trip to the Moon<\/em> as one of the most important films ever made, its imagery still endlessly quoted and parodied. Forgotten and impoverished by the 1920s, he was rediscovered in his final decade, awarded the Légion d'honneur, and given a small pension. His full rehabilitation in popular culture arrived generations later, notably through Martin Scorsese's 2011 film <em>Hugo<\/em>, which dramatised his life and reintroduced his work to new audiences.<\/p>"}],"cover":"a-trip-to-the-moon","wikipedia":"https://en.wikipedia.org/wiki/Georges_M%C3%A9li%C3%A8s","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/georges-melies.md","works":[{"id":"vanishing-lady","title":"The Vanishing Lady","year":"1896","medium":"Silent film, black-and-white, 35mm, about 1 minute","location":"Star Film Company, Montreuil, France","description":"<p>One of Méliès's earliest trick films, made within months of discovering, by accident, that stopping and restarting his camera mid-shot could make an object or person vanish and reappear. Here a woman disappears from a chair, is replaced by a skeleton, and reappears, the basic \"stop trick\" that launched his career as cinema's first great illusionist.<\/p>","image":"images/georges-melies/vanishing-lady.jpg","credit":{"file":"File:Méliès, Escamotage d'une dame chez Robert-Houdin (Star Film 70, 1896).jpg","source":"https://commons.wikimedia.org/wiki/File:M%C3%A9li%C3%A8s,_Escamotage_d%27une_dame_chez_Robert-Houdin_(Star_Film_70,_1896).jpg","author":"Georges Méliès","license":"Public domain","license_url":null}},{"id":"a-trip-to-the-moon","title":"A Trip to the Moon","year":"1902","medium":"Silent film, black-and-white and hand-tinted colour, 35mm, about 13 minutes","location":"Star Film Company, Montreuil, France","description":"<p>Cinema's first true science-fiction film, loosely adapted from Jules Verne and H. G. Wells, following astronomers who fire themselves to the Moon by cannon and battle its insect-like inhabitants, the Selenites. Its image of the capsule lodged in the Man in the Moon's eye is among the most reproduced in film history. Méliès hand-painted colour prints frame by frame in his own studio.<\/p>","image":"images/georges-melies/a-trip-to-the-moon.jpg","credit":{"file":"File:Le Voyage dans la lune.jpg","source":"https://commons.wikimedia.org/wiki/File:Le_Voyage_dans_la_lune.jpg","author":"Georges Méliès","license":"Public domain","license_url":null}},{"id":"kingdom-of-the-fairies","title":"The Kingdom of the Fairies","year":"1903","medium":"Silent film, black-and-white, 35mm, about 17 minutes","location":"Star Film Company, Montreuil, France","description":"<p>An elaborate fairy-tale spectacle, one of the longest and most expensively staged films of its day, moving a kidnapped princess through underwater grottoes, an ice palace and a wedding procession across more than twenty painted sets. It shows Méliès at the height of his output as, in effect, the theatre magician he had been before cinema, now with a camera as his stage.<\/p>","image":"images/georges-melies/kingdom-of-the-fairies.jpg","credit":{"file":"File:Royaume des fees.jpg","source":"https://commons.wikimedia.org/wiki/File:Royaume_des_fees.jpg","author":"Georges Méliès","license":"Public domain","license_url":null}},{"id":"impossible-voyage","title":"The Impossible Voyage","year":"1904","medium":"Silent film, black-and-white and hand-tinted colour, 35mm, about 24 minutes","location":"Star Film Company, Montreuil, France","description":"<p>A follow-up to <em>A Trip to the Moon<\/em>, sending a party of scientists by train, car, submarine and balloon across the globe and into the sun itself, satirising Jules Verne's adventure novels and the era's faith in engineering. Its miniature sets and multiple exposures pushed his in-camera effects further than any of his earlier films.<\/p>","image":"images/georges-melies/impossible-voyage.jpg","credit":{"file":"File:Impossible Voyage 2.jpg","source":"https://commons.wikimedia.org/wiki/File:Impossible_Voyage_2.jpg","author":"Georges Méliès","license":"Public domain","license_url":null}},{"id":"conquest-of-the-pole","title":"The Conquest of the Pole","year":"1912","medium":"Silent film, black-and-white and hand-tinted colour, 35mm, about 30 minutes","location":"Star Film Company, Montreuil, France","description":"<p>One of Méliès's last films, sending a competing international expedition to the North Pole by flying machine, where they encounter a giant \"Snow Giant.\" Made as the fashion for hand-crafted trick films was giving way to narrative realism, it sold poorly and hastened his retirement from filmmaking two years later.<\/p>","image":"images/georges-melies/conquest-of-the-pole.jpg","credit":{"file":"File:Conquest of the Pole 1912 Melies.jpg","source":"https://commons.wikimedia.org/wiki/File:Conquest_of_the_Pole_1912_Melies.jpg","author":"Unknown author Unknown author","license":"Public domain","license_url":null}}]},{"slug":"lumiere-brothers","name":"Auguste and Louis Lumière","lifespan":"1862–1954","born":1862,"died":1954,"year_label":"1862","region":"Europe","country":"France","movements":["Early cinema","Actuality film"],"discipline":["Film"],"summary":"The French brothers whose Cinématographe and first public film screening, in a Paris basement in 1895, launched cinema as a shared public medium.","sections":[{"title":"Overview","html":"<p>Auguste and Louis Lumière were manufacturers of photographic plates in Lyon who, in 1895, patented the Cinématographe, a single lightweight device that could shoot, print and project film, and used it to stage the first paying public screening of projected motion pictures in history. Their short, unedited \"actuality\" films of everyday life, workers, trains, family meals, established projected cinema as a shared public experience rather than a private peep-show novelty, and their camera operators carried the new medium to audiences on every continent within a few years.<\/p>"},{"title":"Life","html":"<p>Born in Besançon, Auguste in 1862 and Louis in 1864, the brothers grew up in Lyon, where their father Antoine ran a photographic portrait studio and later a factory producing dry photographic plates, a business the sons helped industrialise and expand. After their father saw a demonstration of Thomas Edison's Kinetoscope, a single-viewer peephole device, in 1894, the brothers set out to build something that could project moving images to a seated audience. Louis is generally credited with the key mechanical insight, adapting the sewing machine's intermittent claw movement to advance film steadily through the camera. They patented the Cinématographe in February 1895 and held their first paying public screening on 28 December 1895 in the basement of the Grand Café on Paris's Boulevard des Capucines, showing ten short films to an audience of about thirty-five people. Within two years they largely withdrew from film production to focus on other photographic ventures, notably the Autochrome, an early commercially successful colour photography process they introduced in 1907. Louis died in 1948 and Auguste in 1954.<\/p>"},{"title":"Style & Technique","html":"<p>The Lumières' films, later called \"actualities,\" were almost always a single static, carefully composed shot lasting under a minute, unedited and largely unstaged, aimed at capturing recognisable fragments of everyday life rather than telling a constructed story. Their choice of camera position, often placed to let motion develop in depth toward or away from the lens rather than sideways across the frame, gave ordinary subjects, a train, spilled water, toppling bricks, an unexpected charge. <em>L'Arroseur arrosé<\/em> stands apart as a rare deliberately staged, scripted gag, effectively cinema's first fiction film.<\/p>"},{"title":"Legacy","html":"<p>The Lumières sent camera operators around the world to film and screen their actualities, effectively creating the first global newsreel and travelogue circuit and spreading projected cinema to India, Japan, Australia and the Americas within a year or two of that first Paris screening. Though Louis and Auguste stepped back from filmmaking itself by the turn of the century, the technical and commercial model they established, a projected film shown to a paying audience, remained the basic shape of cinema for the century that followed. \"Lumière\" is still used across French-speaking cinema as shorthand for the medium's very beginning.<\/p>"}],"cover":"arrival-of-a-train","wikipedia":"https://en.wikipedia.org/wiki/Auguste_and_Louis_Lumi%C3%A8re","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/lumiere-brothers.md","works":[{"id":"workers-leaving-the-factory","title":"Workers Leaving the Lumière Factory","year":"1895","medium":"Silent film, black-and-white, 35mm, under 1 minute","location":"Lumière factory, Lyon, France","description":"<p>A single, unedited shot of employees streaming out of the Lumière family's own photographic plate factory at the end of the working day. Shown at the brothers' first paying public screening on 28 December 1895, it is often cited as the first true motion picture ever exhibited to an audience, and they filmed at least three separate versions of it.<\/p>","image":"images/lumiere-brothers/workers-leaving-the-factory.jpg","credit":{"file":"File:La sortie des usines Lumiere.jpg","source":"https://commons.wikimedia.org/wiki/File:La_sortie_des_usines_Lumiere.jpg","author":"Louis Lumière","license":"Public domain","license_url":null}},{"id":"arrival-of-a-train","title":"The Arrival of a Train at La Ciotat","year":"1896","medium":"Silent film, black-and-white, 35mm, under 1 minute","location":"La Ciotat railway station, France","description":"<p>A train pulls into a seaside station as passengers wait on the platform, filmed from an angle that lets the locomotive grow rapidly toward the camera. A durable, probably exaggerated legend holds that early audiences screamed and ducked for cover, taking the image for a real train bearing down on them.<\/p>","image":"images/lumiere-brothers/arrival-of-a-train.jpg","credit":{"file":"File:Arrivée d’un train à La Ciotat 1897.png","source":"https://commons.wikimedia.org/wiki/File:Arriv%C3%A9e_d%E2%80%99un_train_%C3%A0_La_Ciotat_1897.png","author":"Louis Lumière","license":"Public domain","license_url":null}},{"id":"feeding-the-baby","title":"Le Repas de bébé (Feeding the Baby)","year":"1895","medium":"Silent film, black-and-white, 35mm, under 1 minute","location":"La Ciotat, France","description":"<p>Auguste Lumière, his wife and their infant daughter share breakfast in the garden of the family's holiday home, a scene notable at the time less for its subject than for the leaves visibly stirring in the background, incidental motion that struck audiences accustomed to still photography as almost magical.<\/p>","image":"images/lumiere-brothers/feeding-the-baby.jpg","credit":{"file":"File:Le Repas de bébé (1895).jpg","source":"https://commons.wikimedia.org/wiki/File:Le_Repas_de_b%C3%A9b%C3%A9_(1895).jpg","author":"Auguste Lumière","license":"Public domain","license_url":null}},{"id":"the-sprinkler-sprinkled","title":"L'Arroseur arrosé (The Sprinkler Sprinkled)","year":"1895","medium":"Silent film, black-and-white, 35mm, under 1 minute","location":"Lyon, France","description":"<p>A boy sneaks up on a gardener watering a lawn, steps on the hose to cut the flow, then lifts his foot just as the gardener peers into the nozzle, soaking him. Staged and acted rather than simply observed, it is generally regarded as cinema's first scripted comedy.<\/p>","image":"images/lumiere-brothers/the-sprinkler-sprinkled.jpg","credit":{"file":"File:L'Arroseur arrosé (Louis Lumière, 1895).png","source":"https://commons.wikimedia.org/wiki/File:L%27Arroseur_arros%C3%A9_(Louis_Lumi%C3%A8re,_1895).png","author":"TB54","license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0"}},{"id":"demolition-of-a-wall","title":"Démolition d'un mur (Demolition of a Wall)","year":"1896","medium":"Silent film, black-and-white, 35mm, under 1 minute","location":"Lyon, France","description":"<p>Workers topple a brick wall with picks and a rope, a mundane demonstration of the new camera's ability to record real motion. The Lumières discovered that running the film backwards made the wall reassemble itself, one of the medium's first accidental special effects and an early hint of cinema's power to reverse and manipulate time.<\/p>","image":"images/lumiere-brothers/demolition-of-a-wall.jpg","credit":{"file":"File:La Démolition d'un mur.jpg","source":"https://commons.wikimedia.org/wiki/File:La_D%C3%A9molition_d%27un_mur.jpg","author":"Louis Lumière","license":"CC0","license_url":"http://creativecommons.org/publicdomain/zero/1.0/deed.en"}}]},{"slug":"klimt","name":"Gustav Klimt","lifespan":"1862–1918","born":1862,"died":1918,"year_label":"1862","region":"Europe","country":"Austria","movements":["Vienna Secession","Symbolism","Art Nouveau"],"discipline":["Painting"],"summary":"Leader of the Vienna Secession, whose golden, patterned paintings of women and love are icons of turn-of-the-century Vienna.","sections":[{"title":"Overview","html":"<p>Gustav Klimt was the central figure of Viennese art around 1900. He began as a successful decorator of public buildings, then broke with the conservative establishment to found the Vienna Secession, a movement that championed modern art and the unity of all the arts. His paintings mix realistic faces and bodies with flat, jewel-like ornament and real gold leaf. They explore love, desire, death and the cycle of life. <em>The Kiss<\/em> and the <em>Portrait of Adele Bloch-Bauer I<\/em> are among the most famous images in the world.<\/p>"},{"title":"Life","html":"<p>Klimt was born on 14 July 1862 at Baumgarten, near Vienna, the second of seven children of a gold engraver. He won a scholarship to the Vienna School of Arts and Crafts in 1876. With his brother Ernst and his friend Franz Matsch he formed the Künstler-Compagnie (\"Company of Artists\"), which painted murals and ceilings for the Burgtheater and the Kunsthistorisches Museum in Vienna.<\/p>\n<p>In 1892 his father and brother Ernst both died, and Klimt's style began to change. In 1897 he became the first president of the Vienna Secession, a group of artists who broke away from the official academy with the motto \"To every age its art, to art its freedom\". His ceiling paintings for the University of Vienna, showing <em>Philosophy<\/em>, <em>Medicine<\/em> and <em>Jurisprudence<\/em>, caused a public scandal over their nudity and pessimism. He withdrew from the commission, and the paintings were later destroyed in a fire in 1945.<\/p>\n<p>Klimt never married but had a lifelong companionship with the fashion designer Emilie Flöge and fathered several children with his models. He spent summers painting landscapes by the Attersee lake. He supported younger artists such as Egon Schiele and Oskar Kokoschka. He died in Vienna on 6 February 1918, after a stroke, during the influenza pandemic.<\/p>"},{"title":"Style & Technique","html":"<p>Klimt's mature style joins sharp, sensitive drawing of faces and hands with flat, decorative surfaces of pattern. He drew on Byzantine mosaics, which he saw in Ravenna in 1903, as well as on Japanese art, Egyptian and Mycenaean ornament, and the Arts and Crafts movement. During his \"golden period\" (about 1899–1910) he applied real gold and silver leaf to his canvases.<\/p>\n<p>He was a superb draughtsman who made thousands of drawings, many of them intimate studies of women. His square landscape paintings of gardens, lakes and forests are almost abstract carpets of dots and colour. Later works dropped the gold for brighter, more colourful patterns influenced by Matisse and Fauvism.<\/p>"},{"title":"Legacy","html":"<p>Klimt shaped the look of Vienna 1900 and of Art Nouveau across Europe. His influence runs through Schiele and Kokoschka to decorative arts, fashion and design. Many of his works were owned by Jewish collectors and looted by the Nazis. Restitution cases, above all the return of Adele Bloch-Bauer's portrait to Maria Altmann, made headlines worldwide. In 2006 Ronald Lauder bought that portrait for a reported $135 million, and in 2023 Klimt's <em>Lady with a Fan<\/em> sold for £85.3 million, a record for a painting at auction in Europe.<\/p>"}],"cover":"the-kiss","wikipedia":"https://en.wikipedia.org/wiki/Gustav_Klimt","source":"https://github.com/groot99-droid/Art-Talk/blob/main/artists/klimt.md","works":[{"id":"pallas-athene","title":"Pallas Athene","year":"1898","medium":"Oil on canvas, 75 × 75 cm","location":"Wien Museum, Vienna","description":"<p>The Greek goddess of wisdom stares out from a golden helmet and breastplate, holding a tiny figure of Truth, a nude woman with a mirror, in her hand. Painted in the year of the first Secession exhibition, it announces Klimt's rebellion against academic art and the start of his use of gold. Athena was the Secession's patron goddess.<\/p>","image":"images/klimt/pallas-athene.jpg","credit":{"file":"File:Klimt - Pallas Athene.jpeg","source":"https://commons.wikimedia.org/wiki/File:Klimt_-_Pallas_Athene.jpeg","author":"Gustav Klimt","license":"Public domain","license_url":null}},{"id":"judith-i","title":"Judith I","year":"1901","medium":"Oil and gold leaf on canvas, 84 × 42 cm","location":"Österreichische Galerie Belvedere, Vienna","description":"<p>The biblical heroine who beheaded Holofernes appears as a modern Viennese <em>femme fatale<\/em>, eyes half closed and lips parted, the severed head barely visible at the edge of the frame. A heavy gold collar and a stylised golden background frame her face. The painting shocked viewers with its fusion of violence and sensuality.<\/p>","image":"images/klimt/judith-i.jpg","credit":{"file":"File:Judith 1 (cropped).jpg","source":"https://commons.wikimedia.org/wiki/File:Judith_1_(cropped).jpg","author":"Gustav Klimt","license":"Public domain","license_url":null}},{"id":"beethoven-frieze","title":"Beethoven Frieze (installation view)","year":"1902","medium":"Casein paint, gold, and semi-precious stones on plaster, 2.15 × 34.14 m (whole frieze)","location":"Secession Building, Vienna","description":"<p>Made for the 1902 Secession exhibition in honour of Beethoven, this frieze runs around three walls of a room high above the viewer. It interprets the Ninth Symphony as humanity's search for happiness, beginning with floating figures and a knight in golden armour, passing the \"Hostile Forces\" and ending in the \"Kiss to the whole world\" from Schiller's <em>Ode to Joy<\/em>. The end wall, seen here, shows the Hostile Forces: the ape-like giant Typhoeus surrounded by his daughters, the Gorgons, and the figures of Sickness, Madness and Death. Meant to be temporary, the frieze was saved and is now on permanent display.<\/p>","image":"images/klimt/beethoven-frieze.jpg","credit":{"file":"File:Gustav Klimt - Beethovenfries, \"Die Sehnsucht nach dem Glück\" (nach Richard Wagners Interpretation der IX. Sinfonie von Ludwig van Beethoven) - 5987 - Österreichische Galerie Belvedere.jpg","source":"https://commons.wikimedia.org/wiki/File:Gustav_Klimt_-_Beethovenfries,_%22Die_Sehnsucht_nach_dem_Gl%C3%BCck%22_(nach_Richard_Wagners_Interpretation_der_IX._Sinfonie_von_Ludwig_van_Beethoven)_-_5987_-_%C3%96sterreichische_Galerie_Belvedere.jpg","author":"Gustav Klimt","license":"Public domain","license_url":null}},{"id":"adele-bloch-bauer-i","title":"Portrait of Adele Bloch-Bauer I","year":"1907","medium":"Oil, silver and gold on canvas, 138 × 138 cm","location":"Neue Galerie, New York","description":"<p>The Viennese salon hostess Adele Bloch-Bauer, her face and hands painted realistically, seems almost dissolved in a shimmering field of gold ornament, eyes and spirals. Seized by the Nazis, it hung for decades in the Belvedere as \"The Woman in Gold\". In 2006 her niece Maria Altmann won its return after a long legal battle, a story told in the 2015 film <em>Woman in Gold<\/em>.<\/p>","image":"images/klimt/adele-bloch-bauer-i.jpg","credit":{"file":"File:Gustav Klimt 046.jpg","source":"https://commons.wikimedia.org/wiki/File:Gustav_Klimt_046.jpg","author":"Gustav Klimt","license":"Public domain","license_url":null}},{"id":"the-kiss","title":"The Kiss","year":"1907–1908","medium":"Oil and gold leaf on canvas, 180 × 180 cm","location":"Österreichische Galerie Belvedere, Vienna","description":"<p>A couple embrace on the edge of a flowering meadow, wrapped together in a single golden cloak. His robe is patterned with black and white rectangles, hers with colourful circles and flowers. Only their faces, hands and her feet are shown as flesh. It is the high point of Klimt's \"golden period\", and the Belvedere bought it even before it was finished.<\/p>","image":"images/klimt/the-kiss.jpg","credit":{"file":"File:The Kiss - Gustav Klimt - Google Cultural Institute.jpg","source":"https://commons.wikimedia.org/wiki/File:The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg","author":"Gustav Klimt","license":"Public domain","license_url":null}},{"id":"death-and-life","title":"Death and Life","year":"1910–1915","medium":"Oil on canvas, 178 × 198 cm","location":"Leopold Museum, Vienna","description":"<p>On the left, Death, a skeleton in a robe of crosses, leers at a tangle of sleeping figures on the right: babies, lovers, mothers and an old woman, woven into a colourful blanket of patterns. Klimt reworked the painting after it won first prize in Rome in 1911, replacing its gold background with blue-grey. The sleepers seem unaware of Death's presence.<\/p>","image":"images/klimt/death-and-life.jpg","credit":{"file":"File:Gustav Klimt - Death and Life - Google Art Project.jpg","source":"https://commons.wikimedia.org/wiki/File:Gustav_Klimt_-_Death_and_Life_-_Google_Art_Project.jpg","author":"Gustav Klimt","license":"Public domain","license_url":null}}]},{"slug":"hilma-af-klint","name":"Hilma af Klint","lifespan":"1862–1944","born":1862,"died":1944,"year_label":"1862","region":"Europe","country":"Sweden","movements":["Abstract art","Spiritualism"],"discipline":["Painting"],"summary":"The Swedish visionary who painted radical abstract works years before Kandinsky, and kept them hidden from the world.","sections":[{"title":"Overview","html":"<p>Hilma af Klint was a trained academic painter who, from 1906, created hundreds of abstract paintings guided by her spiritual beliefs. She made them several years before Kandinsky, Mondrian and Malevich, who are usually credited with inventing abstraction. She believed the world was not ready for them. She showed them to very few people and directed that they should not be exhibited until 20 years after her death. Revealed to the public only in the 1980s, her work has since rewritten the history of modern art. Her 2018–2019 retrospective became the most visited exhibition in the Guggenheim Museum's history.<\/p>"},{"title":"Life","html":"<p>Hilma af Klint was born on 26 October 1862 at Karlberg Palace in Solna, near Stockholm, where her father, a naval commander, taught at the military academy. From 1882 to 1887 she studied at the Royal Academy of Fine Arts in Stockholm, which had begun admitting women in 1864. She then made a respectable living painting landscapes, portraits and botanical illustrations, and had a studio in central Stockholm.<\/p>\n<p>The death of her younger sister in 1880 drew her toward spiritualism and Theosophy. In 1896 she and four other women formed a group called \"The Five\", which held séances and experimented with automatic drawing and writing. In 1906, believing she had received a commission from a spiritual guide, she began the <em>Paintings for the Temple<\/em>, a cycle of nearly 200 works completed in 1915.<\/p>\n<p>In 1908 she showed her work to the Austrian philosopher Rudolf Steiner. His cool response contributed to a four-year break in the series, during which she cared for her blind mother. She later joined Steiner's Anthroposophical Society and continued painting and writing into old age, filling some 125 notebooks. She died on 21 October 1944 after a traffic accident, leaving more than 1,200 paintings and drawings to her nephew, Erik af Klint.<\/p>"},{"title":"Style & Technique","html":"<p>Af Klint's abstract works combine geometric shapes, such as circles, spirals, triangles and grids, with organic forms like petals, shells and cells, together with letters, words and symbols. Colour carries meaning: in her code, bl
