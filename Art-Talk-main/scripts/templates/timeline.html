<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art-Talk Timeline</title>
<meta name="description" content="An illustrated timeline of painters, sculptors, architects, designers, filmmakers and writers from around the world, with key works and short biographies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f2ea;
  --surface: #fffdf8;
  --surface-2: #efe8db;
  --text: #221d16;
  --muted: #6b6255;
  --line: #d9cfbd;
  --accent: #9a3b1f;
  --accent-soft: #f1ddd2;
  --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 8px 24px rgba(40, 30, 10, .08);
  --europe: #7b4ea3;
  --west-asia: #1f7a6d;
  --south-asia: #c0621b;
  --east-asia: #b2304a;
  --americas: #2f62a8;
  --africa: #a8791a;
  --se-asia: #3c8a3a;
  --oceania: #1c7fa0;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --surface: #1f1c17; --surface-2: #2a261f; --text: #efe8dc; --muted: #a79d8e;
    --line: #3a342b; --accent: #e08a62; --accent-soft: #3a2519;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --europe: #b18ad6; --west-asia: #4fb8a8; --south-asia: #e59650; --east-asia: #e0677f; --americas: #6f9be0;
    --africa: #d6a94a; --se-asia: #74c072; --oceania: #59b5d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --surface: #1f1c17; --surface-2: #2a261f; --text: #efe8dc; --muted: #a79d8e;
  --line: #3a342b; --accent: #e08a62; --accent-soft: #3a2519;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --europe: #b18ad6; --west-asia: #4fb8a8; --south-asia: #e59650; --east-asia: #e0677f; --americas: #6f9be0;
  --africa: #d6a94a; --se-asia: #74c072; --oceania: #59b5d6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 var(--sans); overflow-x: hidden;
}
a { color: var(--accent); }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 48px 0 24px; }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
h1 {
  font-family: var(--serif); font-weight: 600; font-size: clamp(2.2rem, 6vw, 3.6rem);
  line-height: 1.05; margin: 0 0 8px; letter-spacing: -.01em;
}
.lede { color: var(--muted); max-width: 60ch; margin: 0; font-size: 1.05rem; }
.theme-btn {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  width: 40px; height: 40px; cursor: pointer; display: grid; place-items: center;
}
.theme-btn svg { width: 18px; height: 18px; }

.controls {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 12px 0;
}
.controls .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: .875rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.search {
  margin-left: auto; min-width: 0; flex: 1 1 180px; max-width: 260px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font: inherit; font-size: .9rem; color: var(--text);
}
.count { color: var(--muted); font-size: .85rem; width: 100%; }

/* Timeline */
.timeline { position: relative; padding: 24px 0 80px; }
.timeline::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 72px; width: 2px; background: var(--line);
}
.century { position: relative; }
.century h2 {
  font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 32px 0 16px;
  padding-left: 96px; position: relative; color: var(--muted);
}
.century h2::before {
  content: ""; position: absolute; left: 66px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--bg); border: 2px solid var(--muted);
}
.entry { position: relative; padding-left: 96px; margin-bottom: 20px; }
.entry .year {
  position: absolute; left: 0; top: 18px; width: 60px; text-align: right;
  font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); font-weight: 500;
}
.entry::before {
  content: ""; position: absolute; left: 67px; top: 22px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 0 4px var(--bg);
}
.card {
  display: grid; grid-template-columns: 200px 1fr; gap: 0; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow); cursor: pointer; padding: 0; transition: transform .15s ease, border-color .15s ease;
}
.card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--c); outline: none; }
.card .cover { position: relative; background: var(--surface-2); min-height: 180px; }
.card .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 16px 18px; min-width: 0; }
.card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; margin: 0; line-height: 1.2; }
.meta { color: var(--muted); font-size: .875rem; margin: 2px 0 8px; }
.meta .region { color: var(--c); font-weight: 600; }
.card p.summary { margin: 0 0 12px; font-size: .95rem; }
.thumbs { display: flex; gap: 6px; overflow: hidden; }
.thumbs img {
  width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex: none;
}
.empty { padding: 48px 0; text-align: center; color: var(--muted); }

/* Detail dialog */
dialog {
  border: none; padding: 0; background: var(--surface); color: var(--text);
  width: min(920px, 100vw); max-width: 100vw; max-height: 100dvh; height: 100dvh;
  margin: 0 0 0 auto; box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 8, 5, .55); }
dialog[open] { animation: slide .2s ease; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel-head {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.panel-head .crumb { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px;
  cursor: pointer; display: grid; place-items: center; flex: none;
}
.panel-body { padding: 24px 24px 64px; }
.hero { border-radius: 12px; overflow: hidden; background: var(--surface-2); margin-bottom: 20px; }
.hero img { width: 100%; max-height: 420px; object-fit: cover; }
.panel-body h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0; line-height: 1.1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
.tag { background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: .8rem; }
.tag.region { background: var(--c); color: #fff; }
.panel-summary { font-size: 1.1rem; font-family: var(--serif); margin: 0 0 20px; }
.prose h3 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 28px 0 8px; }
.prose p { margin: 0 0 12px; max-width: 68ch; }
.prose ul { margin: 0 0 12px; padding-left: 20px; max-width: 68ch; }
details.sec { border-top: 1px solid var(--line); }
details.sec summary {
  cursor: pointer; list-style: none; font-family: var(--serif); font-weight: 600; font-size: 1.2rem; padding: 14px 0;
  display: flex; justify-content: space-between; align-items: center;
}
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::after { content: "+"; font-family: var(--sans); color: var(--muted); font-weight: 400; }
details.sec[open] summary::after { content: "–"; }
.works-title { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 32px 0 16px; }
.works { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.work { margin: 0; display: flex; flex-direction: column; }
.work button.img {
  border: none; padding: 0; cursor: zoom-in; border-radius: 10px; overflow: hidden; background: var(--surface-2);
  aspect-ratio: 4 / 3; width: 100%;
}
.work button.img img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.work button.img:hover img { transform: scale(1.03); }
.work figcaption { padding-top: 10px; font-size: .92rem; }
.work .wt { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.work .wm { color: var(--muted); font-size: .82rem; margin: 2px 0 6px; }
.work .wd p { margin: 0 0 8px; }
.credit { color: var(--muted); font-size: .72rem; line-height: 1.4; word-break: break-word; }
.credit a { color: inherit; }
.links { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; }
.links a { text-decoration: none; }

/* Lightbox */
#lightbox {
  width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; margin: 0;
  background: #0d0b08; color: #f3ede3;
}
#lightbox .lb-inner { height: 100%; display: flex; flex-direction: column; }
#lightbox .lb-img { flex: 1; min-height: 0; display: grid; place-items: center; padding: 56px 16px 8px; }
#lightbox .lb-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
#lightbox .lb-cap { padding: 8px 16px 20px; text-align: center; font-size: .9rem; }
#lightbox .lb-cap .credit { color: #b9b0a2; }
#lightbox .icon-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }
#lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); }
#lightbox .prev { left: 12px; } #lightbox .next { right: 12px; }

footer { border-top: 1px solid var(--line); padding: 24px 0 48px; color: var(--muted); font-size: .85rem; }

@media (max-width: 720px) {
  header.top { padding-top: 32px; }
  .timeline::before { left: 8px; }
  .century h2 { padding-left: 28px; font-size: 1.35rem; }
  .century h2::before { left: 2px; }
  .entry { padding-left: 28px; }
  .entry::before { left: 3px; }
  .entry .year { position: static; display: block; text-align: left; width: auto; margin-bottom: 4px; }
  .card { grid-template-columns: 1fr; }
  .card .cover { min-height: 0; aspect-ratio: 16 / 9; }
  .search { max-width: none; margin-left: 0; flex-basis: 100%; }
  .panel-body { padding: 16px 16px 48px; }
  #lightbox .nav { top: auto; bottom: 12px; transform: none; }
  #lightbox .lb-cap { padding-bottom: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="top-row">
    <div>
      <h1>Art-Talk</h1>
      <p class="lede" id="lede"></p>
    </div>
    <button class="theme-btn" id="theme" type="button" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<nav class="controls" aria-label="Filters">
  <div class="wrap">
    <div id="chips" style="display:contents"></div>
    <input class="search" id="q" type="search" placeholder="Search artists or works" aria-label="Search artists or works">
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <div class="wrap" style="margin-top:8px">
    <div id="chips2" style="display:contents"></div>
  </div>
</nav>

<main class="wrap timeline" id="timeline"></main>

<footer class="wrap" id="footer"></footer>

<dialog id="panel" aria-labelledby="panel-title">
  <div class="panel-head">
    <span class="crumb" id="crumb"></span>
    <button class="icon-btn" type="button" data-close aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</dialog>

<dialog id="lightbox" aria-label="Artwork">
  <div class="lb-inner">
    <button class="icon-btn" type="button" data-close aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button class="icon-btn nav prev" type="button" aria-label="Previous work">&#8249;</button>
    <button class="icon-btn nav next" type="button" aria-label="Next work">&#8250;</button>
    <div class="lb-img"><img id="lb-img" alt=""></div>
    <div class="lb-cap" id="lb-cap"></div>
  </div>
</dialog>

<script>
const DATA = /*__DATA__*/null;
const REGION_VAR = { "Europe": "--europe", "West & Central Asia": "--west-asia", "Africa": "--africa", "South Asia": "--south-asia", "East Asia": "--east-asia", "Southeast Asia": "--se-asia", "Oceania": "--oceania", "Americas": "--americas" };
const yearLabel = y => y < 1 ? `${-y} BCE` : String(y);
const centuryOf = y => y < 1 ? -(Math.floor((-y - 1) / 100) + 1) * 100 : Math.floor(y / 100) * 100;
const centuryLabel = c => c < 0 ? `${-c}s BCE` : `${c}s`;
const listJoin = xs => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = r => `var(${REGION_VAR[r] || "--muted"})`;
const bySlug = Object.fromEntries(DATA.artists.map(a => [a.slug, a]));
const state = { region: "All", discipline: "All", q: "" };

/* Theme */
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("art-talk-theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("art-talk-theme", next); } catch (e) {}
  });
})();

/* Header */
const nWorks = DATA.artists.reduce((n, a) => n + a.works.length, 0);
const first = Math.min(...DATA.artists.map(a => a.born));
const last = Math.max(...DATA.artists.map(a => a.died));
$("#lede").textContent = `${DATA.artists.length} artists from ${DATA.regions.length} regions of the world across ${DATA.disciplines.length} disciplines — ${listJoin(DATA.disciplines.map(d => d.toLowerCase()))} — ${yearLabel(first)}–${yearLabel(last)}, with ${nWorks} key works. Choose an artist to read their story and see their work.`;
$("#footer").innerHTML = `Text written for Art-Talk. Images from <a href="https://commons.wikimedia.org/">Wikimedia Commons</a>, public domain or under the free license given with each work. Source and Markdown files: <a href="${esc(DATA.repo)}">${esc(DATA.repo.replace("https://", ""))}</a>.`;

/* Filters */
function chipCount(key, v) {
  if (v === "All") return DATA.artists.length;
  return DATA.artists.filter(a => key === "region" ? a.region === v : a.discipline.includes(v)).length;
}
function renderChipRow(sel, key, values, colored) {
  const opts = ["All", ...values];
  $(sel).innerHTML = opts.map(v => {
    const n = chipCount(key, v);
    const style = colored ? ` style="--c:${color(v)}"` : "";
    const dot = colored && v !== "All" ? '<span class="dot"></span>' : "";
    return `<button class="chip" type="button" data-${key}="${esc(v)}" aria-pressed="${state[key] === v}"${style}>
      ${dot}${esc(v)} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
}
function renderChips() {
  renderChipRow("#chips", "region", DATA.regions, true);
  renderChipRow("#chips2", "discipline", DATA.disciplines, false);
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-region]");
  if (!b) return;
  state.region = b.dataset.region;
  renderChips(); renderTimeline();
});
$("#chips2").addEventListener("click", e => {
  const b = e.target.closest("[data-discipline]");
  if (!b) return;
  state.discipline = b.dataset.discipline;
  renderChips(); renderTimeline();
});
$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); renderTimeline(); });

function matches(a) {
  if (state.region !== "All" && a.region !== state.region) return false;
  if (state.discipline !== "All" && !a.discipline.includes(state.discipline)) return false;
  if (!state.q) return true;
  const hay = [a.name, a.country, a.movements.join(" "), ...a.works.map(w => w.title)].join(" ").toLowerCase();
  return hay.includes(state.q);
}

/* Timeline */
function renderTimeline() {
  const list = DATA.artists.filter(matches);
  $("#count").textContent = list.length === DATA.artists.length ? "" : `Showing ${list.length} of ${DATA.artists.length} artists`;
  if (!list.length) { $("#timeline").innerHTML = `<p class="empty">No artists match that search.</p>`; return; }
  let html = "", century = null;
  for (const a of list) {
    const c = centuryOf(a.born);
    if (c !== century) {
      if (century !== null) html += "</section>";
      century = c;
      html += `<section class="century"><h2>${centuryLabel(c)}</h2>`;
    }
    const cover = a.works.find(w => w.id === a.cover) || a.works[0];
    html += `<article class="entry" style="--c:${color(a.region)}">
      <span class="year">${esc(a.year_label)}</span>
      <button class="card" type="button" data-slug="${esc(a.slug)}" aria-label="${esc(a.name)}, ${esc(a.lifespan)}">
        <div class="cover"><img src="${esc(cover.image)}" alt="" loading="lazy"></div>
        <div class="body">
          <h3>${esc(a.name)}</h3>
          <div class="meta">${esc(a.lifespan)} · <span class="region">${esc(a.country)}</span> · ${esc(a.movements.join(", "))}</div>
          <p class="summary">${a.summary}</p>
          <div class="thumbs">${a.works.map(w => `<img src="${esc(w.image)}" alt="" loading="lazy">`).join("")}</div>
        </div>
      </button>
    </article>`;
  }
  html += "</section>";
  $("#timeline").innerHTML = html;
}
$("#timeline").addEventListener("click", e => {
  const card = e.target.closest("[data-slug]");
  if (card) location.hash = card.dataset.slug;
});

/* Detail panel */
const panel = $("#panel");
function openArtist(slug) {
  const a = bySlug[slug];
  if (!a) return;
  const cover = a.works.find(w => w.id === a.cover) || a.works[0];
  $("#crumb").textContent = `${a.lifespan} · ${a.country}`;
  $("#panel-body").innerHTML = `
    <div class="hero"><img src="${esc(cover.image)}" alt="${esc(cover.title)}"></div>
    <h2 id="panel-title">${esc(a.name)}</h2>
    <div class="tags" style="--c:${color(a.region)}">
      <span class="tag region">${esc(a.region)}</span>
      <span class="tag">${esc(a.lifespan)}</span>
      <span class="tag">${esc(a.country)}</span>
      ${a.discipline.map(d => `<span class="tag">${esc(d)}</span>`).join("")}
      ${a.movements.map(m => `<span class="tag">${esc(m)}</span>`).join("")}
    </div>
    <p class="panel-summary">${a.summary}</p>
    <div class="prose">
      ${a.sections.map((s, i) => `<details class="sec"${i === 0 ? " open" : ""}><summary>${esc(s.title)}</summary>${s.html}</details>`).join("")}
    </div>
    <h3 class="works-title">Key works</h3>
    <div class="works">
      ${a.works.map((w, i) => `<figure class="work">
        <button class="img" type="button" data-work="${i}" aria-label="Enlarge ${esc(w.title)}"><img src="${esc(w.image)}" alt="${esc(w.title)}" loading="lazy"></button>
        <figcaption>
          <div class="wt">${esc(w.title)} <span style="font-weight:400;color:var(--muted)">(${esc(w.year)})</span></div>
          <div class="wm">${esc(w.medium)} · ${esc(w.location)}</div>
          <div class="wd">${w.description}</div>
          <div class="credit">${creditHtml(w.credit)}</div>
        </figcaption>
      </figure>`).join("")}
    </div>
    <div class="links">
      ${a.wikipedia ? `<a class="chip" href="${esc(a.wikipedia)}" target="_blank" rel="noopener">Wikipedia ↗</a>` : ""}
      <a class="chip" href="${esc(a.source)}" target="_blank" rel="noopener">Markdown source ↗</a>
    </div>`;
  panel.dataset.slug = slug;
  if (!panel.open) panel.showModal();
  panel.scrollTop = 0;
}
function creditHtml(c) {
  if (!c || !c.file) return "";
  const file = c.source ? `<a href="${esc(c.source)}" target="_blank" rel="noopener">Wikimedia Commons</a>` : "Wikimedia Commons";
  const lic = c.license_url ? `<a href="${esc(c.license_url)}" target="_blank" rel="noopener">${esc(c.license)}</a>` : esc(c.license || "");
  return `Image: ${file}${c.author ? " · " + esc(c.author) : ""} · ${lic}`;
}
panel.addEventListener("click", e => {
  if (e.target.closest("[data-close]") || (e.target === panel && outside(panel, e))) closePanel();
  const b = e.target.closest("[data-work]");
  if (b) openLightbox(panel.dataset.slug, +b.dataset.work);
});
panel.addEventListener("close", () => {
  if (location.hash) history.pushState("", document.title, location.pathname + location.search);
});
function closePanel() { panel.close(); }
function outside(el, e) {
  const r = el.getBoundingClientRect();
  return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
}

/* Lightbox */
const lb = $("#lightbox");
const lbState = { slug: null, i: 0 };
function openLightbox(slug, i) {
  const a = bySlug[slug];
  const n = a.works.length;
  lbState.slug = slug; lbState.i = (i + n) % n;
  const w = a.works[lbState.i];
  $("#lb-img").src = w.image; $("#lb-img").alt = w.title;
  $("#lb-cap").innerHTML = `<strong>${esc(w.title)}</strong> (${esc(w.year)}) · ${esc(a.name)}<br>
    <span style="opacity:.8">${esc(w.medium)} · ${esc(w.location)}</span><div class="credit">${creditHtml(w.credit)}</div>`;
  if (!lb.open) lb.showModal();
}
lb.addEventListener("click", e => {
  if (e.target.closest("[data-close]") || e.target.classList.contains("lb-img")) lb.close();
  if (e.target.closest(".prev")) openLightbox(lbState.slug, lbState.i - 1);
  if (e.target.closest(".next")) openLightbox(lbState.slug, lbState.i + 1);
});
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") openLightbox(lbState.slug, lbState.i - 1);
  if (e.key === "ArrowRight") openLightbox(lbState.slug, lbState.i + 1);
});

/* Routing */
function route() {
  const slug = decodeURIComponent(location.hash.slice(1));
  if (slug && bySlug[slug]) openArtist(slug);
  else if (panel.open) panel.close();
}
window.addEventListener("hashchange", route);

renderChips();
renderTimeline();
route();
</script>
</body>
